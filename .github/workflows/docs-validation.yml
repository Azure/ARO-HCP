name: "Docs: Validate Documentation"

on:
  pull_request:
    paths:
      - '**.md'
      - 'test/docs/**'
      - '.github/workflows/docs-validation.yml'
      - '.markdownlint.json'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'test/docs/**'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Linting every .md in the repo is not viable: ~198 files carry pre-existing
      # violations. Lint only in-scope files that this change actually touches, and
      # widen SCOPE as more docs are brought up to standard.
      - name: Collect changed Markdown files in scope
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-}"
          if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # First push to a branch, or a force push: fall back to the previous commit.
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          files="$(git diff --name-only --diff-filter=ACMR "${base}" HEAD -- \
                     docs/personal-dev.md test/docs/ \
                   | { grep -E '\.md$' || true; } \
                   | tr '\n' ' ' | sed 's/ *$//')"

          # When only config/workflow files changed, lint the baseline scope
          # so invalid config can still be caught.
          if [[ -z "${files}" ]]; then
            changed_configs="$(git diff --name-only --diff-filter=ACMR "${base}" HEAD -- \
                                 .markdownlint.json .github/workflows/docs-validation.yml \
                               || true)"
            if [[ -n "${changed_configs}" ]]; then
              files="docs/personal-dev.md test/docs/README.md"
              existing=""
              for f in ${files}; do
                if [[ -f "${f}" ]]; then
                  existing="${existing} ${f}"
                fi
              done
              files="$(echo "${existing}" | sed 's/^ *//')"
              echo "Config changed; linting baseline: ${files}"
            else
              echo "No in-scope Markdown changed; nothing to lint."
            fi
          else
            echo "Linting: ${files}"
          fi

          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Lint changed Markdown files
        if: steps.changed.outputs.files != ''
        uses: nosborn/github-action-markdown-cli@f5d8cad27b5690b173425c45f762f8662ecf47e8 # v3.3.0
        with:
          files: ${{ steps.changed.outputs.files }}
          config_file: .markdownlint.json

  readme-tests:
    name: README Command Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      # dry-run asserts only on the docs, so no az/kubectl install is needed.
      - name: Run personal-dev README tests
        run: |
          bash test/docs/personal-dev-readme-test.sh
        env:
          TEST_MODE: dry-run
