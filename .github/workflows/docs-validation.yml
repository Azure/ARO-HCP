name: Documentation Validation

on:
  pull_request:
    paths:
      - '**.md'
      - 'test/docs/**'
      - '.github/workflows/docs-validation.yml'
      - '.markdownlint.json'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'test/docs/**'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: "**/*.md"
          config_file: .markdownlint.json
          ignore_files: "vendor/"

  readme-tests:
    name: README Command Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      # dry-run asserts only on the docs, so no az/kubectl install is needed.
      - name: Run personal-dev README tests
        run: |
          test/docs/personal-dev-readme-test.sh
        env:
          TEST_MODE: dry-run
