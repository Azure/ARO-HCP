name: Agentic workflow failure alert
on:
  workflow_run:
    workflows:
    - "Agentic CI and development tool updates"
    - "gh-aw recompile"
    - "Agentic Dependabot remediation for ARO-HCP"
    types:
    - completed
permissions: {}
concurrency:
  group: agentic-alert
  cancel-in-progress: true
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
    - name: Checkout the alert helper
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: Maintain the rolling alert issue
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: bash .github/scripts/agentic-alert.sh
