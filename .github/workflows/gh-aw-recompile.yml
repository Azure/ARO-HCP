# Keeps the compiled agentic workflow lock files fresh so the gh-aw runtime
# guardrail never blocks a scheduled run.
#
# Background: gh-aw compiles each .md workflow into a pinned *.lock.yml. The
# gh-aw runtime refuses to run a lock file compiled with a version that upstream
# later adds to its blockedVersions list (see
# https://raw.githubusercontent.com/github/gh-aw-actions/main/.github/aw/compat.json).
# When that happens the activation job fails and the automation silently stops.
#
# This workflow runs `gh aw upgrade` on a schedule: it self-upgrades the gh-aw
# extension to the latest release, recompiles every .md workflow, refreshes the
# action pins, and opens a pull request with the result. A human still reviews
# and merges the PR, so the compiled artifact stays pinned and reviewable.
name: gh-aw recompile
on:
  # Weekly, ahead of the nightly agentic runs, so a fresh recompile can land
  # before upstream blocks the current compiler version.
  schedule:
  - cron: "0 6 * * 1"
  workflow_dispatch:
# Job default GITHUB_TOKEN stays read-only. The write side (branch push + PR)
# uses the scoped aro-hcp-robot App token minted below, never GITHUB_TOKEN.
permissions:
  contents: read
concurrency:
  group: gh-aw-recompile
  cancel-in-progress: false
jobs:
  recompile:
    runs-on: ubuntu-slim
    # Only run the privileged (App-token) job when the definition is the one on
    # the default branch. Scheduled runs always are. This blocks an accidental
    # workflow_dispatch from a feature branch. It is a guardrail, not a hard
    # security control: the real control is that pushing branches to this repo
    # is restricted to maintainers, so only trusted actors can dispatch at all.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
    - name: Mint aro-hcp-robot App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ secrets.DEPENDABOT_APP_CLIENT_ID }}
        private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
        # Only what `gh aw upgrade --create-pull-request` needs: push a branch,
        # update the compiled *.lock.yml files (which live under
        # .github/workflows, so a GitHub App push requires the separate
        # `workflows` permission), and open the PR. Without these inputs the
        # token inherits every App permission; keep it minimal.
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        # Always recompile from the default branch. workflow_dispatch can be run
        # against any branch, and gh aw upgrade builds its upgrade branch from the
        # current checkout while the PR base defaults to the default branch, so a
        # dispatch from a feature branch could otherwise open a PR carrying that
        # branch's unrelated changes.
        ref: ${{ github.event.repository.default_branch }}
        # Do not persist the App token in .git/config. gh-aw is installed and run
        # in later steps; keeping the write token out of the repo config means it
        # is never readable by the extension's git plumbing. Push auth is wired up
        # explicitly via `gh auth setup-git` below.
        persist-credentials: false
    - name: Configure git and gh auth for the App identity
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        # gh aw upgrade runs `git commit` locally, which fails with
        # "Author identity unknown" on a clean runner. Attribute the commit to
        # the aro-hcp-robot App bot so it matches the PR author.
        app_slug=aro-hcp-robot
        bot_login="${app_slug}[bot]"
        bot_id=$(gh api "/users/${bot_login}" --jq '.id')
        git config --global user.name "${bot_login}"
        git config --global user.email "${bot_id}+${bot_login}@users.noreply.github.com"
        # Let git push over https authenticate with the scoped App token without
        # persisting it in the checked-out repo's .git/config.
        gh auth setup-git
    - name: Install gh-aw extension
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      # Installs the latest published gh-aw release (an immutable tagged
      # artifact), not the moving default branch. This is the same tool we
      # already trust to compile the security-critical lock files.
      run: gh extension install github/gh-aw
    - name: Skip if an upgrade PR is already open
      id: guard
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        # gh aw upgrade opens a new randomly-suffixed upgrade-agentic-workflows-*
        # branch every run, authored by the aro-hcp-robot App. If a previous PR
        # is still awaiting review, opening a duplicate is just noise, so skip
        # this run. Narrow to the bot's own PRs server-side (with an explicit
        # limit, since gh pr list otherwise returns only the first 30 and our PR
        # could fall off the page in a busy repo) and match the branch prefix.
        open=$(gh pr list --state open --author app/aro-hcp-robot --limit 100 --json headRefName,author \
          --jq '[.[] | select(.author.login == "aro-hcp-robot[bot]" and (.headRefName | startswith("upgrade-agentic-workflows")))] | length')
        if [ "${open}" -gt 0 ]; then
          echo "An upgrade PR is already open; skipping."
          echo "skip=true" >> "${GITHUB_OUTPUT}"
        else
          echo "skip=false" >> "${GITHUB_OUTPUT}"
        fi
    - name: Upgrade and recompile, open a PR if anything changed
      if: steps.guard.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: gh aw upgrade --create-pull-request --yes
