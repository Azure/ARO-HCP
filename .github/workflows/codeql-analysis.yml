name: "CodeQL Analysis"
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  # Run at 2:00 AM UTC every day
  - cron: '0 2 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CODEQL_GO_RUNNER can target an org-provisioned larger runner for Go;
    # leave Python on the standard runner. Unset uses the existing runner.
    runs-on: ${{ matrix.language == 'go' && vars.CODEQL_GO_RUNNER || 'ubuntu-latest' }}
    # Bound stuck jobs; runner shutdowns have occurred well before this limit.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'python']
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.work'
        cache-dependency-path: '**/go.sum'
    # Initializes the CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      with:
        languages: ${{ matrix.language }}
        # Go doesn't support build-mode: none on this CodeQL version, so build
        # it manually instead of relying on Autobuild. Autobuild detects our
        # root Makefile and runs it as a build heuristic, which triggers
        # `make test` (the full repo test suite). That always fails on this
        # runner because `promtool` isn't installed, and it adds several
        # minutes of wasted work before falling back to a build. Building
        # manually below skips the Makefile entirely. Unit test coverage is
        # unaffected: the required ci/prow/test-unit presubmit already runs
        # the same make test-unit target in a properly provisioned CI image.
        build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
        # Use default CodeQL query packs
        # For custom queries, add: queries: security-and-quality
    - name: Build (go)
      if: matrix.language == 'go'
      run: |
        set -o pipefail
        build_cache=$(go env GOCACHE)
        sample_resources() {
          IFS=: read -r _ _ cgroup_path < /proc/self/cgroup
          cgroup_dir="/sys/fs/cgroup${cgroup_path}"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Go build resources ==="
            free -h
            df -h . /tmp "$build_cache"
            for file in "$cgroup_dir"/memory.current "$cgroup_dir"/memory.max "$cgroup_dir"/memory.events "$cgroup_dir"/cpu.stat; do
              if [ -r "$file" ]; then
                printf '%s: ' "$file"
                cat "$file"
              fi
            done
            sleep 30 >/dev/null 2>&1
          done
        }
        sample_resources &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
        go list -f '{{.Dir}}/...' -m | xargs go build -v
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      with:
        category: "/language:${{matrix.language}}"
