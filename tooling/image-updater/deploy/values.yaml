# Static chart defaults. The rollout pipeline preprocesses `values.yaml.tmpl`
# and passes the rendered file to Helm; this file only needs to stay valid YAML
# so the chart itself can be loaded before overrides are applied.
imageRegistry: ""
imageRepository: "image-updater-monitor"
imageTag: ""
imageDigest: ""
prowBaseURL: "https://prow.ci.openshift.org"
jobRegex: "^periodic-ci-Azure-ARO-HCP-main-image-updater-"
interval: "5m"
resultsBucket: "test-platform-results-public"
