description: "Aggregates Cluster API (CAPI) controller log messages for machine-related controllers, showing first/last occurrence and count per unique message/error/controller/resource combination."
database: hcp
tags: [hypershift, logs]
params:
- ClusterURI
- HCPDatabase
- HostedControlPlaneNamespace
- ManagementClusterName
- PhaseEndTime
- PhaseStartTime
- ServiceClusterName
notes: "Only applies to cluster resources."
