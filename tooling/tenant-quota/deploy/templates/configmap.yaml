# Purpose: Tenant configuration - defines which tenants to collect quota from and their service principal credentials
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-quota-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    interval: "5m"
    timeout: "30s"
    cacheTTL: "24h"
    exitOnPanic: {{ .Values.exitOnPanic }}
    prow:
      enabled: {{ .Values.prow.enabled }}
      baseURL: "{{ .Values.prow.baseURL }}"
      interval: "{{ .Values.prow.interval }}"
      retention: "{{ .Values.prow.retention }}"
      repository:
        org: "{{ .Values.prow.repository.org }}"
        name: "{{ .Values.prow.repository.name }}"
      excludeJobs: {{ if .Values.prow.excludeJobs }}{{ splitList "," .Values.prow.excludeJobs | toJson }}{{ else }}[]{{ end }}
    ciJobOutcomes:
      {{- toYaml .Values.ciJobOutcomes | nindent 6 }}
    tenants:
      {{- with .Values.tenants.redHat0 }}
      - tenantId: "{{ .tenantId }}"
        tenantName: "{{ .tenantName }}"
        servicePrincipalClientId: "{{ .servicePrincipalClientId }}"
        keyVaultSecretName: "{{ .keyVaultSecretName }}"
        scope: "https://graph.microsoft.com/.default"
        directoryQuota: {{ .directoryQuota }}
        subscriptions:
          {{- include "tenant-quota.subscriptions" (dict "subscriptions" $.Values.ci.dev.infrastructureSubscriptions "regions" $.Values.ci.dev.regions) | nindent 10 }}
          {{- include "tenant-quota.subscriptions" (dict "subscriptions" $.Values.ci.dev.e2eSubscriptions "regions" $.Values.ci.dev.regions) | nindent 10 }}
          {{- include "tenant-quota.subscriptions" (dict "subscriptions" $.Values.ci.int.e2eSubscriptions "regions" $.Values.ci.int.regions) | nindent 10 }}
          {{- include "tenant-quota.subscriptions" (dict "subscriptions" $.Values.ci.stg.e2eSubscriptions "regions" $.Values.ci.stg.regions) | nindent 10 }}
          {{- include "tenant-quota.subscriptions" (dict "subscriptions" $.Values.ci.prod.e2eSubscriptions "regions" $.Values.ci.prod.regions) | nindent 10 }}
      {{- end }}
      {{- with .Values.tenants.testTestAro }}
      - tenantId: "{{ .tenantId }}"
        tenantName: "{{ .tenantName }}"
        servicePrincipalClientId: "{{ .servicePrincipalClientId }}"
        keyVaultSecretName: "{{ .keyVaultSecretName }}"
        scope: "https://graph.microsoft.com/.default"
        directoryQuota: {{ .directoryQuota }}
        subscriptions:
          - name: "{{ .subscriptionName }}"
            regions:
              {{- range splitList "," .regions }}
              - "{{ . }}"
              {{- end }}
      {{- end }}
