certificates:
  # The only vault this policy sweeps.
  vaultURL: https://aro-hcp-dev-svc-kv.vault.azure.net
  # A certificate is owned while any resource group in these subscriptions has
  # its owner token in its name. Names are resolved to IDs at run time.
  ownerInventory:
    subscriptions:
    - ARO Hosted Control Planes (EA Subscription 1)
    - ARO HCP E2E Infrastructure (EA Subscription)
  discovery:
    # Certificates carrying any of these tags are never selected by any rule.
    protectedTags:
      persist: "true"
    rules:
    # Protect reserved CI fixture names and low-numbered placeholder job IDs.
    - name: protect-placeholder-job-certificates
      action: skip
      match:
        nameRegex: "^(?:(?:frontend-cert|admin-api-cert|sessiongate-cert)-(?:prow|ci00|ci01)|maestro-server)-j(?:00000[0-9]{2}|7654321)$"
    # Delete current Prow/ci00/ci01 certificates after 7d when no job RG remains.
    - name: current-ci-job-certificates
      action: delete
      match:
        nameRegex: "^(?:(?:frontend-cert|admin-api-cert|sessiongate-cert)-(?:prow|ci00|ci01)|maestro-server)-(?P<owner>j[0-9]{7})$"
        ownerCaptureGroup: owner
      conditions:
        ownerResourceGroupAbsent: true
      olderThan: 168h
    # Protect Maestro certificates of persistent shared environments (the CSPR
    # environment uses the bare regional name; nightly is a shared environment).
    # Their names look like personal certificates, but their owner token is not
    # part of any live resource group name, so the owner guard would not hold.
    - name: protect-shared-environment-maestro-certificates
      action: skip
      match:
        nameRegex: "^maestro-server-(?:usw3|nightly)$"
    # Delete personal service, Maestro, and ephemeral performance certificates
    # after 15d when no owner resource group remains.
    - name: personal-and-ephemeral-certificates
      action: delete
      match:
        nameRegex: "^(?:(?:admin-api-cert|frontend-cert|sessiongate-cert)-pers-|maestro-server-|frontend-cert-perf-)(?P<owner>[a-z0-9]+)$"
        ownerCaptureGroup: owner
      conditions:
        ownerResourceGroupAbsent: true
      olderThan: 360h
