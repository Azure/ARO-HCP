        - name: OPERATOR_VERSION
          value: 2.11.6
        - name: OPERATOR_PACKAGE
          value: multicluster-engine
        - name: OPERAND_IMAGE_BACKPLANE_OPERATOR
          value: '{{ .Values.imageRegistry }}/{{ .Values.imageRootRepository }}/backplane-rhel9-operator@sha256:c50c30ab49ee781289dda799bd59e0a329cf662aee119e1c515e31fe33a84f34'
