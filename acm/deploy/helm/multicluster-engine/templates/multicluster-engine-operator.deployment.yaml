          value: 2.11.7
        - name: OPERATOR_PACKAGE
          value: multicluster-engine
        - name: OPERAND_IMAGE_BACKPLANE_OPERATOR
          value: '{{ .Values.imageRegistry }}/{{ .Values.imageRootRepository }}/backplane-rhel9-operator@sha256:4b0bcdcdcfa5c03dc65dc501173c11b06ea3990b3216a03bc7756d71053f0f2f'
