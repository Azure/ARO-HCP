apiVersion: batch/v1
kind: Job
metadata:
  name: finalize-mce-config
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 3
  template:
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for AddonDeploymentConfig 'hypershift-addon-deploy-config' to exist..."
          until kubectl get AddonDeploymentConfig hypershift-addon-deploy-config; do
            sleep 5
          done

          echo "AddonDeploymentConfig 'hypershift-addon-deploy-config' found. Patching..."
          kubectl patch addondeploymentconfig hypershift-addon-deploy-config -n multicluster-engine --type=merge -p '{"spec":{"customizedVariables":[{"name":"disableMetrics","value": "true"},{"name":"disableHOManagement","value": "true"},{"name":"autoImportDisabled","value": "true"},{"name":"aroHcp","value": "true"}]}}'
          echo "Patch applied successfully."

          # The upstream hypershift-addon template renders the agent container
          # with no resources, so the pod runs BestEffort: under node pressure
          # its startup exceeds the liveness probe budget (initialDelaySeconds 2
          # + failureThreshold 3 x periodSeconds 10 = ~32s) and the kubelet
          # kills it into a crashloop (AROSLSRE-2542). Requests move the pod to
          # Burstable, giving the agent a guaranteed CPU share for startup and a
          # better eviction rank under DiskPressure. No limits, so the startup
          # we are protecting cannot be throttled. The addon manager re-renders
          # the agent Deployment when this config changes; the backplane
          # operator does not reconcile this field, so the patch persists.
          echo "Patching resourceRequirements on AddonDeploymentConfig 'hypershift-addon-deploy-config'..."
          kubectl patch addondeploymentconfig hypershift-addon-deploy-config -n multicluster-engine --type=merge -p '{"spec":{"resourceRequirements":[{"containerID":"deployments:hypershift-addon-agent:hypershift-addon-agent","resources":{"requests":{"cpu":"250m","memory":"256Mi"}}}]}}'
          CPU_REQUEST=$(kubectl get addondeploymentconfig hypershift-addon-deploy-config -n multicluster-engine -o jsonpath='{.spec.resourceRequirements[0].resources.requests.cpu}')
          if [ -z "$CPU_REQUEST" ]; then
            echo "ERROR: resourceRequirements were not persisted on 'hypershift-addon-deploy-config' (patch rejected or pruned by the CRD schema?)" >&2
            exit 1
          fi
          echo "resourceRequirements applied (agent cpu request: $CPU_REQUEST)."

          echo "Wait for MulticlusterEngine to be available..."
          timeout=600
          interval=5
          elapsed=0
          while true; do
            phase=$(kubectl get mce multiclusterengine -o jsonpath='{.status.phase}')
            if [ "$phase" = "Available" ] || [ "$phase" = "Paused" ]; then
              break
            fi
            if [ $elapsed -ge $timeout ]; then
              break
            fi
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $? -ne 0 ]; then
            echo "MulticlusterEngine did not become available within the timeout period."
            exit 1
          fi
          echo "MulticlusterEngine is available"
        image: "{{ .Values.finalizeMceJobImage }}"
        name: finalize
      restartPolicy: Never
      serviceAccountName: multicluster-engine-operator
