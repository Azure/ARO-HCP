apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: kube-applier-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: kube-applier
    labels:
      component: kube-applier
    rules:
    - alert: KubeApplierDesiresMetricNotPresent
      # Fires when at least one instance of kube-applier is running but the kube_applier_desires metric is not present for 5 minutes.
      expr: |
        kube_applier_health == 1 unless on(cluster, namespace) kube_applier_desires
      for: 5m
      labels:
        severity: warning
      annotations:
        description: 'kube-applier on cluster {{ $labels.cluster }} lacks kube_applier_desires metric for 5 minutes.'
        runbook_url: 'TBD'
        summary: 'kube-applier on cluster {{ $labels.cluster }} lacks kube_applier_desires metric'
        title: 'kube-applier on cluster {{ $labels.cluster }} lacks kube_applier_desires metric'
    - alert: KubeApplierApplyFailing
      expr: |
        max by (cluster, namespace, operation, group, resource, reason) (increase(kube_applier_desire_operations_total{operation="apply", status="False", reason=~"KubeAPIError|PreCheckFailed"}[5m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        description: 'kube-applier on cluster {{ $labels.cluster }} has been failing to apply {{ $labels.group }}/{{ $labels.resource }} due to {{ $labels.reason }} for 15 minutes.'
        runbook_url: 'TBD'
        summary: 'kube-applier on cluster {{ $labels.cluster }} failed to apply {{ $labels.group }}/{{ $labels.resource }} due to {{ $labels.reason }}'
        title: 'kube-applier on cluster {{ $labels.cluster }} failed to apply {{ $labels.group }}/{{ $labels.resource }} due to {{ $labels.reason }}'
    - alert: KubeApplierReadFailing
      # ReadDesire operations are recorded as operation="resync".
      expr: |
        max by (cluster, namespace, operation, group, resource, reason) (increase(kube_applier_desire_operations_total{operation="resync", status="False", reason=~"KubeAPIError|PreCheckFailed"}[5m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        description: 'kube-applier on cluster {{ $labels.cluster }} has been failing to read {{ $labels.group }}/{{ $labels.resource }} due to {{ $labels.reason }} for 15 minutes.'
        runbook_url: 'TBD'
        summary: 'kube-applier on cluster {{ $labels.cluster }} failed to read {{ $labels.group }}/{{ $labels.resource }} due to {{ $labels.reason }}'
        title: 'kube-applier on cluster {{ $labels.cluster }} failed to read {{ $labels.group }}/{{ $labels.resource }} due to {{ $labels.reason }}'
