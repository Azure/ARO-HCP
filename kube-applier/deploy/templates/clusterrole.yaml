apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-applier
rules:
- apiGroups:
  - hypershift.openshift.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - certificates.hypershift.openshift.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - namespaces
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Required by ApplyDesire Type=FinalizeNamespace, which clears the built-in
# "kubernetes" finalizer from a namespace already stuck Terminating. A DELETE on
# such a namespace succeeds and changes nothing, so the /finalize subresource is
# the only operation that unwedges one.
#
# Note that this grant is cluster-wide: nothing in RBAC scopes it to the
# namespaces the cleanup targets. The entire restriction lives in the desire's
# execution preconditions (pinned UID, dwell, sole "kubernetes" finalizer, no
# live HostedCluster). That is the same trust model as the delete verb above.
- apiGroups:
  - ''
  resources:
  - namespaces/finalize
  verbs:
  - update
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - certificates.hypershift.openshift.io
  resources:
  - certificatesigningrequestapprovals
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - secrets-store.csi.x-k8s.io
  resources:
  - secretproviderclasses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - secret-sync.x-k8s.io
  resources:
  - secretsyncs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - managedclusters
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - mgmtagent.aro-hcp.azure.com
  resources:
  - capacityreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - velero.io
  resources:
  - schedules
  - backups
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - multitenancy.acn.azure.com
  resources:
  - podnetworks
  - podnetworkinstances
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
