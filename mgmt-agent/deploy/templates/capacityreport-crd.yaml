apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: capacityreports.mgmtagent.aro-hcp.azure.com
  labels:
    app.kubernetes.io/name: mgmt-agent
spec:
  group: mgmtagent.aro-hcp.azure.com
  names:
    kind: CapacityReport
    listKind: CapacityReportList
    plural: capacityreports
    singular: capacityreport
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Last Reported
      type: date
      jsonPath: .status.lastReportedAt
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          status:
            type: object
            required:
            - hostedControlPlanes
            properties:
              conditions:
                description: |-
                  conditions reports the health of the capacity reporting process.
                  Known condition types are:
                  - "ReportCurrent": True when the most recent data collection succeeded
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReportedAt:
                type: string
                format: date-time
              nodes:
                type: array
                maxItems: 64
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - sku
                items:
                  type: object
                  required:
                  - sku
                  - ready
                  - notReady
                  properties:
                    sku:
                      type: string
                      maxLength: 253
                    ready:
                      type: integer
                      format: int32
                      minimum: 0
                    notReady:
                      type: integer
                      format: int32
                      minimum: 0
                    allocatable:
                      description: >-
                        Sum of node.status.allocatable across ready nodes of this SKU. NotReady nodes contribute zero.
                      type: object
                      maxProperties: 16
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        # Standard Kubernetes resource.Quantity validation pattern
                        pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                        x-kubernetes-int-or-string: true
              usage:
                description: >-
                  Actual resource consumption across HCP workloads in ocm-* namespaces, sourced from metrics-server PodMetrics.
                type: object
                maxProperties: 16
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  # Standard Kubernetes resource.Quantity validation pattern
                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                  x-kubernetes-int-or-string: true
              requested:
                description: >-
                  Sum of resource requests across regular (non-init) containers of non-terminal pods (phase is not Succeeded or Failed) in ocm-* namespaces. This approximates steady-state reservation.
                type: object
                maxProperties: 16
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  # Standard Kubernetes resource.Quantity validation pattern
                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                  x-kubernetes-int-or-string: true
              hostedControlPlanes:
                type: object
                properties:
                  readyResourceIDs:
                    description: >-
                      ARM resource IDs of HostedControlPlanes whose Available condition is True.
                    type: array
                    items:
                      type: string
                    x-kubernetes-list-type: set
                  notReadyResourceIDs:
                    description: >-
                      ARM resource IDs of HostedControlPlanes whose Available condition is not True or missing.
                    type: array
                    items:
                      type: string
                    x-kubernetes-list-type: set
              averageHCPResourceUsage:
                description: >-
                  Average actual resource consumption per ready HCP. Omitted when readyResourceIDs is empty.
                type: object
                maxProperties: 16
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  # Standard Kubernetes resource.Quantity validation pattern
                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                  x-kubernetes-int-or-string: true
