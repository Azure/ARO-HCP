apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: capacityreports.mgmtagent.aro-hcp.azure.com
  labels:
    app.kubernetes.io/name: mgmt-agent
spec:
  group: mgmtagent.aro-hcp.azure.com
  names:
    kind: CapacityReport
    listKind: CapacityReportList
    plural: capacityreports
    singular: capacityreport
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Last Reported
      type: date
      jsonPath: .status.lastReportedAt
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          status:
            type: object
            properties:
              conditions:
                description: |-
                  conditions reports the health of the capacity reporting process.
                  Known condition types are:
                  - "ReportCurrent": True when the most recent data collection succeeded
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReportedAt:
                type: string
                format: date-time
              nodes:
                type: array
                maxItems: 64
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - sku
                items:
                  type: object
                  required:
                  - sku
                  - ready
                  - notReady
                  properties:
                    sku:
                      type: string
                      maxLength: 253
                    ready:
                      type: integer
                      format: int32
                      minimum: 0
                    notReady:
                      type: integer
                      format: int32
                      minimum: 0
                    allocatable:
                      description: >-
                        Sum of node.status.allocatable across ready nodes of this SKU. NotReady nodes contribute zero.
                      type: object
                      maxProperties: 16
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        # Standard Kubernetes resource.Quantity validation pattern
                        pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                        x-kubernetes-int-or-string: true
              usage:
                description: >-
                  Consumption across HCP namespaces from PodMetrics, except aro.openshift.io/swift-nic usage, which equals its requested allocation.
                type: object
                maxProperties: 16
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  # Standard Kubernetes resource.Quantity validation pattern
                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                  x-kubernetes-int-or-string: true
              requested:
                description: >-
                  Sum of regular-container requests for Pending and Running pods in HCP namespaces, excluding init containers and pod overhead. This approximates steady-state reservation and may differ from actual usage.
                type: object
                maxProperties: 16
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  # Standard Kubernetes resource.Quantity validation pattern
                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                  x-kubernetes-int-or-string: true
              hostedControlPlanes:
                description: >-
                  Reported as a single atomic unit: the whole object is replaced on every apply, since mgmt-agent is the sole writer. This removes stale identities and size buckets, including the final named bucket. Resource totals measure HCP workloads; overall identity lists and per-size ready counts deduplicate ARM resource IDs by exact, case-sensitive string equality, rather than counting measured HCP objects. Legacy reports may omit resources, readyResources and byClusterSizingConfiguration. Failed collections preserve the existing payload, including absent fields.
                type: object
                x-kubernetes-map-type: atomic
                properties:
                  readyResourceIDs:
                    description: >-
                      ARM resource IDs of HostedControlPlanes whose Available condition is True.
                    type: array
                    items:
                      type: string
                    x-kubernetes-list-type: set
                  notReadyResourceIDs:
                    description: >-
                      ARM resource IDs of HostedControlPlanes whose Available condition is not True or missing.
                    type: array
                    items:
                      type: string
                    x-kubernetes-list-type: set
                  resources:
                    description: >-
                      Usage and requests for all HCPs, including HCPs without usable size attribution. Absence means not reported, not zero. Successful collections by new collectors always include this object and dual-write the same totals to the legacy status.usage and status.requested. Both maps include CPU, memory and aro.openshift.io/swift-nic, with zero values when no matching workload exists.
                    type: object
                    required:
                    - usage
                    - requested
                    properties:
                      usage:
                        description: >-
                          Consumption from PodMetrics, except aro.openshift.io/swift-nic usage, which equals its requested allocation.
                        type: object
                        maxProperties: 16
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          # Standard Kubernetes resource.Quantity validation pattern
                          pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                          x-kubernetes-int-or-string: true
                      requested:
                        description: >-
                          Sum of regular-container requests for Pending and Running pods, excluding init containers and pod overhead.
                        type: object
                        maxProperties: 16
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          # Standard Kubernetes resource.Quantity validation pattern
                          pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                          x-kubernetes-int-or-string: true
                  readyResources:
                    description: >-
                      Usage and requests for all HCPs whose Available condition is True, including HCPs without usable size attribution. Absence means not reported, not zero. Successful collections by new collectors always include this object and CPU, memory and aro.openshift.io/swift-nic in both maps, with zero values when no HCP is ready.
                    type: object
                    required:
                    - usage
                    - requested
                    properties:
                      usage:
                        description: >-
                          Consumption from PodMetrics, except aro.openshift.io/swift-nic usage, which equals its requested allocation.
                        type: object
                        maxProperties: 16
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          # Standard Kubernetes resource.Quantity validation pattern
                          pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                          x-kubernetes-int-or-string: true
                      requested:
                        description: >-
                          Sum of regular-container requests for Pending and Running pods, excluding init containers and pod overhead.
                        type: object
                        maxProperties: 16
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          # Standard Kubernetes resource.Quantity validation pattern
                          pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                          x-kubernetes-int-or-string: true
                  byClusterSizingConfiguration:
                    description: >-
                      HCP populations grouped by the associated HostedCluster's observed hypershift.openshift.io/hosted-cluster-size label. The HCP's hypershift.openshift.io/cluster annotation identifies that HostedCluster as namespace/name. Missing associations or noncanonical/reserved labels contribute only to overall accounting, so named buckets are not exhaustive. When no HCP has usable attribution this list is omitted or empty; that alone does not indicate a legacy report. Resource totals measure each bucket's HCP workloads; readyCount counts distinct ready ARM resource IDs, not measured HCP objects.
                    type: array
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys:
                    - size
                    items:
                      type: object
                      required:
                      - size
                      - readyResources
                      - readyCount
                      properties:
                        size:
                          description: >-
                            Canonical lowercase observed HostedCluster size label value, excluding the reserved name default.
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: '^[a-z0-9]([-a-z0-9_.]*[a-z0-9])?$'
                          x-kubernetes-validations:
                          - rule: "self != 'default'"
                            message: default is reserved for overall accounting
                        readyResources:
                          description: >-
                            Usage and requests for HCPs in this size bucket whose Available condition is True. Required even when no HCP in the bucket is ready. Successful collections include CPU, memory and aro.openshift.io/swift-nic in both maps, with zero values for an empty ready population.
                          type: object
                          required:
                          - usage
                          - requested
                          properties:
                            usage:
                              description: >-
                                Consumption from PodMetrics, except aro.openshift.io/swift-nic usage, which equals its requested allocation.
                              type: object
                              maxProperties: 16
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                # Standard Kubernetes resource.Quantity validation pattern
                                pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                                x-kubernetes-int-or-string: true
                            requested:
                              description: >-
                                Sum of regular-container requests for Pending and Running pods, excluding init containers and pod overhead.
                              type: object
                              maxProperties: 16
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                # Standard Kubernetes resource.Quantity validation pattern
                                pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                                x-kubernetes-int-or-string: true
                        readyCount:
                          description: >-
                            Number of distinct ARM resource IDs of HCPs in this size bucket whose Available condition is True, using exact, case-sensitive string equality. Zero when no HCP in the bucket is ready.
                          type: integer
                          format: int32
                          minimum: 0
              averageHCPResourceUsage:
                description: >-
                  Average actual resource consumption per ready HCP. Omitted when readyResourceIDs is empty.
                type: object
                maxProperties: 16
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  # Standard Kubernetes resource.Quantity validation pattern
                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                  x-kubernetes-int-or-string: true
