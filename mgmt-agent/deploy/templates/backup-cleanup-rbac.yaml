apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mgmt-agent-backup-cleanup
  namespace: velero
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  - backuprepositories
  - datauploads
  - datadownloads
  - restores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - velero.io
  resources:
  - deletebackuprequests
  verbs:
  - list
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mgmt-agent-backup-cleanup
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mgmt-agent-backup-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
