apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mgmt-agent-node-mitigation
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mgmt-agent
rules:
- apiGroups:
  - mgmtagent.aro-hcp.azure.com
  resources:
  - nodemitigationbudgets
  verbs:
  - get
  - list
  - watch
{{- if .Values.nodeMitigation.enabled }}
- apiGroups:
  - mgmtagent.aro-hcp.azure.com
  resources:
  - nodemitigationbudgets
  verbs:
  - create
- apiGroups:
  - mgmtagent.aro-hcp.azure.com
  resources:
  - nodemitigationbudgets/status
  verbs:
  - update
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mgmt-agent-node-mitigation
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mgmt-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mgmt-agent-node-mitigation
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
