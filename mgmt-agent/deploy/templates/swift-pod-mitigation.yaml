apiVersion: v1
kind: ConfigMap
metadata:
  name: mgmt-agent-swift-pod-mitigation
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mgmt-agent
data:
  config.yaml: |
{{ .Values.swiftPodMitigation.configuration | indent 4 }}
{{- if eq (toString .Values.swiftPodMitigation.enabled) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mgmt-agent-swift-pod-mitigation
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [swift-pod-mitigation-budget]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mgmt-agent-swift-pod-mitigation
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mgmt-agent-swift-pod-mitigation
{{- end }}
