      - command:
        - "/mgmt-agent"
        args:
        - controller
        - "--health-address=:8080"
        - "--ksm-image=mcr.microsoft.com/oss/v2/kubernetes/kube-state-metrics@sha256:1234567890"
        - "--log-verbosity=2"
        - "--node-health-configmap=mgmt-agent-node-health"
        - "--node-health-config-key=config.yaml"
        - "--monitoring-api-group=monitoring.coreos.com"
        image: "arohcpsvcdev.azurecr.io/mgmt-agent@sha256:1234567890"
        name: mgmt-agent-controller
        env:
        - name: POD_NAMESPACE
