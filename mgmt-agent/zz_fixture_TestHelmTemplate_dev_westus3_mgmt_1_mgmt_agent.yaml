# Source: mgmt-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mgmt-agent
  namespace: mgmt-agent
  labels:
    app.kubernetes.io/name: mgmt-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mgmt-agent
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mgmt-agent
        azure.workload.identity/use: "true"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - "/mgmt-agent"
        args:
        - controller
        - "--health-address=:8080"
        - "--ksm-image=mcr.microsoft.com/oss/v2/kubernetes/kube-state-metrics@9b99d6e6e3a52eeb24295f1ebbb62dd2f415b1665ca2235e259bdf79792876de"
        - "--log-verbosity=2"
        - "--node-health-configmap=mgmt-agent-node-health"
        - "--node-health-config-key=config.yaml"
        image: "arohcpsvcdev.azurecr.io/mgmt-agent@sha256:1234567890"
        name: mgmt-agent-controller
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AZURE_TOKEN_CREDENTIALS
          value: "WorkloadIdentityCredential"
        ports:
        - containerPort: 8080
          protocol: TCP
          name: health
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 768Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: mgmt-agent
      priorityClassName: service-lifecycle-critical
      terminationGracePeriodSeconds: 10
      nodeSelector:
