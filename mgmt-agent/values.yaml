image:
  registry: "{{ .acr.svc.name }}.{{ .acrDNSSuffix }}"
  repository: "{{ .mgmtAgent.image.repository }}"
  digest: "{{ .mgmtAgent.image.digest }}"
ksmImage:
  registry: "{{ .mgmt.prometheus.kubeStateMetrics.image.registry }}"
  repository: "{{ .mgmt.prometheus.kubeStateMetrics.image.repository }}"
  digest: "{{ .mgmt.prometheus.kubeStateMetrics.image.digest }}"
deployment:
  replicas: "{{ .mgmtAgent.k8s.replicas }}"
  requests:
    cpu: 50m
    memory: 64Mi
logVerbosity: 2
health:
  port: 8080
nodeHealth:
  configMapName: mgmt-agent-node-health
  configKey: config.yaml
  # Rendered into the ConfigMap the controller watches. Detection logic,
  # thresholds, and the SWIFT-v2 node scoping are hard-coded; the only runtime
  # config is this switch.
  #
  # This file is the authoritative source for the ConfigMap's contents. The
  # controller hot-reloads a live edit to the ConfigMap within one resync, which
  # makes `kubectl edit` a valid break-glass to switch the controller off during
  # an incident, but that edit is not durable: the next mgmt-agent rollout runs
  # helm and restores the value from here. A change meant to stick goes in git.
  config:
    enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  name: "{{ .mgmtAgent.k8s.serviceAccountName }}"
  workloadIdentityClientId: "__msiClientId__"
  workloadIdentityTenantId: "__tenantId__"
