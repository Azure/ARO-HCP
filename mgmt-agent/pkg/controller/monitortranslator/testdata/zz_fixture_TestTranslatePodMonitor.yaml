apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app: test-pods
  name: test-pods
  namespace: ocm-arohcppers-abc123-xyz
  ownerReferences:
  - apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    name: test-pods
    uid: source-uid-456
spec:
  podMetricsEndpoints:
  - metricRelabelings:
    - action: replace
      replacement: hcp
      targetLabel: microsoft_metrics_account
    - action: replace
      regex: ^$
      replacement: westus3
      sourceLabels:
      - region
      targetLabel: region
    - action: replace
      regex: ^$
      replacement: dev
      sourceLabels:
      - environment
      targetLabel: environment
    path: /metrics
    port: metrics
  selector:
    matchLabels:
      app: test-pods
