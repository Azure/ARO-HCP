apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: test-service
  name: test-service
  namespace: ocm-arohcppers-abc123-xyz
  ownerReferences:
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    name: test-service
    uid: source-uid-123
spec:
  endpoints:
  - interval: 30s
    metricRelabelings:
    - action: replace
      replacement: hcp
      targetLabel: microsoft_metrics_account
    - action: replace
      regex: ^$
      replacement: westus3
      sourceLabels:
      - region
      targetLabel: region
    - action: replace
      regex: ^$
      replacement: dev
      sourceLabels:
      - environment
      targetLabel: environment
    path: /metrics
    port: metrics
  namespaceSelector:
    matchNames:
    - ocm-arohcppers-abc123-xyz
  selector:
    matchLabels:
      app: test-service
