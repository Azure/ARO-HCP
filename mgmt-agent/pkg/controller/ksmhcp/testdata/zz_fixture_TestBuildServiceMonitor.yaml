apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: kube-state-metrics-hcp
  name: kube-state-metrics-hcp
  namespace: ocm-arohcppers-abc123-xyz
  ownerReferences:
  - apiVersion: hypershift.openshift.io/v1beta1
    kind: HostedControlPlane
    name: test-hcp
    uid: uid-123
spec:
  endpoints:
  - interval: 30s
    metricRelabelings:
    - action: replace
      replacement: ocm-arohcppers-abc123-xyz
      targetLabel: hostedcontrolplane
    - action: replace
      regex: (.+)
      sourceLabels:
      - exported_namespace
      targetLabel: namespace
    - action: replace
      regex: karpenter_nodeclaim_status_condition_transition_time_seconds;(InstanceTerminating);True
      replacement: "true"
      sourceLabels:
      - __name__
      - condition
      - status
      targetLabel: __tmp_karpenter_retained_true_condition
    - action: drop
      regex: karpenter_(nodepool|nodeclaim|aksnodeclass)_status_condition_transition_time_seconds;True;
      sourceLabels:
      - __name__
      - status
      - __tmp_karpenter_retained_true_condition
    - action: labeldrop
      regex: __tmp_karpenter_retained_true_condition
    - action: replace
      replacement: hcp
      targetLabel: microsoft_metrics_include_label
    port: http-metrics
  namespaceSelector:
    matchNames:
    - ocm-arohcppers-abc123-xyz
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics-hcp
