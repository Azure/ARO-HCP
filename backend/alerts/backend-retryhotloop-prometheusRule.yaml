apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: backend-retryhotloop-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: backend-retryhotloop
    labels:
      component: backend
    rules:
    - alert: BackendControllerRetryHotLoop
      # Validation controllers are excluded: they schedule delayed requeues via
      # EnqueueAfter for Failed/Unknown outcomes, which inflates workqueue_adds_total
      # and makes this retry/add ratio a poor proxy for reconcile failure.
      # Use BackendControllerReconcileErrorRate for actual SyncOnce errors.
      # A ratio of retries to total adds that is rate-independent:
      # it stays high regardless of item count or backoff delay.
      # A ratio > 0.5 sustained for 10 minutes means more than half
      # of all queue activity is retries rather than fresh work.
      expr: |
        (
          sum by (name, cluster) (
            max without(prometheus_replica) (
              rate(workqueue_retries_total{namespace="aro-hcp", name!~"clustervalidation.*|nodepoolvalidation.*"}[10m])
            )
          )
          /
          sum by (name, cluster) (
            max without(prometheus_replica) (
              rate(workqueue_adds_total{namespace="aro-hcp", name!~"clustervalidation.*|nodepoolvalidation.*"}[10m])
            )
          )
        ) > 0.5
      for: 10m
      labels:
        severity: warning
      annotations:
        correlationId: 'BackendControllerRetryHotLoop/{{ $labels.cluster }}/{{ $labels.name }}'
        description: 'Backend controller workqueue {{ $labels.name }} has a retry ratio of > 50% sustained over 10 minutes, indicating most queue activity is failed retries rather than fresh work.'
        runbook_url: 'https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/backend-tsg.html'
        summary: 'Backend controller workqueue {{ $labels.name }} retry hot loop'
    - alert: BackendControllerReconcileErrorRate
      # Fraction of reconciles that returned a SyncOnce error. Cooldown no-ops
      # (validation EarliestRetryAfter skips) are subtracted from the denominator
      # so AddRateLimited retries that hit the cooldown cannot hide real failures.
      # A ratio > 0.5 sustained for 10 minutes means most actual reconcile
      # attempts are failing. Failed validation outcomes return nil and do not
      # increment the error counter.
      expr: |
        (
          sum by (controller, cluster) (
            max without(prometheus_replica) (
              rate(backend_controller_reconcile_errors_total{namespace="aro-hcp"}[10m])
            )
          )
          /
          clamp_min(
            (
              sum by (controller, cluster) (
                max without(prometheus_replica) (
                  rate(backend_controller_reconcile_total{namespace="aro-hcp"}[10m])
                )
              )
              -
              (
                sum by (controller, cluster) (
                  max without(prometheus_replica) (
                    rate(backend_controller_reconcile_cooldown_skips_total{namespace="aro-hcp"}[10m])
                  )
                )
                or
                (
                  sum by (controller, cluster) (
                    max without(prometheus_replica) (
                      rate(backend_controller_reconcile_total{namespace="aro-hcp"}[10m])
                    )
                  ) * 0
                )
              )
            )
          , 0)
        ) > 0.5
      for: 10m
      labels:
        severity: warning
      annotations:
        correlationId: 'BackendControllerReconcileErrorRate/{{ $labels.cluster }}/{{ $labels.controller }}'
        description: 'Backend controller {{ $labels.controller }} has a reconcile error ratio of > 50% sustained over 10 minutes, indicating most reconciles are failing rather than succeeding.'
        runbook_url: 'https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/backend-tsg.html'
        summary: 'Backend controller {{ $labels.controller }} reconcile error rate is high'
