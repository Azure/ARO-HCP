apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: backend-cluster-update-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Update SLO Recording Rules
  # ========================================
  # Backend-owned SLIs for cluster update (PUT/PATCH) operations on
  # hcpOpenShiftClusters, derived from backend_resource_operation_last_transition_time_seconds
  # and backend_resource_operation_phase_info.
  #
  # These live here rather than under observability/recording-rules/ because
  # they measure a backend operation type, not a single user journey. They are
  # currently consumed by the IDMS (imageDigestMirrors) user journey
  # (observability/alerts/idms-mirror-slo-prometheusRule.yaml), which is one —
  # but not the only — customer intent carried by this operation type. Any
  # future cluster-update journey should reuse these series rather than define
  # its own.
  #
  # !!! SCOPE — READ BEFORE USING THESE RULES !!!
  #
  # An imageDigestMirrors change is carried by the generic cluster "update" LRO
  # and is emitted with operation_type="update", exactly like an authorizedCIDRs
  # change or a control plane version upgrade. Nothing on
  # backend_resource_operation_phase_info distinguishes them, so these series are
  # deliberately named for the operation they measure (cluster_update) rather
  # than for any journey consuming them.
  #
  # Known co-tenants of operation_type="update":
  #   - Control plane version upgrades. These have their own user journey
  #     (observability/recording-rules/userJourneyClusterUpgrade-recordingRule.yaml),
  #     but it measures version state via backend_cluster_version_info rather
  #     than the LRO, so there is no double-definition. An upgrade failure will
  #     still surface in the error rate below.
  #   - authorizedCIDRs, autoscaling, pod sizing and other cluster spec changes.
  #
  # When an alert built on these series fires, confirm what the affected
  # operation actually changed before attributing it to a specific journey.
  #
  # Relationship to other alerts on the same operation metrics:
  #   - Stuck (non-terminal) update operations are covered by
  #     BackendAsyncOperationClusterUpdateStuck in
  #     backend-async-operations-prometheusRule.yaml (same directory).
  #   - These rules cover the disjoint case: operations that reach a terminal
  #     "failed" phase, which the stuck alert can never fire on.
  #
  # Target: 95% of clusters' latest updates should succeed (not reach "failed").
  # Error Budget: 5% (1 - 0.95)
  #
  # Only succeeded and failed updates are counted. Canceled updates are
  # excluded from both the numerator and the denominator, so a cancellation
  # neither counts as a failure nor dilutes the rate — the same convention as the
  # cluster provisioning SLO.
  #
  # WHAT IS COUNTED: the phase gauge holds at most one series per
  # (resource, operation_type), because the Backend replaces the previous series
  # with the newest retained operation by start time (Cosmos document key breaks
  # ties). Informer resync order does not affect selection. When that document
  # expires, the newest remaining operation is selected. Every count below is
  # therefore a count of CLUSTERS by the outcome of their latest retained
  # update, not a count of LROs. A failed update
  # that is later retried successfully is overwritten and never counted, so
  # these series under-report LRO failures. A true per-LRO rate needs a counter
  # incremented once per terminal transition (ARO-25923).
  #
  # ONE STATE PER OPERATION: every count reads
  # current:backend_cluster_update:last_transition_time_seconds, which holds exactly
  # one series per (cluster, resource, operation_type) with the current phase as a
  # label and the last transition time as its value. Two sources can otherwise
  # report the same operation: HA Prometheus replicas (prometheus_replica), and
  # Backend targets (pod/instance), because a former leader keeps exporting its
  # last snapshot after losing leadership. The two Backend targets may disagree on
  # phase (for example a stale "failed" next to the new leader's "succeeded"), so
  # deduplicating per phase is not enough. The record first collapses identical
  # series with max by (..., phase), then keeps only the phase with the latest
  # transition per operation via topk(1): a stale snapshot cannot be newer than the
  # current leader's view of the same operation. Series without a transition-time
  # gauge fall back to time 0, so they still count in the instantaneous records
  # but never inside a window. An exact tie on transition time (sub-second phase
  # changes across a failover) keeps one arbitrary phase.
  #
  # The windowed group reads the record from the instantaneous group, so a phase
  # change can reach the windowed records up to one evaluation interval later.
  #
  # NOTE: the instantaneous records below are a trailing ~7-day cumulative ratio,
  # because the phase gauge is retained for the Cosmos 7-day TTL, so a single
  # stale failure keeps the ratio elevated for days. Alert on the windowed records
  # in arohcp_cluster_update_slo_windowed_recording_rules; the instantaneous
  # records are kept for dashboards only.
  - name: arohcp_cluster_update_slo_recording_rules
    interval: 1m
    rules:
    # Current state of each cluster update operation: one series per operation,
    # labelled with its current phase, valued with its last transition time.
    - record: current:backend_cluster_update:last_transition_time_seconds
      expr: |
        topk by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type) (
          1,
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="update"
            }
          )
          or
          0 * max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="update"
            }
          )
        )
    # Instantaneous count of clusters whose latest update succeeded
    - record: errors:backend_cluster_update:succeeded_total
      expr: |
        count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="succeeded"})
    # Instantaneous count of clusters whose latest update succeeded or failed
    - record: errors:backend_cluster_update:terminal_total
      expr: |
        count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"})
    # Instantaneous fraction of those clusters whose latest update failed
    - record: errors:backend_cluster_update:error_rate
      expr: |
        (
          count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="failed"})
          or
          0 * count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"})
        )
        /
        clamp_min(count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"}), 1)
  # ========================================
  # Cluster Update SLO Recording Rules: Windowed Errors (stateless)
  # ========================================
  # These windowed records count only clusters whose latest update's terminal
  # transition landed inside the window, via
  # (time() - current:backend_cluster_update:last_transition_time_seconds) < W,
  # so a stale failure ages out of the window instead of smearing for the full
  # Cosmos 7-day TTL. No new metric and no backend change.
  #
  # The `or 0 * ...` term pins the failure count to 0 (not absent) when a
  # cluster has update operations but none failed in-window.
  - name: arohcp_cluster_update_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): terminal transition within 3600s ---
    - record: errors:backend_cluster_update:failed_1h
      expr: |
        count by (cluster) (
          (time() - current:backend_cluster_update:last_transition_time_seconds{phase="failed"}) < 3600
        )
        or
        0 * count by (cluster) (current:backend_cluster_update:last_transition_time_seconds)
    - record: errors:backend_cluster_update:total_1h
      expr: |
        count by (cluster) (
          (time() - current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"}) < 3600
        )
    - record: errors:backend_cluster_update:error_rate_1h
      expr: |
        errors:backend_cluster_update:failed_1h
        /
        clamp_min(errors:backend_cluster_update:total_1h, 1)
    # --- 6h window (medium burn): terminal transition within 21600s ---
    - record: errors:backend_cluster_update:failed_6h
      expr: |
        count by (cluster) (
          (time() - current:backend_cluster_update:last_transition_time_seconds{phase="failed"}) < 21600
        )
        or
        0 * count by (cluster) (current:backend_cluster_update:last_transition_time_seconds)
    - record: errors:backend_cluster_update:total_6h
      expr: |
        count by (cluster) (
          (time() - current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"}) < 21600
        )
    - record: errors:backend_cluster_update:error_rate_6h
      expr: |
        errors:backend_cluster_update:failed_6h
        /
        clamp_min(errors:backend_cluster_update:total_6h, 1)
    # --- 3d window (slow burn / budget): terminal transition within 259200s ---
    - record: errors:backend_cluster_update:failed_3d
      expr: |
        count by (cluster) (
          (time() - current:backend_cluster_update:last_transition_time_seconds{phase="failed"}) < 259200
        )
        or
        0 * count by (cluster) (current:backend_cluster_update:last_transition_time_seconds)
    - record: errors:backend_cluster_update:total_3d
      expr: |
        count by (cluster) (
          (time() - current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"}) < 259200
        )
    - record: errors:backend_cluster_update:error_rate_3d
      expr: |
        errors:backend_cluster_update:failed_3d
        /
        clamp_min(errors:backend_cluster_update:total_3d, 1)
