apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: backend-cluster-update-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Update SLO Recording Rules
  # ========================================
  # Backend-owned SLIs for cluster update (PUT/PATCH) operations on
  # hcpOpenShiftClusters, derived from backend_resource_operation_phase_info.
  #
  # These live here rather than under observability/recording-rules/ because
  # they measure a backend operation type, not a single user journey. They are
  # currently consumed by the IDMS (imageDigestMirrors) user journey
  # (observability/alerts/idms-mirror-slo-prometheusRule.yaml), which is one —
  # but not the only — customer intent carried by this operation type. Any
  # future cluster-update journey should reuse these series rather than define
  # its own.
  #
  # !!! SCOPE — READ BEFORE USING THESE RULES !!!
  #
  # An imageDigestMirrors change is carried by the generic cluster "update" LRO
  # and is emitted with operation_type="update", exactly like an authorizedCIDRs
  # change or a control plane version upgrade. Nothing on
  # backend_resource_operation_phase_info distinguishes them, so these series are
  # deliberately named for the operation they measure (cluster_update) rather
  # than for any journey consuming them.
  #
  # Known co-tenants of operation_type="update":
  #   - Control plane version upgrades. These have their own user journey
  #     (observability/recording-rules/userJourneyClusterUpgrade-recordingRule.yaml),
  #     but it measures version state via backend_cluster_version_info rather
  #     than the LRO, so there is no double-definition. An upgrade failure will
  #     still surface in the error rate below.
  #   - authorizedCIDRs, autoscaling, pod sizing and other cluster spec changes.
  #
  # When an alert built on these series fires, confirm what the affected
  # operation actually changed before attributing it to a specific journey.
  #
  # Relationship to other alerts on the same series:
  #   - Stuck (non-terminal) update operations are covered by
  #     BackendAsyncOperationClusterUpdateStuck in
  #     backend-async-operations-prometheusRule.yaml (same directory).
  #   - These rules cover the disjoint case: operations that reach a terminal
  #     "failed" phase, which the stuck alert can never fire on.
  #
  # SLO: 95% of cluster update operations should succeed (not reach "failed").
  # Error Budget: 5% (1 - 0.95)
  #
  # The SLO counts only succeeded and failed operations. Canceled operations are
  # excluded from both the numerator and the denominator, so a cancellation
  # neither counts as a failure nor dilutes the rate — the same convention as the
  # cluster provisioning SLO.
  #
  # The phase gauge holds at most one series per (resource, operation_type): the
  # Backend replaces the previous series on every transition. Each count below is
  # therefore a count of resources by the phase of their most recent update.
  #
  # count() counts series, so HA scrapes are collapsed with
  # max without (prometheus_replica) BEFORE every count; otherwise each resource
  # is counted once per Prometheus replica.
  #
  # NOTE: the instantaneous records below are a trailing ~7-day cumulative ratio,
  # because the phase gauge is retained for the Cosmos 7-day TTL, so a single
  # stale failure keeps the ratio elevated for days. Alert on the windowed records
  # in arohcp_cluster_update_slo_windowed_recording_rules; the instantaneous
  # records are kept for dashboards only.
  - name: arohcp_cluster_update_slo_recording_rules
    interval: 1m
    rules:
    # Instantaneous count of succeeded cluster update operations per cluster
    - record: errors:backend_cluster_update:succeeded_total
      expr: |
        count by (cluster) (
          max without (prometheus_replica) (
            backend_resource_operation_phase_info{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="update",
              phase="succeeded"
            }
          )
        )
    # Instantaneous count of succeeded or failed cluster update operations per cluster
    - record: errors:backend_cluster_update:terminal_total
      expr: |
        count by (cluster) (
          max without (prometheus_replica) (
            backend_resource_operation_phase_info{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="update",
              phase=~"succeeded|failed"
            }
          )
        )
    # Instantaneous error rate per cluster: fraction of succeeded-or-failed operations that failed
    - record: errors:backend_cluster_update:error_rate
      expr: |
        (
          count by (cluster) (
            max without (prometheus_replica) (
              backend_resource_operation_phase_info{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="update",
                phase="failed"
              }
            )
          )
          or
          0 * count by (cluster) (
            max without (prometheus_replica) (
              backend_resource_operation_phase_info{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="update",
                phase=~"succeeded|failed"
              }
            )
          )
        )
        /
        clamp_min(
          count by (cluster) (
            max without (prometheus_replica) (
              backend_resource_operation_phase_info{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="update",
                phase=~"succeeded|failed"
              }
            )
          ),
          1
        )
  # ========================================
  # Cluster Update SLO Recording Rules: Windowed Errors (stateless)
  # ========================================
  # These windowed records count only cluster update operations whose terminal
  # transition landed inside the window, via
  # (time() - backend_resource_operation_last_transition_time_seconds) < W,
  # so a stale failure ages out of the window instead of smearing for the full
  # Cosmos 7-day TTL. No new metric and no backend change.
  #
  # The `or 0 * ...` term pins the failure count to 0 (not absent) when a
  # cluster has update operations but none failed in-window.
  - name: arohcp_cluster_update_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): terminal transition within 3600s ---
    - record: errors:backend_cluster_update:failed_1h
      expr: |
        count by (cluster) (
          (max without (prometheus_replica) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update",
            phase="failed"
          }) == 1)
          and
          ((time() - max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update"
          })) < 3600)
        )
        or
        0 * count by (cluster) (max without (prometheus_replica) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="update"
        }))
    - record: errors:backend_cluster_update:total_1h
      expr: |
        count by (cluster) (
          (max without (prometheus_replica) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update",
            phase=~"succeeded|failed"
          }) == 1)
          and
          ((time() - max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update"
          })) < 3600)
        )
    - record: errors:backend_cluster_update:error_rate_1h
      expr: |
        errors:backend_cluster_update:failed_1h
        /
        clamp_min(errors:backend_cluster_update:total_1h, 1)
    # --- 6h window (medium burn): terminal transition within 21600s ---
    - record: errors:backend_cluster_update:failed_6h
      expr: |
        count by (cluster) (
          (max without (prometheus_replica) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update",
            phase="failed"
          }) == 1)
          and
          ((time() - max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update"
          })) < 21600)
        )
        or
        0 * count by (cluster) (max without (prometheus_replica) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="update"
        }))
    - record: errors:backend_cluster_update:total_6h
      expr: |
        count by (cluster) (
          (max without (prometheus_replica) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update",
            phase=~"succeeded|failed"
          }) == 1)
          and
          ((time() - max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update"
          })) < 21600)
        )
    - record: errors:backend_cluster_update:error_rate_6h
      expr: |
        errors:backend_cluster_update:failed_6h
        /
        clamp_min(errors:backend_cluster_update:total_6h, 1)
    # --- 3d window (slow burn / budget): terminal transition within 259200s ---
    - record: errors:backend_cluster_update:failed_3d
      expr: |
        count by (cluster) (
          (max without (prometheus_replica) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update",
            phase="failed"
          }) == 1)
          and
          ((time() - max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update"
          })) < 259200)
        )
        or
        0 * count by (cluster) (max without (prometheus_replica) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="update"
        }))
    - record: errors:backend_cluster_update:total_3d
      expr: |
        count by (cluster) (
          (max without (prometheus_replica) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update",
            phase=~"succeeded|failed"
          }) == 1)
          and
          ((time() - max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="update"
          })) < 259200)
        )
    - record: errors:backend_cluster_update:error_rate_3d
      expr: |
        errors:backend_cluster_update:failed_3d
        /
        clamp_min(errors:backend_cluster_update:total_3d, 1)
