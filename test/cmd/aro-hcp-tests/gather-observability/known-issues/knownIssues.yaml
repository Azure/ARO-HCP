knownIssues:
- name: "PrometheusOperatorRejectedResources"
  labels:
    resource: "servicemonitor"
  reason: "ARO-28028 was closed Won't Do. This fires on the self-hosted Prometheus on management clusters and can be removed once management metrics move off self-hosted Prometheus to AMA (https://issues.redhat.com/browse/AROSLSRE-1693)."
- name: "KubeVersionMismatch"
  labels:
    cluster: ".*-mgmt-.*"
  reason: "Under investigation - tracked in https://issues.redhat.com/browse/ARO-30225"
- name: "OrphanedMRGDetected"
  reason: "The detector protects MRGs with existing owner customer resource groups, including owners outside the local backend. Remaining detections do not account for sweeper retention or missing createdAt tags. Keep this classification until rollout and cleanup backlog are verified under AROSLSRE-2447."
- name: "BackendAsyncOperation.*Stuck"
  reason: "Newly added stuck-async-operation alerts (https://github.com/Azure/ARO-HCP/pull/5952) surface a pre-existing problem: Azure Monitor Workspace ingestion latency (metrics can take ~10min to ingest) makes async operations look stuck and latches onto E2E runs even when the tests pass. Observed blocking green E2E runs (per https://cihealth.tools.hcpsvc.osadev.cloud/run-log?q=BackendAsync): BackendAsyncOperationClusterDeleteStuck, BackendAsyncOperationExternalAuthDeleteStuck, BackendAsyncOperationClusterCreateStuck, BackendAsyncOperationNodePoolDeleteStuck, BackendAsyncOperationNodePoolCreateStuck, BackendAsyncOperationStuck. The AMW auto-scaler (https://github.com/Azure/ARO-HCP/pull/6036) does not apply to DEV/CI and was closed unmerged; in DEV/CI the durable fix is the Prometheus-to-AMA metrics migration with multi-AMW routing (https://issues.redhat.com/browse/AROSLSRE-1693), which drastically reduces ingestion limits. Marked known so it stops blocking the merge queue until that lands."
- name: "KubePodNotReady"
  labels:
    namespace: "ocm-.*"
    pod: "(packageserver|olm-operator|catalog-operator)-.*"
  reason: "OLM pods in hosted control plane namespaces are simply uninteresting to us."
- name: "KubePodNotReady"
  labels:
    namespace: "ocm-.*"
    pod: "hosted-cluster-config-operator-.*"
  reason: "HCCO pods are transiently not-ready during cluster provisioning because the init container (availability-prober) blocks until the guest cluster kube-apiserver and 18+ CRDs are bootstrapped, which routinely exceeds the 5-minute KubePodNotReady threshold."
- name: "KubePodNotReady"
  labels:
    namespace: "ocm-.*"
    pod: "capi-provider-.*"
  reason: "capi-provider pods are transiently not-ready during HCP provisioning due to a deliberate bootstrap dependency cycle: the pod mounts the service-network-admin-kubeconfig secret (created by the KAS component), but capi-provider is intentionally excluded from the KAS dependency gate in HyperShift (componentsExcludedFromKubeAPIServerDependency) because node provisioning cannot wait for KAS to fully roll out. The pod sits in ContainerCreating with FailedMount errors until KAS reconciles and creates the secret, then the availability-prober init container gates on KAS /livez before starting the main container. This is by design and consistently exceeds the 5-minute KubePodNotReady threshold during provisioning (~56 alerts/day across 32 pods)."
- name: "KubePodNotReady"
  labels:
    namespace: "velero"
    pod: "ocm-.*"
  reason: "Velero DataUpload exposer pods are transient (short-lived ~30-90s) pods that mount CSI snapshot PVCs for kopia data upload during scheduled backups. They complete and are deleted well within 5 minutes, but Prometheus lookback delta keeps stale Pending-phase metrics queryable beyond the for:5m alert threshold."
- name: "KubePodCrashLooping"
  labels:
    namespace: "open-cluster-management-agent-addon"
    pod: "hypershift-addon-agent-.*"
  reason: "ACM/MCE removal work is in progress. OCM agent log requirements removed in https://github.com/Azure/ARO-HCP/pull/7816; suppressing the corresponding alerts here as well. Tracked in https://issues.redhat.com/browse/AROSLSRE-2645."
  expiresAfter: "2027-01-31"
