#
# Purpose: Run PROW E2E tests
#
$schema: "pipeline.schema.v1"
serviceGroup: Microsoft.Azure.ARO.HCP.E2E
rolloutName: E2E Tests
resourceGroups:
- name: global
  resourceGroup: '{{ .global.rg }}'
  subscription: '{{ .global.subscription.key }}'
  steps:
  - name: output
    action: ARM
    template: ../dev-infrastructure/templates/output-global.bicep
    parameters: ../dev-infrastructure/configurations/output-global.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
  # Test images that e2e workloads in guest clusters pull. Guest clusters can only
  # pull from the OCP ACR (Cluster Service-issued _repositories_pull token), so
  # mirror there. Runs before the regionalGating validation step starts the e2e job.
  - name: mirror-pebble-image
    action: ImageMirror
    targetACR:
      configRef: 'acr.ocp.name'
    sourceRegistry:
      configRef: e2e.pebbleImage.registry
    repository:
      configRef: e2e.pebbleImage.repository
    digest:
      configRef: e2e.pebbleImage.digest
    pullSecretKeyVault:
      configRef: global.keyVault.name
    pullSecretName:
      configRef: imageSync.ondemandSync.pullSecretName
    shellIdentity:
      input:
        resourceGroup: global
        step: output
        name: globalMSIId
    automatedRetry:
      errorContainsAny:
      - "unknown_storage_failure"
      - "unexpected EOF"
      - "unauthorized: authentication required"
      maximumRetryCount: 5
      durationBetweenRetries: 1m
- name: service
  resourceGroup: '{{ .svc.rg }}'
  subscription: '{{ .svc.subscription.key }}'
  steps: []
  validationSteps:
  - name: regionalGating
    action: ProwJob
    validation:
    - GA
    tokenKeyvault: "{{ .global.keyVault.name }}"
    tokenSecret: "{{ .e2e.prow.globalKeyVaultTokenSecret }}"
    jobName: "{{ .e2e.regionTest.prowJobName }}"
    gatePromotion: "{{ .e2e.regionTest.gatePromotion }}"
    allowedSubscriptions: "{{ .e2e.regionTest.allowedSubscriptions }}"
    identityFrom:
      resourceGroup: global
      step: output
      name: globalMSIId
    # Setting this explicitly replaces the default MSI/connection-failure retry
    # (see sdp-pipelines graph_step.go buildOnFailure), so it must keep those
    # phrases as well as the new markers prow-job-executor emits when finished.json
    # marks a gate failure as a known, tracked issue safe to retry (AROSLSRE-1721),
    # or as a pre-test infra precondition failure safe to retry once (AROSLSRE-1926).
    # Do not reproduce ev2-retryable-known-issue-failure or
    # ev2-retryable-infra-precondition-failure verbatim anywhere else this gate's
    # inlined common.sh script could echo back into stdout, or a genuine,
    # non-eligible failure would be spuriously retried (see AROSLSRE-1292).
    # stg and int set useExclusiveLocks in stages.yaml, which makes the generator
    # fail fast on this step; even there, these errorContainsAny patterns are
    # still honored (merged into the fixed, bounded fail-fast retry) as of
    # AROSLSRE-1764 - only the retry count/wait duration are pinned in that path.
    automatedRetry:
      errorContainsAny:
      - "failed to establish a new connection"
      - "failed to get token"
      - "Failed to connect to MSI"
      - "ev2-retryable-known-issue-failure"
      - "ev2-retryable-infra-precondition-failure"
      maximumRetryCount: 1
      durationBetweenRetries: 1m
