        e2e: "ARO HCP E2E Hosted Clusters - Prod - 02 (MCA Sponsorship)"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-prod-shard2-slot
      slot_count: 3
      slot_assets:
