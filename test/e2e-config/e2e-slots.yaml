version: 2
asset_pools:
- name: dev-infrastructure-identities
  kind: infrastructure_identities
  provisioning: managed
  boskos_resource_type: aro-hcp-dev-infrastructure-identities
  resource_name_prefix: aro-hcp-dev-infrastructure-identities
  infrastructure_identities:
    provisioning_region: westus3
environments:
  dev:
    deployment_environment:
      name: ci01
      infrastructure_subscription: "ARO HCP E2E Infrastructure (EA Subscription)"
    pools:
    # Jobs select the runtime region from these weighted pools. Existing jobs
    # with an explicit location override remain pinned during rollout.
    # Identity containers remain provisioned in westus3.
    # Each managed subscription keeps 290 containers split into five 58-container job slots.
    # At the current role-assignment cost, five full runs consume 7,615 of the
    # 8,000-assignment quota, leaving 385 assignments of gross headroom.
    - name: shard0
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters (EA Subscription)"
      region_mode: weighted
      regions:
      - westus3
      - centralus
      - canadacentral
      resource_type: aro-hcp-dev-shard0-slot
      slot_count: 5
      slot_assets:
        e2e_identities:
          allocation: dedicated
          provisioning_region: westus3
          resource_group_prefix: aro-hcp-msi-container-dev-shard0
          resource_group_count: 58
        infrastructure_identities:
          allocation: leased
          asset_pool: dev-infrastructure-identities
    - name: shard1
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters 2 (EA Subscription)"
      region_mode: weighted
