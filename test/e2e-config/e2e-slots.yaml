  # dev-xs is a separate environment for smaller workloads such as upgrade/
  # in-place tests and CAPZ on-demand testing. It uses deploy_env ci02 so
  # these jobs and e2e-parallel jobs (ci00/ci01) never compete for the same
  # Boskos pools. ci02 maps to a dedicated templatize environment with
  # cluster sizing tuned for fewer concurrent HCPs.
  dev-xs:
    deployment_environment:
      name: ci02
      infrastructure_subscription: "ARO HCP E2E Infrastructure (EA Subscription)"
    pools:
    # Dedicated subscription for upgrade and CAPZ on-demand testing.
    # 30 slots support peak concurrent PR activity + merge pool.
    # Each slot supports up to 6 concurrent HCPs (matching ci02 MGMT sizing).
    # After the 6th spec is merged, no additional specs can be added without
    # first increasing identity_container_count here (and resyncing the boskos
    # config) — otherwise excess specs block waiting for a free identity
    # container and the suite eventually times out.
    - name: shard4
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters - Dev - 04"
      region_mode: weighted
      regions:
      - westus3
      - centralus
      - canadacentral
      resource_type: aro-hcp-dev-shard4-slot
      slot_count: 30
      slot_assets:
        e2e_identities:
          allocation: dedicated
          provisioning_region: westus3
          resource_group_prefix: aro-hcp-msi-container-dev-shard4
          resource_group_count: 6
        infrastructure_identities:
          allocation: leased
          asset_pool: dev-infrastructure-identities
  int:
    deployment_environment:
      name: int
    pools:
    - name: shard0
      subscriptions:
        e2e: "ARO SRE Team - INT (EA Subscription 3)"
      region: uksouth
      region_mode: fixed
      resource_type: aro-hcp-int-shard0-slot
      slot_count: 1
      slot_assets:
        e2e_identities:
          allocation: dedicated
          resource_group_prefix: aro-hcp-msi-container-int-shard0
          resource_group_count: 20
    - name: westus3-shard0
      subscriptions:
        e2e: "ARO SRE Team - INT (EA Subscription 3)"
      region: westus3
      region_mode: fixed
      resource_type: aro-hcp-int-westus3-shard0-slot
      slot_count: 1
      identity_container_provisioning_count: 100
      vm_family_policy:
        worker_families:
        - StandardDsv6Family
        - standardDSv5Family
        - standardDASv5Family
        helper_families:
        - StandardDdsv6Family
        - standardDDSv5Family
        - standardDADSv5Family
      slot_assets:
        e2e_identities:
          allocation: dedicated
          resource_group_prefix: aro-hcp-msi-container-int-westus3-shard0
          resource_group_count: 75
  stg:
    deployment_environment:
      name: stg
    pools:
    # shard0: Stage-00 subscription, runtime-selected region with uksouth as the default.
    # resource_group_count set to 25 to support running the full E2E suite in parallel.
    - name: shard0
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters - Stage - 00"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-stg-shard0-slot
      slot_count: 1
      slot_assets:
        e2e_identities:
          allocation: dedicated
          resource_group_prefix: aro-hcp-msi-container-stg-shard0
          # provisionShardClusterLimit is configured to 25 in STG
          resource_group_count: 25
    - name: shard1
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters - Stage - 01 (MCA Sponsorship)"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-stg-shard1-slot
      slot_count: 1
      slot_assets:
        e2e_identities:
          allocation: dedicated
          resource_group_prefix: aro-hcp-msi-container-stg-shard1
          resource_group_count: 25
  prod:
    deployment_environment:
      name: prod
    pools:
    # slot_count is capped at 3 per subscription by the Azure deny-assignment
    # limit, not by role-assignment quota. The Authorization RP allows at most
    # 2000 deny assignments per subscription, and the RP currently creates
    # sharded (per-cluster) deny assignments (~21 per HCP), which caps a
    # subscription at ~92 concurrent HCPs. With resource_group_count: 25
    # (max HCPs per suite run), that is floor(92 / 25) = 3 slots per sub.
    # This constraint is AME-only (STG and PROD): deny assignments are only
    # created in AME. See the "Scaling Constraints" section in
    # docs/ci/identity-leasing.md for the full explanation.
    - name: shard0
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters - Prod - 00"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-prod-shard0-slot
      slot_count: 3
      slot_assets:
        e2e_identities:
          allocation: dedicated
          resource_group_prefix: aro-hcp-msi-container-prod
          resource_group_count: 25
    - name: shard1
      subscriptions:
        e2e: "ARO HCP E2E Hosted Clusters - Prod - 01"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-prod-shard1-slot
      slot_count: 3
      slot_assets:
        e2e_identities:
          allocation: dedicated
          resource_group_prefix: aro-hcp-msi-container-prod
          resource_group_count: 25
    - name: shard2
