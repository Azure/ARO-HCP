version: 1
environments:
  dev:
    deploy_envs:
    - ci00
    - ci01
    pools:
    # Jobs choose the runtime region; `region` is only the default when no runtime override is provided.
    # Identity containers are provisioned in westus3.
    # Each managed subscription keeps 300 containers split into five 60-container job slots.
    - subscription_name: "ARO HCP E2E Hosted Clusters (EA Subscription)"
      region: westus3
      region_mode: runtime-selected
      resource_type: aro-hcp-dev-shard0-slot
      slot_count: 5
      identity_container_prefix: aro-hcp-msi-container-dev-shard0
      identity_container_count: 60
    - subscription_name: "ARO HCP E2E Hosted Clusters 2 (EA Subscription)"
      region: westus3
      region_mode: runtime-selected
      resource_type: aro-hcp-dev-shard1-slot
      slot_count: 5
      identity_container_prefix: aro-hcp-msi-container-dev-shard1
      identity_container_count: 60
    - subscription_name: "ARO HCP E2E Hosted Clusters - Dev - 02"
      region: westus3
      region_mode: runtime-selected
      resource_type: aro-hcp-dev-shard2-slot
      slot_count: 5
      identity_container_prefix: aro-hcp-msi-container-dev-shard2
      identity_container_count: 60
    - subscription_name: "ARO HCP E2E Hosted Clusters - Dev - 03"
      region: westus3
      region_mode: runtime-selected
      resource_type: aro-hcp-dev-shard3-slot
      slot_count: 5
      identity_container_prefix: aro-hcp-msi-container-dev-shard3
      identity_container_count: 60
    - subscription_name: "Hypershift Managed Azure"
      region: westus3
      region_mode: runtime-selected
      resource_type: aro-hcp-dev-hypershift-westus3-slot
      slot_count: 1
      identity_container_prefix: aro-hcp-msi-container-dev
      identity_container_count: 20
      identity_provisioning: unmanaged
  # dev-upgrade is a separate environment for the upgrade/in-place test suite
  # and CAPZ on-demand testing. It uses deploy_env ci02 so upgrade jobs and
  # e2e-parallel jobs (ci00/ci01) never compete for the same Boskos pools.
  # ci02 maps to a dedicated templatize environment with cluster sizing tuned
  # for upgrade workloads (10 concurrent HCPs vs 50 in e2e-parallel).
  dev-upgrade:
    deploy_envs:
    - ci02
    pools:
    # Dedicated subscription for upgrade and CAPZ on-demand testing.
    # 30 slots support peak concurrent PR activity + merge pool.
    # Each slot supports up to 10 concurrent HCPs (matching ci02 MGMT sizing).
    # After the 10th spec is merged, no additional specs can be added without
    # first increasing identity_container_count here (and resyncing the boskos
    # config) — otherwise excess specs block waiting for a free identity
    # container and the suite eventually times out.
    - subscription_name: "ARO HCP E2E Hosted Clusters - Dev - 04"
      region: westus3
      region_mode: runtime-selected
      resource_type: aro-hcp-dev-shard4-slot
      slot_count: 30
      identity_container_prefix: aro-hcp-msi-container-dev-shard4
      identity_container_count: 10
  int:
    deploy_envs:
    - int
    pools:
    - subscription_name: "ARO SRE Team - INT (EA Subscription 3)"
      region: uksouth
      region_mode: fixed
      resource_type: aro-hcp-int-shard0-slot
      slot_count: 1
      identity_container_prefix: aro-hcp-msi-container-int-shard0
      identity_container_count: 20
    - subscription_name: "ARO SRE Team - INT (EA Subscription 3)"
      region: westus3
      region_mode: fixed
      resource_type: aro-hcp-int-westus3-shard0-slot
      slot_count: 1
      identity_container_prefix: aro-hcp-msi-container-int-westus3-shard0
      identity_container_count: 20
  stg:
    deploy_envs:
    - stg
    pools:
    # shard0: Stage-00 subscription, fixed uksouth region.
    # identity_container_count set to 25 to support running the full E2E suite in parallel.
    - subscription_name: "ARO HCP E2E Hosted Clusters - Stage - 00"
      region: uksouth
      region_mode: fixed
      resource_type: aro-hcp-stg-shard0-slot
      slot_count: 1
      identity_container_prefix: aro-hcp-msi-container-stg-shard0
      # provisionShardClusterLimit is configured to 25 in STG
      identity_container_count: 25
  prod:
    deploy_envs:
    - prod
    pools:
    # slot_count is capped at 3 per subscription by the Azure deny-assignment
    # limit, not by role-assignment quota. The Authorization RP allows at most
    # 2000 deny assignments per subscription, and the RP currently creates
    # sharded (per-cluster) deny assignments (~21 per HCP), which caps a
    # subscription at ~92 concurrent HCPs. With identity_container_count: 25
    # (max HCPs per suite run), that is floor(92 / 25) = 3 slots per sub.
    # This constraint is AME-only (STG and PROD): deny assignments are only
    # created in AME. See the "Scaling Constraints" section in
    # docs/ci/identity-leasing.md for the full explanation.
    - subscription_name: "ARO HCP E2E Hosted Clusters - Prod - 00"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-prod-shard0-slot
      slot_count: 3
      identity_container_prefix: aro-hcp-msi-container-prod
      identity_container_count: 25
    - subscription_name: "ARO HCP E2E Hosted Clusters - Prod - 01"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-prod-shard1-slot
      slot_count: 3
      identity_container_prefix: aro-hcp-msi-container-prod
      identity_container_count: 25
    # Test-Test tenant (MSFT) prod sub "ARO HCP E2E" (403d9de9). Cross-tenant, so
    # identities are provisioned externally (identity_provisioning: unmanaged).
    # Kept in the pool so the single prod gating job can lease it for the canary
    # region (eastus2euap), which only this sub is EUAP-onboarded for. The test
    # step resolves this sub's owning tenant/service principal from the
    # /var/run/aro-hcp-prod cluster profile via SELECTED_CLUSTER_PROFILE_DIR.
    - subscription_name: "ARO HCP E2E"
      region: uksouth
      region_mode: runtime-selected
      resource_type: aro-hcp-prod-testtenant-slot
      slot_count: 4
      identity_container_prefix: aro-hcp-msi-container-prod-testtenant
      identity_container_count: 25
      identity_provisioning: unmanaged
