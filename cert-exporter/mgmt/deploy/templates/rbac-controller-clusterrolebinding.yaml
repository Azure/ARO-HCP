apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-exporter-rbac-controller
  labels:
    app.kubernetes.io/name: cert-exporter-rbac-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-exporter-rbac-controller
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbacController.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}