apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-exporter-rbac-controller
  labels:
    app.kubernetes.io/name: cert-exporter-rbac-controller
# NOTE: This ClusterRoleBinding is for the RBAC controller only (needs cluster-scoped
# permissions to list namespaces and create RoleBindings). The cert-exporter itself
# uses only namespaced RoleBindings and never gets a ClusterRoleBinding.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-exporter-rbac-controller
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbacController.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}