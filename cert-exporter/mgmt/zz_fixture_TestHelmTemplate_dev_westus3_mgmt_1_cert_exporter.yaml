    app.kubernetes.io/name: cert-exporter
  name: cert-exporter
  namespace: cert-exporter
automountServiceAccountToken: true
---
# Source: cert-exporter/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-exporter-config
  namespace: cert-exporter
  labels:
    app.kubernetes.io/name: cert-exporter
data:
  config.yaml: |
    server:
      listen: ":9793"
    log:
      level: info
      format: text
    metrics:
      exposeNotBefore: true
    sources:
      - kind: kubernetes
        name: apiserver-tls-certs
        namespaces:
          include: ["ocm-*"]
          exclude: []
        secrets:
          include: ["kube-apiserver-tls-cert"]
          exclude: []
          types:
            - type: "kubernetes.io/tls"
              keyPatterns: ["^tls\\.crt$"]
              format: pem
      - kind: kubernetes
        name: ingress-tls-certs
        namespaces:
          include: ["open-cluster-management-policies"]
          exclude: []
        secrets:
          include: ["default-ingress-tls-cert-*"]
          exclude: []
          types:
            - type: "kubernetes.io/tls"
              keyPatterns: ["^tls\\.crt$"]
              format: pem
---
