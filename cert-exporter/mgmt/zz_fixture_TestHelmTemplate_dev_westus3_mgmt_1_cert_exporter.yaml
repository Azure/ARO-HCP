# Source: cert-exporter/templates/rbac-controller-validatingadmissionpolicy.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cert-exporter-rbac-controller
  labels:
    app.kubernetes.io/name: cert-exporter-rbac-controller
spec:
  failurePolicy: Fail
  matchConditions:
  - name: user-is-cert-exporter-rbac-controller
    expression: "request.userInfo.username == 'system:serviceaccount:cert-exporter:cert-exporter-rbac-controller'"
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["rolebindings"]
      scope: Namespaced
  variables:
  - name: isTargetNamespace
    expression: "request.namespace.startsWith('ocm-') || request.namespace == 'open-cluster-management-policies'"
  - name: isManagedDelete
    expression: "request.operation == 'DELETE' && oldObject.metadata.name == 'cert-exporter' && 'app.kubernetes.io/managed-by' in oldObject.metadata.?labels.orValue({}) && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'cert-exporter-rbac-controller'"
  - name: isValidMutation
    expression: "request.operation != 'DELETE' && variables.isTargetNamespace && object.metadata.name == 'cert-exporter' && 'app.kubernetes.io/managed-by' in object.metadata.?labels.orValue({}) && object.metadata.labels['app.kubernetes.io/managed-by'] == 'cert-exporter-rbac-controller' && object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'cert-exporter' && size(object.subjects) == 1 && object.subjects[0].kind == 'ServiceAccount' && object.subjects[0].name == 'cert-exporter' && object.subjects[0].namespace == 'cert-exporter'"
  validations:
  - expression: "variables.isManagedDelete || variables.isValidMutation"
    message: The cert-exporter RBAC controller may only manage its exact RoleBinding in approved namespaces.
    reason: Forbidden
---
