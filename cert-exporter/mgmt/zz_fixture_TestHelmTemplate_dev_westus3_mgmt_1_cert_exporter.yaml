# Source: cert-exporter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-exporter
  namespace: cert-exporter
  labels:
    app.kubernetes.io/name: cert-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-exporter
    spec:
      serviceAccountName: cert-exporter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cert-exporter
        image: 'arohcpsvcdev.azurecr.io/enix/x509-certificate-exporter@sha256:1234567890'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        args:
        - --config=/etc/x509-certificate-exporter/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/x509-certificate-exporter
          readOnly: true
        ports:
        - name: metrics
          containerPort: 9793
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: cert-exporter-config
---
# Source: cert-exporter/templates/rbac-controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-exporter-rbac-controller
  namespace: cert-exporter
  labels:
    app.kubernetes.io/name: cert-exporter-rbac-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-exporter-rbac-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-exporter-rbac-controller
    spec:
      serviceAccountName: cert-exporter-rbac-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rbac-controller
        image: 'arohcpsvcdev.azurecr.io/cert-exporter-rbac-controller@sha256:1234567890'
        args:
        - --exporter-namespace=cert-exporter
        - --exporter-service-account=cert-exporter
        - --target-namespace-prefix=ocm-
        - --target-namespace=open-cluster-management-policies
        ports:
        - name: healthz
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
