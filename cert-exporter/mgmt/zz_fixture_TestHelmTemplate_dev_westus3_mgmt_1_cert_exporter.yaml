- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: ["cert-exporter"]
  verbs: ["bind"]
---
# Source: cert-exporter/templates/rbac-controller-clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-exporter-rbac-controller
  labels:
    app.kubernetes.io/name: cert-exporter-rbac-controller
# NOTE: This ClusterRoleBinding is for the RBAC controller only (needs cluster-scoped
