apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-exporter-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cert-exporter
data:
  config.yaml: |
    server:
      listen: ":9793"
    log:
      level: info
      format: text
    metrics:
      exposeNotBefore: true
    sources:
      - kind: kubernetes
        name: istio-ingress-secrets
        namespaces:
          include: ["{{ .Values.watchNamespace }}"]
          exclude: []
        secrets:
          include:
            - "frontend-credential"
            - "admin-api-credential"
            - "sessiongate-credential"
          exclude: []
          types:
            - type: "kubernetes.io/tls"
              keyPatterns: ["^tls\\.crt$"]
              format: pem
