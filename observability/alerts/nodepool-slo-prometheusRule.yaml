apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: nodepool-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Node Pool SLO Alerts — Errors
  # ========================================
  # Error-rate burn-rate alerting for node pool operations lives in the
  # windowed, volume-aware group arohcp_nodepool_slo_windowed_error_alerts,
  # which counts only operations whose terminal transition landed inside the
  # window instead of the trailing 7-day gauge ratio. This group retains the
  # stuck-operation detector, which catches operations wedged in a non-terminal
  # phase (invisible to the success/failure SLIs).
  - name: arohcp_nodepool_slo_error_alerts
    labels:
      component: slo
    rules:
    # ----------------------------------------
    # Stuck Operations Alert (non-paging for now per approver request)
    # ----------------------------------------
    # Operations stuck in non-terminal phases are invisible to success/failure SLIs.
    # Threshold: 2 hours (7200s) with 15m sustained observation to filter
    # slow-but-completing operations from genuinely stuck ones.
    #
    # Stickiness (max_over_time ... [6h:]): while a resource stays wedged, the raw
    # condition can transiently clear -- most commonly when the backend retries the
    # operation and resets backend_resource_operation_start_time_seconds, briefly
    # dropping (time() - start_time) below the 7200s threshold. Each clear
    # auto-resolves the IcM incident and the next re-fire opens a brand-new one,
    # producing roughly one new incident every ~4h for the same wedged resource.
    # (Azure Managed Prometheus has no keep_firing_for, so we express the hold in the
    # PromQL.) Holding the condition firing over a 6h look-back collapses a
    # continuously-stuck resource into a single long-lived incident; genuinely
    # distinct stuck episodes more than 6h apart still get their own incident.
    - alert: UJNodePoolStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (
              (
                (time() - backend_resource_operation_start_time_seconds{resource_type=~".*nodepools"})
                and
                backend_resource_operation_phase_info{resource_type=~".*nodepools", phase=~"updating|deleting"} == 1
              ) > 7200
            )[6h:5m]
          )
        )
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: info
      annotations:
        summary: "{{ $labels.cluster }}: Node Pool operation for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 2 hours"
        description: "Node pool operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
  # ========================================
  # Node Pool User Journey Alerts — Saturation
  # ========================================
  # Queue depth impacts node pool operations directly,
  # making these user journey signals per ADR. Sev 4 (precursor).
  - name: arohcp_nodepool_saturation_alerts
    labels:
      component: slo
    rules:
    # Queue depth: node pool controller workqueue accumulating work
    - alert: UJNodePoolSaturationQueueDepth
      expr: |
        max by (name, cluster) (
          max without(prometheus_replica) (
            workqueue_depth{namespace="aro-hcp", name=~".*NodePool.*"}
          )
        ) > 10
      for: 5m
      labels:
        severity: info
      annotations:
        summary: "{{ $labels.cluster }}: Node Pool controller workqueue {{ $labels.name }} depth is high"
        description: "Node pool controller workqueue {{ $labels.name }} has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
        # Retry hot loop alert removed (ARO-28637): the workqueue retry ratio
        # encodes backend implementation detail (polling requeues count as retries),
        # fires without customer impact, and is not actionable. The stuck operation
        # alert covers the customer-visible outcome.
  # ========================================
  # Node Pool SLO Alerts: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # Read the windowed recording rules
  # (errors:backend_nodepool_operation:{failed,total,error_rate}_{1h,6h,3d}), so
  # each tier evaluates a real event window instead of the trailing 7-day gauge
  # ratio. Stateless, no new metric, no backend change. Severities mirror the
  # existing node pool tiers (non-paging "info" per approver request) and are
  # owner-tunable; volume floors mirror cluster-provision and should be tuned to
  # real node pool traffic.
  - name: arohcp_nodepool_slo_windowed_error_alerts
    labels:
      component: slo
    rules:
    # Fast Burn. 14.4x burn: >72% failures over 1h, >=3 failures.
    - alert: UJNodePoolErrorBurst1h
      expr: |
        errors:backend_nodepool_operation:failed_1h >= 3
        and
        errors:backend_nodepool_operation:error_rate_1h > 0.72
      for: 5m
      labels:
        severity: info
        slo: nodepool-errors
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: Node Pool operations failing fast (>72% of recent operations)"
        description: "More than 72% of completed node pool operations (update/delete) on {{ $labels.cluster }} failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    # Medium Burn. 6x burn: >30% failures over 6h, >=5 completions.
    - alert: UJNodePoolErrorBurst6h
      expr: |
        errors:backend_nodepool_operation:total_6h >= 5
        and
        errors:backend_nodepool_operation:error_rate_6h > 0.30
      for: 30m
      labels:
        severity: info
        slo: nodepool-errors
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: Node Pool operation error rate elevated (>30% over 6h)"
        description: "More than 30% of completed node pool operations on {{ $labels.cluster }} failed over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    # Slow Burn / Budget. 1x burn: >5% failures over 3d, >=10 completions, >=2 failures.
    - alert: UJNodePoolErrorBudget3d
      expr: |
        errors:backend_nodepool_operation:total_3d >= 10
        and
        errors:backend_nodepool_operation:failed_3d >= 2
        and
        errors:backend_nodepool_operation:error_rate_3d > 0.05
      for: 6h
      labels:
        severity: info
        slo: nodepool-errors
        long_window: 3d
      annotations:
        summary: "{{ $labels.cluster }}: Node Pool operation error budget burning (>5% over 3d)"
        description: "More than 5% of completed node pool operations on {{ $labels.cluster }} failed over the last 3 days (at least 10 completions and 2 failures), a 1x burn that exhausts the 95% SLO error budget over the window."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
