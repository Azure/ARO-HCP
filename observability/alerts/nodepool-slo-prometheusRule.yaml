apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: nodepool-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Node Pool SLO Alerts — Errors
  # ========================================
  # Error-rate burn-rate alerting for node pool operations lives in the
  # windowed, volume-aware group arohcp_nodepool_slo_windowed_error_alerts,
  # which counts only operations whose terminal transition landed inside the
  # window instead of the trailing 7-day gauge ratio. This group retains the
  # stuck-operation detector, which catches operations wedged in a non-terminal
  # phase (invisible to the success/failure SLIs).
  - name: arohcp_nodepool_slo_error_alerts
    labels:
      component: slo
    rules:
    # ----------------------------------------
    # Stuck Operations Alerts (non-paging for now per approver request)
    # ----------------------------------------
    # Operations stuck in non-terminal phases are invisible to success/failure SLIs.
    # Create, update and delete run different backend code paths, so each verb has
    # its own alert, threshold and IcM correlationId. Thresholds start at 2 hours
    # (7200s) with 15m sustained observation and are tuned per verb from the
    # alert-tester report.
    #
    # Stickiness (max_over_time ... [6h:]): while a resource stays wedged, the raw
    # condition can transiently clear -- most commonly when the backend retries the
    # operation and resets backend_resource_operation_start_time_seconds, briefly
    # dropping (time() - start_time) below the threshold. Each clear
    # auto-resolves the IcM incident and the next re-fire opens a brand-new one,
    # producing roughly one new incident every ~4h for the same wedged resource.
    # (Azure Managed Prometheus has no keep_firing_for, so we express the hold in the
    # PromQL.) Holding the condition firing over a 6h look-back collapses a
    # continuously-stuck resource into a single long-lived incident; genuinely
    # distinct stuck episodes more than 6h apart still get their own incident.
    - alert: userJourneyNodePoolCreateStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (
              (
                (time() - backend_resource_operation_start_time_seconds{resource_type=~".*nodepools", operation_type="create"})
                and
                backend_resource_operation_phase_info{resource_type=~".*nodepools", operation_type="create", phase=~"accepted|provisioning|updating|deleting"} == 1
              ) > 7200
            )[6h:5m]
          )
        )
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        correlationId: "userJourneyNodePoolCreateStuckOperation/{{ $labels.cluster }}/{{ $labels.resource_id }}"
        summary: "{{ $labels.cluster }}: Node Pool create for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 2 hours"
        description: "Node pool create operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    - alert: userJourneyNodePoolUpdateStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (
              (
                (time() - backend_resource_operation_start_time_seconds{resource_type=~".*nodepools", operation_type="update"})
                and
                backend_resource_operation_phase_info{resource_type=~".*nodepools", operation_type="update", phase=~"accepted|provisioning|updating|deleting"} == 1
              ) > 7200
            )[6h:5m]
          )
        )
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        correlationId: "userJourneyNodePoolUpdateStuckOperation/{{ $labels.cluster }}/{{ $labels.resource_id }}"
        summary: "{{ $labels.cluster }}: Node Pool update for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 2 hours"
        description: "Node pool update operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    - alert: userJourneyNodePoolDeleteStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (
              (
                (time() - backend_resource_operation_start_time_seconds{resource_type=~".*nodepools", operation_type="delete"})
                and
                backend_resource_operation_phase_info{resource_type=~".*nodepools", operation_type="delete", phase=~"accepted|provisioning|updating|deleting"} == 1
              ) > 7200
            )[6h:5m]
          )
        )
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        correlationId: "userJourneyNodePoolDeleteStuckOperation/{{ $labels.cluster }}/{{ $labels.resource_id }}"
        summary: "{{ $labels.cluster }}: Node Pool delete for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 2 hours"
        description: "Node pool delete operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
  # ========================================
  # Node Pool User Journey Alerts — Saturation
  # ========================================
  # Queue depth impacts node pool operations directly,
  # making these user journey signals per ADR. Sev 4 (precursor).
  - name: arohcp_nodepool_saturation_alerts
    labels:
      component: slo
    rules:
    # Queue depth: node pool controller workqueue accumulating work
    - alert: userJourneyNodePoolSaturationQueueDepth
      expr: |
        max by (name, cluster) (
          max without(prometheus_replica) (
            workqueue_depth{namespace="aro-hcp", name=~".*NodePool.*"}
          )
        ) > 10
      for: 5m
      labels:
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: Node Pool controller workqueue {{ $labels.name }} depth is high"
        description: "Node pool controller workqueue {{ $labels.name }} has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
        # Retry hot loop alert removed (ARO-28637): the workqueue retry ratio
        # encodes backend implementation detail (polling requeues count as retries),
        # fires without customer impact, and is not actionable. The stuck operation
        # alert covers the customer-visible outcome.
  # ========================================
  # Node Pool SLO Alerts: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # Read the unified backend operation records
  # (errors:backend_resource_operation:{failed,total,error_rate}_{1h,6h,3d})
  # filtered to node pools. The records carry operation_type, so each tier
  # fires per verb (create, update, delete) and gets its own IcM via
  # correlationId.
  #
  # Node pool operations are long running, so no tier uses a window shorter
  # than 1h. Fast burn relies on a 1h window plus a failure-count floor
  # instead of a short confirmation window; medium burn and the degradation
  # precursor use 6h confirmed by 1h; slow burn uses 3d. Severities are
  # non-paging per approver request and owner-tunable.
  - name: arohcp_nodepool_slo_windowed_error_alerts
    labels:
      component: slo
    rules:
    # Fast Burn. 14.4x burn: >72% failures over 1h, >=3 failures.
    - alert: userJourneyNodePoolErrors1h
      expr: |
        errors:backend_resource_operation:failed_1h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} >= 3
        and
        errors:backend_resource_operation:error_rate_1h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} > 0.72
      for: 5m
      labels:
        severity: "4"
        slo: nodepool-errors
        long_window: 1h
      annotations:
        correlationId: "userJourneyNodePoolErrors1h/{{ $labels.cluster }}/{{ $labels.operation_type }}"
        summary: "{{ $labels.cluster }}: Node Pool {{ $labels.operation_type }} operations failing fast (>72% of recent operations)"
        description: "More than 72% of completed node pool {{ $labels.operation_type }} operations on {{ $labels.cluster }} failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    # Medium Burn. 6x burn: >30% failures over 6h confirmed over 1h, >=5 completions.
    - alert: userJourneyNodePoolErrors6h1h
      expr: |
        errors:backend_resource_operation:total_6h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} >= 5
        and
        errors:backend_resource_operation:error_rate_6h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} > 0.30
        and
        errors:backend_resource_operation:error_rate_1h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} > 0.30
      for: 30m
      labels:
        severity: "4"
        slo: nodepool-errors
        long_window: 6h
        short_window: 1h
      annotations:
        correlationId: "userJourneyNodePoolErrors6h1h/{{ $labels.cluster }}/{{ $labels.operation_type }}"
        summary: "{{ $labels.cluster }}: Node Pool {{ $labels.operation_type }} operation error rate elevated (>30% over 6h)"
        description: "More than 30% of completed node pool {{ $labels.operation_type }} operations on {{ $labels.cluster }} failed over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    # Slow Burn / Budget. 1x burn: >5% failures over 3d, >=10 completions, >=2 failures.
    - alert: userJourneyNodePoolErrors3d
      expr: |
        errors:backend_resource_operation:total_3d{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} >= 10
        and
        errors:backend_resource_operation:failed_3d{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} >= 2
        and
        errors:backend_resource_operation:error_rate_3d{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: nodepool-errors
        long_window: 3d
      annotations:
        correlationId: "userJourneyNodePoolErrors3d/{{ $labels.cluster }}/{{ $labels.operation_type }}"
        summary: "{{ $labels.cluster }}: Node Pool {{ $labels.operation_type }} operation error budget burning (>5% over 3d)"
        description: "More than 5% of completed node pool {{ $labels.operation_type }} operations on {{ $labels.cluster }} failed over the last 3 days (at least 10 completions and 2 failures), a 1x burn that exhausts the 95% SLO error budget over the window."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
    # Early Warning / Degradation. Precursor: >15% failures over 6h confirmed over 1h.
    - alert: userJourneyNodePoolErrorsDegradation
      expr: |
        errors:backend_resource_operation:total_6h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} >= 5
        and
        errors:backend_resource_operation:failed_6h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} >= 2
        and
        errors:backend_resource_operation:error_rate_6h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} > 0.15
        and
        errors:backend_resource_operation:error_rate_1h{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type=~"create|update|delete"} > 0.15
      for: 30m
      labels:
        severity: "4"
        slo: nodepool-errors
        long_window: 6h
        short_window: 1h
      annotations:
        correlationId: "userJourneyNodePoolErrorsDegradation/{{ $labels.cluster }}/{{ $labels.operation_type }}"
        summary: "{{ $labels.cluster }}: Node Pool {{ $labels.operation_type }} operation failure rate exceeds 15% over 6h"
        description: "More than 15% of completed node pool {{ $labels.operation_type }} operations on {{ $labels.cluster }} failed over the last 6 hours (at least 5 completions), an early warning of degradation before the burn-rate alerts fire."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
