rule_files:
- idms-mirror-slo-prometheusRule.yaml
- backend-cluster-update-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Test 1: Normal operation — all cluster updates succeeded, no alerts
# ========================================
# 10 cluster update operations in "succeeded" phase, 0 in "failed".
# Error rate = 0%, well below the 95% SLO. No alerts should fire.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/c", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/d", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/e", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/f", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/g", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/h", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/i", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/j", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  promql_expr_test:
  - expr: errors:backend_cluster_update:error_rate
    eval_time: 10m
    exp_samples:
    - labels: 'errors:backend_cluster_update:error_rate{cluster="mgmt-1"}'
      value: 0
  alert_rule_test:
  - eval_time: 60m
    alertname: userJourneyIDMSMirrorErrorsFastBurn
  - eval_time: 60m
    alertname: userJourneyIDMSMirrorErrorsMediumBurn
  - eval_time: 60m
    alertname: userJourneyIDMSMirrorErrorsSlowBurn
# ========================================
# Test 2: Fast burn — 80% failure rate
# ========================================
# 2 succeeded, 8 failed → error rate = 80% > 72% threshold (14.4x burn).
# userJourneyIDMSMirrorErrorsFastBurn fires after its 5m 'for'.
# userJourneyIDMSMirrorErrorsMediumBurn fires after its 30m 'for'.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/c", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/d", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/e", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/f", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/g", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/h", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/i", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/j", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x70"
  promql_expr_test:
  - expr: errors:backend_cluster_update:error_rate
    eval_time: 10m
    exp_samples:
    - labels: 'errors:backend_cluster_update:error_rate{cluster="mgmt-1"}'
      value: 0.8
  alert_rule_test:
  # Fast burn fires after 5m 'for' duration
  - eval_time: 7m
    alertname: userJourneyIDMSMirrorErrorsFastBurn
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        severity: "3"
        slo: idms-mirror-errors
      exp_annotations:
        summary: "mgmt-1: Cluster update error rate critically high (>72%)"
        description: "More than 72% of cluster update operations are in failed state, indicating a fast error budget burn (14.4x) that would exhaust the 95% SLO budget in ~12 hours. Confirm whether the affected operations carried an imageDigestMirrors change before triaging as an IDMS issue."
        runbook_url: "aka.ms/arohcp-runbook"
  # Medium burn fires after 30m 'for' duration
  - eval_time: 35m
    alertname: userJourneyIDMSMirrorErrorsMediumBurn
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        severity: "3"
        slo: idms-mirror-errors
      exp_annotations:
        summary: "mgmt-1: Cluster update error rate elevated (>30%) for 30+ minutes"
        description: "More than 30% of cluster update operations are in failed state sustained over 30 minutes, indicating a medium error budget burn (6x) that would exhaust the 95% SLO budget in ~28 hours. Confirm whether the affected operations carried an imageDigestMirrors change before triaging as an IDMS issue."
        runbook_url: "aka.ms/arohcp-runbook"
# ========================================
# Test 3: Slow burn — 10% failure rate
# ========================================
# 9 succeeded, 1 failed → error rate = 10%.
# Above the 5% slow-burn threshold but below the 15% degradation threshold,
# so only userJourneyIDMSMirrorErrorsSlowBurn should fire, and only after 6h.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/c", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/d", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/e", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/f", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/g", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/h", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/i", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/j", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x400"
  promql_expr_test:
  - expr: errors:backend_cluster_update:error_rate
    eval_time: 10m
    exp_samples:
    - labels: 'errors:backend_cluster_update:error_rate{cluster="mgmt-1"}'
      value: 0.1
  alert_rule_test:
  # Fast and medium burn must NOT fire at 10%
  - eval_time: 60m
    alertname: userJourneyIDMSMirrorErrorsFastBurn
  - eval_time: 60m
    alertname: userJourneyIDMSMirrorErrorsMediumBurn
  # Slow burn fires after 6h 'for' duration
  - eval_time: 6h5m
    alertname: userJourneyIDMSMirrorErrorsSlowBurn
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        severity: "4"
        slo: idms-mirror-errors
      exp_annotations:
        summary: "mgmt-1: Cluster update error rate exceeds SLO target (>5%) for 6+ hours"
        description: "More than 5% of cluster update operations are in failed state sustained over 6 hours, indicating persistent degradation at the 95% SLO boundary that would exhaust the error budget in ~7 days."
        runbook_url: "aka.ms/arohcp-runbook"
