    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f3", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "0x400"
  alert_rule_test:
  - eval_time: 7m
    alertname: userJourneyIDMSMirrorErrorsFastBurn
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        severity: "3"
        long_window: 1h
        short_window: 5m
        slo: idms-mirror-errors
      exp_annotations:
        summary: "mgmt-1: Cluster update operations failing fast (>72% over 1h)"
        description: "More than 72% of completed cluster update operations on mgmt-1 failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget. Confirm whether the affected operations carried an imageDigestMirrors change before triaging as an IDMS issue."
        runbook_url: "https://aka.ms/arohcp-runbook-idms"
  - eval_time: 7m
    alertname: userJourneyIDMSMirrorErrorsMediumBurn
  - eval_time: 7m
    alertname: userJourneyIDMSMirrorErrorsSlowBurn
# ========================================
# Test 3: Volume floor — 100% failure rate, only 2 failures
# ========================================
# 2 < 3 failure floor and 2 < 5 completion floor: nothing fires.
- interval: 1m
