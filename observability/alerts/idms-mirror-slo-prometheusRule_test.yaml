# transitions are at 1500s, so up to 55m (3300s) they sit inside the 30m short
# window, standing in for failures that keep landing for the whole 'for'
# duration. error_rate_1h = 0.5 is below the 0.72 fast threshold, so Errors1h5m
# does not fire.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/s0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1500x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1500x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1500x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1500x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1500x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1500x400"
  alert_rule_test:
  - eval_time: 35m
    alertname: userJourneyIDMSMirrorErrors6h30m
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        severity: "3"
        long_window: 6h
        short_window: 30m
        slo: idms-mirror-errors
      exp_annotations:
        summary: "Cluster update error rate elevated (>30% over 6h)"
        description: "More than 30% of clusters on this service cluster whose latest update completed in the last 6 hours have it in failed state (at least 5 completions), and the failures are still occurring over the last 30 minutes, a 6x burn threshold. Internal subscriptions are excluded. Only each cluster's latest update is counted, so a failure overwritten by a successful retry is missed. Confirm whether the affected operations carried an imageDigestMirrors change before triaging as an IDMS issue."
        runbook_url: "https://aka.ms/arohcp-runbook-idms"
        correlationId: "userJourneyIDMSMirrorErrors/mgmt-1"
  - eval_time: 35m
    alertname: userJourneyIDMSMirrorErrors1h5m
# ========================================
# Test 5: Stale failures do not alert
# ========================================
# 10 failed updates whose terminal transition is older than every window, but
# still retained by the Cosmos TTL. The instantaneous error rate is 1.0, so the
# previous level-based rules would have paged; the windowed rules must not.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/f0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "-300000x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "-300000x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "-300000x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f3", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f3", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "-300000x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/f4", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f4", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "-300000x400"
