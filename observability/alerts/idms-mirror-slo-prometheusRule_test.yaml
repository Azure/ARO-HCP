rule_files:
- idms-mirror-slo-prometheusRule.yaml
- backend-cluster-update-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Test 1: Normal operation — all updates succeeded, no alerts
# ========================================
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/s0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s0", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s2", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s3", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s3", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s4", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s4", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s5", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s5", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s6", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s6", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s7", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s7", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s8", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s8", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "0x400"
  - series: 'backend_resource_operation_phase_info{resource_id="/s9", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1x400"
