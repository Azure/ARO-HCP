      exp_annotations:
        summary: "mgmt-1: Cluster update error rate elevated (>30% over 6h)"
        description: "More than 30% of completed cluster update operations on mgmt-1 failed over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget. Confirm whether the affected operations carried an imageDigestMirrors change before triaging as an IDMS issue."
