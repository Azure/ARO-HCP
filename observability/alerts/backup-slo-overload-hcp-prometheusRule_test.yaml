# ========================================
# DeletionStuckInProgress: enqueue-depth alerts miss a single DBR wedged
# in InProgress (prod queue depth often ~1). Identity must survive for:1h
# so overlapping healthy short deletions cannot keep a cluster-level
# pending timer alive (Copilot finding on PR #7764).
# ========================================
- interval: 5m
  name: overload_deletion_stuck_inprogress
  input_series:
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-stuck-mc", name="dbr-1", namespace="ns-del", phase="InProgress"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 55m
    alertname: userJourneyBackupDeletionStuckInProgress
    exp_alerts: []
  - eval_time: 65m
    alertname: userJourneyBackupDeletionStuckInProgress
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupDeletionStuckInProgress
        cluster: del-stuck-mc
        component: slo
        name: dbr-1
        namespace: ns-del
        severity: "4"
      exp_annotations:
        summary: "DeleteBackupRequest dbr-1 stuck InProgress for 1h"
        description: "DeleteBackupRequest dbr-1 on management cluster del-stuck-mc has been InProgress for 1h. On the management cluster, check Velero pod health (`kubectl -n velero get pods`) and the wedged request (`kubectl get deletebackuprequest dbr-1 -n velero -o yaml`), then inspect Velero server logs for that deletion."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupDeletionStuckInProgress/del-stuck-mc/ns-del/dbr-1"
# Rotating healthy deletions: each request InProgress for only 15m, but
# staggered so the cluster always has something InProgress for >1h.
# Must NOT fire — proves the pending timer is per-request, not per-cluster.
- interval: 5m
  name: overload_deletion_stuck_inprogress_rotating_healthy
  input_series:
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-a", namespace="ns-del", phase="InProgress"}'
    values: "1 1 1 _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-b", namespace="ns-del", phase="InProgress"}'
    values: "_ _ 1 1 1 _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-c", namespace="ns-del", phase="InProgress"}'
    values: "_ _ _ _ 1 1 1 _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-d", namespace="ns-del", phase="InProgress"}'
    values: "_ _ _ _ _ _ 1 1 1 _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-e", namespace="ns-del", phase="InProgress"}'
    values: "_ _ _ _ _ _ _ _ 1 1 1 _ _ _ _ _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-f", namespace="ns-del", phase="InProgress"}'
    values: "_ _ _ _ _ _ _ _ _ _ 1 1 1 _ _ _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-g", namespace="ns-del", phase="InProgress"}'
    values: "_ _ _ _ _ _ _ _ _ _ _ _ 1 1 1 _ _ _ _ _ _ _ _ _ _"
  - series: 'veleroDeleteBackupRequest_phase{cluster="del-rot-mc", name="dbr-h", namespace="ns-del", phase="InProgress"}'
    values: "_ _ _ _ _ _ _ _ _ _ _ _ _ _ 1 1 1 _ _ _ _ _ _ _ _"
  alert_rule_test:
  - eval_time: 65m
    alertname: userJourneyBackupDeletionStuckInProgress
    exp_alerts: []
  - eval_time: 75m
    alertname: userJourneyBackupDeletionStuckInProgress
    exp_alerts: []
# ========================================
# NonTerminalBacklog: same combined boundary+breach trick as QueueBacklog -
# 100 Backup CRs already stuck in Finalizing (a genuinely in-flight,
# non-terminal phase - NOT Failed/PartiallyFailed/FailedValidation, which
# are deliberately excluded from this alert's counted set, see the
# TTL-duplication regression test below) from t=0, plus a 101st that only
# reaches Finalizing partway through the test (its phase="Finalizing"
# series is absent for the first 50m). Proves both "exactly 100, must not
# fire" and "101 sustained past for:1h, must fire" from one input_series
# set.
#
# Also includes "ambiguous-0101": a single CR whose two HA Prometheus
# replicas permanently disagree on phase (replica 0 reports InProgress,
# replica 1 reports Completed) - simulating a scrape caught mid-transition.
# This is a regression test for a bug caught in PR #7764 review: an
# earlier version of this alert's expr subtracted each benign phase
# separately (`count(phase="Completed") - count(phase="InProgress") - ...`)
# rather than as a set, so a single such CR was subtracted TWICE (once per
# phase it appeared under) instead of once - at this test's scale that
# would have silently turned the correct 101-stuck/breach result into 100
# (not > 100), wrongly suppressing the alert. With the current set-based
# `unless` formula, ambiguous-0101 is excluded exactly once regardless of
# how many benign-phase rows it produced, so the 115m assertion below
# still correctly fires on exactly 101 genuinely-stuck CRs.
