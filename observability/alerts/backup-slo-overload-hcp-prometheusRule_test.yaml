        component: slo
        severity: "4"
      exp_annotations:
        summary: "more than 300 Backup CRs are enqueued (not yet started)"
        description: "Management cluster overload-mc has more than 300 Backup CRs still enqueued (no status.phase, or phase New/Queued/ReadyToStart — not yet past the queued states), sustained for 30m. Velero processes a limited number of backups concurrently (default 4), so a sustained backlog this large indicates Velero is stuck or multiple schedule cycles have piled up without draining - check the Velero server logs/pod health and the Backup Schedule Controller before assuming individual HostedClusters are at fault."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupQueueBacklog/overload-mc"
