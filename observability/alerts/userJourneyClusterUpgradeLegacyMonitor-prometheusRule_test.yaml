  - eval_time: 50m
    alertname: userJourneyClusterUpgradeStuckInProgress
    exp_alerts: []
# ========================================
# Deleting cluster: stuck in desired is not an upgrade failure, no alert (ARO-30436)
# ========================================
- interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/5/rg/c9", subscription_id="sub-5", cluster_uuid="uuid-9", version="4.19.20", state="completed"}'
    values: "1+0x50"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/5/rg/c9", subscription_id="sub-5", cluster_uuid="uuid-9", version="4.19.21", state="desired"}'
    values: "1+0x50"
  - series: 'backend_cluster_provision_state{cluster="svc-1", resource_id="/sub/5/rg/c9", subscription_id="sub-5", phase="deleting"}'
    values: "1+0x50"
  alert_rule_test:
  - eval_time: 30m
    alertname: userJourneyClusterUpgradeStuckInDesired
    exp_alerts: []
# ========================================
# Deleting cluster: stuck in progress is not an upgrade failure, no alert (ARO-30436)
