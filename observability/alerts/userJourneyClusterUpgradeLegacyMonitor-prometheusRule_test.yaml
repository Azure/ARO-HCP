# ========================================
# Completed rollback held by a pin: an older version alone does not alert
# ========================================
- interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/4/rg/c7", subscription_id="sub-4", cluster_uuid="uuid-7", version="4.22.10", state="completed"}'
    values: "1x15 0x40"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/4/rg/c7", subscription_id="sub-4", cluster_uuid="uuid-7", version="4.22.2", state="desired"}'
    values: "1x5 0x50"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/4/rg/c7", subscription_id="sub-4", cluster_uuid="uuid-7", version="4.22.2", state="partial"}'
    values: "0x5 1x10 0x40"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/4/rg/c7", subscription_id="sub-4", cluster_uuid="uuid-7", version="4.22.2", state="completed"}'
    values: "0x15 1x40"
