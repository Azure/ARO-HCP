    values: "1+0x50"
  - series: 'backend_cluster_provision_state{cluster="svc-1", resource_id="/sub/5/rg/c11", subscription_id="sub-5", phase="updating"}'
    values: "1+0x50"
  alert_rule_test:
  - eval_time: 30m
    alertname: userJourneyClusterUpgradeStuckInDesired
    exp_alerts:
    - exp_labels:
        alertname: userJourneyClusterUpgradeStuckInDesired
        cluster: "svc-1"
        cluster_uuid: "uuid-11"
        resource_id: "/sub/5/rg/c11"
        subscription_id: "sub-5"
        version: "4.19.21"
        state: "desired"
        severity: "4"
        slo: cluster-upgrade-reach-partial
        component: "slo"
      exp_annotations:
        summary: "svc-1: Cluster version change on /sub/5/rg/c11 to version 4.19.21 not progressing"
        description: |
          Cluster version change (upgrade or rollback) to 4.19.21 has been in desired for over 20 minutes without reaching partial. With the alert pending for 5 minutes, paging starts after ~25 minutes. Partial is when the target version becomes active (recognized as active) on the HCP cluster; the version change is in progress but not yet complete. Investigate backend_cluster_version_info on the affected cluster.
          Service Cluster: svc-1
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-upgrade"
        correlationId: "userJourneyClusterUpgradeStuckInDesired/svc-1/sub/5/rg/c11/4.19.21"
- interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/5/rg/c12", subscription_id="sub-5", cluster_uuid="uuid-12", version="4.19.20", state="completed"}'
    values: "1+0x50"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/5/rg/c12", subscription_id="sub-5", cluster_uuid="uuid-12", version="4.19.21", state="desired"}'
