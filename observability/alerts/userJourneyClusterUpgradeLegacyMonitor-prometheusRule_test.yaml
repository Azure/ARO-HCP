        slo: cluster-upgrade-reach-partial
        component: "slo"
      exp_annotations:
        summary: "svc-1: Cluster version change on /sub/5/rg/c13 to version 4.19.21 not progressing"
        description: |
          Cluster version change (upgrade or rollback) to 4.19.21 has been in desired for over 20 minutes without reaching partial. With the alert pending for 5 minutes, paging starts after ~25 minutes. Partial is when the target version becomes active (recognized as active) on the HCP cluster; the version change is in progress but not yet complete. Investigate backend_cluster_version_info on the affected cluster.
          Service Cluster: svc-1
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-upgrade"
        correlationId: "userJourneyClusterUpgradeStuckInDesired/svc-1/sub/5/rg/c13/4.19.21"
# ========================================
