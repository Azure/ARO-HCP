  - series: 'backend_cluster_provision_state{cluster="svc-1", resource_id="/sub/5/rg/c14", subscription_id="sub-5", phase="updating"}'
    values: "1x30 0x25"
  - series: 'backend_cluster_provision_state{cluster="svc-1", resource_id="/sub/5/rg/c14", subscription_id="sub-5", phase="deleting"}'
    values: "0x30 1x25"
  alert_rule_test:
  - eval_time: 30m
    alertname: userJourneyClusterUpgradeStuckInDesired
    exp_alerts:
    - exp_labels:
        alertname: userJourneyClusterUpgradeStuckInDesired
        cluster: "svc-1"
        cluster_uuid: "uuid-14"
        resource_id: "/sub/5/rg/c14"
        subscription_id: "sub-5"
        version: "4.19.21"
        state: "desired"
        severity: "4"
        slo: cluster-upgrade-reach-partial
        component: "slo"
      exp_annotations:
        summary: "svc-1: Cluster version change on /sub/5/rg/c14 to version 4.19.21 not progressing"
