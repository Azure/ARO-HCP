    values: "0x10 1x50"
  - series: 'backend_cluster_provision_state{cluster="svc-1", resource_id="/sub/5/rg/c12", subscription_id="sub-5", phase="succeeded"}'
    values: "1+0x50"
  alert_rule_test:
  - eval_time: 40m
