    values: "0x10 1x50"
  - series: 'backend_cluster_provision_state{cluster="svc-1", resource_id="/sub/5/rg/c10", subscription_id="sub-5", phase="deleting"}'
    values: "1+0x50"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyClusterUpgradeStuckInProgress
    exp_alerts: []
# ========================================
# Control: a live cluster is only excluded when deleting — any other phase still alerts.
# Without these two cases the exclusion could match every phase and the suite stays green.
# ========================================
- interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/5/rg/c11", subscription_id="sub-5", cluster_uuid="uuid-11", version="4.19.20", state="completed"}'
