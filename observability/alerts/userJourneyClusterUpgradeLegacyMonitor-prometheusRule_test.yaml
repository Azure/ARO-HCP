        correlationId: "userJourneyClusterUpgradeStuckInProgress/svc-1/sub/5/rg/c12/4.19.21"
# ========================================
# Control: no provision state series at all (backend restart, informer lag) still alerts.
# The exclusion must fail open — a missing join must never silence the alert.
# ========================================
- interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/5/rg/c13", subscription_id="sub-5", cluster_uuid="uuid-13", version="4.19.20", state="completed"}'
