apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hcp-kas-latency-recording-rules
  namespace: prometheus
spec:
  groups:
  - name: hcp-kas-latency-recording-rules
    interval: 1m
    rules:
    # NOTE: The apiserver latency SLI ratio recording rules that used to live
    # here (kas:apiserver_request_latency:sli_ratio*) were removed together with
    # the apiserver_request_sli_duration_seconds_* histogram, which is dropped at
    # the remote-write boundary (see observability/prometheus/deploy/templates/
    # prometheus.yaml). That histogram was the single largest metric in the fleet
    # (~103k series) and no alert consumed it. The traffic/saturation signals
    # below do not depend on it and are retained.
    #
    # Request termination rate — ADR Traffic column signal. Non-zero means KAS
    # is killing in-flight requests due to timeout or overload.
    - record: kas:apiserver_request_terminations:rate5m
      expr: sum by (namespace, cluster) (rate(apiserver_request_terminations_total{namespace=~"ocm-.*"}[5m]))
    # In-flight request saturation — ADR Saturation column signal. Smoothed
    # gauge of concurrent requests by kind (mutating vs readOnly).
    - record: kas:apiserver_inflight_requests:avg_5m
      expr: |
        avg_over_time(
          sum by (namespace, cluster, request_kind) (
            apiserver_current_inflight_requests{namespace=~"ocm-.*"}
          )[5m:1m]
        )
