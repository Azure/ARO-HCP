rule_files:
- metrics-proxy-prometheusRule.yaml
evaluation_interval: 1m
tests:
# Management cluster exists but maestro-agent pod is missing — fire
- interval: 1m
  input_series:
  - series: 'kube_node_info{cluster="int-uksouth-mgmt-1"}'
    values: "1+0x15"
  alert_rule_test:
  - eval_time: 10m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts:
    - exp_labels:
        alertname: MaestroAgentMetricsProxyDown
        cluster: int-uksouth-mgmt-1
        component: monitoring-infrastructure
        severity: "3"
      exp_annotations:
        summary: "Maestro agent pod is not ready"
        description: "The maestro-agent pod (namespace=maestro) has not been Ready for 10 minutes on this management cluster, so maestro-agent /metrics are not being served through the metrics-proxy sidecar. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
# Management cluster exists and maestro-agent pod is Ready — no alert
- interval: 1m
  input_series:
  - series: 'kube_node_info{cluster="int-uksouth-mgmt-1"}'
    values: "1+0x15"
  - series: 'kube_pod_status_ready{namespace="maestro", pod="maestro-agent-abc-123", condition="true", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x15"
  alert_rule_test:
  - eval_time: 10m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts: []
# Pod was Ready then goes not-ready — fire after 10m not ready
- interval: 1m
  input_series:
  - series: 'kube_node_info{cluster="prod-uksouth-mgmt-1"}'
    values: "1+0x20"
  - series: 'kube_pod_status_ready{namespace="maestro", pod="maestro-agent-abc-123", condition="true", cluster="prod-uksouth-mgmt-1"}'
    values: "1+0x5 0+0x15"
  alert_rule_test:
  - eval_time: 16m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts:
    - exp_labels:
        alertname: MaestroAgentMetricsProxyDown
        cluster: prod-uksouth-mgmt-1
        component: monitoring-infrastructure
        severity: "3"
      exp_annotations:
        summary: "Maestro agent pod is not ready"
        description: "The maestro-agent pod (namespace=maestro) has not been Ready for 10 minutes on this management cluster, so maestro-agent /metrics are not being served through the metrics-proxy sidecar. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
# Service cluster has no maestro-agent — must not fire (LHS scoped to *-mgmt-*)
- interval: 1m
  input_series:
  - series: 'kube_node_info{cluster="int-uksouth-svc-1"}'
    values: "1+0x15"
  alert_rule_test:
  - eval_time: 10m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts: []
# Pod was Ready then not-ready for less than for: 10m — must not fire
- interval: 1m
  input_series:
  - series: 'kube_node_info{cluster="int-uksouth-mgmt-1"}'
    values: "1+0x12"
  - series: 'kube_pod_status_ready{namespace="maestro", pod="maestro-agent-abc-123", condition="true", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x5 0+0x7"
  alert_rule_test:
  - eval_time: 9m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts: []
