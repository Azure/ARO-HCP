rule_files:
- metrics-proxy-prometheusRule.yaml
evaluation_interval: 1m
tests:
# Declared management cluster without KSM telemetry fires.
- interval: 1m
  input_series:
  - series: 'underlay_clusters{source="bicep", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x15"
  alert_rule_test:
  - eval_time: 10m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts:
    - exp_labels:
        alertname: MaestroAgentMetricsProxyDown
        cluster: int-uksouth-mgmt-1
        component: monitoring-infrastructure
        severity: "3"
      exp_annotations:
        summary: "Maestro agent pod is not ready"
        description: "No maestro-agent pod is Ready in namespace maestro on this declared management cluster, or its readiness metrics are missing. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
# Ready maestro-agent pod suppresses the alert.
- interval: 1m
  input_series:
  - series: 'underlay_clusters{source="bicep", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x15"
  - series: 'kube_pod_status_ready{namespace="maestro", condition="true", pod="maestro-agent-abc-123", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x15"
  alert_rule_test:
  - eval_time: 10m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts: []
# Pod becomes unready for ten minutes.
- interval: 1m
  input_series:
  - series: 'underlay_clusters{source="bicep", cluster="prod-uksouth-mgmt-1"}'
    values: "1+0x20"
  - series: 'kube_pod_status_ready{namespace="maestro", condition="true", pod="maestro-agent-abc-123", cluster="prod-uksouth-mgmt-1"}'
    values: "1+0x5 0+0x15"
  alert_rule_test:
  - eval_time: 16m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts:
    - exp_labels:
        alertname: MaestroAgentMetricsProxyDown
        cluster: prod-uksouth-mgmt-1
        component: monitoring-infrastructure
        severity: "3"
      exp_annotations:
        summary: "Maestro agent pod is not ready"
        description: "No maestro-agent pod is Ready in namespace maestro on this declared management cluster, or its readiness metrics are missing. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
# Service cluster has no maestro-agent — must not fire
- interval: 1m
  input_series:
  - series: 'underlay_clusters{source="bicep", cluster="int-uksouth-svc-1"}'
    values: "1+0x15"
  alert_rule_test:
  - eval_time: 10m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts: []
# Pod is unready for less than ten minutes.
- interval: 1m
  input_series:
  - series: 'underlay_clusters{source="bicep", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x12"
  - series: 'kube_pod_status_ready{namespace="maestro", condition="true", pod="maestro-agent-abc-123", cluster="int-uksouth-mgmt-1"}'
    values: "1+0x5 0+0x7"
  alert_rule_test:
  - eval_time: 9m
    alertname: MaestroAgentMetricsProxyDown
    exp_alerts: []
