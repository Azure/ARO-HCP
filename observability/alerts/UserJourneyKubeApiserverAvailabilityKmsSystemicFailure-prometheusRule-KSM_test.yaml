rule_files:
- UserJourneyKubeApiserverAvailabilityAlertExclusions-prometheusRule-KSM.yaml
- UserJourneyKubeApiserverAvailabilityKmsSystemicFailure-prometheusRule-KSM.yaml
group_eval_order:
- userjourney-kubeapiserver-availability-alert-exclusion-recording-rules
- rp-userjourney-kas-kms-systemic-failure-rules
evaluation_interval: 1m
tests:
# One broken cluster out of five is well below both thresholds -- exactly the
# single-customer case the per-cluster exclusion already handles.
- interval: 1m
  name: "Test 1: A single customer's KMS failure is not systemic"
  input_series:
  # One hosted cluster reporting an invalid (customer-caused) KMS config
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="a-broken", namespace="clusters", _id="a-broken-id", cluster="mgmt-a", resource_id="a-broken-rid"}'
    values: "1+0x40"
  # Four sibling hosted clusters on the same management cluster, all healthy
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="a-ok-1", namespace="clusters", _id="a-ok-1-id", cluster="mgmt-a", resource_id="a-ok-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="a-ok-2", namespace="clusters", _id="a-ok-2-id", cluster="mgmt-a", resource_id="a-ok-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="a-ok-3", namespace="clusters", _id="a-ok-3-id", cluster="mgmt-a", resource_id="a-ok-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="a-ok-4", namespace="clusters", _id="a-ok-4-id", cluster="mgmt-a", resource_id="a-ok-4-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # One broken cluster out of five never comes close to either threshold, at any point in time
  - eval_time: 40m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
# A real majority outage (4 of 5) clears both thresholds immediately and fires once the 10m for-timer elapses.
- interval: 1m
  name: "Test 2: A majority KMS outage fires once the for timer elapses"
  input_series:
  # Four hosted clusters all report an invalid KMS config at the same time
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="b-broken-1", namespace="clusters", _id="b-broken-1-id", cluster="mgmt-b", resource_id="b-broken-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="b-broken-2", namespace="clusters", _id="b-broken-2-id", cluster="mgmt-b", resource_id="b-broken-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="b-broken-3", namespace="clusters", _id="b-broken-3-id", cluster="mgmt-b", resource_id="b-broken-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="b-broken-4", namespace="clusters", _id="b-broken-4-id", cluster="mgmt-b", resource_id="b-broken-4-rid"}'
    values: "1+0x40"
  # One sibling hosted cluster on the same management cluster stays healthy throughout
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="b-ok-1", namespace="clusters", _id="b-ok-1-id", cluster="mgmt-b", resource_id="b-ok-1-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # All five clusters are born at t=0, so the 15m offset blackout gate (see the alert's header
  # comment) doesn't open until t=15 -- the "for" timer can't even start before then.
  - eval_time: 14m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
  # The gate opens at t=15, so the "for" timer starts there and completes at t=25; one minute
  # later the alert is firing, keyed only on the management cluster -- not on any individual
  # hosted cluster
  - eval_time: 26m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts:
    - exp_labels:
        cluster: mgmt-b
        component: slo
        severity: "3"
        slo: kas-availability
        scope: mgmt-cluster
      exp_annotations:
        summary: "[HCPKASAvailableKMSSystemic] Azure KMS failing across hosted clusters on mgmt-b"
        description: "At least three-quarters (minimum 3) of the hosted clusters on management cluster mgmt-b are reporting ValidAzureKMSConfig=False (80% affected) -- independent customer BYOK failures don't correlate like this, so treat it as a shared Azure dependency failure (management cluster KMS managed identity / IMDS, control-plane-operator rollout, or a regional Key Vault / AAD outage), not a per-customer issue. This is NOT per-cluster actionable: confirm the blast radius and declare an incident if confirmed. Per-cluster KMS failures are already excluded from the userJourneyKubeApiserverAvailability burn-rate alerts; this is the only notification path for the systemic case."
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable-kms-systemic
        correlationId: "userJourneyKubeApiserverAvailabilityKmsSystemicFailure/mgmt-b"
# 100% of a two-cluster population still doesn't fire -- the count floor
# guards against a tiny denominator looking systemic.
- interval: 1m
  name: "Test 3: A small population never trips the count floor"
  input_series:
  # The only two KMS-enabled hosted clusters on this management cluster, both broken
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="c-broken-1", namespace="clusters", _id="c-broken-1-id", cluster="mgmt-c", resource_id="c-broken-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="c-broken-2", namespace="clusters", _id="c-broken-2-id", cluster="mgmt-c", resource_id="c-broken-2-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # 100% of two clusters still fails the "at least 3" floor, so the alert never fires
  - eval_time: 40m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
# Unknown does NOT count as failing, nor toward the denominator (see the alert's header comment):
# per the control-plane-operator, Unknown is also the permanent, by-design status for clusters with
# no Azure KMS configured or with a private Key Vault, so counting it as failing -- or even as part
# of the measurable population -- would skew this alert on such fleets.
- interval: 1m
  name: "Test 4: Unknown clusters do not count as failing, even mixed with a real False failure"
  input_series:
  # One hosted cluster reports an explicitly invalid KMS config
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="d-broken-1", namespace="clusters", _id="d-broken-1-id", cluster="mgmt-d", resource_id="d-broken-1-rid"}'
    values: "1+0x40"
  # Four sibling hosted clusters report Unknown -- not explicitly False, but also not the
  # healthy True state every cluster is expected to reach
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="d-unknown-1", namespace="clusters", _id="d-unknown-1-id", cluster="mgmt-d", resource_id="d-unknown-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="d-unknown-2", namespace="clusters", _id="d-unknown-2-id", cluster="mgmt-d", resource_id="d-unknown-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="d-unknown-3", namespace="clusters", _id="d-unknown-3-id", cluster="mgmt-d", resource_id="d-unknown-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="d-unknown-4", namespace="clusters", _id="d-unknown-4-id", cluster="mgmt-d", resource_id="d-unknown-4-rid"}'
    values: "1+0x40"
  # Five sibling hosted clusters on the same management cluster are healthy
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="d-ok-1", namespace="clusters", _id="d-ok-1-id", cluster="mgmt-d", resource_id="d-ok-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="d-ok-2", namespace="clusters", _id="d-ok-2-id", cluster="mgmt-d", resource_id="d-ok-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="d-ok-3", namespace="clusters", _id="d-ok-3-id", cluster="mgmt-d", resource_id="d-ok-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="d-ok-4", namespace="clusters", _id="d-ok-4-id", cluster="mgmt-d", resource_id="d-ok-4-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="d-ok-5", namespace="clusters", _id="d-ok-5-id", cluster="mgmt-d", resource_id="d-ok-5-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # 1 False out of 6 measurable (True|False) clusters is ~17%, count 1 -- below both thresholds.
  # The 4 Unknown clusters (standing in for e.g. private-Key-Vault or no-KMS-configured clusters)
  # don't move the needle at all: they're excluded from both the numerator and the denominator.
  - eval_time: 40m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
# Clearing the count floor (3 of 7) isn't enough on its own -- 43% is still below the ratio threshold.
- interval: 1m
  name: "Test 5: Clearing the count floor alone does not fire without the ratio"
  input_series:
  # Three hosted clusters report an invalid KMS config
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="e-broken-1", namespace="clusters", _id="e-broken-1-id", cluster="mgmt-e", resource_id="e-broken-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="e-broken-2", namespace="clusters", _id="e-broken-2-id", cluster="mgmt-e", resource_id="e-broken-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="e-broken-3", namespace="clusters", _id="e-broken-3-id", cluster="mgmt-e", resource_id="e-broken-3-rid"}'
    values: "1+0x40"
  # Four sibling hosted clusters on the same management cluster stay healthy
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="e-ok-1", namespace="clusters", _id="e-ok-1-id", cluster="mgmt-e", resource_id="e-ok-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="e-ok-2", namespace="clusters", _id="e-ok-2-id", cluster="mgmt-e", resource_id="e-ok-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="e-ok-3", namespace="clusters", _id="e-ok-3-id", cluster="mgmt-e", resource_id="e-ok-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="e-ok-4", namespace="clusters", _id="e-ok-4-id", cluster="mgmt-e", resource_id="e-ok-4-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # 3 of 7 clears the count floor but is only 43%, below the 75% ratio threshold -- silent
  - eval_time: 40m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
# The alert resolves once KMS recovers everywhere, rather than latching.
- interval: 1m
  name: "Test 6: The alert resolves once KMS recovers, rather than latching"
  input_series:
  # Three hosted clusters report an invalid KMS config for the first 30 minutes (long enough,
  # past the 15m offset gate, for the 10m "for" timer to complete before they recover)...
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="f-1", namespace="clusters", _id="f-1-id", cluster="mgmt-f", resource_id="f-1-rid"}'
    values: "1+0x29"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="f-2", namespace="clusters", _id="f-2-id", cluster="mgmt-f", resource_id="f-2-rid"}'
    values: "1+0x29"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="f-3", namespace="clusters", _id="f-3-id", cluster="mgmt-f", resource_id="f-3-rid"}'
    values: "1+0x29"
  # ...then the same three clusters report a healthy KMS config from minute 30 onward
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="f-1", namespace="clusters", _id="f-1-id", cluster="mgmt-f", resource_id="f-1-rid"}'
    values: "_x30 1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="f-2", namespace="clusters", _id="f-2-id", cluster="mgmt-f", resource_id="f-2-rid"}'
    values: "_x30 1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="f-3", namespace="clusters", _id="f-3-id", cluster="mgmt-f", resource_id="f-3-rid"}'
    values: "_x30 1+0x40"
  alert_rule_test:
  # All three clusters are born at t=0, so (as in Test 2) the 15m offset gate delays the "for"
  # timer's start to t=15; only 5m of it has elapsed here
  - eval_time: 20m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
  # The "for" timer completes at t=25, so the alert is firing one minute later, while all three
  # hosted clusters are still broken
  - eval_time: 26m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts:
    - exp_labels:
        cluster: mgmt-f
        component: slo
        severity: "3"
        slo: kas-availability
        scope: mgmt-cluster
      exp_annotations:
        summary: "[HCPKASAvailableKMSSystemic] Azure KMS failing across hosted clusters on mgmt-f"
        description: "At least three-quarters (minimum 3) of the hosted clusters on management cluster mgmt-f are reporting ValidAzureKMSConfig=False (100% affected) -- independent customer BYOK failures don't correlate like this, so treat it as a shared Azure dependency failure (management cluster KMS managed identity / IMDS, control-plane-operator rollout, or a regional Key Vault / AAD outage), not a per-customer issue. This is NOT per-cluster actionable: confirm the blast radius and declare an incident if confirmed. Per-cluster KMS failures are already excluded from the userJourneyKubeApiserverAvailability burn-rate alerts; this is the only notification path for the systemic case."
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable-kms-systemic
        correlationId: "userJourneyKubeApiserverAvailabilityKmsSystemicFailure/mgmt-f"
  # Well past recovery (t=30) and past the default 5m staleness lookback: resolved, not latched
  - eval_time: 45m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
# An all-Unknown population is NOT systemic, and must never latch permanently firing. Per the
# control-plane-operator's validateAzureKMSConfig, ValidAzureKMSConfig=Unknown is the permanent,
# by-design status for (a) hosted clusters with no Azure KMS configured at all, and (b) ARO HCP
# clusters using a private Key Vault (CPO cannot reach a private endpoint directly). Either
# population can be most or all of a management cluster's fleet, indefinitely -- if Unknown counted
# as failing, this alert would fire forever on such a management cluster, exactly the "never
# resolves, trains on-call to ignore it" alert-fatigue failure mode the "not latching" design in
# Test 6 is meant to avoid.
- interval: 1m
  name: "Test 7: An all-Unknown population (e.g. private Key Vault or no KMS configured) never fires"
  input_series:
  # Four hosted clusters all permanently report Unknown -- e.g. all using a private Key Vault
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="g-unknown-1", namespace="clusters", _id="g-unknown-1-id", cluster="mgmt-g", resource_id="g-unknown-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="g-unknown-2", namespace="clusters", _id="g-unknown-2-id", cluster="mgmt-g", resource_id="g-unknown-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="g-unknown-3", namespace="clusters", _id="g-unknown-3-id", cluster="mgmt-g", resource_id="g-unknown-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="g-unknown-4", namespace="clusters", _id="g-unknown-4-id", cluster="mgmt-g", resource_id="g-unknown-4-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # 4 of 4 Unknown, 0 True or False: both the numerator and the denominator (True|False only) are
  # empty, so the ratio expression never produces a sample for this management cluster at all,
  # let alone crosses the threshold, no matter how long this persists.
  - eval_time: 40m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
# A real majority False outage still fires correctly alongside a permanently-Unknown population
# (e.g. private-Key-Vault clusters) on the same management cluster: Unknown clusters are excluded
# from both the numerator and the denominator, so a large Unknown population doesn't dilute the
# ratio among the clusters whose KMS health is actually measurable.
- interval: 1m
  name: "Test 9: A real outage still fires when private-KV-style Unknown clusters are also present"
  input_series:
  # Four hosted clusters report an invalid KMS config -- a real, explicit outage
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="i-broken-1", namespace="clusters", _id="i-broken-1-id", cluster="mgmt-i", resource_id="i-broken-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="i-broken-2", namespace="clusters", _id="i-broken-2-id", cluster="mgmt-i", resource_id="i-broken-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="i-broken-3", namespace="clusters", _id="i-broken-3-id", cluster="mgmt-i", resource_id="i-broken-3-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="i-broken-4", namespace="clusters", _id="i-broken-4-id", cluster="mgmt-i", resource_id="i-broken-4-rid"}'
    values: "1+0x40"
  # One sibling hosted cluster stays healthy
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="True", name="i-ok-1", namespace="clusters", _id="i-ok-1-id", cluster="mgmt-i", resource_id="i-ok-1-rid"}'
    values: "1+0x40"
  # Three more sibling hosted clusters permanently report Unknown, e.g. private Key Vault -- almost
  # as many as the broken population, to make clear they don't dilute the ratio at all
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="i-kv-1", namespace="clusters", _id="i-kv-1-id", cluster="mgmt-i", resource_id="i-kv-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="i-kv-2", namespace="clusters", _id="i-kv-2-id", cluster="mgmt-i", resource_id="i-kv-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="Unknown", name="i-kv-3", namespace="clusters", _id="i-kv-3-id", cluster="mgmt-i", resource_id="i-kv-3-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # 4 False of 5 measurable (True|False) clusters is 80%, count 4 -- both thresholds are met. The
  # 3 Unknown clusters are excluded entirely (neither numerator nor denominator), so they have zero
  # effect on the ratio despite being nearly as numerous as the broken population. As in Test 2, the
  # 15m offset gate delays the "for" timer's start to t=15, completing at t=25.
  - eval_time: 26m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts:
    - exp_labels:
        cluster: mgmt-i
        component: slo
        severity: "3"
        slo: kas-availability
        scope: mgmt-cluster
      exp_annotations:
        summary: "[HCPKASAvailableKMSSystemic] Azure KMS failing across hosted clusters on mgmt-i"
        description: "At least three-quarters (minimum 3) of the hosted clusters on management cluster mgmt-i are reporting ValidAzureKMSConfig=False (80% affected) -- independent customer BYOK failures don't correlate like this, so treat it as a shared Azure dependency failure (management cluster KMS managed identity / IMDS, control-plane-operator rollout, or a regional Key Vault / AAD outage), not a per-customer issue. This is NOT per-cluster actionable: confirm the blast radius and declare an incident if confirmed. Per-cluster KMS failures are already excluded from the userJourneyKubeApiserverAvailability burn-rate alerts; this is the only notification path for the systemic case."
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable-kms-systemic
        correlationId: "userJourneyKubeApiserverAvailabilityKmsSystemicFailure/mgmt-i"
# Three brand-new hosted clusters, all reporting an explicit KMS failure immediately after birth,
# would otherwise look like a 100% systemic outage before there's been any time to confirm it isn't
# just provisioning noise (e.g. a config applied before dependent infra finished rolling out). The
# 15m offset blackout gate (see the alert's header comment) excludes them -- on both sides of the
# ratio -- until their KMS condition has existed for 15 minutes.
- interval: 1m
  name: "Test 8: Newly-provisioned clusters are excluded for their first 15 minutes"
  input_series:
  # Three hosted clusters born at t=0, reporting an explicit KMS failure from birth
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="h-new-1", namespace="clusters", _id="h-new-1-id", cluster="mgmt-h", resource_id="h-new-1-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="h-new-2", namespace="clusters", _id="h-new-2-id", cluster="mgmt-h", resource_id="h-new-2-rid"}'
    values: "1+0x40"
  - series: 'hostedClusterAPI_valid_azure_kms_config{status="False", name="h-new-3", namespace="clusters", _id="h-new-3-id", cluster="mgmt-h", resource_id="h-new-3-rid"}'
    values: "1+0x40"
  alert_rule_test:
  # Within the first 15 minutes, the gate has no data to look back on -- both sides of the
  # ratio are empty, so the alert can't evaluate true at all
  - eval_time: 10m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
  # The gate opens at t=15 (offset 15m now resolves to the t=0 sample), but the 10m "for"
  # timer has only run 5m
  - eval_time: 20m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts: []
  # KMS is still broken 26 minutes after cluster creation -- well past the 15m startup grace
  # period -- so this is no longer provisioning noise, and the alert fires
  - eval_time: 26m
    alertname: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
    exp_alerts:
    - exp_labels:
        cluster: mgmt-h
        component: slo
        severity: "3"
        slo: kas-availability
        scope: mgmt-cluster
      exp_annotations:
        summary: "[HCPKASAvailableKMSSystemic] Azure KMS failing across hosted clusters on mgmt-h"
        description: "At least three-quarters (minimum 3) of the hosted clusters on management cluster mgmt-h are reporting ValidAzureKMSConfig=False (100% affected) -- independent customer BYOK failures don't correlate like this, so treat it as a shared Azure dependency failure (management cluster KMS managed identity / IMDS, control-plane-operator rollout, or a regional Key Vault / AAD outage), not a per-customer issue. This is NOT per-cluster actionable: confirm the blast radius and declare an incident if confirmed. Per-cluster KMS failures are already excluded from the userJourneyKubeApiserverAvailability burn-rate alerts; this is the only notification path for the systemic case."
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable-kms-systemic
        correlationId: "userJourneyKubeApiserverAvailabilityKmsSystemicFailure/mgmt-h"
