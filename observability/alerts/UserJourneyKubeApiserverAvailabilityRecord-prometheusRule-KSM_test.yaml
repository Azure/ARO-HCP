rule_files:
- HCPkasRecord-prometheusRule-KSM.yaml
- UserJourneyKubeApiserverAvailabilityRecord-prometheusRule-KSM.yaml
evaluation_interval: 1m
tests:
# Recording rules are exercised end-to-end by UserJourneyKubeApiserverAvailabilityMonitor-prometheusRule-KSM_test.yaml
# (6 alert scenarios covering all 6 SLI rules). This file satisfies the generator's
# test-file requirement with a basic smoke test.
- interval: 1m
  name: "Smoke test: SLI rules produce output for healthy non-deleting cluster"
  input_series:
  - series: 'hostedClusterAPI_kubeapiserver_available{status="True", name="test-cluster", namespace="clusters", _id="abc-123", cluster="mgmt-cluster", resource_id="/subscriptions/test-sub/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-cluster"}'
    values: "1+0x30"
  promql_expr_test:
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_sum_5m{name="test-cluster"}
    exp_samples:
    - labels: 'hostedClusterAPI_kubeapiserver_available:sli_sum_5m{_id="abc-123", cluster="mgmt-cluster", name="test-cluster", namespace="clusters", resource_id="/subscriptions/test-sub/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-cluster"}'
      value: 5
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_count_5m{name="test-cluster"}
    exp_samples:
    - labels: 'hostedClusterAPI_kubeapiserver_available:sli_count_5m{_id="abc-123", cluster="mgmt-cluster", name="test-cluster", namespace="clusters", resource_id="/subscriptions/test-sub/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-cluster"}'
      value: 5
# Test: SLI rules produce NO output for a cluster that is being deleted.
# When hostedClusterAPI_deleting is present, the `unless` clause on the SLI
# recording rules suppresses all SLI output for that cluster. This prevents
# zombie-deleting clusters from consuming KAS SLO error budget. (ARO-29170)
- interval: 1m
  name: "Deletion suppression: SLI rules produce no output for deleting cluster"
  input_series:
  - series: 'hostedClusterAPI_kubeapiserver_available{status="True", name="deleting-cluster", namespace="clusters", _id="del-456", cluster="mgmt-cluster", resource_id="/subscriptions/test-sub/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/deleting-cluster"}'
    values: "0+0x30"
  - series: 'hostedClusterAPI_deleting{name="deleting-cluster", namespace="clusters", _id="del-456", cluster="mgmt-cluster", resource_id="/subscriptions/test-sub/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/deleting-cluster", deletion_timestamp="2026-07-10T08:36:42Z"}'
    values: "1+0x30"
  promql_expr_test:
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_sum_5m{name="deleting-cluster"}
    exp_samples: []
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_count_5m{name="deleting-cluster"}
    exp_samples: []
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_sum_1h{name="deleting-cluster"}
    exp_samples: []
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_count_1h{name="deleting-cluster"}
    exp_samples: []
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_sum_30m{name="deleting-cluster"}
    exp_samples: []
  - eval_time: 20m
    expr: hostedClusterAPI_kubeapiserver_available:sli_count_30m{name="deleting-cluster"}
    exp_samples: []
