rule_files:
- hcp-upgrade-new-alert-prometheusRule.yaml
- hcp-upgrade-recordingRule.yaml
evaluation_interval: 1m
group_eval_order:
- hcp-upgrade
- hcp-upgrade-new-alert
tests:
- name: During and post upgrade alerts fire and clear while pre-upgrade A remains
  interval: 1m
  input_series:
  - series: hostedClusterAPI_control_plane_version_history_started_timestamp_seconds{resource_id="hcp-id",attempt_started_at="install",version="4.21"}
    values: 0+0x1500
  - series: hostedClusterAPI_control_plane_version_history_completed_timestamp_seconds{resource_id="hcp-id",attempt_started_at="install",version="4.21"}
    values: 60+0x1500
  - series: hostedClusterAPI_control_plane_version_history_started_timestamp_seconds{resource_id="hcp-id",attempt_started_at="upgrade",version="4.22"}
    values: _x10 600+0x1490
  - series: hostedClusterAPI_control_plane_version_history_completed_timestamp_seconds{resource_id="hcp-id",attempt_started_at="upgrade",version="4.22"}
    values: _x20 1200+0x1480
  - series: hcp:alerts{namespace="hcp-test",resource_id="hcp-id",alertname="A",alertstate="firing"}
    values: 1+0x30
  - series: hcp:alerts_for_state{namespace="hcp-test",resource_id="hcp-id",alertname="A"}
    values: 0+0x30
  - series: hcp:alerts{namespace="hcp-test",resource_id="hcp-id",alertname="B",alertstate="firing"}
    values: _x21 1 stale
  - series: hcp:alerts_for_state{namespace="hcp-test",resource_id="hcp-id",alertname="B"}
    values: _x21 1200 stale
  - series: hcp:alerts{namespace="hcp-test",resource_id="hcp-id",alertname="C",alertstate="firing"}
    values: _x11 1+0x11 stale
  - series: hcp:alerts_for_state{namespace="hcp-test",resource_id="hcp-id",alertname="C"}
    values: _x11 600+0x11 stale
  alert_rule_test:
  - eval_time: 9m
    alertname: HCPUpgradeNewAlert
    exp_alerts: []
  - eval_time: 19m
    alertname: HCPUpgradeNewAlert
    exp_alerts: []
  - eval_time: 20m
    alertname: HCPUpgradeNewAlert
    exp_alerts:
    - exp_labels:
        resource_id: hcp-id
        severity: '4'
        hcp_upgrade_new_alert: 'true'
        component: hcp
        version: '4.22'
        attempt_started_at: upgrade
      exp_annotations:
        summary: 'hcp-id: new control-plane alert after upgrade to 4.22 (upgrade)'
        description: HCP hcp-id has a firing namespace-level alert type activated at or after the upgrade to 4.22 started at upgrade, with no observed firing in the 24 hours before that upgrade started. The upgrade completed within 24 hours and lasted at most 24 hours. Timing is evidence for investigation, not proof of causation.
        correlationId: HCPUpgradeNewAlert/hcp-id/4.22/upgrade
  - eval_time: 22m
    alertname: HCPUpgradeNewAlert
    exp_alerts:
    - exp_labels:
        resource_id: hcp-id
        severity: '4'
        hcp_upgrade_new_alert: 'true'
        component: hcp
        version: '4.22'
        attempt_started_at: upgrade
      exp_annotations:
        summary: 'hcp-id: new control-plane alert after upgrade to 4.22 (upgrade)'
        description: HCP hcp-id has a firing namespace-level alert type activated at or after the upgrade to 4.22 started at upgrade, with no observed firing in the 24 hours before that upgrade started. The upgrade completed within 24 hours and lasted at most 24 hours. Timing is evidence for investigation, not proof of causation.
        correlationId: HCPUpgradeNewAlert/hcp-id/4.22/upgrade
  - eval_time: 23m
    alertname: HCPUpgradeNewAlert
    exp_alerts: []
- name: Alert first appearing 12 hours after completion fires and expires at completion plus 24 hours
