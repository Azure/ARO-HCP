# ========================================
# Test 13: Stuck operation that flaps (backend retry resets start_time)
# ========================================
# A genuinely-wedged delete stays in "deleting" the whole time, but the backend
# retries the operation at t=120m and resets start_time, so (time() - start_time)
# briefly drops below the 3600s threshold. The max_over_time(...[6h:]) hold must
# keep the SAME alert firing across this gap.
- interval: 1m
  input_series:
  # phase stays "deleting" throughout
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/3/ea/flap-del", subscription_id="sub-3", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths", operation_type="delete", phase="deleting", cluster="mgmt-1", environment="int", region="uksouth"}'
    values: "1+0x300"
  # start_time=0 until t=119m (age crosses 3600s at t=60m); backend retries at
  # t=120m so start_time jumps to 7200s and age re-crosses 3600s only at t=180m.
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/3/ea/flap-del", subscription_id="sub-3", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths", operation_type="delete", phase="deleting", cluster="mgmt-1", environment="int", region="uksouth"}'
    values: "0+0x119 7200+0x180"
  alert_rule_test:
  # Raw condition true (age 5400s > 3600s) → firing.
  - eval_time: 90m
    alertname: userJourneyExternalAuthStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        environment: "int"
        region: "uksouth"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/3/ea/flap-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
        severity: "4"
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-3"
      exp_annotations:
        summary: "mgmt-1: ExternalAuth operation for /sub/3/ea/flap-del stuck in deleting for over 1 hour"
        description: "ExternalAuth operation for /sub/3/ea/flap-del has been in deleting phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
  # Raw condition FALSE here (start_time reset → age < 3600s) but the resource is
  # still wedged. The 6h hold keeps the same alert firing → no resolve, no duplicate.
  - eval_time: 150m
    alertname: userJourneyExternalAuthStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        environment: "int"
        region: "uksouth"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/3/ea/flap-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
        severity: "4"
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-3"
      exp_annotations:
        summary: "mgmt-1: ExternalAuth operation for /sub/3/ea/flap-del stuck in deleting for over 1 hour"
        description: "ExternalAuth operation for /sub/3/ea/flap-del has been in deleting phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
# ========================================
# Test 14: Completed operation clears stuck alert (current-state gate)
# ========================================
# An operation was stuck in "provisioning" for >1h, but has now completed
# (phase moved to "succeeded"). The max_over_time window still remembers it
# was overdue, but the current-state gate (and ... phase_info{phase=~non-terminal})
# must prevent the alert from firing for a completed operation.
- interval: 1m
  input_series:
  # Phase was "provisioning" for 80 minutes, then transitions to "succeeded"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/4/ea/completed", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths", operation_type="create", phase="provisioning", cluster="mgmt-1", environment="int", region="uksouth"}'
    values: "1+0x80 0+0x20"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/4/ea/completed", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths", operation_type="create", phase="succeeded", cluster="mgmt-1", environment="int", region="uksouth"}'
    values: "0+0x80 1+0x20"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/4/ea/completed", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths", operation_type="create", phase="provisioning", cluster="mgmt-1", environment="int", region="uksouth"}'
    values: "0+0x80 _x20"
  alert_rule_test:
  # At t=85m the operation completed 5 minutes ago. max_over_time still remembers
  # the overdue condition, but the current-state gate must suppress the alert.
  - eval_time: 85m
    alertname: userJourneyExternalAuthStuckOperation
