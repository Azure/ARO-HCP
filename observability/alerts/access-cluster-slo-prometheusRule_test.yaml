rule_files:
- access-cluster-slo-prometheusRule.yaml
- access-cluster-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Test 4: Stuck operation — requestcredential in "accepted" for > 1 hour
# ========================================
# start_time is 0 (epoch). At eval_time=90m (5400s), delta = 5400 > 3600 threshold.
# The alert has for: 15m, so it fires after the threshold is crossed for 15 minutes.
# Threshold crossed at 60m, plus 15m for duration = 75m. Eval at 90m confirms firing.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/3/cluster/stuck", subscription_id="sub-3", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", phase="accepted", cluster="mgmt-1"}'
    values: "0+0x95"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/3/cluster/stuck", subscription_id="sub-3", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", phase="accepted", cluster="mgmt-1"}'
    values: "1+0x95"
  alert_rule_test:
  # At 90m (5400s), time() - 0 = 5400 > 3600, and for: 15m is satisfied
  - eval_time: 90m
    alertname: userJourneyAccessClusterStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "requestcredential"
        phase: "accepted"
        resource_id: "/sub/3/cluster/stuck"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters"
        severity: "4"
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-3"
      exp_annotations:
        summary: "mgmt-1: Credential operation for /sub/3/cluster/stuck stuck in accepted for over 1 hour"
        description: "Credential operation for /sub/3/cluster/stuck has been in accepted phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
# ========================================
# Test 5: No stuck operation — requestcredential in "provisioning" for < 1 hour
# ========================================
# Operation started recently, should not trigger stuck alert.
- interval: 1m
  input_series:
  # start_time=600 (recent). At eval_time=50m, time()=3000. delta=2400 < 3600.
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/4/cluster/recent", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", phase="provisioning", cluster="mgmt-1"}'
    values: "600+0x55"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/4/cluster/recent", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", phase="provisioning", cluster="mgmt-1"}'
    values: "1+0x55"
  alert_rule_test:
  - eval_time: 50m
    alertname: userJourneyAccessClusterStuckOperation
# ========================================
# Test 7: Queue depth — credential controller workqueue exceeds threshold
# ========================================
- interval: 1m
  input_series:
  - series: 'workqueue_depth{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "15+0x10"
  alert_rule_test:
  - eval_time: 7m
    alertname: userJourneyAccessClusterSaturationQueueDepth
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        name: "OperationRequestCredential"
        severity: "4"
      exp_annotations:
        summary: "mgmt-1: Credential controller workqueue OperationRequestCredential depth is high"
        description: "Credential controller workqueue OperationRequestCredential has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
# ========================================
# Test 8: Queue depth normal — below threshold, no alert
# ========================================
- interval: 1m
  input_series:
  - series: 'workqueue_depth{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "5+0x10"
  alert_rule_test:
  - eval_time: 7m
    alertname: userJourneyAccessClusterSaturationQueueDepth
# ========================================
# Test 9: Retry hot loop — retry ratio > 50%
# ========================================
- interval: 1m
  input_series:
  - series: 'workqueue_retries_total{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "0+80x25"
  - series: 'workqueue_adds_total{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "0+100x25"
  alert_rule_test:
  - eval_time: 22m
    alertname: userJourneyAccessClusterSaturationRetryHotLoop
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        name: "OperationRequestCredential"
        severity: "4"
      exp_annotations:
        summary: "mgmt-1: Credential controller workqueue OperationRequestCredential retry hot loop"
        description: "Credential controller workqueue OperationRequestCredential has a retry ratio > 50% sustained over 10 minutes, indicating most queue activity is failed retries rather than fresh work."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
# ========================================
# Test 10: Retry hot loop — low retry ratio, no alert
# ========================================
- interval: 1m
  input_series:
  - series: 'workqueue_retries_total{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "0+10x25"
  - series: 'workqueue_adds_total{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "0+100x25"
  alert_rule_test:
  - eval_time: 22m
    alertname: userJourneyAccessClusterSaturationRetryHotLoop
# ========================================
# Test 10b: Retry hot loop — high ratio but below traffic floor, no alert
# ========================================
# Incrementing counters at 0.08 retries/min and 0.12 adds/min.
# ratio = 0.08/0.12 = 67% (above 50% threshold),
# but rate(adds) = ~0.002/s which is below the 0.008/s floor.
- interval: 1m
  input_series:
  - series: 'workqueue_retries_total{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "0+0.08x25"
  - series: 'workqueue_adds_total{namespace="aro-hcp", name="OperationRequestCredential", cluster="mgmt-1"}'
    values: "0+0.12x25"
  alert_rule_test:
  - eval_time: 22m
    alertname: userJourneyAccessClusterSaturationRetryHotLoop
# ========================================
# Test 12: Stuck revokecredentials operation in "deleting" for > 1 hour
# ========================================
# Verifies that revokecredentials operations stuck in "deleting" also trigger the alert.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/7/cluster/stuck-revoke", subscription_id="sub-7", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="revokecredentials", phase="deleting", cluster="mgmt-1"}'
    values: "0+0x95"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/7/cluster/stuck-revoke", subscription_id="sub-7", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="revokecredentials", phase="deleting", cluster="mgmt-1"}'
    values: "1+0x95"
  alert_rule_test:
  - eval_time: 90m
    alertname: userJourneyAccessClusterStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "revokecredentials"
        phase: "deleting"
        resource_id: "/sub/7/cluster/stuck-revoke"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters"
        severity: "4"
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-7"
      exp_annotations:
        summary: "mgmt-1: Credential operation for /sub/7/cluster/stuck-revoke stuck in deleting for over 1 hour"
        description: "Credential operation for /sub/7/cluster/stuck-revoke has been in deleting phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
# ========================================
# Test 13: Stuck operation fires for all subscriptions at YAML level
# ========================================
# Filtering of internal subscriptions happens in the generated bicep (via
# the generator-injected `unless` clause), not in the source YAML. This test
# confirms the source expression fires for an e2e subscription, proving that
# promtool validates the unfiltered logic correctly.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/e2e/cluster/stuck", subscription_id="00000000-0000-0000-0000-000000000001", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", phase="accepted", cluster="mgmt-1"}'
    values: "0+0x95"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/e2e/cluster/stuck", subscription_id="00000000-0000-0000-0000-000000000001", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", phase="accepted", cluster="mgmt-1"}'
    values: "1+0x95"
  alert_rule_test:
  - eval_time: 90m
    alertname: userJourneyAccessClusterStuckOperation
    exp_alerts:
    - exp_labels:
        alertname: userJourneyAccessClusterStuckOperation
        resource_id: /sub/e2e/cluster/stuck
        subscription_id: "00000000-0000-0000-0000-000000000001"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters"
        operation_type: requestcredential
        phase: accepted
        cluster: mgmt-1
        severity: "4"
        component: slo
        exclude_internal_subscriptions: "true"
      exp_annotations:
        summary: "mgmt-1: Credential operation for /sub/e2e/cluster/stuck stuck in accepted for over 1 hour"
        description: "Credential operation for /sub/e2e/cluster/stuck has been in accepted phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: aka.ms/arohcp-runbook-access-cluster
# ========================================
# Windowed error alert tests (stateless, last_transition-windowed)
# ========================================
# Acute burst: 4 failed + 1 succeeded credential ops all reach terminal at t=85m,
# so from t=85m the in-1h-window ratio is 4/5 = 0.8 (>0.72) with failed_1h = 4
# (>= floor 3). By eval 95m the condition has held 10m (> for: 5m), so it fires.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f1", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f1", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f2", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f2", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f3", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f3", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f4", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f4", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/s1", phase="succeeded"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/s1", phase="succeeded"}'
    values: "_x85 5100x115"
  alert_rule_test:
  - eval_time: 95m
    alertname: UserJourneyAccessClusterErrorBurst1h
    exp_alerts:
    - exp_labels:
        alertname: UserJourneyAccessClusterErrorBurst1h
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: access-cluster-errors
        long_window: 1h
        short_window: 5m
      exp_annotations:
        summary: "mgmt-1: Credential operations failing fast (>72% of recent operations)"
        description: "More than 72% of completed credential operations (requestcredential/revokecredentials) on mgmt-1 failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
# Volume guard: a single recent failed credential op (ratio 100% but one failure)
# must NOT page, because failed_1h < 3 and the 6h/3d completion floors are unmet.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f1", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/f1", phase="failed"}'
    values: "_x85 5100x115"
  alert_rule_test:
  - eval_time: 95m
    alertname: UserJourneyAccessClusterErrorBurst1h
  - eval_time: 95m
    alertname: UserJourneyAccessClusterErrorBurst6h
  - eval_time: 95m
    alertname: UserJourneyAccessClusterErrorBudget3d
# Medium burn (6h) positive: 3 failed + 2 succeeded credential ops reach terminal ~2h
# ago (ltt at 40m), so from 40m they sit in the 6h window; by 100m they age out of
# the 1h window. total_6h = 5 (>= 5) and error_rate_6h = 0.6 (> 0.30). The alert
# holds for 30m, so it is still pending at 60m and firing by 140m, while the 1h
# tier stays silent once the failures leave the 1h window.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6f1", phase="failed"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6f1", phase="failed"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6f2", phase="failed"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6f2", phase="failed"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6f3", phase="failed"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6f3", phase="failed"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6s1", phase="succeeded"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6s1", phase="succeeded"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6s2", phase="succeeded"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w6s2", phase="succeeded"}'
    values: "_x40 2400x101"
  promql_expr_test:
  - expr: errors:backend_credential_operation:failed_6h
    eval_time: 140m
    exp_samples:
    - labels: 'errors:backend_credential_operation:failed_6h{cluster="mgmt-1"}'
      value: 3
  - expr: errors:backend_credential_operation:total_6h
    eval_time: 140m
    exp_samples:
    - labels: 'errors:backend_credential_operation:total_6h{cluster="mgmt-1"}'
      value: 5
  - expr: errors:backend_credential_operation:error_rate_6h
    eval_time: 140m
    exp_samples:
    - labels: 'errors:backend_credential_operation:error_rate_6h{cluster="mgmt-1"}'
      value: 0.6
  alert_rule_test:
  - eval_time: 60m
    alertname: UserJourneyAccessClusterErrorBurst6h
  - eval_time: 140m
    alertname: UserJourneyAccessClusterErrorBurst6h
    exp_alerts:
    - exp_labels:
        alertname: UserJourneyAccessClusterErrorBurst6h
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: access-cluster-errors
        long_window: 6h
        short_window: 30m
      exp_annotations:
        summary: "mgmt-1: Credential operation error rate elevated (>30% over 6h)"
        description: "More than 30% of completed credential operations on mgmt-1 failed over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
  - eval_time: 140m
    alertname: UserJourneyAccessClusterErrorBurst1h
# Slow burn (3d) positive: 2 failed + 8 succeeded credential ops complete inside the 3d
# window (ltt at t=0). total_3d = 10 (>= 10) and error_rate_3d = 0.2 (> 0.05 but
# < 0.30). The alert holds for 6h, so it is still pending at 300m and firing by
# 365m; by 365m the operations have aged out of the 6h and 1h windows, so only the
# 3d budget tier fires.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3f1", phase="failed"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3f1", phase="failed"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3f2", phase="failed"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3f2", phase="failed"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s1", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s1", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s2", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s2", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s3", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s3", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s4", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s4", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s5", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s5", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s6", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s6", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s7", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s7", phase="succeeded"}'
    values: "0x366"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s8", phase="succeeded"}'
    values: "1x366"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="requestcredential", subscription_id="sub-1", resource_id="/w3s8", phase="succeeded"}'
    values: "0x366"
  promql_expr_test:
  - expr: errors:backend_credential_operation:failed_3d
