apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: frontend-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Frontend (ARM RP) SLO Alerts
  # ========================================
  # Driven by raw Frontend request counters and latency histograms. The
  # ARO-28705 recording rules remain as diagnostic SLIs for dashboards.
  # Naming: {Scope}{Subject}{Metric}{BurnRateTier} per ADR-001.
  #
  # Availability SLO 99.95% -> error budget 0.05% (0.0005):
  #   Fast (14.4x): 14.4 * 0.0005 = 0.0072 -> 0.72% 5xx share
  #   Medium (6x):  6 * 0.0005 = 0.003 -> 0.30% 5xx share
  #   Slow (1x):    1 * 0.0005 = 0.0005 -> 0.05% 5xx share
  #
  # Latency SLO p99 < 1s -> error budget 1% of requests over 1s:
  #   Fast (14.4x): 14.4 * 0.01 = 0.144 -> 14.4% slow requests
  #   Medium (6x):  6 * 0.01 = 0.06 -> 6% slow requests
  #   Slow (1x):    1 * 0.01 = 0.01 -> 1% slow requests
  #
  # Errors and latency ratios are calculated directly over
  # each alert window. Averaging 5m quantiles is neither an aggregate p99 nor a
  # burn rate, and averaging 5m ratios (the reverted design) would weight quiet
  # and busy windows equally. Histogram bucket counts and request counts are
  # summed across HA replicas because duplicate counts cancel in the ratio;
  # max per bucket can break cumulative monotonicity (AROSLSRE-1746). offset 5m
  # avoids evaluating the unsettled ingestion edge.
  #
  # Ready: kube /healthz via Deployment available/spec. Distinguishes a
  # Frontend outage (ready=0) from an ARM traffic drought (HTTP SLIs absent).
  #
  # Multi-window multi-burn-rate (ADR 79 / Google MWMBR): fast and medium
  # require BOTH long-window and short-window conditions. Errors and latency
  # alerts compute request-weighted ratios directly over each window;
  # `for` is a short pending duration only, not a substitute for the short
  # window. Slow uses 3d long + 6h short at 1x.
  #
  # Fast/medium Errors + Latency page Sev 3 (customer-facing UJ).
  # Slow/traffic/saturation Sev 4 ticket.
  #
  # summary includes {{ $labels.cluster }} (Access / Node Pool convention; prometheus-rules
  # generator requires it). IcM.Title may also prepend cluster - same as other RP alerts.
  - name: arohcp_frontend_slo_error_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyFrontendErrors1h5m
      expr: |
        (
          (
            sum by (cluster) (
              rate(frontend_http_requests_total{
                code=~"5..",
                route!~".*hcpoperation(results|statuses).*"
              }[1h] offset 5m)
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_total{
                route!~".*hcpoperation(results|statuses).*"
              }[1h] offset 5m)
            )
          ) > 0.0072
          and on (cluster)
          (
            sum by (cluster) (
              rate(frontend_http_requests_total{
                code=~"5..",
                route!~".*hcpoperation(results|statuses).*"
              }[5m] offset 5m)
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_total{
                route!~".*hcpoperation(results|statuses).*"
              }[5m] offset 5m)
            )
          ) > 0.0072
        )
      for: 2m
      labels:
        severity: "3"
        slo: frontend-errors
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP 5xx error rate critically high (>0.72%)"
        description: "Frontend 5xx share on cluster {{ $labels.cluster }} is above 0.72% on both the 1h and 5m windows (14.4x burn of the 99.95% availability / 0.05% error budget). Would exhaust the 30d budget in ~2d (~50h)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
    - alert: userJourneyFrontendErrors6h30m
      expr: |
        (
          (
            sum by (cluster) (
              rate(frontend_http_requests_total{
                code=~"5..",
                route!~".*hcpoperation(results|statuses).*"
              }[6h] offset 5m)
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_total{
                route!~".*hcpoperation(results|statuses).*"
              }[6h] offset 5m)
            )
          ) > 0.003
          and on (cluster)
          (
            sum by (cluster) (
              rate(frontend_http_requests_total{
                code=~"5..",
                route!~".*hcpoperation(results|statuses).*"
              }[30m] offset 5m)
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_total{
                route!~".*hcpoperation(results|statuses).*"
              }[30m] offset 5m)
            )
          ) > 0.003
        )
      for: 15m
      labels:
        severity: "3"
        slo: frontend-errors
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP 5xx error rate elevated (>0.30%)"
        description: "Frontend 5xx share on cluster {{ $labels.cluster }} is above 0.30% on both the 6h and 30m windows (6x burn of the 0.05% error budget)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
    - alert: userJourneyFrontendErrors3d6h
      expr: |
        (
          (
            sum by (cluster) (
              rate(frontend_http_requests_total{
                code=~"5..",
                route!~".*hcpoperation(results|statuses).*"
              }[3d] offset 5m)
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_total{
                route!~".*hcpoperation(results|statuses).*"
              }[3d] offset 5m)
            )
          ) > 0.0005
          and on (cluster)
          (
            sum by (cluster) (
              rate(frontend_http_requests_total{
                code=~"5..",
                route!~".*hcpoperation(results|statuses).*"
              }[6h] offset 5m)
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_total{
                route!~".*hcpoperation(results|statuses).*"
              }[6h] offset 5m)
            )
          ) > 0.0005
        )
      for: 1h
      labels:
        severity: "4"
        slo: frontend-errors
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP 5xx error rate exceeds SLO (>0.05%)"
        description: "Frontend 5xx share on cluster {{ $labels.cluster }} is above the 0.05% SLO boundary on both the 3d and 6h windows (1x burn)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
  - name: arohcp_frontend_slo_latency_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyFrontendLatency1h5m
      expr: |
        (
          (
            (
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le="+Inf",
                  route!~".*hcpoperation(results|statuses).*"
                }[1h] offset 5m)
              )
              -
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le=~"^1([.]0)?$",
                  route!~".*hcpoperation(results|statuses).*"
                }[1h] offset 5m)
              )
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_duration_seconds_bucket{
                le="+Inf",
                route!~".*hcpoperation(results|statuses).*"
              }[1h] offset 5m)
            )
          ) > 0.144
          and on (cluster)
          (
            (
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le="+Inf",
                  route!~".*hcpoperation(results|statuses).*"
                }[5m] offset 5m)
              )
              -
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le=~"^1([.]0)?$",
                  route!~".*hcpoperation(results|statuses).*"
                }[5m] offset 5m)
              )
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_duration_seconds_bucket{
                le="+Inf",
                route!~".*hcpoperation(results|statuses).*"
              }[5m] offset 5m)
            )
          ) > 0.144
        )
      for: 2m
      labels:
        severity: "3"
        slo: frontend-latency
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP latency budget burning critically fast (>14.4% over 1s)"
        description: "More than 14.4% of Frontend requests on cluster {{ $labels.cluster }} exceeded 1s on both the 1h and 5m windows (14.4x burn of the 1% latency budget)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
    - alert: userJourneyFrontendLatency6h30m
      expr: |
        (
          (
            (
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le="+Inf",
                  route!~".*hcpoperation(results|statuses).*"
                }[6h] offset 5m)
              )
              -
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le=~"^1([.]0)?$",
                  route!~".*hcpoperation(results|statuses).*"
                }[6h] offset 5m)
              )
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_duration_seconds_bucket{
                le="+Inf",
                route!~".*hcpoperation(results|statuses).*"
              }[6h] offset 5m)
            )
          ) > 0.06
          and on (cluster)
          (
            (
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le="+Inf",
                  route!~".*hcpoperation(results|statuses).*"
                }[30m] offset 5m)
              )
              -
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le=~"^1([.]0)?$",
                  route!~".*hcpoperation(results|statuses).*"
                }[30m] offset 5m)
              )
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_duration_seconds_bucket{
                le="+Inf",
                route!~".*hcpoperation(results|statuses).*"
              }[30m] offset 5m)
            )
          ) > 0.06
        )
      for: 15m
      labels:
        severity: "3"
        slo: frontend-latency
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP latency budget burning fast (>6% over 1s)"
        description: "More than 6% of Frontend requests on cluster {{ $labels.cluster }} exceeded 1s on both the 6h and 30m windows (6x burn of the 1% latency budget)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
    - alert: userJourneyFrontendLatency3d6h
      expr: |
        (
          (
            (
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le="+Inf",
                  route!~".*hcpoperation(results|statuses).*"
                }[3d] offset 5m)
              )
              -
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le=~"^1([.]0)?$",
                  route!~".*hcpoperation(results|statuses).*"
                }[3d] offset 5m)
              )
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_duration_seconds_bucket{
                le="+Inf",
                route!~".*hcpoperation(results|statuses).*"
              }[3d] offset 5m)
            )
          ) > 0.01
          and on (cluster)
          (
            (
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le="+Inf",
                  route!~".*hcpoperation(results|statuses).*"
                }[6h] offset 5m)
              )
              -
              sum by (cluster) (
                rate(frontend_http_requests_duration_seconds_bucket{
                  le=~"^1([.]0)?$",
                  route!~".*hcpoperation(results|statuses).*"
                }[6h] offset 5m)
              )
            )
            /
            sum by (cluster) (
              rate(frontend_http_requests_duration_seconds_bucket{
                le="+Inf",
                route!~".*hcpoperation(results|statuses).*"
              }[6h] offset 5m)
            )
          ) > 0.01
        )
      for: 1h
      labels:
        severity: "4"
        slo: frontend-latency
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP latency exceeds its SLO budget (>1% over 1s)"
        description: "More than 1% of Frontend requests on cluster {{ $labels.cluster }} exceeded 1s on both the 3d and 6h windows (1x burn of the latency budget)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
  - name: arohcp_frontend_slo_ready_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyFrontendReady
      expr: |
        sli:frontend:ready:ratio5m == 0
      for: 5m
      labels:
        severity: "3"
        slo: frontend-ready
      annotations:
        summary: "{{ $labels.cluster }}: Frontend has no Ready replicas (kube /healthz)"
        description: "aro-hcp-frontend on cluster {{ $labels.cluster }} has 0 available replicas (kube readiness probes hit /healthz). This is a process outage, not an ARM traffic drought."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
  # Traffic drought is Sev 4 (ticket). The 0.5 RPS 1d-baseline floor is a
  # fleet-wide noise gate, not an SLO: 10% of 0.5 RPS is 0.05 RPS (~3 rpm),
  # below which a 90% drop is scrape noise / idle INT, not a customer-visible
  # ARM collapse. Replica death is userJourneyFrontendReady (Sev 3).
  # One RP bicep is generated for all clouds, so the floor is not per-env.
  - name: arohcp_frontend_slo_traffic_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyFrontendTrafficDrop
      expr: |
        (
          avg_over_time(traffic:frontend_http:request_rate:rate5m[15m])
          < 0.1 * avg_over_time(traffic:frontend_http:request_rate:rate5m[1d])
        )
        and
        avg_over_time(traffic:frontend_http:request_rate:rate5m[1d]) > 0.5
        and
        sli:frontend:ready:ratio5m > 0
      for: 15m
      labels:
        severity: "4"
        slo: frontend-traffic
      annotations:
        summary: "{{ $labels.cluster }}: Frontend HTTP traffic collapsed below 10% of 1d baseline"
        description: "Frontend request rate on cluster {{ $labels.cluster }} is below 10% of its 1-day average for 15m while the 1d baseline exceeded 0.5 RPS (fleet-wide noise floor) and pods are still Ready (traffic drought, not a replica outage)."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
  - name: arohcp_frontend_slo_saturation_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyFrontendSaturationMemory
      expr: |
        sli:frontend:saturation_memory:ratio5m > 0.85
      for: 15m
      labels:
        severity: "4"
        slo: frontend-saturation
      annotations:
        summary: "{{ $labels.cluster }}: Frontend pod memory above 85% of limit for 15+ minutes"
        description: "Frontend container memory (working set/limit) on cluster {{ $labels.cluster }} is above 85% for 15m."
        runbook_url: "https://aka.ms/arohcp-runbook-frontend"
