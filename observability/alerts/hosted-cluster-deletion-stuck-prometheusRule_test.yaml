    values: 1x2881
  alert_rule_test:
  - eval_time: 0m
    alertname: HostedClusterDeletionStuck
    exp_alerts: []
  - eval_time: 47h59m
    alertname: HostedClusterDeletionStuck
    exp_alerts: []
  - eval_time: 48h
    alertname: HostedClusterDeletionStuck
    exp_alerts:
    - exp_labels:
        name: hc-a
        namespace: ocm-a
        _id: id-a
        subscription_id: sub-a
        resource_id: /subscriptions/sub-a/resourceGroups/rg-a/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/hc-a
        cluster: mgmt-a
        region: eastus
        component: cluster-deletion
        severity: '4'
      exp_annotations:
        summary: HostedCluster mgmt-a/ocm-a/hc-a continuously observed deleting for 48h (id-a, sub-a, /subscriptions/sub-a/resourceGroups/rg-a/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/hc-a)
