- name: missing and empty deletion timestamps never fire
  interval: 1m
  input_series:
  - series: hostedClusterAPI_deleting{name="hc-a",namespace="ocm-a",_id="id-a",subscription_id="sub-a",resource_id="/subscriptions/sub-a/resourceGroups/rg-a/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/hc-a",cluster="mgmt-a",region="eastus"}
    values: 1x3000
  - series: hostedClusterAPI_deleting{name="hc-a",namespace="ocm-a",_id="id-a",subscription_id="sub-a",resource_id="/subscriptions/sub-a/resourceGroups/rg-a/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/hc-a",cluster="mgmt-a",region="eastus",deletion_timestamp="",pod="other"}
    values: 1x3000
  alert_rule_test:
  - eval_time: 50h
    alertname: HostedClusterDeletionStuck
    exp_alerts: []
- name: old timestamp waits a full observation period without operation records
