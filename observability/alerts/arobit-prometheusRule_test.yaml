        description: 'Fluent Bit router cosmos_snapshot_router_fleet (copy) in pod arobit-routing on cluster test has more matched records than successful rewrite emissions for at least two minutes.

          A failed reroute can leave the original tag and use a fallback destination; a failed copy omits the additional destination. The mixed container-name router combines both operations.

