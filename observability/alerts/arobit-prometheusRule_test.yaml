# Routing emission failures, operation grouping, publication skew and resets
- interval: 30s
  input_series:
  - series: arobit_routing_reroute_resource_snapshot_router_matched_total{cluster="test",pod="arobit-routing"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 1m
    alertname: FluentBitRoutingEmissionFailed
    exp_alerts: []
  - eval_time: 2m
    alertname: FluentBitRoutingEmissionFailed
    exp_alerts:
    - exp_labels:
        alertname: FluentBitRoutingEmissionFailed
        cluster: test
        pod: arobit-routing
        router: resource_snapshot_router
        routing_type: reroute
        component: monitoring-infrastructure
        severity: warning
      exp_annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: 'Fluent Bit router resource_snapshot_router (reroute) in pod arobit-routing on cluster test has more matched records than successful rewrite emissions for at least two minutes.

          A failed reroute can leave the original tag and use a fallback destination; a failed copy omits the additional destination. The mixed container-name router combines both operations.

          Inspect rewrite-tag emitter backpressure. These counters measure emission failures, not confirmed Kusto loss.

'
        summary: Fluent Bit resource_snapshot_router (reroute) in arobit-routing on test has failed routing emissions
- interval: 30s
  input_series:
  - series: arobit_routing_copy_cosmos_snapshot_router_fleet_matched_total{cluster="test",pod="arobit-routing"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 1m
    alertname: FluentBitRoutingEmissionFailed
    exp_alerts: []
  - eval_time: 2m
