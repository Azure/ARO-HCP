    values: "0+6x480"
  - series: 'kube_pod_container_resource_requests{container="backend", namespace="aro-hcp", pod="backend-0", cluster="test", resource="cpu", job="kube-state-metrics"}'
    values: "0.2+0x480"
  alert_rule_test:
  - eval_time: 35m
