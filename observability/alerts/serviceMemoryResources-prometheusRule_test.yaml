rule_files:
- serviceMemoryResources-prometheusRule.yaml
evaluation_interval: 1m
tests:
# ServiceMemoryDrift - alert fires when 30m-average usage > 1.2x request (using frontend as example)
- interval: 1m
  input_series:
  - series: 'container_memory_working_set_bytes{container="frontend", namespace="aro-hcp", pod="frontend-0", cluster="test"}'
    values: "201326592+0x40"
  - series: 'kube_pod_container_resource_requests{container="frontend", namespace="aro-hcp", pod="frontend-0", cluster="test", resource="memory", job="kube-state-metrics"}'
    values: "134217728+0x40"
  alert_rule_test:
  - eval_time: 35m
    alertname: ServiceMemoryDrift
    exp_alerts:
    - exp_labels:
        alertname: ServiceMemoryDrift
        severity: warning
        team: hcp-sl
        component: service-memory
        cluster: test
        container: frontend
        namespace: aro-hcp
        pod: frontend-0
      exp_annotations:
        summary: frontend in aro-hcp exceeds 1.2x its memory request on cluster test. pod:frontend-0
        description: |
          Container frontend in pod frontend-0 (namespace aro-hcp) on cluster test has averaged 150% of its memory request over the last 30 minutes.
          This may indicate a memory leak or workload growth that requires right-sizing the request in config.yaml.
        runbook_url: https://github.com/Azure/ARO-HCP/blob/main/docs/alerts/service-memory-resources.md
        owning_team: hcp-sl
# ServiceMemoryDrift - no alert when 30m-average usage is below 1.2x
- interval: 1m
  input_series:
  - series: 'container_memory_working_set_bytes{container="frontend", namespace="aro-hcp", pod="frontend-0", cluster="test"}'
    values: "140509184+0x40"
  - series: 'kube_pod_container_resource_requests{container="frontend", namespace="aro-hcp", pod="frontend-0", cluster="test", resource="memory", job="kube-state-metrics"}'
    values: "134217728+0x40"
  alert_rule_test:
  - eval_time: 35m
    alertname: ServiceMemoryDrift
    exp_alerts: []
# ServiceMemoryDrift - no alert when fewer than 30 minutes of data are present (data-guard)
- interval: 1m
  input_series:
  - series: 'container_memory_working_set_bytes{container="frontend", namespace="aro-hcp", pod="frontend-0", cluster="test"}'
    values: "201326592+0x20"
  - series: 'kube_pod_container_resource_requests{container="frontend", namespace="aro-hcp", pod="frontend-0", cluster="test", resource="memory", job="kube-state-metrics"}'
    values: "134217728+0x20"
  alert_rule_test:
  - eval_time: 20m
    alertname: ServiceMemoryDrift
    exp_alerts: []
