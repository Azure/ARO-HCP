# ServiceCPUDrift - alert fires when 30m-average CPU usage > 1.2x request
# container_cpu_usage_seconds_total is a counter; +6x480 => 0.1 cores/s rate, request 0.05 cores => 2.0x
- interval: 1m
  input_series:
  - series: 'container_cpu_usage_seconds_total{container="backend", namespace="aro-hcp", pod="backend-0", cluster="test"}'
    values: "0+6x480"
  - series: 'kube_pod_container_resource_requests{container="backend", namespace="aro-hcp", pod="backend-0", cluster="test", resource="cpu", job="kube-state-metrics"}'
    values: "0.05+0x480"
  alert_rule_test:
  - eval_time: 35m
    alertname: ServiceCPUDrift
    exp_alerts:
    - exp_labels:
        alertname: ServiceCPUDrift
        severity: warning
        team: hcp-sl
        component: service-memory
        cluster: test
        container: backend
        namespace: aro-hcp
        pod: backend-0
      exp_annotations:
        summary: backend in aro-hcp exceeds 1.2x its CPU request on cluster test. pod:backend-0
        description: |
          Container backend in pod backend-0 (namespace aro-hcp) on cluster test has averaged 200% of its CPU request over the last 30 minutes.
          This may indicate workload growth that requires right-sizing the request in config.yaml.
        runbook_url: https://github.com/Azure/ARO-HCP/blob/main/docs/alerts/service-memory-resources.md
        owning_team: hcp-sl
# ServiceCPUDrift - no alert when CPU usage is below 1.2x request
# +6x480 => 0.1 cores/s rate, request 0.2 cores => 0.5x
- interval: 1m
  input_series:
