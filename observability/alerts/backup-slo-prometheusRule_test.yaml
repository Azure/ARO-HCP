# Tests for the non-schedule (services-workspace) backup SLO alerts:
# StorageAvailability and MetricsAbsent. Their source series carry no
# `schedule` label and stay in the services workspace.
rule_files:
- backup-slo-prometheusRule.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  name: healthy_baseline
  input_series:
  - series: 'underlay_clusters{cluster="mgmt-1", source="bicep"}'
    values: "1+0x300"
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-1", backup_location_name="default"}'
    values: "1+0x300"
  alert_rule_test:
  - eval_time: 290m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
- interval: 1m
  name: storage_location_unavailable
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-1", backup_location_name="default"}'
    values: "0x20"
  alert_rule_test:
  - eval_time: 14m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero default BackupStorageLocation unavailable on mgmt-1"
        description: "The default Velero BackupStorageLocation on management cluster mgmt-1 has reported unavailable for 15m. Check `kubectl get backupstoragelocation -n velero` and the underlying Azure Blob storage account/credentials on the MC."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# StorageAvailability: healthy BSL (gauge = 1) must never fire.
# ========================================
- interval: 1m
  name: storage_location_available
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-2", backup_location_name="default"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# StorageAvailability: HA-replica dedup. Two `prometheus_replica` series
# for the same cluster, one reporting
# unavailable (0) and one reporting available (1) throughout - `max by
# (cluster)` must take the conservative max (1), so this must NEVER fire
# even though a naive `== 0` on the raw gauge would match the bad replica.
# ========================================
- interval: 1m
  name: storage_location_ha_replica_disagreement
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-3", backup_location_name="default", prometheus_replica="0"}'
    values: "0x20"
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-3", backup_location_name="default", prometheus_replica="1"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# StorageAvailability: HA-replica dedup, both replicas unavailable. Must
# fire exactly ONCE per cluster (single exp_alerts entry), not once per
# prometheus_replica series.
# ========================================
- interval: 1m
  name: storage_location_ha_replica_both_down
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-4", backup_location_name="default", prometheus_replica="0"}'
    values: "0x20"
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-4", backup_location_name="default", prometheus_replica="1"}'
    values: "0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: mgmt-4
        component: slo
        severity: "3"
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero default BackupStorageLocation unavailable on mgmt-4"
        description: "The default Velero BackupStorageLocation on management cluster mgmt-4 has reported unavailable for 15m. Check `kubectl get backupstoragelocation -n velero` and the underlying Azure Blob storage account/credentials on the MC."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# StorageAvailability: fires while unavailable, then recovers once the BSL
# controller reports availability again.
# ========================================
- name: storage_location_outage_then_recovery
  interval: 1m
  input_series:
  - series: velero_backup_location_status_gauge{cluster="storage-recovery", backup_location_name="default"}
    values: 0x20 1x19
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: storage-recovery
        component: slo
        severity: '3'
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero default BackupStorageLocation unavailable on storage-recovery"
        description: "The default Velero BackupStorageLocation on management cluster storage-recovery has reported unavailable for 15m. Check `kubectl get backupstoragelocation -n velero` and the underlying Azure Blob storage account/credentials on the MC."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 23m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# MetricsAbsent: a management cluster is in the underlay inventory but has
# no successful Velero server scrape (Velero itself, its PodMonitor, or the
# metrics pipeline is down). Cluster name follows the real
# {env}-{region}-mgmt-{stamp} production convention (config.yaml) so it
# actually matches the alert's cluster=~".*-mgmt-.*" filter.
# ========================================
- interval: 1m
  name: metrics_missing_server
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-mgmt-1", source="bicep"}'
    values: "1+0x20"
  # Cluster healthy and reporting (its Prometheus self-scrape is up), so a
  # missing Velero server scrape is a real failure and must fire (ARO-30447 gate).
  - series: 'up{cluster="int-eastus-mgmt-1", job="prometheus/prometheus", namespace="prometheus"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupMetricsAbsent
        cluster: int-eastus-mgmt-1
        component: slo
        severity: "3"
        slo: backup-metrics-absent
      exp_annotations:
        summary: "no successful Velero server metrics scrape for 15m on int-eastus-mgmt-1"
        description: "Management cluster int-eastus-mgmt-1 is in the underlay-cluster inventory but has had no successful Velero server metrics scrape for 15m. Check Velero, its PodMonitor, and the management-cluster metrics pipeline. A healthy empty cluster with up=1 is not a failure merely because it has no backup attempts."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ARO-30447: a management cluster declared in the bicep inventory that is absent
# or non-functional - e.g. a torn-down or never-provisioned stamp, so nothing
# remote-writes from it (no Prometheus self-scrape, no Velero) - must NOT fire
# this Velero canary. Its absence is PrometheusMetricsAbsentPerCluster's job.
# Mirror of metrics_missing_server (same cluster/inventory/missing-velero) minus
# the Prometheus self-up health signal.
- interval: 1m
  name: metrics_absent_unhealthy_cluster_does_not_fire
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-mgmt-absent", source="bicep"}'
    values: "1+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
# A service cluster absent from the inventory filter must never fire - svc
# clusters never run Velero/HostedCluster backups.
- interval: 1m
  name: metrics_service_cluster_excluded
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-svc-1", source="bicep"}'
    values: "1+0x20"
  # Healthy and reporting (self-scrape up=1) so exclusion is enforced by the
  # cluster=~".*-mgmt-.*" filter, not by a missing inventory side - drop the
  # filter and this reporting svc cluster would fire.
  - series: 'up{cluster="int-eastus-svc-1", job="prometheus/prometheus", namespace="prometheus"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
# A management cluster with a successful server scrape must not fire, even if
# it is also in the inventory.
- interval: 1m
  name: metrics_healthy_server
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-mgmt-1", source="bicep"}'
    values: "1+0x20"
  # Healthy and reporting (self-scrape up=1) so the inventory side is populated
  # and the Velero up=1 suppression below is actually exercised - drop the Velero
  # series and this would fire.
  - series: 'up{cluster="int-eastus-mgmt-1", job="prometheus/prometheus", namespace="prometheus"}'
    values: "1x20"
  - series: 'velero_backup_attempt_total{cluster="int-eastus-mgmt-1", schedule="ns-a-6-hourly"}'
    values: "0+1x20"
  - series: 'up{cluster="int-eastus-mgmt-1", namespace="velero", pod="velero-server-1"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
- name: metrics_absent_failed_scrapes_then_healthy_recovery
  interval: 1m
  input_series:
  - series: underlay_clusters{cluster="int-eastus-mgmt-recovery"}
    values: 1x50
  - series: 'up{cluster="int-eastus-mgmt-recovery", job="prometheus/prometheus", namespace="prometheus"}'
    values: 1x50
  - series: up{cluster="int-eastus-mgmt-recovery", namespace="velero", pod="velero-server-1"}
    values: 0x20 1x29
  alert_rule_test:
  - eval_time: 14m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupMetricsAbsent
        cluster: int-eastus-mgmt-recovery
        component: slo
        severity: '3'
        slo: backup-metrics-absent
      exp_annotations:
        summary: "no successful Velero server metrics scrape for 15m on int-eastus-mgmt-recovery"
        description: "Management cluster int-eastus-mgmt-recovery is in the underlay-cluster inventory but has had no successful Velero server metrics scrape for 15m. Check Velero, its PodMonitor, and the management-cluster metrics pipeline. A healthy empty cluster with up=1 is not a failure merely because it has no backup attempts."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 22m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
- name: metrics_absent_empty_cluster_with_healthy_server_and_no_attempts
  interval: 1m
  input_series:
  - series: underlay_clusters{cluster="int-eastus-mgmt-empty"}
    values: 1x30
  # Healthy and reporting (self-scrape up=1) so the inventory side is populated;
  # this is the empty-but-healthy MC case - Velero up=1 with no backup attempts
  # must not fire. Drop the Velero series and it would.
  - series: up{cluster="int-eastus-mgmt-empty", job="prometheus/prometheus", namespace="prometheus"}
    values: 1x30
  - series: up{cluster="int-eastus-mgmt-empty", namespace="velero", pod="velero-server-1"}
    values: 1x30
  alert_rule_test:
  - eval_time: 25m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
- name: metrics_absent_one_healthy_ha_scrape_prevents_false_alarm
  interval: 1m
  input_series:
  - series: underlay_clusters{cluster="int-eastus-mgmt-ha"}
    values: 1x30
  # Cluster healthy and reporting (self-scrape up=1) so the inventory side is
  # populated - without this the alert cannot fire regardless of Velero and the
  # HA-replica suppression below would not actually be exercised.
  - series: 'up{cluster="int-eastus-mgmt-ha", job="prometheus/prometheus", namespace="prometheus"}'
    values: 1x30
  - series: up{cluster="int-eastus-mgmt-ha", namespace="velero", pod="velero-server-1", prometheus_replica="0"}
    values: '0x30'
  - series: up{cluster="int-eastus-mgmt-ha", namespace="velero", pod="velero-server-1", prometheus_replica="1"}
    values: 1x30
  alert_rule_test:
  - eval_time: 25m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
- name: metrics_absent_node_agent_does_not_mask_missing_server
  interval: 1m
  input_series:
  - series: underlay_clusters{cluster="int-eastus-mgmt-server-missing"}
    values: 1x30
  - series: 'up{cluster="int-eastus-mgmt-server-missing", job="prometheus/prometheus", namespace="prometheus"}'
    values: 1x30
  - series: up{cluster="int-eastus-mgmt-server-missing", namespace="velero", pod="node-agent-1"}
    values: 1x30
  alert_rule_test:
  - eval_time: 25m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupMetricsAbsent
        cluster: int-eastus-mgmt-server-missing
        component: slo
        severity: '3'
        slo: backup-metrics-absent
      exp_annotations:
        summary: "no successful Velero server metrics scrape for 15m on int-eastus-mgmt-server-missing"
        description: "Management cluster int-eastus-mgmt-server-missing is in the underlay-cluster inventory but has had no successful Velero server metrics scrape for 15m. Check Velero, its PodMonitor, and the management-cluster metrics pipeline. A healthy empty cluster with up=1 is not a failure merely because it has no backup attempts."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
