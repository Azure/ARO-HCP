# backup-slo-recordingRule.yaml is listed here (not just in
# recording-rules-services.yaml's testDependencies) because the generator
# flattens every rule file it loads into one shared temp dir by basename, and
# Traffic/StorageAvailability/RepoMaintenanceSaturation below query recording
# rules it defines (traffic:backup:attempt_rate:rate5m,
# sli:backup:last_run_failure:ratio5m, backup:hostedcluster_count:count,
# backup:in_progress:count) - promtool needs both files loaded together to
# resolve them from the raw velero_* input series below. Errors and Latency
# alerts compute their own windowed ratios/quantiles directly from raw
# counters (see backup-slo-prometheusRule.yaml's comments), so they do not
# depend on the recording rules at all.
rule_files:
- backup-slo-prometheusRule.yaml
- backup-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Healthy baseline: 6-hourly schedule succeeding on time, low error
# rate, normal latency, metrics present. No alerts anywhere.
# ========================================
- interval: 1m
  name: healthy_baseline
  input_series:
  - series: 'velero_backup_last_successful_timestamp{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+60x300"
  - series: 'underlay_clusters{cluster="mgmt-1", source="bicep"}'
    values: "1+0x300"
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x300"
  - series: 'velero_backup_success_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x300"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x300"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x300"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x300"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+1x300"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="60"}'
    values: "0+1x300"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x300"
  - series: 'velero_backup_last_status{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "1+0x300"
  alert_rule_test:
  - eval_time: 290m
    alertname: userJourneyBackupAvailability1h5m
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupAvailability6h30m
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupAvailability3d6h
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupErrors1h5m
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupErrors6h30m
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupLatency6h30m
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupTraffic
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupRepoMaintenanceSaturation
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
# ========================================
# Availability: 6-hourly schedule's last success is frozen at t=0 while time
# keeps advancing, so lag grows unbounded - simulates a stuck schedule.
# hosted_cluster_namespace is derived from the "{namespace}-6-hourly" schedule
# name via label_replace.
# ========================================
- interval: 5m
  name: availability_fast_stale_12h
  input_series:
  - series: 'velero_backup_last_successful_timestamp{cluster="mgmt-1", schedule="ns-hc-stuck-6-hourly"}'
    values: "0+0x6000"
  alert_rule_test:
  # At 12h20m: lag = 740*60 = 44400s > 43200s (12h) -> 1h5m tier fires
  - eval_time: 12h20m
    alertname: userJourneyBackupAvailability1h5m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability1h5m
        cluster: mgmt-1
        hosted_cluster_namespace: ns-hc-stuck
        component: slo
        severity: "4"
        slo: backup-availability
        long_window: 1h
        short_window: 5m
      exp_annotations:
        summary: "no successful 6-hourly backup for ns-hc-stuck in over 12h"
        description: "No successful Velero 6-hourly backup for HostedCluster namespace ns-hc-stuck on management cluster mgmt-1 in over 12 hours (6-hourly cadence; this is the primary restore-point freshness signal). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
        correlationId: "userJourneyBackupAvailability1h5m/mgmt-1/ns-hc-stuck"
  # At 11h: lag = 39600s < 43200s (12h) -> not yet firing
  - eval_time: 11h
    alertname: userJourneyBackupAvailability1h5m
    exp_alerts: []
  # At 12h20m: lag 44400s < 86400s (24h) -> 6h30m tier not yet firing
  - eval_time: 12h20m
    alertname: userJourneyBackupAvailability6h30m
    exp_alerts: []
- interval: 5m
  name: availability_medium_stale_24h
  # At 25h lag exceeds BOTH the 1h5m tier's 12h threshold and the 6h30m
  # tier's 24h threshold - these tiers are independent absolute thresholds on
  # the same monotonic lag, not mutually exclusive, so both are expected to
  # be firing simultaneously (by design: the more a backup lags, the more
  # tiers agree it is stuck).
  input_series:
  - series: 'velero_backup_last_successful_timestamp{cluster="mgmt-1", schedule="ns-hc-stuck-6-hourly"}'
    values: "0+0x400"
  alert_rule_test:
  - eval_time: 25h
    alertname: userJourneyBackupAvailability6h30m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability6h30m
        cluster: mgmt-1
        hosted_cluster_namespace: ns-hc-stuck
        component: slo
        severity: "4"
        slo: backup-availability
        long_window: 6h
        short_window: 30m
      exp_annotations:
        summary: "no successful 6-hourly backup for ns-hc-stuck in over 24h"
        description: "No successful Velero 6-hourly backup for HostedCluster namespace ns-hc-stuck on management cluster mgmt-1 in over 24 hours. No recent restore point for this HC; investigate before this ages further."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
        correlationId: "userJourneyBackupAvailability6h30m/mgmt-1/ns-hc-stuck"
  - eval_time: 25h
    alertname: userJourneyBackupAvailability1h5m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability1h5m
        cluster: mgmt-1
        hosted_cluster_namespace: ns-hc-stuck
        component: slo
        severity: "4"
        slo: backup-availability
        long_window: 1h
        short_window: 5m
      exp_annotations:
        summary: "no successful 6-hourly backup for ns-hc-stuck in over 12h"
        description: "No successful Velero 6-hourly backup for HostedCluster namespace ns-hc-stuck on management cluster mgmt-1 in over 12 hours (6-hourly cadence; this is the primary restore-point freshness signal). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
        correlationId: "userJourneyBackupAvailability1h5m/mgmt-1/ns-hc-stuck"
# ========================================
# Availability 3d6h: lag passes the 72h (3d) threshold. Sampled at 5m (not a
# sparser interval) - the alert expr is a bare instant-vector lookup with no
# range selector, so it relies on the default 5m staleness window; widely
# spaced samples would go stale between points in this test harness even
# though real Velero scrapes (~30s) never would.
# ========================================
- interval: 5m
  name: availability_slow_stale_72h
  input_series:
  - series: 'velero_backup_last_successful_timestamp{cluster="mgmt-1", schedule="ns-hc-stuck-6-hourly"}'
    values: "0+0x1000"
  alert_rule_test:
  - eval_time: 73h10m
    alertname: userJourneyBackupAvailability3d6h
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability3d6h
        cluster: mgmt-1
        hosted_cluster_namespace: ns-hc-stuck
        component: slo
        severity: "4"
        slo: backup-availability
        long_window: 3d
        short_window: 6h
      exp_annotations:
        summary: "no successful 6-hourly backup for ns-hc-stuck in over 3d"
        description: "No successful Velero 6-hourly backup for HostedCluster namespace ns-hc-stuck on management cluster mgmt-1 in over 3 days. Daily and weekly tiers on this HC are also at risk once their own cadences lapse."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
        correlationId: "userJourneyBackupAvailability3d6h/mgmt-1/ns-hc-stuck"
# ========================================
# Availability recovery: alert fires when last-success is stale, then
# resolves after a new successful backup resets the timestamp. Proves the
# alert is not sticky once the underlying issue clears.
# ========================================
- interval: 5m
  name: availability_recovery_after_success
  input_series:
  # Timestamp stuck at 0 for first 150 steps (750m = 12.5h), then jumps to
  # near-current at step 151 (simulates a new successful backup completing).
  # After the jump the lag drops well below 12h so the 1h5m tier resolves.
  - series: 'velero_backup_last_successful_timestamp{cluster="mgmt-2", schedule="ns-hc-recovery-6-hourly"}'
    values: "0+0x151 45300+0x20"
  alert_rule_test:
  # At 12h20m (740m): lag = 740*60 = 44400s > 43200s (12h) -> alert fires
  - eval_time: 12h20m
    alertname: userJourneyBackupAvailability1h5m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability1h5m
        cluster: mgmt-2
        hosted_cluster_namespace: ns-hc-recovery
        component: slo
        severity: "4"
        slo: backup-availability
        long_window: 1h
        short_window: 5m
      exp_annotations:
        summary: "no successful 6-hourly backup for ns-hc-recovery in over 12h"
        description: "No successful Velero 6-hourly backup for HostedCluster namespace ns-hc-recovery on management cluster mgmt-2 in over 12 hours (6-hourly cadence; this is the primary restore-point freshness signal). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
        correlationId: "userJourneyBackupAvailability1h5m/mgmt-2/ns-hc-recovery"
  # At 12h40m (760m): last_successful_timestamp = 45300 (set at step 151 =
  # 755m = 45300s), current time = 760*60 = 45600s, lag = 300s << 43200s ->
  # alert resolves
  - eval_time: 12h40m
    alertname: userJourneyBackupAvailability1h5m
    exp_alerts: []
# ========================================
# Errors: fast burn (>7.2% failed-attempt share, sustained 1h and 5m).
# Ratio is now computed directly over the raw counters per window (not the
# 5m errors:backup:ratio:rate5m recording rule), but a sustained-rate input
# like this produces the same result either way - the delayed-completion
# regression test below is what specifically exercises the fix.
# ========================================
- interval: 1m
  name: errors_fast_burn
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+100x80"
  - series: 'velero_backup_success_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+90x80"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+10x80"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x80"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x80"
  alert_rule_test:
  - eval_time: 62m
    alertname: userJourneyBackupErrors1h5m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors1h5m
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-errors
        long_window: 1h
        short_window: 5m
      exp_annotations:
        summary: "Velero backup failure rate critically high (>7.2%)"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above 7.2% on both the 1h and 5m windows (14.4x burn of the 99.5% success / 0.5% error budget)."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
# Note: a sustained 10% error rate (as above) also satisfies the medium and
# slow tiers' thresholds once their own `for:` durations elapse - the tiers
# are independent absolute thresholds, not mutually exclusive, so this block
# intentionally does not assert userJourneyBackupErrors6h30m/3d6h are empty.
# ========================================
# Errors: delayed-failure regression test. A single 6-hourly batch of 50 HCs'
# worth of attempts lands in one burst at t=0; 4 of them fail ~10m later
# (matching the real 10m pre-hook timeout in internal/backup/backup.go:88),
# well outside that attempt's own 5m slice. This is exactly the case where
# the old design (5m errors:backup:ratio:rate5m recording rule, gated by
# `and on (cluster) (attempt_rate[5m] > 0)`) would have silently dropped the
# failure: at the moment it lands, the trailing 5m attempt-rate window no
# longer contains the t=0 burst, so the gate reads 0 and discards that whole
# instant. Computing the ratio directly over the alert's own 30m/6h windows
# avoids this because both the attempt and the delayed failure fall inside
# the same window regardless of the gap between them.
# ========================================
- interval: 1m
  name: errors_delayed_completion
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0 50+0x40"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+0x9 4+0x31"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x41"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x41"
  alert_rule_test:
  - eval_time: 26m
    alertname: userJourneyBackupErrors6h30m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors6h30m
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-errors
        long_window: 6h
        short_window: 30m
      exp_annotations:
        summary: "Velero backup failure rate elevated (>3.0%)"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above 3.0% on both the 6h and 30m windows (6x burn)."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
# ========================================
# Errors: +Inf short-window regression test. An early batch (1000 attempts,
# 200 failures, resolved immediately at t=1m) keeps the 1h long window well
# above the 7.2% fast-burn threshold throughout. A second batch of 900
# attempts fires at t=50m, but its outcomes (9 failures, 1% - well under
# 7.2%, 891 successes) do not complete until t=57m. At eval_time=58m, the
# trailing 5m short window [53m,58m] contains the batch-2 COMPLETIONS (the
# failure/success jump at t=57m) but not the batch-2 ATTEMPT (which jumped at
# t=50m, 3m outside this window) - so rate(attempt_total[5m]) reads exactly
# 0 in that window. Against the OLD attempt-denominator design, that 0 would
# make the short-window ratio divide-by-zero to +Inf, which is always
# "> 0.072" regardless of the real recent failure share, letting the stale
# 1h check alone confirm a fast-burn page even though only 1% of the newest
# batch actually failed. The completed-outcome denominator used here instead
# makes the short-window ratio correctly read 9/(891+9) = 1%, which does not
# clear 7.2%, so this alert must not fire.
# ========================================
- interval: 1m
  name: errors_delayed_low_failure_share_not_infinity
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0 1000+0x48 1900+0x8"
  - series: 'velero_backup_success_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0 800+0x55 1691+0x1"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0 200+0x55 209+0x1"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x59"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x59"
  alert_rule_test:
  - eval_time: 58m
    alertname: userJourneyBackupErrors1h5m
    exp_alerts: []
# ========================================
# Errors volume guard: ratio breaches fast-burn threshold (100% failures)
# but only 2 attempts in the 1h window - below the >= 3 floor.
# The alert must NOT fire despite the high error ratio.
# ========================================
- interval: 1m
  name: errors_fast_below_volume_floor
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0 0 2+0x78"
  - series: 'velero_backup_success_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0x80"
  - series: 'velero_backup_failure_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0 0 2+0x78"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0x80"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0x80"
  alert_rule_test:
  - eval_time: 4m
    alertname: userJourneyBackupErrors1h5m
    exp_alerts: []
# ========================================
# Errors: slow burn (>0.5%, sustained 3d and 6h) - below the fast/medium
# floors so only the slow tier fires. Sampled at 1m (not 5m or hourly): a
# [5m]/[30m]/etc. rate() needs multiple raw points comfortably inside every
# window to produce a reliable value every evaluation tick (real Velero
# scrapes are ~30s and never hit this). 4380 steps @ 1m = 73h, covering the
# 3d (72h) long window plus for:1h margin.
# ========================================
- interval: 1m
  name: errors_slow_burn
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+100x4380"
  - series: 'velero_backup_success_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+99x4380"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x4380"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x4380"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x4380"
  alert_rule_test:
  - eval_time: 73h
    alertname: userJourneyBackupErrors3d6h
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors3d6h
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-errors
        long_window: 3d
        short_window: 6h
      exp_annotations:
        summary: "Velero backup failure rate exceeds SLO (>0.5%)"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above the 0.5% SLO boundary on both the 3d and 6h windows (1x burn)."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
  - eval_time: 73h
    alertname: userJourneyBackupErrors1h5m
    exp_alerts: []
  - eval_time: 73h
    alertname: userJourneyBackupErrors6h30m
    exp_alerts: []
# ========================================
# Latency: p99 duration stuck above 20 minutes (1200s), sustained 6h and 30m.
# p99 is now computed via histogram_quantile directly over each full window's
# aggregated bucket rate, not by averaging the 5m sli:backup:latency_p99:rate5m
# recording rule. All observations land in (1200,1800] (a finite bucket, not
# the +Inf overflow) so histogram_quantile can interpolate a concrete
# estimate. Sampled at 1m (see the Errors slow-burn comment above).
# ========================================
- interval: 1m
  name: latency_medium_breach
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="1200"}'
    values: "0x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="1800"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+2x450"
  alert_rule_test:
  - eval_time: 6h25m
    alertname: userJourneyBackupLatency6h30m
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupLatency6h30m
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-latency
        long_window: 6h
        short_window: 30m
      exp_annotations:
        summary: "Velero backup p99 duration above SLO (>20m)"
        description: "Velero backup p99 duration on management cluster mgmt-1 is above 20 minutes on both the 6h and 30m windows (SLO: p99 < 20m, inside the 10m CSI snapshot / 15m item-operation timeouts)."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
# ========================================
# Latency: healthy p99 well under 20m - no alert.
# ========================================
- interval: 1m
  name: latency_medium_healthy
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="300"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+2x450"
  alert_rule_test:
  - eval_time: 6h25m
    alertname: userJourneyBackupLatency6h30m
    exp_alerts: []
# ========================================
# Latency: mixed-duration, unequal-volume regression test (firing case). A
# high-volume fast schedule (50/min at ~50s, all <=60s) runs alongside a
# low-volume slow schedule (2/min at ~1700s, in (60,1800]). Slow share of
# total volume is 2/52 ~= 3.8%, comfortably over 1%, so the TRUE
# volume-weighted p99 (rank 0.99*52=51.48, between cumulative(60)=50 and
# cumulative(1800)=52) interpolates to ~1348s - above the 1200s SLO. The old
# design (averaging two independently-computed 5m p99 values, e.g. a
# slow-only 5m snapshot at ~1700s and a fast-only 5m snapshot at ~50s) could
# average to ~875s and miss this entirely; aggregating bucket rates over the
# full window before one histogram_quantile call does not.
# ========================================
- interval: 1m
  name: latency_mixed_volumes_breach
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="60"}'
    values: "0+50x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="1800"}'
    values: "0+50x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="+Inf"}'
