  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-a-6-hourly"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-a-daily"}'
    values: "1+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-a-weekly"}'
    values: "1+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-b-6-hourly"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-b-daily"}'
    values: "1+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-b-weekly"}'
    values: "1+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-c-6-hourly"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-c-daily"}'
    values: "1+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-9", schedule="ns-c-weekly"}'
    values: "1+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: mgmt-9
        component: slo
        severity: "4"
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero backups failing fleet-wide - possible storage location outage"
        description: "Over 80% of observed Velero 6-hourly schedules on management cluster mgmt-9 had a failed last run, sustained for 15m, across at least 3 distinct HostedClusters on mgmt-9. PROXY signal for a BackupStorageLocation outage (no direct BSL-phase metric exists yet - see ARO-29949); also fires for other fleet-wide causes (e.g. a bad Velero/plugin rollout) - check `kubectl get backupstoragelocation -n velero` on the MC before assuming it is specifically storage. Paused schedules retain their last status; verify pause state before interpreting this ratio as active failures."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
