    values: '0x800'
  - series: velero_backup_attempt_total{cluster="never-success", schedule="ns-never-6-hourly"}
    values: 0+1x800
  - series: velero_backup_last_successful_timestamp{cluster="never-success", schedule="ns-never-6-hourly"}
    values: _x741 44460x59
  - series: velero_backup_last_status{cluster="never-success", schedule="ns-healthy-6-hourly"}
    values: 1x800
  - series: velero_backup_last_successful_timestamp{cluster="never-success", schedule="ns-healthy-6-hourly"}
    values: 0+60x800
  alert_rule_test:
  - eval_time: 719m
    alertname: userJourneyBackupNeverSucceeded
    exp_alerts: []
  - eval_time: 720m
    alertname: userJourneyBackupNeverSucceeded
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupNeverSucceeded
        cluster: never-success
        component: slo
        severity: '4'
        slo: backup-availability
        hosted_cluster_namespace: ns-never
      exp_annotations:
        summary: no successful backup timestamp for ns-never after 12h of observed schedule status
        description: HostedCluster namespace ns-never on management cluster never-success has reported a 6-hourly schedule status without a successful backup timestamp for 12h. Check initial backup failures, metric resets, and schedule pause state. This signal requires an observed schedule status; it cannot detect a schedule that was never delivered.
        runbook_url: https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md
        correlationId: userJourneyBackupNeverSucceeded/never-success/ns-never
