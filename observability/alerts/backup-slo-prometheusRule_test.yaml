    exp_alerts: []
# ========================================
# StorageAvailability: 3 schedules on one MC, 3 distinct HostedClusters, all
# failed their last run - PROXY signal for a BSL outage. Guarded by the >= 3
# distinct-HostedCluster floor (backup:hostedcluster_count:count).
# ========================================
- interval: 1m
  name: storage_three_hostedclusters_fail
  input_series:
  - series: 'velero_backup_last_status{cluster="mgmt-1", schedule="ns-a-6-hourly"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-1", schedule="ns-b-6-hourly"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-1", schedule="ns-c-6-hourly"}'
    values: "0+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero backups failing fleet-wide - possible storage location outage"
        description: "Over 80% of observed Velero 6-hourly schedules on management cluster mgmt-1 had a failed last run, sustained for 15m, across at least 3 distinct HostedClusters on mgmt-1. PROXY signal for a BackupStorageLocation outage (no direct BSL-phase metric exists yet - see ARO-29949); also fires for other fleet-wide causes (e.g. a bad Velero/plugin rollout) - check `kubectl get backupstoragelocation -n velero` on the MC before assuming it is specifically storage. Paused schedules retain their last status; verify pause state before interpreting this ratio as active failures."
        runbook_url: "https://github.com/Azure/ARO-HCP/blob/main/docs/backups.md"
# ========================================
# StorageAvailability: only 1 schedule failing on an otherwise-healthy MC with
# just that 1 schedule total - must not fire (single-HC problem, not
# fleet-wide; also below the >= 3 distinct-HostedCluster guard).
# ========================================
- interval: 1m
  name: storage_single_hostedcluster_guard
  input_series:
  - series: 'velero_backup_last_status{cluster="mgmt-2", schedule="ns-a-6-hourly"}'
    values: "0+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# StorageAvailability: regression test for the schedule-count vs.
# HostedCluster-count fix. ONE HostedCluster with all 3 of its own cadences
# (6-hourly/daily/weekly) failing - 3 schedules, but only 1 distinct
# hosted_cluster_namespace. Under the old raw-schedule-count guard this would
# have incorrectly looked like 3 HCs and fired; gating on distinct
# HostedCluster count correctly keeps this as a single-HC problem.
# ========================================
- interval: 1m
  name: storage_one_hostedcluster_three_cadences
  input_series:
  - series: 'velero_backup_last_status{cluster="mgmt-3", schedule="ns-x-6-hourly"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-3", schedule="ns-x-daily"}'
    values: "0+0x20"
  - series: 'velero_backup_last_status{cluster="mgmt-3", schedule="ns-x-weekly"}'
    values: "0+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# StorageAvailability: mixed-cadence dilution regression test. 3 distinct
# HostedClusters, each with all 3 schedules (6-hourly/daily/weekly) - only the
# 6-hourly schedule has failed on each (a storage outage just started); daily
# and weekly still show their old pre-outage success since their own cron
# hasn't ticked again yet. Before restricting sli:backup:last_run_failure:
# ratio5m to 6-hourly-only, this would read 3 failed / 9 total = 33%, well
# under the 0.8 threshold, and could delay detection by up to a week waiting
# for weekly to also fail. Scoped to 6-hourly, it correctly fires.
# ========================================
- interval: 1m
  name: storage_mixed_cadence_outage
