# ========================================
# Overload (ARO-29950): Queue & Accumulation alerts modeled on ROSA-HCP's
# OADP observability doc (threshold/duration values match that doc).
# These are count-based (how many distinct Backup/DeleteBackupRequest CRs
# match a label combination), unlike every other alert in this file, which
# is rate/ratio/gauge-based - genuinely hitting 300/100 requires that many
# distinct synthetic CRs. To get both a "right at the threshold, must not
# fire" and a "over it, must fire" proof without needing 300+301 separate
# series, the 301st CR's info series is simply absent for the test's first
# 50m (as if not yet created) then appears - letting one input_series set
# cover both boundaries by moving the eval_time, not the series count.
# ========================================
