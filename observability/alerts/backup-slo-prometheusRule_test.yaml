        correlationId: "userJourneyBackupDeletionQueueBacklog/del-overload-mc"
# ========================================
# NonTerminalBacklog: same combined boundary+breach trick as QueueBacklog -
# 100 Backup CRs already stuck in Finalizing (a genuinely in-flight,
# non-terminal phase - NOT Failed/PartiallyFailed/FailedValidation, which
# are deliberately excluded from this alert's counted set, see the
# TTL-duplication regression test below) from t=0, plus a 101st that only
# reaches Finalizing partway through the test (its phase="Finalizing"
# series is absent for the first 50m). Proves both "exactly 100, must not
# fire" and "101 sustained past for:1h, must fire" from one input_series
# set.
#
# Also includes "ambiguous-0101": a single CR whose two HA Prometheus
# replicas permanently disagree on phase (replica 0 reports InProgress,
# replica 1 reports Completed) - simulating a scrape caught mid-transition.
# This is a regression test for a bug caught in PR #7764 review: an
# earlier version of this alert's expr subtracted each benign phase
# separately (`count(phase="Completed") - count(phase="InProgress") - ...`)
# rather than as a set, so a single such CR was subtracted TWICE (once per
# phase it appeared under) instead of once - at this test's scale that
# would have silently turned the correct 101-stuck/breach result into 100
# (not > 100), wrongly suppressing the alert. With the current set-based
# `unless` formula, ambiguous-0101 is excluded exactly once regardless of
# how many benign-phase rows it produced, so the 115m assertion below
# still correctly fires on exactly 101 genuinely-stuck CRs.
# ========================================
- interval: 5m
  name: overload_nonterminal_backlog_boundary_and_breach
  input_series:
  - series: 'veleroBackup_info{cluster="stuck-mc", name="backup-0000", namespace="ns-stuck"}'
