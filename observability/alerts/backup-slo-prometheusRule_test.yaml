# ========================================
# Formula unit checks at small scale (promql_expr_test, not alert_rule_test
# - these assert the computed VALUE directly, independent of the 300/100
# alert thresholds, to pin the arithmetic itself cheaply):
#   - QueueBacklog's enqueued-count correctly dedups HA Prometheus replicas
#     (2 CRs x 2 replicas = 4 raw info series must still count as 2, not 4).
#   - NonTerminalBacklog's set-based exclusion correctly excludes Completed/
#     InProgress/queued CRs - including a CR whose replicas disagree on
#     which benign phase it's in - and counts only the genuinely-stuck one.
# ========================================
- interval: 1m
  name: overload_formula_unit_checks
  input_series:
  - series: 'veleroBackup_info{cluster="formula-mc", name="dedup-a", namespace="ns-f", prometheus_replica="0"}'
    values: "1x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="dedup-a", namespace="ns-f", prometheus_replica="1"}'
    values: "1x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="dedup-b", namespace="ns-f", prometheus_replica="0"}'
    values: "1x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="dedup-b", namespace="ns-f", prometheus_replica="1"}'
    values: "1x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="completed-a", namespace="ns-f"}'
    values: "1x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="completed-a", namespace="ns-f", phase="Completed"}'
    values: "1x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="inprogress-a", namespace="ns-f"}'
    values: "1x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="inprogress-a", namespace="ns-f", phase="InProgress"}'
    values: "1x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="queued-a", namespace="ns-f"}'
    values: "1x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="queued-a", namespace="ns-f", phase="New"}'
    values: "1x10"
  # queued-a's StateSet zero-valued siblings - a real KSM StateSet
  # metric emits one row per `list` entry for any CR with phase resolved,
  # so a genuinely-New CR ALSO emits these at value 0, not just its own
  # "New"=1 row. Without the `== 1` filter on the exclusion's right-hand
  # side, a label-only match on "InProgress" would hit this zero-valued
  # row and wrongly treat queued-a as already-active.
  - series: 'veleroBackup_phase{cluster="formula-mc", name="queued-a", namespace="ns-f", phase="InProgress"}'
    values: "0x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="queued-a", namespace="ns-f", phase="Completed"}'
    values: "0x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="stuck-a", namespace="ns-f"}'
    values: "1x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="stuck-a", namespace="ns-f", phase="Finalizing"}'
    values: "1x10"
  # stuck-a's StateSet zero-valued siblings - same fan-out as queued-a
  # above, this is the exact scenario Copilot review flagged on PR #7764:
  # a stuck Backup still emits Completed=0/InProgress=0 rows, and
  # without `== 1` a label-only match on those rows would wrongly
  # exclude a genuinely-stuck CR from userJourneyBackupNonTerminalBacklog.
  # Uses "Finalizing" rather than "Failed" so this formula-level check
  # exercises a phase userJourneyBackupNonTerminalBacklog actually counts
  # as stuck - Failed/PartiallyFailed/FailedValidation are deliberately
  # excluded from that alert's counted set (see
  # nonterminal_backlog_excludes_ttl_bound_terminal_phases earlier in
  # this file), so a Failed fixture here would silently test an
  # exclusion predicate the real alert no longer uses.
  - series: 'veleroBackup_phase{cluster="formula-mc", name="stuck-a", namespace="ns-f", phase="Completed"}'
    values: "0x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="stuck-a", namespace="ns-f", phase="InProgress"}'
    values: "0x10"
  - series: 'veleroBackup_info{cluster="formula-mc", name="ambiguous-a", namespace="ns-f"}'
    values: "1x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="ambiguous-a", namespace="ns-f", phase="InProgress", prometheus_replica="0"}'
    values: "1x10"
  - series: 'veleroBackup_phase{cluster="formula-mc", name="ambiguous-a", namespace="ns-f", phase="Completed", prometheus_replica="1"}'
    values: "1x10"
  promql_expr_test:
  # dedup-a and dedup-b are each reported by both HA replicas (2 enqueued
  # CRs, 4 raw series) - proving group by (cluster, name, namespace)
  # collapses the replica duplication rather than double-counting it.
  # queued-a has an explicit phase="New" row (phase-bearing, not merely
  # absent) PLUS its StateSet zero-valued InProgress/Completed siblings,
  # and must still survive the subtraction - proving (a) the
  # `phase!~"New|Queued|ReadyToStart"` filter correctly treats a
  # still-queued phase the same as no phase at all (the bug Copilot
  # review flagged first on PR #7764: phase-bearing queued Backups were
  # invisible to both this alert and userJourneyBackupNonTerminalBacklog),
  # and (b) the trailing `== 1` keeps queued-a's zero-valued
  # "InProgress"=0 sibling row from being label-matched into the excluded
  # set and wrongly treated as already-active (the second bug Copilot
  # review flagged, once the StateSet fan-out was accounted for).
  # Expected count: dedup-a + dedup-b + queued-a = 3.
  - expr: |
      count by (cluster) (
        group by (cluster, name, namespace) (veleroBackup_info)
        unless on (cluster, name, namespace)
        group by (cluster, name, namespace) (veleroBackup_phase{phase!~"New|Queued|ReadyToStart"} == 1)
      )
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="formula-mc"}'
      value: 3
  # Of the 5 CRs with a phase set (completed-a/inprogress-a/queued-a/
  # stuck-a/ambiguous-a), only stuck-a (Finalizing) should survive the
  # exclusion - must read 1, proving Completed/InProgress/New are
  # actually excluded rather than merely counted as "has some phase".
  # The right-hand regex here is kept in sync with
  # userJourneyBackupNonTerminalBacklog's actual exclusion set
  # (Completed|InProgress|New|Queued|ReadyToStart|Failed|PartiallyFailed|
  # FailedValidation) - a Copilot review finding on PR #7764 caught an
  # earlier version of this check still using the pre-TTL-fix regex
  # (without the trailing three terminal phases), which silently tested
  # an exclusion predicate the deployed alert no longer uses.
  # ambiguous-a's two replicas disagree (one reports InProgress, the
  # other Completed) - it must still count as exactly one excluded CR,
  # not escape exclusion and not get subtracted twice. This is the
  # formula-level regression check for the double-subtraction bug caught
  # in PR #7764 review (see the fuller alert-threshold version of this
  # same regression in overload_nonterminal_backlog_boundary_and_breach
  # above, using "ambiguous-0101"). stuck-a's zero-valued
  # Completed=0/InProgress=0 StateSet siblings must NOT cause it to be
  # label-matched into the excluded set either - without the trailing
  # `== 1`, this is exactly the second bug Copilot review caught: a
  # stuck Backup's own zero-valued benign-phase rows would wrongly
  # exclude it, making the left-hand presence set's unfiltered (no
  # `== 1`) label match the only thing distinguishing "phase resolved at
  # all" from "phase resolved to something benign".
  - expr: |
      count by (cluster) (
        group by (cluster, name, namespace) (veleroBackup_phase)
        unless on (cluster, name, namespace)
        group by (cluster, name, namespace) (veleroBackup_phase{phase=~"Completed|InProgress|New|Queued|ReadyToStart|Failed|PartiallyFailed|FailedValidation"} == 1)
      )
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="formula-mc"}'
      value: 1
