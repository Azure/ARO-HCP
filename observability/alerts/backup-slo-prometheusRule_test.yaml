# ========================================
# Errors: single tier, >0.5% failed-attempt share. The ratio is computed
# directly from the counters regardless of how much history exists (same
# reasoning as the delayed-completion test below), so a sustained 1% failure
# share is already "true" well before a full 6h of data accumulates - what
# actually gates firing is the `for: 30m` hold, not the window length.
# ========================================
- interval: 1m
  name: errors_breach
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+100x60"
  - series: 'velero_backup_success_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+99x60"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x60"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x60"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x60"
  alert_rule_test:
  # Ratio is already above 0.5% from the first minute, but `for: 30m` has
  # not elapsed yet - still pending, not firing.
  - eval_time: 10m
    alertname: userJourneyBackupErrors
    exp_alerts: []
  # 30m+ of continuous breach - firing.
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on mgmt-1"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Errors: delayed-failure regression test. A batch of attempts lands at t=0;
# failures complete ~10m later (matching the real 10m pre-hook timeout in
# internal/backup/backup.go:88), outside that attempt's own narrow slice.
# Computing the ratio from completed outcomes over the full 6h window (not an
# attempt-denominator short window) still catches this once `for: 30m`
# elapses after the failures land.
# ========================================
- interval: 1m
  name: errors_delayed_completion
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0 50+0x80"
  - series: 'velero_backup_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+0x9 4+0x71"
  - series: 'velero_backup_partial_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x81"
  - series: 'velero_backup_validation_failure_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x81"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on mgmt-1"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Errors volume guard: ratio breaches the threshold (100% failures) but only
# 2 attempts in the 6h window - below the >= 5 floor. The alert must NOT
# fire despite the high error ratio. Evaluated at 40m (not 6h30m): by 6h30m
# the counter increments at minute 2 have aged out of the 6h rate() window
# entirely, making the ratio 0/0 (NaN) - that would pass even with the
# volume guard removed, so it wouldn't actually exercise the guard. At 40m
# the 100% failure ratio is still in-window and the for:30m hold has
# elapsed, so the volume floor is the only thing preventing this from firing.
# ========================================
- interval: 1m
  name: errors_below_volume_floor
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0 0 2+0x400"
  - series: 'velero_backup_failure_total{cluster="mgmt-10", schedule="ns-low-vol-6-hourly"}'
    values: "0 0 2+0x400"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Errors: fires then recovers once outcomes return to all-success. Because
# the ratio is a rate() over a full 6h window, the failing minutes (0-370m)
# only fully roll out of the window once the window's start passes t=370m,
# i.e. at t=370+360=730m (12h10m) - recovery is checked comfortably after
# that, not immediately once successes resume.
# ========================================
- name: errors_fires_then_recovers_with_successes
  interval: 1m
  input_series:
  - series: velero_backup_attempt_total{cluster="recovery-errors", schedule="ns-a-6-hourly"}
    values: 0+100x780
  - series: velero_backup_success_total{cluster="recovery-errors", schedule="ns-a-6-hourly"}
    values: 0+99x370 36630+100x410
  - series: velero_backup_failure_total{cluster="recovery-errors", schedule="ns-a-6-hourly"}
    values: 0+1x370 370x410
  alert_rule_test:
  - eval_time: 6h20m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: recovery-errors
        component: slo
        severity: '3'
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on recovery-errors"
        description: "Velero backup failed-attempt share on management cluster recovery-errors is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 13h
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Errors: a schedule outside the three recurring cadences (e.g. a one-off
# key-rotation backup, named "<namespace>-keyrotation-<timestamp>" by
# backend/pkg/controllers/cluster/backups/key_rotation_controller.go) is
# excluded from the SLI population entirely, even while failing at 100%.
# Only the recurring-cadence schedule on the same cluster is counted, and
# it's healthy, so no alert fires.
# ========================================
- name: errors_excludes_non_cadence_schedule
  interval: 1m
  input_series:
  - series: velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-a-keyrotation-20261020"}
    values: 0+10x60
  - series: velero_backup_failure_total{cluster="mgmt-1", schedule="ns-a-keyrotation-20261020"}
    values: 0+10x60
  - series: velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-a-6-hourly"}
    values: 0+100x60
  - series: velero_backup_success_total{cluster="mgmt-1", schedule="ns-a-6-hourly"}
    values: 0+100x60
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Latency: p99 duration stuck above 20 minutes (1200s) over a 6h window,
# sustained for 15m. All observations land in (1200,1800] (a finite bucket,
# not the +Inf overflow) so histogram_quantile can interpolate a concrete
# estimate.
# ========================================
- interval: 1m
  name: latency_breach
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="1200"}'
    values: "0x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="1800"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+2x450"
  alert_rule_test:
  - eval_time: 6h15m
    alertname: userJourneyBackupLatency
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupLatency
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-latency
      exp_annotations:
        summary: "Velero backup p99 duration above SLO (>20m) on mgmt-1"
        description: "Velero backup p99 duration on management cluster mgmt-1 is above 20 minutes over a 6h window, sustained for 15m (SLO: p99 < 20m, inside the 10m CSI snapshot / 15m item-operation timeouts). Same recurring-cadence scope and >=5 completed-backup volume floor as userJourneyBackupErrors, so a single slow backup can't swing the p99 on its own."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Latency: a single very slow backup alone pushes histogram_quantile(0.99,...)
# over 1200s, but the >=5 completed-backup volume floor (same pattern as
# userJourneyBackupErrors) holds the alert pending - one data point isn't
# enough to trust a p99 estimate.
# ========================================
- interval: 1m
  name: latency_single_sample_below_volume_floor
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="1200"}'
    values: "0x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="1800"}'
    values: "0x349 1x101"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0x349 1x101"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0x349 1x101"
  alert_rule_test:
  - eval_time: 6h15m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Latency: healthy p99 well under 20m - no alert.
# ========================================
- interval: 1m
  name: latency_healthy
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="300"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+2x450"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+2x450"
  alert_rule_test:
  - eval_time: 6h15m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Latency: mixed-duration, unequal-volume regression test (firing case). A
# high-volume fast schedule (50/min at ~50s, all <=60s) runs alongside a
# low-volume slow schedule (2/min at ~1700s, in (60,1800]). Slow share of
# total volume is 2/52 ~= 3.8%, comfortably over 1%, so the TRUE
# volume-weighted p99 interpolates to ~1348s - above the 1200s SLO.
# Aggregating bucket rates over the full window before one histogram_quantile
# call catches this (averaging two independently-computed 5m p99 values
# could miss it entirely).
# ========================================
- interval: 1m
  name: latency_mixed_volumes_breach
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="60"}'
    values: "0+50x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="1800"}'
    values: "0+50x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="+Inf"}'
    values: "0+50x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-few-slow-6-hourly", le="1800"}'
    values: "0+2x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-few-slow-6-hourly", le="+Inf"}'
    values: "0+2x50"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-many-fast-6-hourly"}'
    values: "0+50x50"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-few-slow-6-hourly"}'
    values: "0+2x50"
  alert_rule_test:
  - eval_time: 45m
    alertname: userJourneyBackupLatency
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupLatency
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-latency
      exp_annotations:
        summary: "Velero backup p99 duration above SLO (>20m) on mgmt-1"
        description: "Velero backup p99 duration on management cluster mgmt-1 is above 20 minutes over a 6h window, sustained for 15m (SLO: p99 < 20m, inside the 10m CSI snapshot / 15m item-operation timeouts). Same recurring-cadence scope and >=5 completed-backup volume floor as userJourneyBackupErrors, so a single slow backup can't swing the p99 on its own."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Latency: mixed-duration, unequal-volume regression test (non-firing case).
# Same shape, but the slow share drops to 1/201 ~= 0.5%, under the 1% mark -
# the 99th-percentile rank now falls entirely within the fast le="60" bucket,
# so the true p99 stays well under 60s and must not fire.
# ========================================
- interval: 1m
  name: latency_mixed_volumes_healthy
  input_series:
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="60"}'
    values: "0+200x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="1800"}'
    values: "0+200x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-many-fast-6-hourly", le="+Inf"}'
    values: "0+200x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-few-slow-6-hourly", le="1800"}'
    values: "0+1x50"
  - series: 'velero_backup_duration_seconds_bucket{cluster="mgmt-1", schedule="ns-few-slow-6-hourly", le="+Inf"}'
    values: "0+1x50"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-many-fast-6-hourly"}'
    values: "0+200x50"
  - series: 'velero_backup_duration_seconds_count{cluster="mgmt-1", schedule="ns-few-slow-6-hourly"}'
    values: "0+1x50"
  alert_rule_test:
  - eval_time: 45m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Traffic: after a day of activity, sustained near-zero attempts must fire.
# The recent window spans 12h (two six-hour production intervals), then the
# condition must hold for another hour. Evaluate at 39h with margin.
# ========================================
- interval: 1m
  name: traffic_sustained_collapse
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x1440 1440+0.004x900"
  alert_rule_test:
  - eval_time: 39h
    alertname: userJourneyBackupTraffic
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupTraffic
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-traffic
      exp_annotations:
        summary: "Velero backup attempts collapsed below 10% of 1d baseline on mgmt-1"
        description: "Velero backup attempt rate on management cluster mgmt-1 is below 10% of its 1-day average, sustained across a 12h window for 1h. Likely a global/per-cluster backup-schedule pause (check backend.backupScheduleState and per-cluster admin API state before paging further), the Backup Schedule Controller stuck, or kube-applier delivery broken - not an individual HC's problem."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Traffic: healthy synchronized six-hour bursts, with constant counters
# between them. Check near the end of the quiet gap before the next burst;
# a two-hour observation window would incorrectly fire here.
# ========================================
- interval: 1m
  name: traffic_healthy_six_hour_bursts
  input_series:
  - series: 'velero_backup_attempt_total{cluster="mgmt-1", schedule="ns-hc1-6-hourly"}'
    values: "0 60x359 120x359 180x359 240x359 300x359 360x359"
  alert_rule_test:
  - eval_time: 35h
    alertname: userJourneyBackupTraffic
    exp_alerts: []
- name: traffic_six_hour_bursts_stop_and_recover
  interval: 1m
  input_series:
  - series: velero_backup_attempt_total{cluster="traffic-recovery", schedule="ns-a-6-hourly"}
    values: 0 60x359 120x359 180x359 240x899 300x179
  alert_rule_test:
  - eval_time: 23h
    alertname: userJourneyBackupTraffic
    exp_alerts: []
  - eval_time: 32h
    alertname: userJourneyBackupTraffic
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupTraffic
        cluster: traffic-recovery
        component: slo
        severity: '4'
        slo: backup-traffic
      exp_annotations:
        summary: "Velero backup attempts collapsed below 10% of 1d baseline on traffic-recovery"
        description: "Velero backup attempt rate on management cluster traffic-recovery is below 10% of its 1-day average, sustained across a 12h window for 1h. Likely a global/per-cluster backup-schedule pause (check backend.backupScheduleState and per-cluster admin API state before paging further), the Backup Schedule Controller stuck, or kube-applier delivery broken - not an individual HC's problem."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 34h
    alertname: userJourneyBackupTraffic
    exp_alerts: []
# ========================================
# StorageAvailability: the real Velero BSL gauge reports the default location
# unavailable for >15m - fires directly off velero_backup_location_status_gauge,
# no proxy or HostedCluster-count guard needed. `max by (cluster)` drops the
# backup_location_name label from the resulting alert (collapsed away by the
# HA-replica dedup aggregation below), so exp_labels no longer carries it.
# ========================================
- interval: 1m
  name: storage_location_unavailable
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-1", backup_location_name="default"}'
    values: "0x20"
  alert_rule_test:
  - eval_time: 14m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero default BackupStorageLocation unavailable on mgmt-1"
        description: "The default Velero BackupStorageLocation on management cluster mgmt-1 has reported unavailable for 15m. Check `kubectl get backupstoragelocation -n velero` and the underlying Azure Blob storage account/credentials on the MC."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# StorageAvailability: healthy BSL (gauge = 1) must never fire.
# ========================================
- interval: 1m
  name: storage_location_available
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-2", backup_location_name="default"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# StorageAvailability: HA-replica dedup. Two `prometheus_replica` series
# for the same cluster, one reporting
# unavailable (0) and one reporting available (1) throughout - `max by
# (cluster)` must take the conservative max (1), so this must NEVER fire
# even though a naive `== 0` on the raw gauge would match the bad replica.
# ========================================
- interval: 1m
  name: storage_location_ha_replica_disagreement
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-3", backup_location_name="default", prometheus_replica="0"}'
    values: "0x20"
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-3", backup_location_name="default", prometheus_replica="1"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# StorageAvailability: HA-replica dedup, both replicas unavailable. Must
# fire exactly ONCE per cluster (single exp_alerts entry), not once per
# prometheus_replica series.
# ========================================
- interval: 1m
  name: storage_location_ha_replica_both_down
  input_series:
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-4", backup_location_name="default", prometheus_replica="0"}'
    values: "0x20"
  - series: 'velero_backup_location_status_gauge{cluster="mgmt-4", backup_location_name="default", prometheus_replica="1"}'
    values: "0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: mgmt-4
        component: slo
        severity: "3"
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero default BackupStorageLocation unavailable on mgmt-4"
        description: "The default Velero BackupStorageLocation on management cluster mgmt-4 has reported unavailable for 15m. Check `kubectl get backupstoragelocation -n velero` and the underlying Azure Blob storage account/credentials on the MC."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# StorageAvailability: fires while unavailable, then recovers once the BSL
# controller reports availability again.
# ========================================
- name: storage_location_outage_then_recovery
  interval: 1m
  input_series:
  - series: velero_backup_location_status_gauge{cluster="storage-recovery", backup_location_name="default"}
    values: 0x20 1x19
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupStorageAvailability
        cluster: storage-recovery
        component: slo
        severity: '3'
        slo: backup-storage-availability
      exp_annotations:
        summary: "Velero default BackupStorageLocation unavailable on storage-recovery"
        description: "The default Velero BackupStorageLocation on management cluster storage-recovery has reported unavailable for 15m. Check `kubectl get backupstoragelocation -n velero` and the underlying Azure Blob storage account/credentials on the MC."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 23m
    alertname: userJourneyBackupStorageAvailability
    exp_alerts: []
# ========================================
# MetricsAbsent: a management cluster is in the underlay inventory but has
# no successful Velero server scrape (Velero itself, its PodMonitor, or the
# metrics pipeline is down). Cluster name follows the real
# {env}-{region}-mgmt-{stamp} production convention (config.yaml) so it
# actually matches the alert's cluster=~".*-mgmt-.*" filter.
# ========================================
- interval: 1m
  name: metrics_missing_server
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-mgmt-1", source="bicep"}'
    values: "1+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupMetricsAbsent
        cluster: int-eastus-mgmt-1
        component: slo
        severity: "3"
        slo: backup-metrics-absent
      exp_annotations:
        summary: "no successful Velero server metrics scrape for 15m on int-eastus-mgmt-1"
        description: "Management cluster int-eastus-mgmt-1 is in the underlay-cluster inventory but has had no successful Velero server metrics scrape for 15m. Check Velero, its PodMonitor, and the management-cluster metrics pipeline. A healthy empty cluster with up=1 is not a failure merely because it has no backup attempts."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# A service cluster absent from the inventory filter must never fire - svc
# clusters never run Velero/HostedCluster backups.
- interval: 1m
  name: metrics_service_cluster_excluded
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-svc-1", source="bicep"}'
    values: "1+0x20"
  alert_rule_test:
  - eval_time: 17m
    alertname: userJourneyBackupMetricsAbsent
    exp_alerts: []
# A management cluster with a successful server scrape must not fire, even if
# it is also in the inventory.
- interval: 1m
  name: metrics_healthy_server
  input_series:
  - series: 'underlay_clusters{cluster="int-eastus-mgmt-1", source="bicep"}'
    values: "1+0x20"
  - series: 'velero_backup_attempt_total{cluster="int-eastus-mgmt-1", schedule="ns-a-6-hourly"}'
    values: "0+1x20"
  - series: 'up{cluster="int-eastus-mgmt-1", namespace="velero", pod="velero-server-1"}'
    values: "1x20"
  alert_rule_test:
  - eval_time: 17m
