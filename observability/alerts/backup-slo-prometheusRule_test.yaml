        summary: "more than 300 DeleteBackupRequest CRs are enqueued (not yet started) on del-overload-mc"
        description: "Management cluster del-overload-mc has more than 300 DeleteBackupRequest CRs with no status.phase set yet (enqueued, not yet picked up by Velero), sustained for 30m. Velero processes deletions sequentially, so a sustained backlog this large indicates Velero is stuck or deletion requests are accumulating faster than they can drain - check the Velero server logs/pod health before assuming individual HostedClusters are at fault."
