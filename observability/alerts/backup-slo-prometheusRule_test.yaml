    alertname: userJourneyBackupNonTerminalBacklog
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupNonTerminalBacklog
        cluster: stuck-mc
        component: slo
        severity: "4"
      exp_annotations:
        summary: "more than 100 Backup CRs are stuck mid-processing on stuck-mc"
        description: "Management cluster stuck-mc has more than 100 Backup CRs stuck in a non-terminal, non-queued, non-failed phase - e.g. Finalizing, WaitingForPluginOperations, or Deleting - sustained for 1h. Terminal phases (Failed/PartiallyFailed/FailedValidation) are excluded here since they just await TTL cleanup and are already covered by userJourneyBackupErrors at the time of failure; this alert indicates a systemic issue requiring manual CR triage/purge rather than a transient blip - check `kubectl get backups -A` phase distribution on the management cluster."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupNonTerminalBacklog/stuck-mc"
# ========================================
# NonTerminalBacklog TTL/duplication regression: 101 Backup CRs sitting in
# Failed (terminal, TTL-bound - 30/90 days per Velero's default backup TTL
# handling) for the entire window - comfortably above the 100 threshold and
# sustained well past for:1h. Must NOT fire: Failed/PartiallyFailed/
# FailedValidation are excluded from this alert's counted set specifically so
# a single incident's worth of failed backups doesn't keep this alert firing
# for weeks until TTL garbage collection, duplicating userJourneyBackupErrors
# (which already caught the failure rate at the time it happened). Without
# the Failed/PartiallyFailed/FailedValidation exclusion, this exact input
# would wrongly fire (101 > 100). Flagged in review on PR #7764 before this
# exclusion was added.
# ========================================
