apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: service-memory-resources-rules
  namespace: monitoring
spec:
  groups:
  - name: service-memory-resources-rules
    labels:
      component: service-memory
    rules:
    # Owner: Service Lifecycle team (hcp-sl)
    # AROSLSRE-1564: Generic memory/CPU drift/trend alerting for all ARO-HCP services
    # Only containers with a configured request will match the join;
    # services without a request are naturally excluded.
    #
    # Drift alerts compare the 30-minute AVERAGE usage/request ratio (not
    # instantaneous usage) against 1.2x, and fire only after that average has
    # been sustained for 5 minutes. A count_over_time data-guard requires at
    # least 30 minutes of samples so we never alert on partial/warm-up data.
    - alert: ServiceMemoryDrift
      expr: |
        (
          avg_over_time(
            (
              max by(namespace, pod, container, cluster) (
                container_memory_working_set_bytes{container!="", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}
              )
              / on(namespace, pod, container, cluster) group_left()
              max by(namespace, pod, container, cluster) (
                kube_pod_container_resource_requests{resource="memory", job="kube-state-metrics", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}
              )
            )[30m:1m]
          ) > 1.2
        )
        and on(namespace, pod, container, cluster)
        (
          count_over_time(
            max by(namespace, pod, container, cluster) (
              container_memory_working_set_bytes{container!="", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}
            )[30m:1m]
          ) >= 30
        )
      for: 5m
      labels:
        severity: warning
        team: hcp-sl
      annotations:
        summary: '{{ $labels.container }} in {{ $labels.namespace }} exceeds 1.2x its memory request on cluster {{ $labels.cluster }}. pod:{{ $labels.pod }}'
        description: |
          Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) on cluster {{ $labels.cluster }} has averaged {{ $value | humanizePercentage }} of its memory request over the last 30 minutes.
          This may indicate a memory leak or workload growth that requires right-sizing the request in config.yaml.
        runbook_url: https://github.com/Azure/ARO-HCP/blob/main/docs/alerts/service-memory-resources.md
        owning_team: hcp-sl
    - alert: ServiceCPUDrift
      expr: |
        (
          avg_over_time(
            (
              max by(namespace, pod, container, cluster) (
                rate(container_cpu_usage_seconds_total{container!="", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}[5m])
              )
              / on(namespace, pod, container, cluster) group_left()
              max by(namespace, pod, container, cluster) (
                kube_pod_container_resource_requests{resource="cpu", job="kube-state-metrics", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}
              )
            )[30m:1m]
          ) > 1.2
        )
        and on(namespace, pod, container, cluster)
        (
          count_over_time(
            max by(namespace, pod, container, cluster) (
              rate(container_cpu_usage_seconds_total{container!="", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}[5m])
            )[30m:1m]
          ) >= 30
        )
      for: 5m
      labels:
        severity: warning
        team: hcp-sl
      annotations:
        summary: '{{ $labels.container }} in {{ $labels.namespace }} exceeds 1.2x its CPU request on cluster {{ $labels.cluster }}. pod:{{ $labels.pod }}'
        description: |
          Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) on cluster {{ $labels.cluster }} has averaged {{ $value | humanizePercentage }} of its CPU request over the last 30 minutes.
          This may indicate workload growth that requires right-sizing the request in config.yaml.
        runbook_url: https://github.com/Azure/ARO-HCP/blob/main/docs/alerts/service-memory-resources.md
        owning_team: hcp-sl
    - alert: ServiceMemoryTrend
      expr: |
        (
          predict_linear(
            container_memory_working_set_bytes{container!="", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}[6h], 4 * 3600
          )
          / on(namespace, pod, container, cluster) group_left()
          max by(namespace, pod, container, cluster) (
            kube_pod_container_resource_requests{resource="memory", job="kube-state-metrics", namespace=~"aro-hcp|aro-hcp-admin-api|aro-hcp-exporter|arobit|clusters-service|fleet|kube-applier|maestro|mgmt-agent|monitoring|prometheus|secret-sync-controller|sessiongate"}
          )
        ) > 2.0
      for: 30m
      labels:
        severity: info
        team: hcp-sl
      annotations:
        summary: '{{ $labels.container }} in {{ $labels.namespace }} memory trending toward 2x its request on cluster {{ $labels.cluster }}. pod:{{ $labels.pod }}'
        description: |
          Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) on cluster {{ $labels.cluster }} memory is growing steadily.
          At the current rate over the past 6 hours, it will exceed 2x its memory request within 4 hours.
          Investigate for potential memory leaks or increased workload.
        runbook_url: https://github.com/Azure/ARO-HCP/blob/main/docs/alerts/service-memory-resources.md
        owning_team: hcp-sl
