rule_files:
- hypershiftUserJourneyRecord-prometheusRule.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  name: "Journey availability sli ratios"
  input_series:
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-1", cluster="mc1", pod="cpo-a", prometheus_replica="r1"}'
    values: "1+0x100"
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-2", cluster="mc1", pod="cpo-b", prometheus_replica="r1"}'
    values: "0+0x100"
  promql_expr_test:
  - expr: hypershift_kube_apiserver_available:sli_sum_5m / hypershift_kube_apiserver_available:sli_count_5m
    eval_time: 30m
    exp_samples:
    - labels: '{namespace="ocm-prefix-1", cluster="mc1"}'
      value: 1
    - labels: '{namespace="ocm-prefix-2", cluster="mc1"}'
      value: 0
  - expr: hypershift_kube_apiserver_available:sli_count_5m
    eval_time: 5m
    exp_samples: []
- interval: 1m
  name: "Control Plane Operator ratios"
  input_series:
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", controller="x", result="success", cluster="mc1", prometheus_replica="r1"}'
    values: "0+10x100"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", controller="x", result="error", cluster="mc1", prometheus_replica="r1"}'
    values: "0+0x100"
  promql_expr_test:
  - expr: hypershift:cpo:reconcile_error:ratio_rate5m
    eval_time: 30m
    exp_samples:
    - labels: 'hypershift:cpo:reconcile_error:ratio_rate5m{cluster="mc1", namespace="ocm-prefix-1"}'
      value: 0
- interval: 1m
  name: "Zero denominators produce no sample, never NaN or +Inf"
  # spec=0 (scaled down) and idle CPO (no reconciles).
  input_series:
  - series: 'kube_deployment_status_replicas_available{deployment="control-plane-operator", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "0+0x100"
  - series: 'kube_deployment_spec_replicas{deployment="control-plane-operator", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "0+0x100"
  - series: 'controller_runtime_reconcile_total{pod="control-plane-operator-abc", controller="x", result="success", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "5+0x100"
  - series: 'controller_runtime_reconcile_time_seconds_bucket{pod="control-plane-operator-abc", controller="x", le="10", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "5+0x100"
  - series: 'controller_runtime_reconcile_time_seconds_count{pod="control-plane-operator-abc", controller="x", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "5+0x100"
  promql_expr_test:
  - expr: hypershift:cpo:replica_availability:ratio
    eval_time: 30m
    exp_samples: []
  - expr: hypershift:cpo:reconcile_error:ratio_rate5m
    eval_time: 30m
    exp_samples: []
  - expr: hypershift:cpo:reconcile_error:ratio_rate3d
    eval_time: 30m
    exp_samples: []
  - expr: hypershift:cpo:reconcile_slow:ratio_rate5m
    eval_time: 30m
    exp_samples: []
  - expr: hypershift:cpo:reconcile_slow:ratio_rate3d
    eval_time: 30m
    exp_samples: []
  - expr: hypershift:cpo:saturation_signal
    eval_time: 30m
    exp_samples: []
  - expr: hypershift:cpo:saturated
    eval_time: 30m
    exp_samples: []
- interval: 1m
  name: "CPO saturation is workqueue depth only, with the deployed requests-only resources"
  # Matches the pinned CPO deployment asset: requests 10m CPU / 80Mi, no
  # limits. Usage is far above requests (0.2 cores, ~300Mi), which is normal
  # and must not read as saturated. Depth crosses 100 only from 30m.
  input_series:
  - series: 'process_cpu_seconds_total{pod="control-plane-operator-abc", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "0+12x60"
  - series: 'process_resident_memory_bytes{pod="control-plane-operator-abc", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "314572800+0x60"
  - series: 'kube_pod_container_resource_requests{resource="cpu", unit="core", pod="control-plane-operator-abc", container="control-plane-operator", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "0.01+0x60"
  - series: 'kube_pod_container_resource_requests{resource="memory", unit="byte", pod="control-plane-operator-abc", container="control-plane-operator", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "83886080+0x60"
  - series: 'workqueue_depth{name="hcp", pod="control-plane-operator-abc", namespace="ocm-prefix-1", cluster="mc1", prometheus_replica="r1"}'
    values: "5+0x29 500+0x30"
  promql_expr_test:
  - expr: hypershift:cpo:saturation_signal
    eval_time: 20m
    exp_samples:
    - labels: 'hypershift:cpo:saturation_signal{cluster="mc1", namespace="ocm-prefix-1", signal="workqueue_depth"}'
      value: 0
  - expr: hypershift:cpo:saturated
    eval_time: 20m
    exp_samples:
    - labels: 'hypershift:cpo:saturated{cluster="mc1", namespace="ocm-prefix-1"}'
      value: 0
  - expr: hypershift:cpo:saturated
    eval_time: 40m
    exp_samples:
    - labels: 'hypershift:cpo:saturated{cluster="mc1", namespace="ocm-prefix-1"}'
      value: 1
