apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hcp-etcd-grpc-latency-alerts
  namespace: prometheus
spec:
  groups:
  - name: hcp-etcd-grpc-latency-alerts
    labels:
      component: etcd
    rules:
    # Require at least 1,000 operations in each window so the P99 tail represents
    # roughly ten observations, not a handful of slow requests on an idle cluster.
    # Count operations via the +Inf bucket, not scrapes or all cumulative buckets.
    # increase() estimates window volume; these guards do not require full history.
    #
    # Medium and slow alerts add a 5m freshness guard (> 0 operations in the last
    # 5 minutes) to suppress firing on deleted clusters whose long lookback windows
    # still retain historical samples. The fast alert's 5m volume guard (>= 1000)
    # already implies freshness, so no separate check is needed.
    # etcd gRPC read latency (Range operations) — MWMBR alerts
    # P99 > 500ms threshold. Range is the primary KAS read operation to etcd.
    - alert: userJourneyEtcdReadLatencyP991h5m
      expr: |
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Range",
                namespace=~"ocm-.*"
              }[1h])
            )
          ) > 0.5
        )
        and
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Range",
                namespace=~"ocm-.*"
              }[5m])
            )
          ) > 0.5
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[1h])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[5m])
          ) >= 1000
        )
      for: 2m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: etcd-grpc-read-latency
      annotations:
        summary: "[userJourneyEtcdReadLatencyP99] {{ $labels.cluster }} / {{ $labels.namespace }} P99 > 500ms (1h/5m)"
        description: |
          etcd gRPC Range (read) P99 latency has exceeded 500ms in both the 1h and 5m windows.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-etcd
        correlationId: "userJourneyEtcdReadLatencyP99/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyEtcdReadLatencyP996h30m
      expr: |
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Range",
                namespace=~"ocm-.*"
              }[6h])
            )
          ) > 0.5
        )
        and
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Range",
                namespace=~"ocm-.*"
              }[30m])
            )
          ) > 0.5
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[6h])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[30m])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[5m])
          ) > 0
        )
      for: 5m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: etcd-grpc-read-latency
      annotations:
        summary: "[userJourneyEtcdReadLatencyP99] {{ $labels.cluster }} / {{ $labels.namespace }} P99 > 500ms (6h/30m)"
        description: |
          etcd gRPC Range (read) P99 latency has exceeded 500ms in both the 6h and 30m windows.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-etcd
        correlationId: "userJourneyEtcdReadLatencyP99/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyEtcdReadLatencyP993d6h
      expr: |
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Range",
                namespace=~"ocm-.*"
              }[3d])
            )
          ) > 0.5
        )
        and
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Range",
                namespace=~"ocm-.*"
              }[6h])
            )
          ) > 0.5
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[3d])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[6h])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Range",
              namespace=~"ocm-.*",
              le="+Inf"
            }[5m])
          ) > 0
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "4"
        slo: etcd-grpc-read-latency
      annotations:
        summary: "[userJourneyEtcdReadLatencyP99] {{ $labels.cluster }} / {{ $labels.namespace }} P99 > 500ms (3d/6h)"
        description: |
          etcd gRPC Range (read) P99 latency has exceeded 500ms over 3d/6h windows.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-etcd
        correlationId: "userJourneyEtcdReadLatencyP99/{{ $labels.cluster }}/{{ $labels.namespace }}"
    # etcd gRPC write latency (Txn operations) — MWMBR alerts
    # Txn is the primary KAS write operation to etcd.
    - alert: userJourneyEtcdWriteLatencyP991h5m
      expr: |
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Txn",
                namespace=~"ocm-.*"
              }[1h])
            )
          ) > 0.5
        )
        and
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Txn",
                namespace=~"ocm-.*"
              }[5m])
            )
          ) > 0.5
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[1h])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[5m])
          ) >= 1000
        )
      for: 2m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: etcd-grpc-write-latency
      annotations:
        summary: "[userJourneyEtcdWriteLatencyP99] {{ $labels.cluster }} / {{ $labels.namespace }} P99 > 500ms (1h/5m)"
        description: |
          etcd gRPC Txn (write) P99 latency has exceeded 500ms in both the 1h and 5m windows.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-etcd
        correlationId: "userJourneyEtcdWriteLatencyP99/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyEtcdWriteLatencyP996h30m
      expr: |
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Txn",
                namespace=~"ocm-.*"
              }[6h])
            )
          ) > 0.5
        )
        and
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Txn",
                namespace=~"ocm-.*"
              }[30m])
            )
          ) > 0.5
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[6h])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[30m])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[5m])
          ) > 0
        )
      for: 5m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: etcd-grpc-write-latency
      annotations:
        summary: "[userJourneyEtcdWriteLatencyP99] {{ $labels.cluster }} / {{ $labels.namespace }} P99 > 500ms (6h/30m)"
        description: |
          etcd gRPC Txn (write) P99 latency has exceeded 500ms in both the 6h and 30m windows.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-etcd
        correlationId: "userJourneyEtcdWriteLatencyP99/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyEtcdWriteLatencyP993d6h
      expr: |
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Txn",
                namespace=~"ocm-.*"
              }[3d])
            )
          ) > 0.5
        )
        and
        (
          histogram_quantile(0.99,
            sum by (namespace, cluster, le) (
              rate(grpc_server_handling_seconds_bucket{
                grpc_service="etcdserverpb.KV",
                grpc_method="Txn",
                namespace=~"ocm-.*"
              }[6h])
            )
          ) > 0.5
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[3d])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[6h])
          ) >= 1000
        )
        and on (namespace, cluster)
        (
          sum by (namespace, cluster) (
            increase(grpc_server_handling_seconds_bucket{
              grpc_service="etcdserverpb.KV",
              grpc_method="Txn",
              namespace=~"ocm-.*",
              le="+Inf"
            }[5m])
          ) > 0
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "4"
        slo: etcd-grpc-write-latency
      annotations:
        summary: "[userJourneyEtcdWriteLatencyP99] {{ $labels.cluster }} / {{ $labels.namespace }} P99 > 500ms (3d/6h)"
        description: |
          etcd gRPC Txn (write) P99 latency has exceeded 500ms over 3d/6h windows.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-etcd
        correlationId: "userJourneyEtcdWriteLatencyP99/{{ $labels.cluster }}/{{ $labels.namespace }}"
