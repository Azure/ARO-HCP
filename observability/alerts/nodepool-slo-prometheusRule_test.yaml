rule_files:
- nodepool-slo-prometheusRule.yaml
- nodepool-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Test 4: Stuck operation — operation in "updating" for > 2 hours
# ========================================
# start_time is 0 (epoch). At eval_time=150m (9000s), delta = 9000 > 7200 threshold.
# The alert has for: 15m, so it fires after the threshold is crossed for 15 minutes.
# Threshold crossed at 120m, plus 15m for duration = 135m. Eval at 150m confirms firing.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/3/np/stuck", subscription_id="sub-3", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1"}'
    values: "0+0x155"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/3/np/stuck", subscription_id="sub-3", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1"}'
    values: "1+0x155"
  alert_rule_test:
  # At 150m (9000s), time() - 0 = 9000 > 7200, and for: 15m is satisfied
  - eval_time: 150m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "update"
        phase: "updating"
        resource_id: "/sub/3/np/stuck"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-3"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/3/np/stuck stuck in updating for over 2 hours"
        description: "Node pool operation for /sub/3/np/stuck has been in updating phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# ========================================
# Test 5: No stuck operation — operation in "updating" for < 2 hours
# ========================================
# Operation started recently, should not trigger stuck alert.
- interval: 1m
  input_series:
  # start_time=600 (recent). At eval_time=90m, time()=5400. delta=4800 < 7200.
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/4/np/recent", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1"}'
    values: "600+0x95"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/4/np/recent", subscription_id="sub-4", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1"}'
    values: "1+0x95"
  alert_rule_test:
  - eval_time: 90m
    alertname: UJNodePoolStuckOperation
# ========================================
# Test 7: Queue depth — workqueue depth exceeds threshold
# ========================================
- interval: 1m
  input_series:
  - series: 'workqueue_depth{namespace="aro-hcp", name="OperationNodePoolUpdate", cluster="mgmt-1"}'
    values: "15+0x10"
  alert_rule_test:
  - eval_time: 7m
    alertname: UJNodePoolSaturationQueueDepth
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        name: "OperationNodePoolUpdate"
        severity: info
      exp_annotations:
        summary: "mgmt-1: Node Pool controller workqueue OperationNodePoolUpdate depth is high"
        description: "Node pool controller workqueue OperationNodePoolUpdate has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# ========================================
# Test 8: Queue depth normal — below threshold, no alert
# ========================================
- interval: 1m
  input_series:
  - series: 'workqueue_depth{namespace="aro-hcp", name="OperationNodePoolUpdate", cluster="mgmt-1"}'
    values: "5+0x10"
  alert_rule_test:
  - eval_time: 7m
    alertname: UJNodePoolSaturationQueueDepth
# ========================================
# Test 12: Stuck delete operation
# ========================================
# Verifies that delete operations stuck for >2h also trigger the alert.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/7/np/stuck-del", subscription_id="sub-7", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="delete", phase="deleting", cluster="mgmt-1"}'
    values: "0+0x155"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/7/np/stuck-del", subscription_id="sub-7", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="delete", phase="deleting", cluster="mgmt-1"}'
    values: "1+0x155"
  alert_rule_test:
  - eval_time: 150m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/7/np/stuck-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-7"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/7/np/stuck-del stuck in deleting for over 2 hours"
        description: "Node pool operation for /sub/7/np/stuck-del has been in deleting phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# ========================================
# Test 13: Stuck delete that flaps (backend retry resets start_time)
# ========================================
# A genuinely-wedged delete stays in "deleting" the whole time, but the backend
# retries the operation at t=240m and resets
# backend_resource_operation_start_time_seconds, so (time() - start_time) briefly
# drops below the 7200s threshold (raw condition false for t=240..360m). The
# max_over_time(...[6h:]) hold must keep the SAME alert firing across this gap so a
# continuously-stuck resource maps to a single long-lived IcM incident instead of a
# fresh incident every few hours.
- interval: 1m
  input_series:
  # phase stays "deleting" throughout
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/8/np/flap-del", subscription_id="sub-8", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="delete", phase="deleting", cluster="mgmt-1"}'
    values: "1+0x480"
  # start_time=0 until t=239m (age crosses 7200s at t=120m); backend retries at
  # t=240m so start_time jumps to 14400s and age re-crosses 7200s only at t=360m.
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/8/np/flap-del", subscription_id="sub-8", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="delete", phase="deleting", cluster="mgmt-1"}'
    values: "0+0x239 14400+0x240"
  alert_rule_test:
  # Raw condition true (age 9000s > 7200s) → firing.
  - eval_time: 150m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/8/np/flap-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-8"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/8/np/flap-del stuck in deleting for over 2 hours"
        description: "Node pool operation for /sub/8/np/flap-del has been in deleting phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
  # Raw condition FALSE here (start_time reset → age < 7200s) but the resource is
  # still wedged. The 6h hold keeps the same alert firing → no resolve, no duplicate.
  - eval_time: 300m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/8/np/flap-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-8"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/8/np/flap-del stuck in deleting for over 2 hours"
        description: "Node pool operation for /sub/8/np/flap-del has been in deleting phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
  # Raw condition true again after re-crossing 7200s — still one continuous alert.
  - eval_time: 470m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/8/np/flap-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-8"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/8/np/flap-del stuck in deleting for over 2 hours"
        description: "Node pool operation for /sub/8/np/flap-del has been in deleting phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# ========================================
# Test 14: Stuck delete completes — alert clears after the 6h hold
# ========================================
# The resource is wedged (deleting) through t=150m, then the operation completes
# (phase_info flips to 0). The 6h hold keeps the alert firing for a while (still
# firing at t=300m) but it resolves once there has been no stuck sample for 6h (not
# firing at t=520m). Confirms the stickiness is bounded and does not fire forever.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/9/np/done-del", subscription_id="sub-9", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="delete", phase="deleting", cluster="mgmt-1"}'
    values: "1+0x150 0+0x400"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/9/np/done-del", subscription_id="sub-9", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="delete", phase="deleting", cluster="mgmt-1"}'
    values: "0+0x551"
  alert_rule_test:
  # Within the 6h hold after the last stuck sample (t=150m) → still firing.
  - eval_time: 300m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        operation_type: "delete"
        phase: "deleting"
        resource_id: "/sub/9/np/done-del"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-9"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/9/np/done-del stuck in deleting for over 2 hours"
        description: "Node pool operation for /sub/9/np/done-del has been in deleting phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
  # 6h after the last stuck sample (150m + 360m = 510m) the hold expires → resolved.
  - eval_time: 520m
    alertname: UJNodePoolStuckOperation
# ========================================
# Test 15: Stuck operation fires for all subscriptions at YAML level
# ========================================
# Filtering of internal subscriptions happens in the generated bicep (via
# the generator-injected `unless` clause), not in the source YAML. This test
# confirms the source expression fires for an e2e subscription, proving that
# promtool validates the unfiltered logic correctly.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/e2e/np/stuck", subscription_id="00000000-0000-0000-0000-000000000001", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1"}'
    values: "0+0x155"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/e2e/np/stuck", subscription_id="00000000-0000-0000-0000-000000000001", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1"}'
    values: "1+0x155"
  alert_rule_test:
  - eval_time: 150m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        alertname: UJNodePoolStuckOperation
        resource_id: /sub/e2e/np/stuck
        subscription_id: "00000000-0000-0000-0000-000000000001"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        operation_type: update
        phase: updating
        cluster: mgmt-1
        severity: info
        component: slo
        exclude_internal_subscriptions: "true"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/e2e/np/stuck stuck in updating for over 2 hours"
        description: "Node pool operation for /sub/e2e/np/stuck has been in updating phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# ========================================
# Test 16: Duplicate stuck series across a volatile label collapse into one alert
# ========================================
# The same wedged node pool is scraped as two series that differ only by a volatile
# label (here `instance`, but the same applies to pod/prometheus_replica). Without
# the `max by (...)` aggregation this would fan out into two identical IcM incidents
# for a single stuck resource. The aggregation drops the volatile label, so both
# series collapse into a single output series and exactly one alert fires (with no
# `instance` label carried through). The routing labels in the `max by (...)`
# allowlist (`environment`, `region`) are identical across the duplicates and must
# survive the aggregation, so they are carried through to the single output alert.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/10/np/dup", subscription_id="sub-10", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1", environment="int", region="uksouth", instance="prom-a"}'
    values: "0+0x155"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/10/np/dup", subscription_id="sub-10", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1", environment="int", region="uksouth", instance="prom-a"}'
    values: "1+0x155"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/sub/10/np/dup", subscription_id="sub-10", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1", environment="int", region="uksouth", instance="prom-b"}'
    values: "0+0x155"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/10/np/dup", subscription_id="sub-10", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="updating", cluster="mgmt-1", environment="int", region="uksouth", instance="prom-b"}'
    values: "1+0x155"
  alert_rule_test:
  # Two duplicate series in → exactly one alert out (instance dropped; environment/region preserved).
  - eval_time: 150m
    alertname: UJNodePoolStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: "mgmt-1"
        component: slo
        environment: "int"
        operation_type: "update"
        phase: "updating"
        region: "uksouth"
        resource_id: "/sub/10/np/dup"
        resource_type: "microsoft.redhatopenshift/hcpopenshiftclusters/nodepools"
        severity: info
        exclude_internal_subscriptions: "true"
        subscription_id: "sub-10"
      exp_annotations:
        summary: "mgmt-1: Node Pool operation for /sub/10/np/dup stuck in updating for over 2 hours"
        description: "Node pool operation for /sub/10/np/dup has been in updating phase for over 2 hours. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# ========================================
# Windowed error alert tests (stateless, last_transition-windowed)
# ========================================
# Acute burst: 4 failed + 1 succeeded node pool ops all reach terminal at t=85m,
# so from t=85m the in-1h-window ratio is 4/5 = 0.8 (>0.72) with failed_1h = 4
# (>= floor 3). By eval 95m the condition has held 10m (> for: 5m), so it fires.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np1", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np1", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np2", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np2", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np3", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np3", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np4", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np4", phase="failed"}'
    values: "_x85 5100x115"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np5", phase="succeeded"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np5", phase="succeeded"}'
    values: "_x85 5100x115"
  alert_rule_test:
  - eval_time: 95m
    alertname: UJNodePoolErrorBurst1h
    exp_alerts:
    - exp_labels:
        alertname: UJNodePoolErrorBurst1h
        cluster: mgmt-1
        component: slo
        severity: info
        slo: nodepool-errors
        long_window: 1h
        short_window: 5m
      exp_annotations:
        summary: "mgmt-1: Node Pool operations failing fast (>72% of recent operations)"
        description: "More than 72% of completed node pool operations (update/delete) on mgmt-1 failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-nodepool"
# Volume guard: a single recent failed node pool op (ratio 100% but one failure)
# must NOT fire, because failed_1h < 3 and the 6h/3d completion floors are unmet.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np1", phase="failed"}'
    values: "_x85 1x115"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/np1", phase="failed"}'
    values: "_x85 5100x115"
  alert_rule_test:
  - eval_time: 95m
    alertname: UJNodePoolErrorBurst1h
  - eval_time: 95m
    alertname: UJNodePoolErrorBurst6h
  - eval_time: 95m
    alertname: UJNodePoolErrorBudget3d
# Medium burn (6h) positive: 3 failed + 2 succeeded node pool ops reach terminal ~2h
# ago (ltt at 40m), so from 40m they sit in the 6h window; by 100m they age out of
# the 1h window. total_6h = 5 (>= 5) and error_rate_6h = 0.6 (> 0.30). The alert
# holds for 30m, so it is still pending at 60m and firing by 140m, while the 1h
# tier stays silent once the failures leave the 1h window.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6f1", phase="failed"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6f1", phase="failed"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6f2", phase="failed"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6f2", phase="failed"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6f3", phase="failed"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6f3", phase="failed"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6s1", phase="succeeded"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6s1", phase="succeeded"}'
    values: "_x40 2400x101"
  - series: 'backend_resource_operation_phase_info{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6s2", phase="succeeded"}'
    values: "_x40 1x101"
  - series: 'backend_resource_operation_last_transition_time_seconds{cluster="mgmt-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", subscription_id="sub-1", resource_id="/w6s2", phase="succeeded"}'
    values: "_x40 2400x101"
  promql_expr_test:
  - expr: errors:backend_nodepool_operation:failed_6h
    eval_time: 140m
    exp_samples:
    - labels: 'errors:backend_nodepool_operation:failed_6h{cluster="mgmt-1"}'
      value: 3
  - expr: errors:backend_nodepool_operation:total_6h
    eval_time: 140m
    exp_samples:
    - labels: 'errors:backend_nodepool_operation:total_6h{cluster="mgmt-1"}'
      value: 5
