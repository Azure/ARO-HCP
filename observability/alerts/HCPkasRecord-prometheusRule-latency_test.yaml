rule_files:
- HCPkasRecord-prometheusRule-latency.yaml
evaluation_interval: 1m
tests:
# Test 1: Termination rate — non-zero with terminations, namespace filtered
- interval: 1m
  input_series:
  - series: 'apiserver_request_terminations_total{cluster="test-mgmt-5", namespace="ocm-aro-test-05"}'
    values: "0+10x15"
  - series: 'apiserver_request_terminations_total{cluster="test-mgmt-5", namespace="kube-system"}'
    values: "0+100x15"
  promql_expr_test:
  - expr: kas:apiserver_request_terminations:rate5m{cluster="test-mgmt-5", namespace="ocm-aro-test-05"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="kas:apiserver_request_terminations:rate5m", cluster="test-mgmt-5", namespace="ocm-aro-test-05"}'
      value: 0.16666666666666666
  - expr: kas:apiserver_request_terminations:rate5m{cluster="test-mgmt-5", namespace="kube-system"}
    eval_time: 5m
    exp_samples: []
# Test 2: In-flight request saturation — smoothed gauge by request_kind
- interval: 1m
  input_series:
  - series: 'apiserver_current_inflight_requests{cluster="test-mgmt-6", namespace="ocm-aro-test-06", request_kind="mutating"}'
    values: "10+0x15"
  - series: 'apiserver_current_inflight_requests{cluster="test-mgmt-6", namespace="ocm-aro-test-06", request_kind="readOnly"}'
    values: "20+0x15"
  promql_expr_test:
  - expr: kas:apiserver_inflight_requests:avg_5m{cluster="test-mgmt-6", namespace="ocm-aro-test-06", request_kind="mutating"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="kas:apiserver_inflight_requests:avg_5m", cluster="test-mgmt-6", namespace="ocm-aro-test-06", request_kind="mutating"}'
      value: 10
  - expr: kas:apiserver_inflight_requests:avg_5m{cluster="test-mgmt-6", namespace="ocm-aro-test-06", request_kind="readOnly"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="kas:apiserver_inflight_requests:avg_5m", cluster="test-mgmt-6", namespace="ocm-aro-test-06", request_kind="readOnly"}'
      value: 20
