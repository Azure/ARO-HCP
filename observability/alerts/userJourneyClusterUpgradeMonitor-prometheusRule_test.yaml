  - series: 'backend_cluster_upgrade_monitoring_enabled{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1"}'
    values: "1x80"
  promql_expr_test:
  - expr: hosted_control_plane_upgrade:stuck:bool
    eval_time: 50m
    exp_samples:
