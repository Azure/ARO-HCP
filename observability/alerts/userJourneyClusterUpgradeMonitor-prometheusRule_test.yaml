rule_files:
- userJourneyClusterUpgrade-recordingRule.yaml
- userJourneyClusterUpgradeMonitor-prometheusRule.yaml
evaluation_interval: 1m
group_eval_order:
- arohcp_user_journey_cluster_upgrade_recording_rules
- rp-user-journey-cluster-upgrade-monitor-rules-v2
tests:
- name: superseded versions and lifecycle resolution
  interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.41", state="completed"}'
    values: "1x80"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.42", state="partial"}'
    values: "1x80"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.43", state="partial"}'
    values: "1x80"
  - series: 'backend_cluster_upgrade_target_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.43"}'
    values: "1x80"
  - series: 'backend_cluster_upgrade_monitoring_enabled{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1"}'
    values: "1x45 0x35"
  promql_expr_test:
  - expr: hosted_control_plane_upgrade:stuck:bool
    eval_time: 30m
    exp_samples:
    - labels: &monitorLabels 'hosted_control_plane_upgrade:stuck:bool{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1"}'
      value: 0
  - expr: hosted_control_plane_upgrade:stuck:bool
    eval_time: 40m
    exp_samples:
    - labels: *monitorLabels
      value: 1
  - expr: hosted_control_plane_upgrade:stuck:bool
    eval_time: 50m
    exp_samples:
    - labels: *monitorLabels
      value: 0
  alert_rule_test:
  - eval_time: 35m
    alertname: userJourneyClusterUpgradeStuck
    exp_alerts: []
  - eval_time: 40m
    alertname: userJourneyClusterUpgradeStuck
    exp_alerts:
    - exp_labels: &stuckLabels
        alertname: userJourneyClusterUpgradeStuck
        cluster: svc-1
        resource_id: /sub/1/rg/c1
        subscription_id: sub-1
        severity: "4"
        slo: cluster-upgrade
        component: slo
      exp_annotations: &stuckAnnotations
        summary: "svc-1: Cluster upgrade on /sub/1/rg/c1 is stuck"
        description: |
          The cluster version change (upgrade or rollback) has not converged. The target exceeded 20 minutes in desired or 30 minutes in progress, with a further 5-minute alert pending window. This cluster-level condition remains active across target and phase changes until the current observed targets complete or deletion/uninstallation is confirmed. Inspect backend_cluster_version_info and backend_cluster_upgrade_target_info for version details.
          Service Cluster: svc-1
        runbook_url: https://aka.ms/arohcp-runbook-cluster-upgrade
        correlationId: userJourneyClusterUpgradeStuck/svc-1/sub/1/rg/c1
  - eval_time: 50m
    alertname: userJourneyClusterUpgradeStuck
    exp_alerts: []
- name: deletion cancels pending alert
  interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.41", state="completed"}'
    values: "1x50"
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.43", state="partial"}'
    values: "1x50"
  - series: 'backend_cluster_upgrade_target_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.43"}'
    values: "1x50"
  - series: 'backend_cluster_upgrade_monitoring_enabled{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1"}'
    values: "1x33 0x17"
  promql_expr_test:
  - expr: hosted_control_plane_upgrade:stuck:bool
    eval_time: 34m
    exp_samples:
    - labels: *monitorLabels
      value: 0
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyClusterUpgradeStuck
    exp_alerts: []
- name: current completion overrides historical and stale same-version partial
  interval: 1m
  input_series:
  - series: 'backend_cluster_version_info{cluster="svc-1", resource_id="/sub/1/rg/c1", subscription_id="sub-1", cluster_uuid="uuid-1", version="4.20.41", state="completed"}'
