apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: userjourney-kubeapiserver-availability-kms-systemic-failure-alerts
  namespace: prometheus
spec:
  groups:
  - name: rp-userjourney-kas-kms-systemic-failure-rules
    labels:
      component: slo
    rules:
    # Closes a gap in the per-cluster KMS exclusion (UserJourneyKubeApiserverAvailabilityAlertExclusions-prometheusRule-KSM.yaml): many clusters failing KMS together is a shared Azure/ARO problem, not a per-customer one, and today nothing notifies anyone of it.
    # Notify-only, not page-and-fix -- there's no per-cluster remediation, just confirm blast radius and declare an incident if it's real.
    # Aggregated by management cluster, not fleet-wide, to stay correlatable in ICM and distinguishable from a single customer's bad day.
    # Ratio + absolute floor together guard against one customer's BYOK failure looking systemic on a management cluster with few clusters.
    # Only status="False" counts as failing (matching the is_customer_caused exclusion's scope), NOT status="Unknown".
    # Unlike the burn-rate SLI, ValidAzureKMSConfig=Unknown is not a transient/reconciling state here: per the
    # control-plane-operator (validateAzureKMSConfig), Unknown is also the permanent, by-design status for (a) any
    # hosted cluster without Azure KMS configured at all (spec.secretEncryption.kms.azure is nil) and (b) ARO HCP
    # clusters using a private Key Vault, since CPO cannot reach a private endpoint directly (only KAS pods can, via
    # the private router). Both populations can be a large, permanent fraction of any management cluster's fleet, so
    # treating Unknown as failing would make this alert fire continuously on such clusters and never resolve --
    # the opposite of the "notify on a real, confirmable incident" contract this alert exists for.
    # The denominator is also restricted to status=~"True|False" (excluding Unknown), not the raw
    # hosted-cluster population: Unknown clusters are structurally unmeasurable for KMS health (no
    # KMS configured, or a private Key Vault the control-plane-operator can't probe), so counting
    # them toward the total dilutes the ratio with clusters that can never contribute to the
    # numerator either. A fleet skewed toward private-KV/no-KMS clusters could otherwise have its
    # entire observable population in False and still never cross the ratio threshold.
    # Both the failing count and the total count go through the same max by (...) == 1
    # dedup (matching the is_customer_caused recording rule in the exclusions file) so a
    # hosted cluster is counted once per side of the ratio regardless of duplicate series.
    # Each side also carries the same 15m offset blackout gate as HCPkasRecord-prometheusRule-KSM.yaml
    # (`(hostedClusterAPI_valid_azure_kms_config offset 15m) >= 0`): a hosted cluster only
    # contributes to the numerator or denominator once its KMS condition has been reported for
    # at least 15 minutes. Without it, a burst of newly-provisioned clusters -- whose KMS config
    # is still reconciling, not actually broken -- can look like a majority outage on a
    # management cluster with few other clusters.
    - alert: userJourneyKubeApiserverAvailabilityKmsSystemicFailure
      expr: |
        (
          count by (cluster) (
            max by (name, namespace, _id, resource_id, cluster) (
              hostedClusterAPI_valid_azure_kms_config{status="False"}
              and on (name, namespace, _id, resource_id, cluster)
              max by (name, namespace, _id, resource_id, cluster) ((hostedClusterAPI_valid_azure_kms_config offset 15m) >= 0)
            ) == 1
          )
          /
          count by (cluster) (
            max by (name, namespace, _id, resource_id, cluster) (
              hostedClusterAPI_valid_azure_kms_config{status=~"True|False"}
              and on (name, namespace, _id, resource_id, cluster)
              max by (name, namespace, _id, resource_id, cluster) ((hostedClusterAPI_valid_azure_kms_config offset 15m) >= 0)
            ) == 1
          )
        ) >= 0.75
        and on (cluster)
        count by (cluster) (
          max by (name, namespace, _id, resource_id, cluster) (
            hostedClusterAPI_valid_azure_kms_config{status="False"}
            and on (name, namespace, _id, resource_id, cluster)
            max by (name, namespace, _id, resource_id, cluster) ((hostedClusterAPI_valid_azure_kms_config offset 15m) >= 0)
          ) == 1
        ) >= 3
      # Rides out a brief reconcile blip without delaying real detection too long
      for: 10m
      labels:
        severity: "3"
        slo: kas-availability
        scope: mgmt-cluster
      annotations:
        summary: "[HCPKASAvailableKMSSystemic] Azure KMS failing across hosted clusters on {{ $labels.cluster }}"
        description: "At least three-quarters (minimum 3) of the hosted clusters on management cluster {{ $labels.cluster }} are reporting ValidAzureKMSConfig=False ({{ $value | humanizePercentage }} affected) -- independent customer BYOK failures don't correlate like this, so treat it as a shared Azure dependency failure (management cluster KMS managed identity / IMDS, control-plane-operator rollout, or a regional Key Vault / AAD outage), not a per-customer issue. This is NOT per-cluster actionable: confirm the blast radius and declare an incident if confirmed. Per-cluster KMS failures are already excluded from the userJourneyKubeApiserverAvailability burn-rate alerts; this is the only notification path for the systemic case."
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable-kms-systemic
        correlationId: "userJourneyKubeApiserverAvailabilityKmsSystemicFailure/{{ $labels.cluster }}"
