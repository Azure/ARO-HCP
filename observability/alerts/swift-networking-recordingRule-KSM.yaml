apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: swift-networking-recording-rules
  namespace: prometheus
spec:
  groups:
  # ========================================
  # SWIFT Networking SLO Recording Rules
  # ========================================
  # These rules implement the management-cluster SLI for the SWIFT Networking
  # control plane: all configured router replicas are available.
  #
  # Source: kube-state-metrics on management cluster.
  # Router pods are identified by their ReplicaSet owner (always "router-*"),
  # created by the HyperShift CPO router Deployment.
  #
  # A management cluster is compliant only when every configured router replica is
  # available. Alert for-durations enforce the 300-second notification allowance.
  - name: arohcp_swift_networking_slo_recording_rules
    interval: 1m
    rules:
    # Concrete management-cluster facts across all HCP namespaces. Their ratio
    # is derived in alert and dashboard queries, where its meaning is visible.
    - record: swift_router_replicas:available
      expr: |
        sum by (cluster) (
          max without (prometheus_replica) (
            kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="router"}
          )
        )
    - record: swift_router_replicas:configured
      expr: |
        sum by (cluster) (
          max without (prometheus_replica) (
            kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="router"}
          )
        )
    # Pending age remains per-HCP diagnostic evidence. It is not the formal SLO
    # input because it is emitted only while a router pod remains Pending.
    - record: router:startup_latency:seconds
      expr: |
        (time() - max without (prometheus_replica) (kube_pod_created{namespace=~"ocm-.*"}))
        * on(cluster, namespace, pod) max without (prometheus_replica) (kube_pod_owner{owner_kind="ReplicaSet", owner_name=~"router-.*"})
        * on(cluster, namespace, pod) (max without (prometheus_replica) (kube_pod_status_phase{phase="Pending"}) == 1)
    - record: router:startup_latency:p99
      expr: quantile(0.99, router:startup_latency:seconds) by (cluster, namespace)
  # ========================================
  # Konnectivity Tunnel Diagnostic Recording Rules
  # ========================================
  # Server-side control-stream error and dial-failure diagnostics. These are
  # retained for dashboard/TSG validation; they are not SLO inputs yet.
  # Source: konnectivity-server sidecar in KAS pod (PodMonitor on port 8093).
  - name: arohcp_swift_konnectivity_recording_rules
    interval: 1m
    rules:
    - record: konnectivity:stream_error_rate:5m
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(konnectivity_network_proxy_server_stream_errors_total[5m])
          )
        )
        /
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(konnectivity_network_proxy_server_stream_packets_total[5m])
          )
        )
    # Diagnostic frequency of server-observed dial failures. The upstream
    # counter can increment multiple times per dial request, so this is not a
    # dial-failure probability or SLO error ratio.
    - record: konnectivity:dial_failure_rate:5m
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(konnectivity_network_proxy_server_dial_failure_count[5m])
          )
        )
        /
        (
          sum by (cluster, namespace) (
            max without (prometheus_replica) (
              rate(konnectivity_network_proxy_server_dial_failure_count[5m])
            )
          )
          +
          sum by (cluster, namespace) (
            max without (prometheus_replica) (
              rate(konnectivity_network_proxy_server_stream_packets_total{segment="from_agent", packet_type="DIAL_RSP"}[5m])
            )
          )
        )
