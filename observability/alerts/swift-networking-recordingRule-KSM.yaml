apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: swift-networking-recording-rules
  namespace: prometheus
spec:
  groups:
  # ========================================
  # SWIFT Networking SLO Recording Rules
  # ========================================
  # Router pods are identified by ReplicaSet owner name "router-.*" (HyperShift
  # CPO router Deployment). Raw available/configured counts are recorded here;
  # ratio is computed by the alert/dashboard queries.
  - name: arohcp_swift_networking_slo_recording_rules
    interval: 1m
    rules:
    - record: swift_router_replicas:available
      expr: |
        sum by (cluster) (
          max by (cluster, namespace, deployment) (kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"})
          - clamp_min(
              max by (cluster, namespace, deployment) (kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"})
              - max by (cluster, namespace, deployment) (kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"}),
              0
            )
        )
    - record: swift_router_replicas:configured
      expr: |
        sum by (cluster) (
          max by (cluster, namespace, deployment) (
            kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"}
          )
        )
    # Router replicas missing from an HCP for longer than the 10 minute
    # allowance. A replica counts only after its HCP has been short in eleven
    # consecutive 1m samples (10 minutes), so pod start-up, rollouts, node
    # eviction and AKS auto-repair, which Kubernetes and AKS heal on their
    # own, do not burn the SLO.
    # count_over_time requires the HCP to have existed for the whole window,
    # so a newly created Deployment does not count. The `or` keeps a zero
    # sample for every cluster that has router capacity.
    - record: swift_router_replicas:unavailable_sustained
      expr: |
        sum by (cluster) (
          min_over_time(
            clamp_min(
              max by (cluster, namespace) (kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"})
              - max by (cluster, namespace) (kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"}),
              0
            )[11m:1m]
          )
          and on (cluster, namespace)
          (
            count_over_time(
              (
                clamp_min(
                  max by (cluster, namespace) (kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"})
                  - max by (cluster, namespace) (kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~"ocm-.*", deployment="router"}),
                  0
                ) > 0
              )[11m:1m]
            ) >= 11
          )
        )
        or on (cluster) (0 * swift_router_replicas:configured)
    # SLI event series: 1 for each minute in which any HCP on the management
    # cluster has had a router replica missing for 10 minutes or longer,
    # 0 otherwise. Emitted only while the cluster has router capacity
    # configured, so count_over_time is the number of eligible minutes.
    - record: swift_router_capacity:degraded
      expr: |
        (swift_router_replicas:unavailable_sustained > bool 0)
        and on (cluster)
        (swift_router_replicas:configured > 0)
    # Diagnostic: latency while a router pod is Pending.
    - record: router:startup_latency:seconds
      # KSM rolling updates can expose the same object from old and new targets
      # with different `instance` labels. Collapse to one series per pod before
      # joining, rather than only dropping the Prometheus HA replica label.
      expr: |
        (time() - max by (cluster, namespace, pod, region) (kube_pod_created{job="kube-state-metrics", namespace=~"ocm-.*"}))
        * on(cluster, namespace, pod, region) max by (cluster, namespace, pod, region) (kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet", owner_name=~"router-.*"})
        * on(cluster, namespace, pod, region) (max by (cluster, namespace, pod, region) (kube_pod_status_phase{job="kube-state-metrics", phase="Pending"}) == 1)
    - record: router:startup_latency:p99
      expr: quantile(0.99, router:startup_latency:seconds) by (cluster, namespace, region)
  # ========================================
  # Konnectivity Tunnel Diagnostic Recording Rules
  # ========================================
  # Diagnostic signal from the konnectivity-server sidecar in the KAS pod,
  # named port "konnect-health" (2041).
  - name: arohcp_swift_konnectivity_recording_rules
    interval: 1m
    rules:
    # Keep an absolute error-rate diagnostic even when packet telemetry is
    # absent, which makes the normalized error ratio undefined.
    - record: konnectivity:stream_errors:rate5m
      expr: |
        sum by (cluster, namespace, region) (
          max by (cluster, namespace, region, pod, segment, code, packet_type) (
            rate(konnectivity_network_proxy_server_stream_errors_total[5m])
          )
        )
    - record: konnectivity:stream_error_rate:5m
      expr: |
        (
          sum by (cluster, namespace) (
            max without (prometheus_replica) (
              rate(konnectivity_network_proxy_server_stream_errors_total[5m])
            )
          )
          or on (cluster, namespace, region)
          (
            0 * sum by (cluster, namespace) (
              max without (prometheus_replica) (
                rate(konnectivity_network_proxy_server_stream_packets_total[5m])
              )
            )
          )
        )
        /
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(konnectivity_network_proxy_server_stream_packets_total[5m])
          )
        )
    # The upstream counter can increment multiple times per dial request. Fill a
    # missing counter with zero only when its counterpart has observed traffic.
    - record: konnectivity:dial_failure_rate:5m
      expr: |
        (
          sum by (cluster, namespace) (
            max without (prometheus_replica) (
              rate(konnectivity_network_proxy_server_dial_failure_count[5m])
            )
          )
          or on (cluster, namespace, region)
          (
            0 * sum by (cluster, namespace) (
              max without (prometheus_replica) (
                rate(konnectivity_network_proxy_server_stream_packets_total{segment="from_agent", packet_type="DIAL_RSP"}[5m])
              )
            )
          )
        )
        /
        (
          (
            sum by (cluster, namespace) (
              max without (prometheus_replica) (
                rate(konnectivity_network_proxy_server_dial_failure_count[5m])
              )
            )
            or on (cluster, namespace, region)
            (
              0 * sum by (cluster, namespace) (
                max without (prometheus_replica) (
                  rate(konnectivity_network_proxy_server_stream_packets_total{segment="from_agent", packet_type="DIAL_RSP"}[5m])
                )
              )
            )
          )
          +
          (
            sum by (cluster, namespace) (
              max without (prometheus_replica) (
                rate(konnectivity_network_proxy_server_stream_packets_total{segment="from_agent", packet_type="DIAL_RSP"}[5m])
              )
            )
            or on (cluster, namespace, region)
            (
              0 * sum by (cluster, namespace) (
                max without (prometheus_replica) (
                  rate(konnectivity_network_proxy_server_dial_failure_count[5m])
                )
              )
            )
          )
        )
