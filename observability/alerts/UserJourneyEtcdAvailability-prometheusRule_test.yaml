  - series: 'etcd_network_peer_round_trip_time_seconds_bucket{cluster="test-hcp-cluster",namespace="test-hcp-cluster-healthy",le="+Inf"}'
    values: "0+100x15"
  alert_rule_test:
  - eval_time: 11m
    alertname: userJourneyEtcdPeerRoundTripTimeHigh1h5m
