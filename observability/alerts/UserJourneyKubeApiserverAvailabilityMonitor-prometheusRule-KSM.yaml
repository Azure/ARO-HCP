apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: userjourney-kubeapiserver-availability-alerts
  namespace: prometheus
spec:
  groups:
  - name: rp-userjourney-kas-availability-monitor-rules
    labels:
      component: slo
    rules:
    # Exclusion of known inactionable conditions (registered in
    # UserJourneyKubeApiserverAvailabilityAlertExclusions-prometheusRule-KSM.yaml -- add new
    # exclusions there, not here) is already applied per-sample inside sli_sum_*/sli_count_*
    # themselves, so this alert expression needs no unless clause of its own.
    - alert: userJourneyKubeApiserverAvailability1h5m
      expr: |
        (
          1 - (hostedClusterAPI_kubeapiserver_available:sli_sum_5m_excl_known / hostedClusterAPI_kubeapiserver_available:sli_count_5m_excl_known)
          > (14.4 * (1 - 0.9995))
          and on (name, namespace, _id, resource_id, cluster)
          hostedClusterAPI_kubeapiserver_available:sli_count_5m_excl_known > 3
        )
        and on (name, namespace, _id, resource_id, cluster)
        (
          1 - (hostedClusterAPI_kubeapiserver_available:sli_sum_1h_excl_known / hostedClusterAPI_kubeapiserver_available:sli_count_1h_excl_known)
          > (14.4 * (1 - 0.9995))
          and on (name, namespace, _id, resource_id, cluster)
          hostedClusterAPI_kubeapiserver_available:sli_count_1h_excl_known > 54
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "2"
        slo: kas-availability
      annotations:
        summary: "[HCPKASAvailableBurn] {{ $labels.cluster }} / {{ $labels.namespace }} (1h/5m) resource_id:{{ $labels.resource_id }}"
        description: |
          Resource ID: {{ $labels.resource_id }}
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable
        correlationId: "userJourneyKubeApiserverAvailability/{{ $labels.cluster }}/{{ $labels.namespace }}"
    # sli_sum_30m_excl_known/sli_count_30m_excl_known: userJourneyKubeApiserverAvailabilityRecord-prometheusRule-KSM.yaml
    # sli_sum_6h_excl_known/sli_count_6h_excl_known: HCPkasRecord-prometheusRule-KSM.yaml
    # Every window here carries the _excl_known suffix (alerting-only, exclusion-applied);
    # the kas_golden_signals dashboard charts the raw/unexcluded sli_sum_6h/sli_count_6h instead.
    # Excludes conditions registered in UserJourneyKubeApiserverAvailabilityAlertExclusions-prometheusRule-KSM.yaml -- add new exclusions there, not here.
    - alert: userJourneyKubeApiserverAvailability6h30m
      expr: |
        (
          1 - (hostedClusterAPI_kubeapiserver_available:sli_sum_30m_excl_known / hostedClusterAPI_kubeapiserver_available:sli_count_30m_excl_known)
          > (6 * (1 - 0.9995))
          and on (name, namespace, _id, resource_id, cluster)
          hostedClusterAPI_kubeapiserver_available:sli_count_30m_excl_known > 27
        )
        and on (name, namespace, _id, resource_id, cluster)
        (
          1 - (hostedClusterAPI_kubeapiserver_available:sli_sum_6h_excl_known / hostedClusterAPI_kubeapiserver_available:sli_count_6h_excl_known)
          > (6 * (1 - 0.9995))
          and on (name, namespace, _id, resource_id, cluster)
          hostedClusterAPI_kubeapiserver_available:sli_count_6h_excl_known > 64
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "2"
        slo: kas-availability
      annotations:
        summary: "[HCPKASAvailableBurn] {{ $labels.cluster }} / {{ $labels.namespace }} (6h/30m) resource_id:{{ $labels.resource_id }}"
        description: |
          Resource ID: {{ $labels.resource_id }}
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable
        correlationId: "userJourneyKubeApiserverAvailability/{{ $labels.cluster }}/{{ $labels.namespace }}"
    # sli_sum_3d_excl_known/sli_count_3d_excl_known and sli_sum_6h_excl_known/sli_count_6h_excl_known
    # are recording rules in HCPkasRecord-prometheusRule-KSM.yaml. Every window here carries
    # the _excl_known suffix; the kas_golden_signals dashboard charts the raw/unexcluded
    # sli_sum_6h/sli_count_6h instead.
    # Excludes conditions registered in UserJourneyKubeApiserverAvailabilityAlertExclusions-prometheusRule-KSM.yaml -- add new exclusions there, not here.
    - alert: userJourneyKubeApiserverAvailability3d6h
      expr: |
        (
          1 - (hostedClusterAPI_kubeapiserver_available:sli_sum_6h_excl_known / hostedClusterAPI_kubeapiserver_available:sli_count_6h_excl_known)
          > (1 * (1 - 0.9995))
          and on (name, namespace, _id, resource_id, cluster)
          hostedClusterAPI_kubeapiserver_available:sli_count_6h_excl_known > 64
        )
        and on (name, namespace, _id, resource_id, cluster)
        (
          1 - (hostedClusterAPI_kubeapiserver_available:sli_sum_3d_excl_known / hostedClusterAPI_kubeapiserver_available:sli_count_3d_excl_known)
          > (1 * (1 - 0.9995))
          and on (name, namespace, _id, resource_id, cluster)
          hostedClusterAPI_kubeapiserver_available:sli_count_3d_excl_known > 130
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: kas-availability
      annotations:
        summary: "[HCPKASAvailableBurn] {{ $labels.cluster }} / {{ $labels.namespace }} (3d/6h) resource_id:{{ $labels.resource_id }}"
        description: |
          Resource ID: {{ $labels.resource_id }}
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-ujkasavailable
        correlationId: "userJourneyKubeApiserverAvailability/{{ $labels.cluster }}/{{ $labels.namespace }}"
