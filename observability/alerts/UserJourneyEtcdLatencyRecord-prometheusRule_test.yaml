rule_files:
- UserJourneyEtcdLatencyRecord-prometheusRule.yaml
evaluation_interval: 1m
tests:
# Test 1: Recording rules produce expected P99/P95 values from histogram buckets
- interval: 1m
  name: "Test 1: Recording rules produce expected P99/P95 values"
  input_series:
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="0.005"}'
    values: "0+50x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="0.01"}'
    values: "0+60x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="0.025"}'
    values: "0+70x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="0.05"}'
    values: "0+80x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="0.1"}'
    values: "0+90x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="0.5"}'
    values: "0+100x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="etcdserverpb.KV", namespace="ocm-test-123", cluster="mgmt-1", le="+Inf"}'
    values: "0+100x20"
  promql_expr_test:
  - expr: etcd:grpc_server_handling:latency_p99:rate5m{namespace="ocm-test-123"}
    eval_time: 10m
    exp_samples:
    - labels: '{__name__="etcd:grpc_server_handling:latency_p99:rate5m", namespace="ocm-test-123", cluster="mgmt-1"}'
      value: 4.5999999999999996e-01
  - expr: etcd:grpc_server_handling:latency_p95:rate5m{namespace="ocm-test-123"}
    eval_time: 10m
    exp_samples:
    - labels: '{__name__="etcd:grpc_server_handling:latency_p95:rate5m", namespace="ocm-test-123", cluster="mgmt-1"}'
      value: 2.9999999999999993e-01

# Test 2: Non-etcd gRPC service is excluded from recording rules
- interval: 1m
  name: "Test 2: Non-etcdserverpb traffic excluded from recording rules"
  input_series:
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="other.Service", namespace="ocm-test-exclude", cluster="mgmt-2", le="0.1"}'
    values: "0+90x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="other.Service", namespace="ocm-test-exclude", cluster="mgmt-2", le="0.5"}'
    values: "0+100x20"
  - series: 'grpc_server_handling_seconds_bucket{grpc_service="other.Service", namespace="ocm-test-exclude", cluster="mgmt-2", le="+Inf"}'
    values: "0+100x20"
  promql_expr_test:
  - expr: etcd:grpc_server_handling:latency_p99:rate5m{namespace="ocm-test-exclude"}
    eval_time: 10m
    exp_samples: []
