apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-user-journey-hcp-alerts
  namespace: prometheus
spec:
  # Control Plane Operator threshold alerts - HCP workspace.
  # prometheus.yaml remote-write routes HCP-namespace-backed metrics here.
  # HyperShift Operator alerts live in hypershiftOperatorUserJourney-prometheusRule.yaml
  # (services workspace). Cross-workspace PromQL joins are not possible.
  # Burn-rate alerts are deferred until the shared recordings are live in
  # production, stakeholders approve the targets, and an alert-tester report
  # validates the proposed alerts. KAS alerting is unchanged.
  #
  # Aggregation: per management cluster + HCP namespace (cluster, namespace),
  # so a single unhealthy HCP is never averaged away by healthy neighbours.
  groups:
  # control-plane-operator (CPO) health, one CPO per hosted control plane.
  # Fires when the CPO has no available pods; backend operation alerts cannot
  # catch this while the customer is not making changes. spec=0 (scaled down,
  # hibernating or deleting) does not fire. max by dedupes KSM and HA replicas.
  - name: hypershift-cpo-monitor-rules
    labels:
      component: slo
    rules:
    - alert: userJourneyControlPlaneOperatorAvailabilityDown
      expr: |
        max by (cluster, namespace) (kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="control-plane-operator"}) > 0
        and on (cluster, namespace)
        max by (cluster, namespace) (kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="control-plane-operator"}) == 0
      for: 10m
      labels:
        severity: "3"
        slo: control-plane-operator-availability
        service: control-plane-operator
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator has no available pods"
        description: |
          control-plane-operator has had no available pods for 10 minutes.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorAvailabilityDown/{{ $labels.cluster }}/{{ $labels.namespace }}"
