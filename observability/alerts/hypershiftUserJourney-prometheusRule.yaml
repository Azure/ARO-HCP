apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-user-journey-hcp-alerts
  namespace: prometheus
spec:
  # ========================================
  # HyperShift User Journey SLO Alerts - HCP workspace (ARO-27787)
  # ========================================
  # Only rules whose inputs live in the HCP Azure Monitor workspace belong here.
  # prometheus.yaml remote-write routes any series whose namespace or
  # hostedcontrolplane label matches ocm-<env>* to the HCP workspace, so the
  # control-plane-operator (runs in the per-HCP namespace) is here. HyperShift
  # Operator alerts live in hypershiftOperatorUserJourney-prometheusRule.yaml
  # (services workspace) because the operator runs in the "hypershift"
  # namespace. Cross-workspace PromQL joins are not possible.
  #
  # Journey availability from hypershift_kube_apiserver_available is deferred
  # until that metric is scraped in production and its overlap with
  # HCPKASAvailableBurn is settled. CPO replica availability (99.95%) and
  # Successful Reconciliations (99.9%) have multi-window multi-burn-rate alerts
  # (fast/medium Sev 3, slow Sev 4) backed by
  # recording-rules/hypershiftControlPlaneOperator-recordingRule.yaml; CPO
  # reconcile latency is dashboard-only per the SLO definition. Burn-rate
  # summaries omit {{ $labels.cluster }} because the RP bicep prefixes it.
  #
  # SLO targets are proposed defaults from the ARO-27787 spike, pending
  # confirmation by the SLO owners; promtool tests prove the maths, not the
  # targets.
  #
  # Aggregation: every alert is scoped per management cluster + HCP namespace
  # (cluster, namespace), i.e. one alert per hosted control plane, so a single
  # unhealthy HCP is never averaged away by healthy neighbours on the same MC.
  groups:
  # control-plane-operator (CPO) health, one CPO per hosted control plane.
  # Fires when the CPO has no available pods; backend operation alerts cannot
  # catch this while the customer is not making changes. spec=0 (scaled down,
  # hibernating or deleting) does not fire. max by dedupes KSM and HA replicas.
  - name: hypershift-cpo-monitor-rules
    labels:
      component: slo
    rules:
    - alert: userJourneyControlPlaneOperatorAvailabilityDown
      expr: |
        max by (cluster, namespace) (kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="control-plane-operator"}) > 0
        and on (cluster, namespace)
        max by (cluster, namespace) (kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="control-plane-operator"}) == 0
      for: 10m
      labels:
        severity: "3"
        slo: control-plane-operator-availability
        service: control-plane-operator
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator has no available pods"
        description: |
          control-plane-operator has had no available pods for 10 minutes.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorAvailabilityDown/{{ $labels.cluster }}/{{ $labels.namespace }}"
  # Component Availability: control-plane-operator replicas, proposed SLO 99.95% (budget 0.05%).
  #   Fast 14.4x -> 0.72%, Medium 6x -> 0.3%, Slow 1x -> 0.05% unavailable share.
  # Per hosted control plane (cluster, namespace), so the correlationId is per
  # namespace. Complements userJourneyControlPlaneOperatorAvailabilityDown (no pods for 10m) by catching
  # repeated short outages that consume budget.
  - name: hypershift-cpo-availability-alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyControlPlaneOperatorAvailability1h5m
      expr: |
        avg_over_time(hypershift:cpo:replicas_unavailable:ratio[1h]) > 0.0072
        and on (cluster, namespace)
        avg_over_time(hypershift:cpo:replicas_unavailable:ratio[5m]) > 0.0072
      for: 2m
      labels:
        severity: "3"
        slo: control-plane-operator-availability
        service: control-plane-operator
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator availability burning error budget (14.4x)"
        description: |
          control-plane-operator unavailable replica share is above 0.72% over both the 1h and 5m windows,
          a 14.4x burn of the proposed 99.95% replica availability SLO.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorAvailability1h5m/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyControlPlaneOperatorAvailability6h30m
      expr: |
        avg_over_time(hypershift:cpo:replicas_unavailable:ratio[6h]) > 0.003
        and on (cluster, namespace)
        avg_over_time(hypershift:cpo:replicas_unavailable:ratio[30m]) > 0.003
      for: 15m
      labels:
        severity: "3"
        slo: control-plane-operator-availability
        service: control-plane-operator
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator availability burning error budget (6x)"
        description: |
          control-plane-operator unavailable replica share is above 0.3% over both the 6h and 30m windows,
          a 6x burn of the proposed 99.95% replica availability SLO.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorAvailability6h30m/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyControlPlaneOperatorAvailability3d6h
      expr: |
        avg_over_time(hypershift:cpo:replicas_unavailable:ratio[3d]) > 0.0005
        and on (cluster, namespace)
        avg_over_time(hypershift:cpo:replicas_unavailable:ratio[6h]) > 0.0005
      for: 1h
      labels:
        severity: "4"
        slo: control-plane-operator-availability
        service: control-plane-operator
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator availability burning error budget (1x)"
        description: |
          control-plane-operator unavailable replica share is above 0.05% over both the 3d and 6h windows,
          a 1x burn of the proposed 99.95% replica availability SLO.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorAvailability3d6h/{{ $labels.cluster }}/{{ $labels.namespace }}"
  # Component Errors: control-plane-operator Successful Reconciliations, proposed SLO 99.9% (budget 0.1%).
  #   Fast 14.4x -> 1.44%, Medium 6x -> 0.6%, Slow 1x -> 0.1% result="error" share.
  # Per hosted control plane (cluster, namespace).
  - name: hypershift-cpo-error-alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyControlPlaneOperatorErrors1h5m
      expr: |
        (
          avg_over_time(hypershift:cpo:reconcile_errors:rate5m[1h])
          /
          avg_over_time(hypershift:cpo:reconcile:rate5m[1h])
        ) > 0.0144
        and on (cluster, namespace)
        (
          avg_over_time(hypershift:cpo:reconcile_errors:rate5m[5m])
          /
          avg_over_time(hypershift:cpo:reconcile:rate5m[5m])
        ) > 0.0144
      for: 2m
      labels:
        severity: "3"
        slo: control-plane-operator-reconcile-errors
        service: control-plane-operator
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator reconcile errors burning error budget (14.4x)"
        description: |
          control-plane-operator reconcile error share is above 1.44% over both the 1h and 5m windows,
          a 14.4x burn of the proposed 99.9% Successful Reconciliations SLO.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorErrors1h5m/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyControlPlaneOperatorErrors6h30m
      expr: |
        (
          avg_over_time(hypershift:cpo:reconcile_errors:rate5m[6h])
          /
          avg_over_time(hypershift:cpo:reconcile:rate5m[6h])
        ) > 0.006
        and on (cluster, namespace)
        (
          avg_over_time(hypershift:cpo:reconcile_errors:rate5m[30m])
          /
          avg_over_time(hypershift:cpo:reconcile:rate5m[30m])
        ) > 0.006
      for: 15m
      labels:
        severity: "3"
        slo: control-plane-operator-reconcile-errors
        service: control-plane-operator
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator reconcile errors burning error budget (6x)"
        description: |
          control-plane-operator reconcile error share is above 0.6% over both the 6h and 30m windows,
          a 6x burn of the proposed 99.9% Successful Reconciliations SLO.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorErrors6h30m/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: userJourneyControlPlaneOperatorErrors3d6h
      expr: |
        (
          avg_over_time(hypershift:cpo:reconcile_errors:rate5m[3d])
          /
          avg_over_time(hypershift:cpo:reconcile:rate5m[3d])
        ) > 0.001
        and on (cluster, namespace)
        (
          avg_over_time(hypershift:cpo:reconcile_errors:rate5m[6h])
          /
          avg_over_time(hypershift:cpo:reconcile:rate5m[6h])
        ) > 0.001
      for: 1h
      labels:
        severity: "4"
        slo: control-plane-operator-reconcile-errors
        service: control-plane-operator
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.namespace }}: control-plane-operator reconcile errors burning error budget (1x)"
        description: |
          control-plane-operator reconcile error share is above 0.1% over both the 3d and 6h windows,
          a 1x burn of the proposed 99.9% Successful Reconciliations SLO.
          Management Cluster: {{ $labels.cluster }}
          Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorErrors3d6h/{{ $labels.cluster }}/{{ $labels.namespace }}"
