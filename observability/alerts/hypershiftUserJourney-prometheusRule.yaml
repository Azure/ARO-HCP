apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-user-journey-alerts
  namespace: prometheus
spec:
  groups:
  - name: hypershift-journey-monitor-rules
    labels:
      component: slo
    rules:
    - alert: hypershiftJourneyAvailability1h5m
      expr: |
        (
          (1 - (hypershift_kube_apiserver_available:sli_sum_1h / hypershift_kube_apiserver_available:sli_count_1h)) > (14.4 * (1 - 0.9995))
          and on (namespace, cluster)
          hypershift_kube_apiserver_available:sli_count_1h > 54
        )
        and on (namespace, cluster)
        (
          (1 - (hypershift_kube_apiserver_available:sli_sum_5m / hypershift_kube_apiserver_available:sli_count_5m)) > (14.4 * (1 - 0.9995))
          and on (namespace, cluster)
          hypershift_kube_apiserver_available:sli_count_5m > 3
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-journey-availability
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyAvailabilityBurn] {{ $labels.cluster }} (1h/5m) / {{ $labels.namespace }}"
        description: |
          Hosted control plane API availability is burning error budget at 14.4x over 1h/5m.
          Management Cluster: {{ $labels.cluster }}
          Control Plane Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyAvailability/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: hypershiftJourneyAvailability6h30m
      expr: |
        (
          (1 - (hypershift_kube_apiserver_available:sli_sum_6h / hypershift_kube_apiserver_available:sli_count_6h)) > (6 * (1 - 0.9995))
          and on (namespace, cluster)
          hypershift_kube_apiserver_available:sli_count_6h > 64
        )
        and on (namespace, cluster)
        (
          (1 - (hypershift_kube_apiserver_available:sli_sum_30m / hypershift_kube_apiserver_available:sli_count_30m)) > (6 * (1 - 0.9995))
          and on (namespace, cluster)
          hypershift_kube_apiserver_available:sli_count_30m > 27
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-journey-availability
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyAvailabilityBurn] {{ $labels.cluster }} (6h/30m) / {{ $labels.namespace }}"
        description: |
          Hosted control plane API availability is burning error budget at 6x over 6h/30m.
          Management Cluster: {{ $labels.cluster }}
          Control Plane Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyAvailability/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: hypershiftJourneyAvailability3d6h
      expr: |
        (
          (1 - (hypershift_kube_apiserver_available:sli_sum_3d / hypershift_kube_apiserver_available:sli_count_3d)) > (1 * (1 - 0.9995))
          and on (namespace, cluster)
          hypershift_kube_apiserver_available:sli_count_3d > 130
        )
        and on (namespace, cluster)
        (
          (1 - (hypershift_kube_apiserver_available:sli_sum_6h / hypershift_kube_apiserver_available:sli_count_6h)) > (1 * (1 - 0.9995))
          and on (namespace, cluster)
          hypershift_kube_apiserver_available:sli_count_6h > 64
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: hypershift-journey-availability
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyAvailabilityBurn] {{ $labels.cluster }} (3d/6h) / {{ $labels.namespace }}"
        description: |
          Hosted control plane API availability is burning error budget at 1x over 3d/6h.
          Management Cluster: {{ $labels.cluster }}
          Control Plane Namespace: {{ $labels.namespace }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyAvailability/{{ $labels.cluster }}/{{ $labels.namespace }}"
    - alert: hypershiftJourneyHealthyClusters1h5m
      expr: |
        (
          avg_over_time(hypershift:hostedclusters_unhealthy:ratio[1h]) > (14.4 * (1 - 0.999))
          and on (cluster)
          count_over_time(hypershift:hostedclusters_unhealthy:ratio[1h]) > 54
        )
        and on (cluster)
        (
          avg_over_time(hypershift:hostedclusters_unhealthy:ratio[5m]) > (14.4 * (1 - 0.999))
          and on (cluster)
          count_over_time(hypershift:hostedclusters_unhealthy:ratio[5m]) > 3
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-journey-errors
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyHealthyClustersBurn] {{ $labels.cluster }} (1h/5m)"
        description: |
          HostedCluster failure-condition share is burning error budget at 14.4x over 1h/5m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyHealthyClusters/{{ $labels.cluster }}"
    - alert: hypershiftJourneyHealthyClusters6h30m
      expr: |
        (
          avg_over_time(hypershift:hostedclusters_unhealthy:ratio[6h]) > (6 * (1 - 0.999))
          and on (cluster)
          count_over_time(hypershift:hostedclusters_unhealthy:ratio[6h]) > 64
        )
        and on (cluster)
        (
          avg_over_time(hypershift:hostedclusters_unhealthy:ratio[30m]) > (6 * (1 - 0.999))
          and on (cluster)
          count_over_time(hypershift:hostedclusters_unhealthy:ratio[30m]) > 27
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-journey-errors
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyHealthyClustersBurn] {{ $labels.cluster }} (6h/30m)"
        description: |
          HostedCluster failure-condition share is burning error budget at 6x over 6h/30m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyHealthyClusters/{{ $labels.cluster }}"
    - alert: hypershiftJourneyHealthyClusters3d6h
      expr: |
        (
          avg_over_time(hypershift:hostedclusters_unhealthy:ratio[3d]) > (1 * (1 - 0.999))
          and on (cluster)
          count_over_time(hypershift:hostedclusters_unhealthy:ratio[3d]) > 130
        )
        and on (cluster)
        (
          avg_over_time(hypershift:hostedclusters_unhealthy:ratio[6h]) > (1 * (1 - 0.999))
          and on (cluster)
          count_over_time(hypershift:hostedclusters_unhealthy:ratio[6h]) > 64
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: hypershift-journey-errors
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyHealthyClustersBurn] {{ $labels.cluster }} (3d/6h)"
        description: |
          HostedCluster failure-condition share is burning error budget at 1x over 3d/6h.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyHealthyClusters/{{ $labels.cluster }}"
    - alert: hypershiftJourneyCreationLatencySLO
      expr: |
        hypershift:hostedcluster_creation_over_30m:ratio_30d > 0.01
      for: 1h
      labels:
        severity: "3"
        slo: hypershift-journey-latency
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyCreationLatencySLO] {{ $labels.cluster }}"
        description: |
          More than 1% of HostedCluster creations over 30 days took longer than 30 minutes to reach initial availability.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyCreationLatencySLO/{{ $labels.cluster }}"
    - alert: hypershiftJourneyClusterWaitingOver30m
      expr: |
        max by (cluster, namespace, name) (max without (prometheus_replica) (hypershift_cluster_waiting_initial_availability_duration_seconds)) > 1800
      for: 5m
      labels:
        severity: "3"
        slo: hypershift-journey-saturation
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyClusterWaitingOver30m] {{ $labels.cluster }} / {{ $labels.namespace }}/{{ $labels.name }}"
        description: |
          HostedCluster has not reached initial availability within 30 minutes.
          Management Cluster: {{ $labels.cluster }}
          HostedCluster: {{ $labels.namespace }}/{{ $labels.name }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyClusterWaitingOver30m/{{ $labels.cluster }}/{{ $labels.namespace }}/{{ $labels.name }}"
    - alert: hypershiftJourneyTransitionBacklog
      expr: |
        hypershift:hostedclusters_waiting_over_30m:ratio > 0.05
      for: 15m
      labels:
        severity: "4"
        slo: hypershift-journey-saturation
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyTransitionBacklog] {{ $labels.cluster }}"
        description: |
          More than 5% of HostedClusters in initial lifecycle transition have exceeded the 30 minute limit.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyTransitionBacklog/{{ $labels.cluster }}"
    - alert: hypershiftJourneyTrafficDrop
      expr: |
        hypershift:hostedcluster_transitions:increase1h < 0.5 * (hypershift:hostedcluster_transitions:increase1h offset 24h)
        and
        (hypershift:hostedcluster_transitions:increase1h offset 24h) > 0
      for: 30m
      labels:
        severity: "4"
        slo: hypershift-journey-traffic
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyTrafficDrop] {{ $labels.cluster }}"
        description: |
          HostedCluster lifecycle transitions dropped below 50% of the rate 24 hours ago.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyTrafficDrop/{{ $labels.cluster }}"
    - alert: hypershiftJourneyTrafficSpike
      expr: |
        hypershift:hostedcluster_transitions:increase1h > 3 * avg_over_time(hypershift:hostedcluster_transitions:increase1h[7d])
        and
        hypershift:hostedcluster_transitions:increase1h > 10
      for: 30m
      labels:
        severity: "4"
        slo: hypershift-journey-traffic
        service: hypershift-journey
      annotations:
        summary: "[HyperShiftJourneyTrafficSpike] {{ $labels.cluster }}"
        description: |
          HostedCluster lifecycle transitions exceeded 3x the 7 day average.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftJourneyTrafficSpike/{{ $labels.cluster }}"
  - name: hypershift-operator-monitor-rules
    labels:
      component: slo
    rules:
    - alert: hypershiftOperatorAvailability1h5m
      expr: |
        (
          (1 - avg_over_time(hypershift:operator:replica_availability:ratio[1h])) > (14.4 * (1 - 0.9995))
          and on (cluster)
          count_over_time(hypershift:operator:replica_availability:ratio[1h]) > 54
        )
        and on (cluster)
        (
          (1 - avg_over_time(hypershift:operator:replica_availability:ratio[5m])) > (14.4 * (1 - 0.9995))
          and on (cluster)
          count_over_time(hypershift:operator:replica_availability:ratio[5m]) > 3
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorAvailabilityBurn] {{ $labels.cluster }} (1h/5m)"
        description: |
          hypershift-operator replica availability is burning error budget at 14.4x over 1h/5m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorAvailability/{{ $labels.cluster }}"
    - alert: hypershiftOperatorAvailability6h30m
      expr: |
        (
          (1 - avg_over_time(hypershift:operator:replica_availability:ratio[6h])) > (6 * (1 - 0.9995))
          and on (cluster)
          count_over_time(hypershift:operator:replica_availability:ratio[6h]) > 64
        )
        and on (cluster)
        (
          (1 - avg_over_time(hypershift:operator:replica_availability:ratio[30m])) > (6 * (1 - 0.9995))
          and on (cluster)
          count_over_time(hypershift:operator:replica_availability:ratio[30m]) > 27
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorAvailabilityBurn] {{ $labels.cluster }} (6h/30m)"
        description: |
          hypershift-operator replica availability is burning error budget at 6x over 6h/30m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorAvailability/{{ $labels.cluster }}"
    - alert: hypershiftOperatorAvailability3d6h
      expr: |
        (
          (1 - avg_over_time(hypershift:operator:replica_availability:ratio[3d])) > (1 * (1 - 0.9995))
          and on (cluster)
          count_over_time(hypershift:operator:replica_availability:ratio[3d]) > 130
        )
        and on (cluster)
        (
          (1 - avg_over_time(hypershift:operator:replica_availability:ratio[6h])) > (1 * (1 - 0.9995))
          and on (cluster)
          count_over_time(hypershift:operator:replica_availability:ratio[6h]) > 64
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorAvailabilityBurn] {{ $labels.cluster }} (3d/6h)"
        description: |
          hypershift-operator replica availability is burning error budget at 1x over 3d/6h.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorAvailability/{{ $labels.cluster }}"
    - alert: hypershiftOperatorReconcileErrors1h5m
      expr: |
        (
          hypershift:operator:reconcile_error:ratio_rate1h > (14.4 * (1 - 0.999))
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
        and on (cluster)
        (
          hypershift:operator:reconcile_error:ratio_rate5m > (14.4 * (1 - 0.999))
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-operator-errors
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorReconcileErrorsBurn] {{ $labels.cluster }} (1h/5m)"
        description: |
          hypershift-operator reconcile error ratio is burning error budget at 14.4x over 1h/5m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorReconcileErrors/{{ $labels.cluster }}"
    - alert: hypershiftOperatorReconcileErrors6h30m
      expr: |
        (
          hypershift:operator:reconcile_error:ratio_rate6h > (6 * (1 - 0.999))
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
        and on (cluster)
        (
          hypershift:operator:reconcile_error:ratio_rate30m > (6 * (1 - 0.999))
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-operator-errors
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorReconcileErrorsBurn] {{ $labels.cluster }} (6h/30m)"
        description: |
          hypershift-operator reconcile error ratio is burning error budget at 6x over 6h/30m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorReconcileErrors/{{ $labels.cluster }}"
    - alert: hypershiftOperatorReconcileErrors3d6h
      expr: |
        (
          hypershift:operator:reconcile_error:ratio_rate3d > (1 * (1 - 0.999))
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
        and on (cluster)
        (
          hypershift:operator:reconcile_error:ratio_rate6h > (1 * (1 - 0.999))
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: hypershift-operator-errors
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorReconcileErrorsBurn] {{ $labels.cluster }} (3d/6h)"
        description: |
          hypershift-operator reconcile error ratio is burning error budget at 1x over 3d/6h.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorReconcileErrors/{{ $labels.cluster }}"
    - alert: hypershiftOperatorReconcileLatency1h5m
      expr: |
        (
          hypershift:operator:reconcile_slow:ratio_rate1h > (14.4 * 0.01)
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
        and on (cluster)
        (
          hypershift:operator:reconcile_slow:ratio_rate5m > (14.4 * 0.01)
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-operator-latency
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorReconcileLatencyBurn] {{ $labels.cluster }} (1h/5m)"
        description: |
          hypershift-operator reconciles slower than 10s is burning error budget at 14.4x over 1h/5m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorReconcileLatency/{{ $labels.cluster }}"
    - alert: hypershiftOperatorReconcileLatency6h30m
      expr: |
        (
          hypershift:operator:reconcile_slow:ratio_rate6h > (6 * 0.01)
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
        and on (cluster)
        (
          hypershift:operator:reconcile_slow:ratio_rate30m > (6 * 0.01)
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-operator-latency
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorReconcileLatencyBurn] {{ $labels.cluster }} (6h/30m)"
        description: |
          hypershift-operator reconciles slower than 10s is burning error budget at 6x over 6h/30m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorReconcileLatency/{{ $labels.cluster }}"
    - alert: hypershiftOperatorReconcileLatency3d6h
      expr: |
        (
          hypershift:operator:reconcile_slow:ratio_rate3d > (1 * 0.01)
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
        and on (cluster)
        (
          hypershift:operator:reconcile_slow:ratio_rate6h > (1 * 0.01)
          and on (cluster)
          hypershift:operator:reconcile:rate5m > 0
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: hypershift-operator-latency
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorReconcileLatencyBurn] {{ $labels.cluster }} (3d/6h)"
        description: |
          hypershift-operator reconciles slower than 10s is burning error budget at 1x over 3d/6h.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorReconcileLatency/{{ $labels.cluster }}"
    - alert: hypershiftOperatorSaturation1h5m
      expr: |
        (
          avg_over_time(hypershift:operator:saturated[1h]) > (14.4 * 0.01)
          and on (cluster)
          count_over_time(hypershift:operator:saturated[1h]) > 54
        )
        and on (cluster)
        (
          avg_over_time(hypershift:operator:saturated[5m]) > (14.4 * 0.01)
          and on (cluster)
          count_over_time(hypershift:operator:saturated[5m]) > 3
        )
      for: 10m
      labels:
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-operator-saturation
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorSaturationBurn] {{ $labels.cluster }} (1h/5m)"
        description: |
          hypershift-operator saturated intervals is burning error budget at 14.4x over 1h/5m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorSaturation/{{ $labels.cluster }}"
    - alert: hypershiftOperatorSaturation6h30m
      expr: |
        (
          avg_over_time(hypershift:operator:saturated[6h]) > (6 * 0.01)
          and on (cluster)
          count_over_time(hypershift:operator:saturated[6h]) > 64
        )
        and on (cluster)
        (
          avg_over_time(hypershift:operator:saturated[30m]) > (6 * 0.01)
          and on (cluster)
          count_over_time(hypershift:operator:saturated[30m]) > 27
        )
      for: 30m
      labels:
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-operator-saturation
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorSaturationBurn] {{ $labels.cluster }} (6h/30m)"
        description: |
          hypershift-operator saturated intervals is burning error budget at 6x over 6h/30m.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorSaturation/{{ $labels.cluster }}"
    - alert: hypershiftOperatorSaturation3d6h
      expr: |
        (
          avg_over_time(hypershift:operator:saturated[3d]) > (1 * 0.01)
          and on (cluster)
          count_over_time(hypershift:operator:saturated[3d]) > 130
        )
        and on (cluster)
        (
          avg_over_time(hypershift:operator:saturated[6h]) > (1 * 0.01)
          and on (cluster)
          count_over_time(hypershift:operator:saturated[6h]) > 64
        )
      for: 3h
      labels:
        long_window: 3d
        short_window: 6h
        severity: "3"
        slo: hypershift-operator-saturation
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorSaturationBurn] {{ $labels.cluster }} (3d/6h)"
        description: |
          hypershift-operator saturated intervals is burning error budget at 1x over 3d/6h.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftOperatorSaturation/{{ $labels.cluster }}"
    - alert: hypershiftOperatorSaturationSignal
      expr: |
        hypershift:operator:saturation_signal == 1
      for: 15m
      labels:
        severity: "4"
        slo: hypershift-operator-saturation
        service: hypershift-operator
      annotations:
        summary: "[HyperShiftOperatorSaturation] {{ $labels.cluster }} ({{ $labels.signal }})"
        description: |
          hypershift-operator {{ $labels.signal }} is above its limit.
