apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-provision-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Provisioning SLO Alerts — Errors
  # ========================================
  # Error-rate burn-rate alerting for cluster create operations has moved to the
  # windowed, volume-aware group arohcp_cluster_provision_slo_windowed_error_alerts,
  # which counts only operations whose terminal transition landed inside the
  # window instead of the trailing 7-day gauge ratio. The stuck-operation
  # detector lives in arohcp_cluster_provision_slo_latency_alerts. This group
  # is kept empty so existing silences / inhibition rules referencing it by
  # name continue to match.
  - name: arohcp_cluster_provision_slo_error_alerts
    labels:
      component: slo
    rules: []
  # ========================================
  # Cluster Provisioning SLO Alerts — Latency (Stuck Operations)
  # ========================================
  # Cluster create operations stuck in non-terminal phases are invisible to
  # the Errors SLI (which only counts terminal phases) and require investigation.
  #
  # Threshold: 30 minutes (1800s). Cluster provisioning typically takes ~13
  # minutes for HCP (P99 ~18 min). The 60-minute operation deadline
  # (defaultCreateOperationCompletionDeadlineDuration) marks operations as
  # failed, so the threshold must be well below 60 min to provide early detection.
  #
  # Stickiness (max_over_time ... [6h:5m]): while a resource stays wedged,
  # the raw condition can transiently clear — most commonly when the backend
  # retries the operation and resets backend_resource_operation_start_time_seconds,
  # briefly dropping (time() - start_time) below the 1800s threshold. Each clear
  # auto-resolves the IcM incident and the next re-fire opens a brand-new one.
  # Holding the condition firing over a 6h look-back collapses a
  # continuously-stuck resource into a single long-lived incident; genuinely
  # distinct stuck episodes more than 6h apart still get their own incident.
  - name: arohcp_cluster_provision_slo_latency_alerts
    labels:
      component: slo
    rules:
    - alert: UserJourneyClusterProvisionStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (latency:backend_cluster_provision:inflight_duration_seconds > 1800)[6h:5m]
          )
        )
        and on (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase)
        latency:backend_cluster_provision:inflight_duration_seconds
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: Cluster create operation for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 30 minutes"
        description: "Cluster create operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 30 minutes. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
  # ========================================
  # Cluster Provisioning SLO Alerts: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # These read the windowed recording rules
  # (errors:backend_cluster_provision:{failed,total,error_rate}_{1h,6h,3d}),
  # which count only cluster create operations whose terminal transition landed
  # inside the window, so each tier evaluates a real event window instead of the
  # trailing 7-day gauge ratio. Stateless and level-driven: no new metric and no
  # backend change.
  #
  # Volume guard: each tier requires an absolute floor of completions/failures
  # in the window so a single failure on a quiet window cannot page.
  - name: arohcp_cluster_provision_slo_windowed_error_alerts
    labels:
      component: slo
    rules:
    # Fast Burn (IcM Sev 3, page). 14.4x burn: >72% failures over 1h, >=3 failures.
    - alert: UserJourneyClusterProvisionErrors1h5m
      expr: |
        errors:backend_cluster_provision:failed_1h >= 3
        and
        errors:backend_cluster_provision:error_rate_1h > 0.72
      for: 5m
      labels:
        severity: "3"
        slo: cluster-provision-errors
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: Cluster create operations failing fast (>72% of recent operations)"
        description: "More than 72% of completed cluster create (install) operations on {{ $labels.cluster }} failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
    # Medium Burn (IcM Sev 3, page). 6x burn: >30% failures over 6h, >=5 completions.
    - alert: UserJourneyClusterProvisionErrors6h30m
      expr: |
        errors:backend_cluster_provision:total_6h >= 5
        and
        errors:backend_cluster_provision:error_rate_6h > 0.30
      for: 30m
      labels:
        severity: "3"
        slo: cluster-provision-errors
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: Cluster create operation error rate elevated (>30% over 6h)"
        description: "More than 30% of completed cluster create (install) operations on {{ $labels.cluster }} failed over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
    # Slow Burn / Budget (IcM Sev 4, ticket). 1x burn: >5% failures over 3d, >=10 completions, >=2 failures.
    - alert: UserJourneyClusterProvisionErrors3d
      expr: |
        errors:backend_cluster_provision:total_3d >= 10
        and
        errors:backend_cluster_provision:failed_3d >= 2
        and
        errors:backend_cluster_provision:error_rate_3d > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: cluster-provision-errors
        long_window: 3d
      annotations:
        summary: "{{ $labels.cluster }}: Cluster create operation error budget burning (>5% over 3d)"
        description: "More than 5% of completed cluster create (install) operations on {{ $labels.cluster }} failed over the last 3 days (at least 10 completions and 2 failures), a 1x burn that exhausts the 95% SLO error budget over the window."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
    # Early Warning / Degradation (IcM Sev 4, ticket). Precursor: >15% failures over 6h before the burn-rate alerts fire.
    - alert: UserJourneyClusterProvisionErrorsDegradation
      expr: |
        errors:backend_cluster_provision:total_6h >= 5
        and
        errors:backend_cluster_provision:failed_6h >= 2
        and
        errors:backend_cluster_provision:error_rate_6h > 0.15
      for: 30m
      labels:
        severity: "4"
        slo: cluster-provision-errors
        long_window: 6h
      annotations:
        summary: "{{ $labels.cluster }}: Cluster create operation failure rate exceeds 15% over 6h"
        description: "More than 15% of completed cluster create (install) operations on {{ $labels.cluster }} failed over the last 6 hours (at least 5 completions and 2 failures), an early warning of degradation before the burn-rate alerts fire."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
