        component: slo
        long_window: 6h
        short_window: 30m
        severity: "3"
        slo: hypershift-journey-availability
        service: hypershift-journey
        cluster: mc1
        namespace: ocm-prefix-1
      exp_annotations:
        summary: "mc1/ocm-prefix-1: Hosted control plane API availability is burning error budget at 6x over 6h/30m"
        description: |
