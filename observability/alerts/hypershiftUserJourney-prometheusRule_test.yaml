- interval: 1m
  name: "Cluster with no hypershift_kube_apiserver_available: cold start and decommission"
  # ocm-prefix-1 (cold start / onboarding) never reports the metric, while
  # ocm-prefix-3 reports a healthy KAS so the rules are known to be evaluating.
  # ocm-prefix-2 (decommission) is fully unavailable for 120m, firing the
  # 1h/5m tier, then its series goes stale (HCP deleted). The SLI recordings
  # are gated on the raw metric still being reported, so a missing metric
  # yields no SLI sample at all (not 0% availability) and no tier alerts. This
  # also means losing the metric does not page through this SLO; absent-metric
  # detection has to come from a scrape/target-down alert instead.
  input_series:
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-2", cluster="mc1"}'
    values: "0x120 stale"
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-3", cluster="mc1"}'
    values: "1x200"
  promql_expr_test:
  - expr: count by (namespace) (hypershift_kube_apiserver_available:sli_sum_5m)
    eval_time: 100m
    exp_samples:
    - labels: '{namespace="ocm-prefix-2"}'
      value: 1
    - labels: '{namespace="ocm-prefix-3"}'
      value: 1
  - expr: count by (namespace) (hypershift_kube_apiserver_available:sli_sum_5m)
    eval_time: 125m
    exp_samples:
    - labels: '{namespace="ocm-prefix-3"}'
      value: 1
  - expr: count by (namespace) (hypershift_kube_apiserver_available:sli_count_5m)
    eval_time: 100m
