rule_files:
- hypershiftUserJourneyRecord-prometheusRule.yaml
- hypershiftUserJourney-prometheusRule.yaml
group_eval_order:
- hypershift-journey-availability-recording-rules
- hypershift-cpo-recording-rules
- hypershift-journey-availability-monitor-rules
- hypershift-cpo-monitor-rules
evaluation_interval: 1m
tests:
- interval: 1m
  name: "Healthy hosted control planes fire no alerts"
  input_series:
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-1", cluster="mc1"}'
    values: "1+0x600"
  alert_rule_test:
  - eval_time: 600m
    alertname: userJourneyAvailability1h5m
    exp_alerts: []
- interval: 1m
  name: "Journey availability fast burn"
  input_series:
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-1", cluster="mc1"}'
    values: "0+0x200"
  alert_rule_test:
  - eval_time: 100m
    alertname: userJourneyAvailability1h5m
    exp_alerts:
    - exp_labels:
        component: slo
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: hypershift-journey-availability
        service: hypershift-journey
        cluster: mc1
        namespace: ocm-prefix-1
      exp_annotations:
        summary: "mc1/ocm-prefix-1: Hosted control plane API availability is burning error budget at 14.4x over 1h/5m"
        description: |
          Hosted control plane API availability is burning error budget at 14.4x over 1h/5m.
          Management Cluster: mc1
          Control Plane Namespace: ocm-prefix-1
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyAvailability/mc1/ocm-prefix-1"
- interval: 1m
  name: "Control Plane Operator fast burn is scoped to the HCP namespace"
  input_series:
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", result="error", cluster="mc1"}'
    values: "0+10x200"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-2", pod="control-plane-operator-def", result="success", cluster="mc1"}'
    values: "0+10x200"
  alert_rule_test:
  - eval_time: 100m
    alertname: hypershiftCPOReconcileErrors1h5m
    exp_alerts:
    - exp_labels:
        component: slo
        long_window: 1h
        short_window: 5m
        severity: "3"
        slo: control-plane-operator-errors
        service: control-plane-operator
        cluster: mc1
        namespace: ocm-prefix-1
      exp_annotations:
        summary: "mc1/ocm-prefix-1: control-plane-operator reconcile error ratio is burning error budget at 14.4x over 1h/5m"
        description: |
          control-plane-operator reconcile error ratio is burning error budget at 14.4x over 1h/5m.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "hypershiftCPOReconcileErrors/mc1/ocm-prefix-1"
- interval: 1m
  name: "Cold start: CPO 6h and 3d tiers stay silent on under 5h of history"
  # 100% burn from t=0. Before the subquery-step guards the 6h30m tiers fired
  # after ~1h and the 3d6h tiers after ~3h.
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x300"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "1+0x300"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", result="error", cluster="mc1"}'
    values: "0+10x300"
  - series: 'controller_runtime_reconcile_time_seconds_bucket{namespace="ocm-prefix-1", pod="control-plane-operator-abc", le="10", cluster="mc1"}'
    values: "0+0x300"
  - series: 'controller_runtime_reconcile_time_seconds_count{namespace="ocm-prefix-1", pod="control-plane-operator-abc", cluster="mc1"}'
    values: "0+10x300"
  - series: 'workqueue_depth{namespace="ocm-prefix-1", pod="control-plane-operator-abc", name="hcp", cluster="mc1"}'
    values: "500+0x300"
  alert_rule_test:
  - eval_time: 280m
    alertname: hypershiftCPOAvailability6h30m
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOAvailability3d6h
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOReconcileErrors6h30m
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOReconcileErrors3d6h
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOReconcileLatency6h30m
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOReconcileLatency3d6h
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOSaturation6h30m
    exp_alerts: []
  - eval_time: 280m
    alertname: hypershiftCPOSaturation3d6h
    exp_alerts: []
- interval: 1m
  name: "Recovery: API availability and CPO alerts clear once the budget stops burning"
  # Burn for 405m, then recover. MWMBR clears each tier once its short
  # window (5m / 30m) is clean, without waiting for the long window to
  # drain: at 415m the 1h/5m tier has cleared while the 6h/30m tier is still
  # firing (its 30m window still covers the burn); by 445m all have cleared.
  input_series:
  - series: 'hypershift_kube_apiserver_available{namespace="ocm-prefix-1", cluster="mc1"}'
    values: "0+0x404 1+0x100"
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x404 1+0x100"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "1+0x505"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", result="error", cluster="mc1"}'
    values: "0+10x404 4040+0x100"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", result="success", cluster="mc1"}'
    values: "0+0x404 0+10x100"
  - series: 'controller_runtime_reconcile_time_seconds_bucket{namespace="ocm-prefix-1", pod="control-plane-operator-abc", le="10", cluster="mc1"}'
    values: "0+0x404 0+10x100"
  - series: 'controller_runtime_reconcile_time_seconds_count{namespace="ocm-prefix-1", pod="control-plane-operator-abc", cluster="mc1"}'
    values: "0+10x404 4040+10x100"
  - series: 'workqueue_depth{namespace="ocm-prefix-1", pod="control-plane-operator-abc", name="hcp", cluster="mc1"}'
    values: "500+0x404 1+0x100"
