- interval: 1m
  name: "6h/30m tier fires between its 6x and the 1h/5m 14.4x thresholds"
  # ocm-prefix-1 burns between 6x and 14.4x (availability 0.005 vs 0.003/0.0072,
  # errors 0.01 vs 0.006/0.0144, latency and saturation 0.1 vs 0.06/0.144): the
  # 6h/30m tier fires and the 1h/5m tier stays silent. ocm-prefix-2 burns just
  # under 6x (availability 0.002, errors 0.005, latency and saturation 0.05)
  # and fires nothing. The KAS SLI is a per-HCP 0/1 sample, so ocm-prefix-3
  # has 1 unavailable minute in 20: every 30m window holds 1-2 (above 6x), but
  # the 5m window is only burning 5 minutes in 20, so 1h/5m never holds for 10m.
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "995+0x420"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "1000+0x420"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", result="error", cluster="mc1"}'
    values: "0+1x420"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-abc", result="success", cluster="mc1"}'
    values: "0+99x420"
  - series: 'controller_runtime_reconcile_time_seconds_bucket{namespace="ocm-prefix-1", pod="control-plane-operator-abc", le="10", cluster="mc1"}'
    values: "0+90x420"
  - series: 'controller_runtime_reconcile_time_seconds_count{namespace="ocm-prefix-1", pod="control-plane-operator-abc", cluster="mc1"}'
    values: "0+100x420"
  - series: 'workqueue_depth{namespace="ocm-prefix-1", pod="control-plane-operator-abc", name="hcp", cluster="mc1"}'
    values: "500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8 500 1x8"
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-2", deployment="control-plane-operator", cluster="mc1"}'
    values: "998+0x420"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-2", deployment="control-plane-operator", cluster="mc1"}'
    values: "1000+0x420"
