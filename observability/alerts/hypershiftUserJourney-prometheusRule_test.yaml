rule_files:
- hypershiftControlPlaneOperator-recordingRule.yaml
- hypershiftUserJourney-prometheusRule.yaml
group_eval_order:
- hypershift-cpo-recording-rules
- hypershift-cpo-monitor-rules
- hypershift-cpo-availability-alerts
- hypershift-cpo-error-alerts
evaluation_interval: 1m
tests:
- interval: 1m
  name: "Control Plane Operator down is scoped to the HCP namespace"
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x60"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "1+0x60"
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-2", deployment="control-plane-operator", cluster="mc1"}'
    values: "1+0x60"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-2", deployment="control-plane-operator", cluster="mc1"}'
    values: "1+0x60"
  # Scaled to zero (for example, hibernating or deleting) must not fire.
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-3", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x60"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-3", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x60"
  alert_rule_test:
  - eval_time: 5m
    alertname: userJourneyControlPlaneOperatorAvailabilityDown
    exp_alerts: []
  - eval_time: 15m
    alertname: userJourneyControlPlaneOperatorAvailabilityDown
    exp_alerts:
    - exp_labels:
        severity: "3"
        slo: control-plane-operator-availability
        service: control-plane-operator
        component: slo
        cluster: mc1
        namespace: ocm-prefix-1
      exp_annotations:
        summary: "ocm-prefix-1: control-plane-operator has no available pods"
        description: |
          control-plane-operator has had no available pods for 10 minutes.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyControlPlaneOperatorAvailabilityDown/mc1/ocm-prefix-1"
- interval: 1m
  name: "CPO replica availability burn is scoped to the HCP namespace"
  input_series:
  # ocm-prefix-1: 1 of 2 replicas available.
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "1+0x40"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
    values: "2+0x40"
  # ocm-prefix-2: healthy neighbour on the same MC.
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-2", deployment="control-plane-operator", cluster="mc1"}'
    values: "2+0x40"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-2", deployment="control-plane-operator", cluster="mc1"}'
    values: "2+0x40"
  # ocm-prefix-3: scaled to zero.
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-3", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x40"
  - series: 'kube_deployment_spec_replicas{namespace="ocm-prefix-3", deployment="control-plane-operator", cluster="mc1"}'
    values: "0+0x40"
  alert_rule_test:
  - eval_time: 1m
    alertname: userJourneyControlPlaneOperatorAvailability1h5m
    exp_alerts: []
  - eval_time: 10m
    alertname: userJourneyControlPlaneOperatorAvailability1h5m
    exp_alerts:
    - exp_labels:
        component: "slo"
        severity: "3"
        slo: "control-plane-operator-availability"
        service: "control-plane-operator"
        long_window: "1h"
        short_window: "5m"
        cluster: "mc1"
        namespace: "ocm-prefix-1"
      exp_annotations:
        summary: "ocm-prefix-1: control-plane-operator availability burning error budget (14.4x)"
        description: |
          control-plane-operator unavailable replica share is above 0.72% over both the 1h and 5m windows,
          a 14.4x burn of the proposed 99.95% replica availability SLO.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: "https://aka.ms/arohcp-runbook-hypershift"
        correlationId: "userJourneyControlPlaneOperatorAvailability1h5m/mc1/ocm-prefix-1"
  - eval_time: 25m
    alertname: userJourneyControlPlaneOperatorAvailability6h30m
    exp_alerts:
    - exp_labels:
        component: "slo"
        severity: "3"
        slo: "control-plane-operator-availability"
        service: "control-plane-operator"
        long_window: "6h"
        short_window: "30m"
        cluster: "mc1"
        namespace: "ocm-prefix-1"
      exp_annotations:
        summary: "ocm-prefix-1: control-plane-operator availability burning error budget (6x)"
        description: |
          control-plane-operator unavailable replica share is above 0.3% over both the 6h and 30m windows,
          a 6x burn of the proposed 99.95% replica availability SLO.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: "https://aka.ms/arohcp-runbook-hypershift"
        correlationId: "userJourneyControlPlaneOperatorAvailability6h30m/mc1/ocm-prefix-1"
- interval: 1m
  name: "CPO reconcile error burn"
  input_series:
  # ocm-prefix-1: 5% of reconciliations fail.
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-x", result="success", cluster="mc1"}'
    values: "0+95x90"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-x", result="error", cluster="mc1"}'
    values: "0+5x90"
  # ocm-prefix-2: no errors.
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-2", pod="control-plane-operator-y", result="success", cluster="mc1"}'
    values: "0+100x90"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-2", pod="control-plane-operator-y", result="error", cluster="mc1"}'
    values: "0+0x90"
  alert_rule_test:
  - eval_time: 15m
    alertname: userJourneyControlPlaneOperatorErrors1h5m
    exp_alerts:
    - exp_labels:
        component: "slo"
        severity: "3"
        slo: "control-plane-operator-reconcile-errors"
        service: "control-plane-operator"
        long_window: "1h"
        short_window: "5m"
        cluster: "mc1"
        namespace: "ocm-prefix-1"
      exp_annotations:
        summary: "ocm-prefix-1: control-plane-operator reconcile errors burning error budget (14.4x)"
        description: |
          control-plane-operator reconcile error share is above 1.44% over both the 1h and 5m windows,
          a 14.4x burn of the proposed 99.9% Successful Reconciliations SLO.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: "https://aka.ms/arohcp-runbook-hypershift"
        correlationId: "userJourneyControlPlaneOperatorErrors1h5m/mc1/ocm-prefix-1"
  - eval_time: 30m
    alertname: userJourneyControlPlaneOperatorErrors6h30m
    exp_alerts:
    - exp_labels:
        component: "slo"
        severity: "3"
        slo: "control-plane-operator-reconcile-errors"
        service: "control-plane-operator"
        long_window: "6h"
        short_window: "30m"
        cluster: "mc1"
        namespace: "ocm-prefix-1"
      exp_annotations:
        summary: "ocm-prefix-1: control-plane-operator reconcile errors burning error budget (6x)"
        description: |
          control-plane-operator reconcile error share is above 0.6% over both the 6h and 30m windows,
          a 6x burn of the proposed 99.9% Successful Reconciliations SLO.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: "https://aka.ms/arohcp-runbook-hypershift"
        correlationId: "userJourneyControlPlaneOperatorErrors6h30m/mc1/ocm-prefix-1"
  - eval_time: 85m
    alertname: userJourneyControlPlaneOperatorErrors3d6h
    exp_alerts:
    - exp_labels:
        component: "slo"
        severity: "4"
        slo: "control-plane-operator-reconcile-errors"
        service: "control-plane-operator"
        long_window: "3d"
        short_window: "6h"
        cluster: "mc1"
        namespace: "ocm-prefix-1"
      exp_annotations:
        summary: "ocm-prefix-1: control-plane-operator reconcile errors burning error budget (1x)"
        description: |
          control-plane-operator reconcile error share is above 0.1% over both the 3d and 6h windows,
          a 1x burn of the proposed 99.9% Successful Reconciliations SLO.
          Management Cluster: mc1
          Namespace: ocm-prefix-1
        runbook_url: "https://aka.ms/arohcp-runbook-hypershift"
        correlationId: "userJourneyControlPlaneOperatorErrors3d6h/mc1/ocm-prefix-1"
- interval: 1m
  name: "Short CPO error spike does not fire the fast tier"
  input_series:
  # Errors only from 60m to 63m; the 1h window stays under 1.44%.
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-x", result="success", cluster="mc1"}'
    values: "0+100x90"
  - series: 'controller_runtime_reconcile_total{namespace="ocm-prefix-1", pod="control-plane-operator-x", result="error", cluster="mc1"}'
    values: "0x60 0+1x3 3x27"
  alert_rule_test:
  - eval_time: 66m
    alertname: userJourneyControlPlaneOperatorErrors1h5m
    exp_alerts: []
