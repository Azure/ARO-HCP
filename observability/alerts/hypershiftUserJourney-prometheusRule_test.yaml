- interval: 1m
  name: "3d/6h tier fires between its 1x and the 6h/30m 6x thresholds"
  # 70h of history: the [3d:30m] > 130 guard needs ~65.5h, then for: 3h.
  # ocm-prefix-1 burns between 1x and 6x (availability 0.002 vs 0.0005/0.003,
  # errors 0.003 vs 0.001/0.006, latency and saturation 0.03-0.033 vs
  # 0.01/0.06): only the 3d/6h tier fires. ocm-prefix-2 burns just under 1x
  # (availability 0.0004, errors 0.0008, latency 0.009, saturation 1 minute in
  # 120 = 0.0083) and fires nothing. KAS is not isolated here: its 6h window
  # uses 5m steps, so one 0/1 sample moves the ratio by 1/72 and a sub-6x KAS
  # burn cannot be built at 1m resolution.
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="ocm-prefix-1", deployment="control-plane-operator", cluster="mc1"}'
