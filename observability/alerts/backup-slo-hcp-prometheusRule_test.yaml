# Tests for the schedule-scoped (velero_hcp_*) HCP backup SLO alerts.
# No recording-rule file is listed here: Errors, Latency, and Traffic all
# compute their windowed ratios/quantiles/averages directly from raw
# velero_hcp_* counters (see backup-slo-hcp-prometheusRule.yaml's comments).
rule_files:
- backup-slo-hcp-prometheusRule.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  name: healthy_baseline
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+60x300"
  - series: 'velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x300"
  - series: 'velero_hcp_backup_success_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x300"
  - series: 'velero_hcp_backup_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x300"
  - series: 'velero_hcp_backup_partial_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x300"
  - series: 'velero_hcp_backup_validation_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x300"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+1x300"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="60"}'
    values: "0+1x300"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x300"
  - series: 'velero_hcp_backup_last_status{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "1+0x300"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 290m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupAvailabilityDaily
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupAvailabilityWeekly
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupErrors
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupLatency
    exp_alerts: []
  - eval_time: 290m
    alertname: userJourneyBackupTraffic
    exp_alerts: []
- interval: 5m
  name: availability_6hourly_stale
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-1", namespace="ns-hc-stuck", schedule="ns-hc-stuck-6-hourly"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc-stuck"}'
    values: "0+0x6000"
  alert_rule_test:
  # At 12h55m: lag = 46500s < 46800s (13h) -> not yet firing
  - eval_time: 12h55m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts: []
  # At 13h20m: lag = 48000s > 46800s (13h), true since 13h0m, well past the
  # for:5m hold -> firing
  - eval_time: 13h20m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability6Hourly
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-availability
        cadence: 6-hourly
      exp_annotations:
        summary: "at least one HostedCluster has no successful 6-hourly backup in over 13h on mgmt-1"
        description: "At least one HostedCluster namespace on management cluster mgmt-1 has had no successful Velero 6-hourly backup in over 13 hours (2x the 6h cadence + 1h grace). This is the primary restore-point freshness signal. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further (ARO-29949)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupAvailability6Hourly/mgmt-1"
# ========================================
# Availability recovery: alert fires when last-success is stale, then
# resolves after a new successful backup resets the timestamp. Proves the
# alert is not sticky once the underlying issue clears.
# ========================================
- interval: 5m
  name: availability_6hourly_recovery_after_success
  input_series:
  # Timestamp stuck at 0 for the first part, then jumps to near-current
  # (simulates a new successful backup completing). After the jump the lag
  # drops well below 13h so the alert resolves.
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-2", namespace="ns-hc-recovery", schedule="ns-hc-recovery-6-hourly"}'
    values: "0+0x161 48300+0x20"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-2", namespace="ns-hc-recovery"}'
    values: "0+0x6000"
  alert_rule_test:
  # At 13h20m (800m): lag = 800*60 - 0 = 48000s > 46800s (13h) -> firing
  - eval_time: 13h20m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability6Hourly
        cluster: mgmt-2
        component: slo
        severity: "3"
        slo: backup-availability
        cadence: 6-hourly
      exp_annotations:
        summary: "at least one HostedCluster has no successful 6-hourly backup in over 13h on mgmt-2"
        description: "At least one HostedCluster namespace on management cluster mgmt-2 has had no successful Velero 6-hourly backup in over 13 hours (2x the 6h cadence + 1h grace). This is the primary restore-point freshness signal. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further (ARO-29949)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupAvailability6Hourly/mgmt-2"
  # At 13h40m (820m): last_successful_timestamp = 48300 (set at step 161 =
  # 805m = 48300s), current time = 820*60 = 49200s, lag = 900s << 46800s ->
  # alert resolves
  - eval_time: 13h40m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts: []
# ========================================
# Availability 6-hourly per-MC collapse: three HostedCluster namespaces
# share one management cluster. Only ONE is stuck; the other two keep
# succeeding on schedule. Must fire EXACTLY ONCE for the cluster (not three
# times), using the worst (oldest) lag across all three schedules - and
# must only resolve once that single worst schedule also recovers, even
# while its siblings have been healthy the whole time.
# ========================================
- interval: 5m
  name: availability_6hourly_one_of_three_namespaces_stuck_fires_once_per_cluster
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-3", namespace="ns-stuck", schedule="ns-stuck-6-hourly"}'
    values: "0+0x6000"
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-3", namespace="ns-healthy-a", schedule="ns-healthy-a-6-hourly"}'
    values: "0+300x6000"
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-3", namespace="ns-healthy-b", schedule="ns-healthy-b-6-hourly"}'
    values: "0+300x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-3", namespace="ns-stuck"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-3", namespace="ns-healthy-a"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-3", namespace="ns-healthy-b"}'
    values: "0+0x6000"
  alert_rule_test:
  # At 13h20m: ns-stuck's lag (48000s) breaches 13h; the two healthy
  # schedules' lag stays ~300s. min by (cluster) picks the worst (ns-stuck),
  # so exactly one alert instance fires for the whole cluster.
  - eval_time: 13h20m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailability6Hourly
        cluster: mgmt-3
        component: slo
        severity: "3"
        slo: backup-availability
        cadence: 6-hourly
      exp_annotations:
        summary: "at least one HostedCluster has no successful 6-hourly backup in over 13h on mgmt-3"
        description: "At least one HostedCluster namespace on management cluster mgmt-3 has had no successful Velero 6-hourly backup in over 13 hours (2x the 6h cadence + 1h grace). This is the primary restore-point freshness signal. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further (ARO-29949)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupAvailability6Hourly/mgmt-3"
# ========================================
# Availability daily: same shape, threshold 49h (2x the 24h cadence + 1h
# grace), for: 15m.
# ========================================
- interval: 5m
  name: availability_daily_stale
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-1", namespace="ns-hc-stuck", schedule="ns-hc-stuck-daily"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc-stuck"}'
    values: "0+0x6000"
  alert_rule_test:
  # At 48h55m: lag = 176100s < 176400s (49h) -> not yet firing
  - eval_time: 48h55m
    alertname: userJourneyBackupAvailabilityDaily
    exp_alerts: []
  # At 49h30m: lag = 178200s > 176400s (49h), true since 49h0m, past for:15m
  - eval_time: 49h30m
    alertname: userJourneyBackupAvailabilityDaily
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailabilityDaily
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-availability
        cadence: daily
      exp_annotations:
        summary: "at least one HostedCluster has no successful daily backup in over 49h on mgmt-1"
        description: "At least one HostedCluster namespace on management cluster mgmt-1 has had no successful Velero daily backup in over 49 hours (2x the 24h cadence + 1h grace). Daily backups carry longer retention than 6-hourly; a gap here is a separate restore-point loss even if 6-hourly is healthy. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further (ARO-29949)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupAvailabilityDaily/mgmt-1"
# ========================================
# Availability weekly: same shape, threshold 337h (2x the 7d cadence + 1h
# grace), for: 1h. Sampled at 5m (not a sparser interval) - the alert expr is
# a bare instant-vector lookup with no range selector, so it relies on the
# default 5m staleness window; widely spaced samples would go stale between
# points in this test harness even though real Velero scrapes (~30s) never
# would.
# ========================================
- interval: 5m
  name: availability_weekly_stale
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-1", namespace="ns-hc-stuck", schedule="ns-hc-stuck-weekly"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc-stuck"}'
    values: "0+0x6000"
  alert_rule_test:
  # At 336h: lag = 1,209,600s < 1,213,200s (337h) - comfortably before the
  # threshold is even crossed.
  - eval_time: 336h
    alertname: userJourneyBackupAvailabilityWeekly
    exp_alerts: []
  # At 338h15m: lag = 1,217,700s > 1,213,200s (337h), true since 337h0m, past
  # for:1h with margin
  - eval_time: 338h15m
    alertname: userJourneyBackupAvailabilityWeekly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupAvailabilityWeekly
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-availability
        cadence: weekly
      exp_annotations:
        summary: "at least one HostedCluster has no successful weekly backup in over 337h on mgmt-1"
        description: "At least one HostedCluster namespace on management cluster mgmt-1 has had no successful Velero weekly backup in over 337 hours (2x the 7d cadence + 1h grace). Weekly backups carry the longest retention; a gap here is a separate restore-point loss even if 6-hourly/daily are healthy. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s). Known gap: does not yet exclude an individually-paused schedule - check pause state via the admin API before paging further (ARO-29949)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupAvailabilityWeekly/mgmt-1"
# ========================================
# NeverSucceeded 6-hourly: a successful-timestamp series does not exist until
# the first success. A schedule reporting status with no success timestamp
# for 12h (two 6-hourly production intervals) fires; a healthy sibling
# schedule must not mask it, and the first real success resolves it.
# ========================================
- interval: 1m
  name: never_succeeded_6hourly_observed_status_grace_healthy_sibling_and_first_success
  input_series:
  - series: velero_hcp_backup_last_status{cluster="never-success", namespace="ns-never", schedule="ns-never-6-hourly"}
    values: '0x800'
  - series: velero_hcp_backup_attempt_total{cluster="never-success", namespace="ns-never", schedule="ns-never-6-hourly"}
    values: 0+1x800
  - series: velero_hcp_backup_last_successful_timestamp{cluster="never-success", namespace="ns-never", schedule="ns-never-6-hourly"}
    values: _x741 44460x59
  - series: velero_hcp_backup_last_status{cluster="never-success", namespace="ns-healthy", schedule="ns-healthy-6-hourly"}
    values: 1x800
  - series: velero_hcp_backup_last_successful_timestamp{cluster="never-success", namespace="ns-healthy", schedule="ns-healthy-6-hourly"}
    values: 0+60x800
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="never-success", namespace="ns-never"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="never-success", namespace="ns-healthy"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 719m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
  - eval_time: 720m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupNeverSucceeded6Hourly
        cluster: never-success
        component: slo
        severity: '3'
        slo: backup-availability
        cadence: 6-hourly
      exp_annotations:
        summary: "at least one HostedCluster has no successful backup timestamp after 12h of observed 6-hourly schedule status on never-success"
        description: "At least one HostedCluster namespace on management cluster never-success has reported a 6-hourly schedule status without a successful backup timestamp for 12h. Check initial backup failures, metric resets, and schedule pause state. This signal requires an observed schedule status; it cannot detect a schedule that was never delivered. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupNeverSucceeded6Hourly/never-success"
  - eval_time: 740m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupNeverSucceeded6Hourly
        cluster: never-success
        component: slo
        severity: '3'
        slo: backup-availability
        cadence: 6-hourly
      exp_annotations:
        summary: "at least one HostedCluster has no successful backup timestamp after 12h of observed 6-hourly schedule status on never-success"
        description: "At least one HostedCluster namespace on management cluster never-success has reported a 6-hourly schedule status without a successful backup timestamp for 12h. Check initial backup failures, metric resets, and schedule pause state. This signal requires an observed schedule status; it cannot detect a schedule that was never delivered. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupNeverSucceeded6Hourly/never-success"
  - eval_time: 742m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
# ========================================
# NeverSucceeded 6-hourly per-MC collapse (same per-MC rationale as
# Availability above): two DIFFERENT schedules on one cluster have never
# succeeded. count by (cluster) (...) > 0 must still produce exactly ONE
# alert instance for the cluster (same {cluster} label set for both), not
# two.
# ========================================
- name: never_succeeded_6hourly_two_namespaces_fires_once_per_cluster
  interval: 1m
  input_series:
  - series: velero_hcp_backup_last_status{cluster="never-success-multi", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: '0x800'
  - series: velero_hcp_backup_last_status{cluster="never-success-multi", namespace="ns-b", schedule="ns-b-6-hourly"}
    values: '0x800'
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="never-success-multi", namespace="ns-a"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="never-success-multi", namespace="ns-b"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 720m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupNeverSucceeded6Hourly
        cluster: never-success-multi
        component: slo
        severity: '3'
        slo: backup-availability
        cadence: 6-hourly
      exp_annotations:
        summary: "at least one HostedCluster has no successful backup timestamp after 12h of observed 6-hourly schedule status on never-success-multi"
        description: "At least one HostedCluster namespace on management cluster never-success-multi has reported a 6-hourly schedule status without a successful backup timestamp for 12h. Check initial backup failures, metric resets, and schedule pause state. This signal requires an observed schedule status; it cannot detect a schedule that was never delivered. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupNeverSucceeded6Hourly/never-success-multi"
# ========================================
# NeverSucceeded 6-hourly overlapping-schedule regression: proves the
# count_over_time grace-clock design does not let two different schedules'
# breach windows add up to a shared clock neither earned individually.
# Schedule A breaches 0-8h then recovers; schedule B breaches 7h-15h. Their
# breach windows overlap (7h-8h), so a naive `count by (cluster) (...) > 0
# for: 12h` design would read continuously true from minute 0 and
# incorrectly fire at hour 12 even though neither A (8h total) nor B (8h
# total) individually reached the 12h grace. This must NOT fire at any
# point in this test - in particular not at 12h.
# ========================================
- interval: 1m
  name: never_succeeded_6hourly_overlapping_schedules_do_not_share_grace_clock
  input_series:
  # Schedule A: status present throughout; breaches (no success) for the
  # first 8h (480m), then recovers (success timestamp appears from 480m).
  - series: velero_hcp_backup_last_status{cluster="overlap-mc", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: "0x1000"
  - series: velero_hcp_backup_last_successful_timestamp{cluster="overlap-mc", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: "_x479 28800x520"
  # Schedule B: created at 7h (420m) - status absent before then; breaches
  # for 8h after creation (420m-900m), then recovers (success from 900m).
  - series: velero_hcp_backup_last_status{cluster="overlap-mc", namespace="ns-b", schedule="ns-b-6-hourly"}
    values: "_x419 0x580"
  - series: velero_hcp_backup_last_successful_timestamp{cluster="overlap-mc", namespace="ns-b", schedule="ns-b-6-hourly"}
    values: "_x899 28800x100"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="overlap-mc", namespace="ns-a"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="overlap-mc", namespace="ns-b"}'
    values: "0+0x6000"
  alert_rule_test:
  # A and B overlap 420m-480m. Neither schedule's own streak has reached
  # 12h (A: 480m total, already recovered; B: only 300m of its own 480m
  # total so far), so this must not fire.
  - eval_time: 720m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
  # B keeps breaching alone (A stays recovered) through its own full 480m
  # (8h), well short of its own 12h grace - still must not fire.
  - eval_time: 899m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
  # B recovers at 900m; both schedules are now healthy. Must never have
  # fired at any point in this test.
  - eval_time: 950m
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
- name: never_succeeded_no_schedule_inventory_is_not_fabricated
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 13h
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
- name: never_succeeded_daily_schedule_not_treated_as_production_six_hourly
