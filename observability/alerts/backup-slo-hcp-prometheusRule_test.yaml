# ========================================
# NeverSucceeded weekly: same unless-based logic, scoped to "-weekly"
# schedules and a 336h grace (two weekly production intervals). Sampled at
# 5m for the same staleness-window reason as Availability above.
# ========================================
- name: never_succeeded_weekly_fires_after_grace
  interval: 5m
  input_series:
  - series: velero_hcp_backup_last_status{cluster="never-weekly-mc", namespace="ns-never", schedule="ns-never-weekly"}
    values: '0+0x6000'
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="never-weekly-mc", namespace="ns-never"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 335h
    alertname: userJourneyBackupNeverSucceededWeekly
    exp_alerts: []
  - eval_time: 337h
    alertname: userJourneyBackupNeverSucceededWeekly
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupNeverSucceededWeekly
        cluster: never-weekly-mc
        component: slo
        severity: '3'
        slo: backup-availability
        cadence: weekly
      exp_annotations:
        summary: "at least one HostedCluster has no successful backup timestamp after 336h of observed weekly schedule status on never-weekly-mc"
        description: "At least one HostedCluster namespace on management cluster never-weekly-mc has reported a weekly schedule status without a successful backup timestamp for 336h. Check initial backup failures, metric resets, and schedule pause state. This signal requires an observed schedule status; it cannot detect a schedule that was never delivered. One alert fires per management cluster regardless of how many HostedClusters are affected - use the Velero dashboard's \"Hours Since Last Backup\" and \"Backup Schedule Last Status\" panels to identify which schedule(s)."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupNeverSucceededWeekly/never-weekly-mc"
# ========================================
# Errors: single tier, >0.5% failed-attempt share. The ratio is computed
# directly from the counters regardless of how much history exists (same
# reasoning as the delayed-completion test below), so a sustained 1% failure
# share is already "true" well before a full 6h of data accumulates - what
# actually gates firing is the `for: 30m` hold, not the window length.
# ========================================
- interval: 1m
  name: errors_breach
  input_series:
  - series: 'velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+100x60"
  - series: 'velero_hcp_backup_success_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+99x60"
  - series: 'velero_hcp_backup_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x60"
  - series: 'velero_hcp_backup_partial_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x60"
  - series: 'velero_hcp_backup_validation_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x60"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  # Ratio is already above 0.5% from the first minute, but `for: 30m` has
  # not elapsed yet - still pending, not firing.
  - eval_time: 10m
    alertname: userJourneyBackupErrors
    exp_alerts: []
  # 30m+ of continuous breach - firing.
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on mgmt-1"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Errors: delayed-failure regression test. A batch of attempts lands at t=0;
# failures complete ~10m later (matching the real 10m pre-hook timeout in
# internal/backup/backup.go:88), outside that attempt's own narrow slice.
# Computing the ratio from completed outcomes over the full 6h window (not an
# attempt-denominator short window) still catches this once `for: 30m`
# elapses after the failures land.
# ========================================
- interval: 1m
  name: errors_delayed_completion
  input_series:
  - series: 'velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0 50+0x80"
  - series: 'velero_hcp_backup_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+0x9 4+0x71"
  - series: 'velero_hcp_backup_partial_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x81"
  - series: 'velero_hcp_backup_validation_failure_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x81"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on mgmt-1"
        description: "Velero backup failed-attempt share on management cluster mgmt-1 is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Errors volume guard: ratio breaches the threshold (100% failures) but only
# 2 attempts in the 6h window - below the >= 5 floor. The alert must NOT
# fire despite the high error ratio. Evaluated at 40m (not 6h30m): by 6h30m
# the counter increments at minute 2 have aged out of the 6h rate() window
# entirely, making the ratio 0/0 (NaN) - that would pass even with the
# volume guard removed, so it wouldn't actually exercise the guard. At 40m
# the 100% failure ratio is still in-window and the for:30m hold has
# elapsed, so the volume floor is the only thing preventing this from firing.
# ========================================
- interval: 1m
  name: errors_below_volume_floor
  input_series:
  - series: 'velero_hcp_backup_attempt_total{cluster="mgmt-10", namespace="ns-low-vol", schedule="ns-low-vol-6-hourly"}'
    values: "0 0 2+0x400"
  - series: 'velero_hcp_backup_failure_total{cluster="mgmt-10", namespace="ns-low-vol", schedule="ns-low-vol-6-hourly"}'
    values: "0 0 2+0x400"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-10", namespace="ns-low-vol"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Errors: fires then recovers once outcomes return to all-success. Because
# the ratio is a rate() over a full 6h window, the failing minutes (0-370m)
# only fully roll out of the window once the window's start passes t=370m,
# i.e. at t=370+360=730m (12h10m) - recovery is checked comfortably after
# that, not immediately once successes resume.
# ========================================
- name: errors_fires_then_recovers_with_successes
  interval: 1m
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="recovery-errors", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: 0+100x780
  - series: velero_hcp_backup_success_total{cluster="recovery-errors", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: 0+99x370 36630+100x410
  - series: velero_hcp_backup_failure_total{cluster="recovery-errors", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: 0+1x370 370x410
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="recovery-errors", namespace="ns-a"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 6h20m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: recovery-errors
        component: slo
        severity: '3'
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on recovery-errors"
        description: "Velero backup failed-attempt share on management cluster recovery-errors is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 13h
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Errors: a schedule outside the three recurring cadences (e.g. a one-off
# key-rotation backup, named "<namespace>-keyrotation-<timestamp>" by
# backend/pkg/controllers/cluster/backups/key_rotation_controller.go) is
# excluded from the SLI population entirely, even while failing at 100%.
# Only the recurring-cadence schedule on the same cluster is counted, and
# it's healthy, so no alert fires.
# ========================================
- name: errors_excludes_non_cadence_schedule
  interval: 1m
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-a", schedule="ns-a-keyrotation-20261020"}
    values: 0+10x60
  - series: velero_hcp_backup_failure_total{cluster="mgmt-1", namespace="ns-a", schedule="ns-a-keyrotation-20261020"}
    values: 0+10x60
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: 0+100x60
  - series: velero_hcp_backup_success_total{cluster="mgmt-1", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: 0+100x60
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-a"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Latency: p99 duration stuck above 20 minutes (1200s) over a 6h window,
# sustained for 15m. All observations land in (1200,1800] (a finite bucket,
# not the +Inf overflow) so histogram_quantile can interpolate a concrete
# estimate.
# ========================================
- interval: 1m
  name: latency_breach
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="1200"}'
    values: "0x450"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="1800"}'
    values: "0+2x450"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+2x450"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+2x450"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 6h15m
    alertname: userJourneyBackupLatency
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupLatency
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-latency
      exp_annotations:
        summary: "Velero backup p99 duration above SLO (>20m) on mgmt-1"
        description: "Velero backup p99 duration on management cluster mgmt-1 is above 20 minutes over a 6h window, sustained for 15m (SLO: p99 < 20m, inside the 10m CSI snapshot / 15m item-operation timeouts). Same recurring-cadence scope and >=5 completed-backup volume floor as userJourneyBackupErrors, so a single slow backup can't swing the p99 on its own."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Latency: a single very slow backup alone pushes histogram_quantile(0.99,...)
# over 1200s, but the >=5 completed-backup volume floor (same pattern as
# userJourneyBackupErrors) holds the alert pending - one data point isn't
# enough to trust a p99 estimate.
# ========================================
- interval: 1m
  name: latency_single_sample_below_volume_floor
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="1200"}'
    values: "0x450"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="1800"}'
    values: "0x349 1x101"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0x349 1x101"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0x349 1x101"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 6h15m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Latency: healthy p99 well under 20m - no alert.
# ========================================
- interval: 1m
  name: latency_healthy
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="300"}'
    values: "0+2x450"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly", le="+Inf"}'
    values: "0+2x450"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+2x450"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 6h15m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Latency: mixed-duration, unequal-volume regression test (firing case). A
# high-volume fast schedule (50/min at ~50s, all <=60s) runs alongside a
# low-volume slow schedule (2/min at ~1700s, in (60,1800]). Slow share of
# total volume is 2/52 ~= 3.8%, comfortably over 1%, so the TRUE
# volume-weighted p99 interpolates to ~1348s - above the 1200s SLO.
# Aggregating bucket rates over the full window before one histogram_quantile
# call catches this (averaging two independently-computed 5m p99 values
# could miss it entirely).
# ========================================
- interval: 1m
  name: latency_mixed_volumes_breach
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly", le="60"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly", le="1800"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly", le="+Inf"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-few-slow", schedule="ns-few-slow-6-hourly", le="1800"}'
    values: "0+2x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-few-slow", schedule="ns-few-slow-6-hourly", le="+Inf"}'
    values: "0+2x50"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-few-slow", schedule="ns-few-slow-6-hourly"}'
    values: "0+2x50"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-many-fast"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-few-slow"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 45m
    alertname: userJourneyBackupLatency
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupLatency
        cluster: mgmt-1
        component: slo
        severity: "3"
        slo: backup-latency
      exp_annotations:
        summary: "Velero backup p99 duration above SLO (>20m) on mgmt-1"
        description: "Velero backup p99 duration on management cluster mgmt-1 is above 20 minutes over a 6h window, sustained for 15m (SLO: p99 < 20m, inside the 10m CSI snapshot / 15m item-operation timeouts). Same recurring-cadence scope and >=5 completed-backup volume floor as userJourneyBackupErrors, so a single slow backup can't swing the p99 on its own."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Latency: mixed-duration, unequal-volume regression test (non-firing case).
# Same shape, but the slow share drops to 1/201 ~= 0.5%, under the 1% mark -
# the 99th-percentile rank now falls entirely within the fast le="60" bucket,
# so the true p99 stays well under 60s and must not fire.
# ========================================
- interval: 1m
  name: latency_mixed_volumes_healthy
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly", le="60"}'
    values: "0+200x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly", le="1800"}'
    values: "0+200x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly", le="+Inf"}'
    values: "0+200x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-few-slow", schedule="ns-few-slow-6-hourly", le="1800"}'
    values: "0+1x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-1", namespace="ns-few-slow", schedule="ns-few-slow-6-hourly", le="+Inf"}'
    values: "0+1x50"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-many-fast", schedule="ns-many-fast-6-hourly"}'
    values: "0+200x50"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-1", namespace="ns-few-slow", schedule="ns-few-slow-6-hourly"}'
    values: "0+1x50"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-many-fast"}'
    values: "0+0x6000"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-few-slow"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 45m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Traffic: after a day of activity, sustained near-zero attempts must fire.
# The recent window spans 12h (two six-hour production intervals), then the
# condition must hold for another hour. Evaluate at 39h with margin.
# ========================================
- interval: 1m
  name: traffic_sustained_collapse
  input_series:
  - series: 'velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0+1x1440 1440+0.004x900"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 39h
    alertname: userJourneyBackupTraffic
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupTraffic
        cluster: mgmt-1
        component: slo
        severity: "4"
        slo: backup-traffic
      exp_annotations:
        summary: "Velero backup attempts collapsed below 10% of 1d baseline on mgmt-1"
        description: "Velero backup attempt rate on management cluster mgmt-1 is below 10% of its 1-day average, sustained across a 12h window for 1h. Likely a global/per-cluster backup-schedule pause (check backend.backupScheduleState and per-cluster admin API state before paging further), the Backup Schedule Controller stuck, or kube-applier delivery broken - not an individual HC's problem."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Traffic: healthy synchronized six-hour bursts, with constant counters
# between them. Check near the end of the quiet gap before the next burst;
# a two-hour observation window would incorrectly fire here.
# ========================================
- interval: 1m
  name: traffic_healthy_six_hour_bursts
  input_series:
  - series: 'velero_hcp_backup_attempt_total{cluster="mgmt-1", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "0 60x359 120x359 180x359 240x359 300x359 360x359"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-1", namespace="ns-hc1"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 35h
    alertname: userJourneyBackupTraffic
    exp_alerts: []
- name: traffic_six_hour_bursts_stop_and_recover
  interval: 1m
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="traffic-recovery", namespace="ns-a", schedule="ns-a-6-hourly"}
    values: 0 60x359 120x359 180x359 240x899 300x179
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="traffic-recovery", namespace="ns-a"}'
    values: "0+0x6000"
  alert_rule_test:
  - eval_time: 23h
    alertname: userJourneyBackupTraffic
    exp_alerts: []
  - eval_time: 32h
    alertname: userJourneyBackupTraffic
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupTraffic
        cluster: traffic-recovery
        component: slo
        severity: '4'
        slo: backup-traffic
      exp_annotations:
        summary: "Velero backup attempts collapsed below 10% of 1d baseline on traffic-recovery"
        description: "Velero backup attempt rate on management cluster traffic-recovery is below 10% of its 1-day average, sustained across a 12h window for 1h. Likely a global/per-cluster backup-schedule pause (check backend.backupScheduleState and per-cluster admin API state before paging further), the Backup Schedule Controller stuck, or kube-applier delivery broken - not an individual HC's problem."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
  - eval_time: 34h
    alertname: userJourneyBackupTraffic
    exp_alerts: []
# ========================================
# Deletion-gate cases (ARO-30442 / ARO-30446): the gauge
# hostedClusterAPI_deletion_timestamp_seconds excludes deleting/deleted
# HostedClusters. Both the gauge and velero_hcp_* carry namespace=ocm-*,
# so the gate joins directly on (cluster, namespace) in this HCP workspace.
# ========================================
# ========================================
# Availability (ARO-30446): a HostedCluster marked for deletion must not trigger
# the freshness alert. velero keeps exporting the frozen
# velero_hcp_backup_last_successful_timestamp, so the lag grows past 13h, but
# deletion_timestamp > 0 means the gate drops the schedule - no alert, even though
# the ungated expression would fire.
# ========================================
- interval: 5m
  name: availability_6hourly_excludes_marked_for_deletion
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-avd", namespace="ns-del", schedule="ns-del-6-hourly"}'
    values: "0+0x160"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-avd", namespace="ns-del"}'
    values: "1700000000+0x160"
  alert_rule_test:
  - eval_time: 13h20m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts: []
# ========================================
# Availability (ARO-30446): the deleted-cluster case. The HostedCluster CR is
# gone, so its hostedClusterAPI_deletion_timestamp_seconds series is absent, but velero's
# last-successful timestamp lingers (frozen) in the metrics - the exact situation
# that kept these alerts firing for deleted clusters. The gate requires a live,
# not-marked-for-deletion HostedCluster, so the lingering timestamp is dropped and
# the alert stays silent.
# ========================================
- interval: 5m
  name: availability_6hourly_excludes_deleted_cluster
  input_series:
  - series: 'velero_hcp_backup_last_successful_timestamp{cluster="mgmt-avdel", namespace="ns-del", schedule="ns-del-6-hourly"}'
    values: "0+0x160"
  # No hostedClusterAPI_deletion_timestamp_seconds for ns-del: the HostedCluster is gone.
  alert_rule_test:
  - eval_time: 13h20m
    alertname: userJourneyBackupAvailability6Hourly
    exp_alerts: []
# ========================================
# NeverSucceeded (ARO-30446): a cluster deleted or marked for deletion before its
# first successful backup must not be flagged "never succeeded". Both ns-del
# (deletion_timestamp > 0) and ns-gone (HostedCluster CR gone, so no gauge) have a
# lingering status and no success timestamp for 13h - ungated this fires, gated it
# must not.
# ========================================
- interval: 1m
  name: never_succeeded_6hourly_excludes_deleting_and_deleted_cluster
  input_series:
  - series: velero_hcp_backup_last_status{cluster="never-del", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: '0x800'
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="never-del", namespace="ns-del"}'
    values: 1700000000+0x800
  - series: velero_hcp_backup_last_status{cluster="never-del", namespace="ns-gone", schedule="ns-gone-6-hourly"}
    values: '0x800'
  # No gauge for ns-gone: the HostedCluster CR has been removed.
  alert_rule_test:
  - eval_time: 13h
    alertname: userJourneyBackupNeverSucceeded6Hourly
    exp_alerts: []
# ========================================
# Errors: a backup that races an HCP deletion finishes PartiallyFailed, but the
# cluster is marked for deletion (ARO-30442) - hostedClusterAPI_deletion_timestamp_seconds
# > 0 for its namespace - so the gate drops its outcomes and the alert must not
# fire, even though the ungated management-cluster ratio (100 success / 200 =
# 0.50) is far below the 0.995 threshold with ample attempt volume. The healthy
# live peer (ns-live) continues to be counted.
# ========================================
- name: errors_excludes_deleting_cluster
  interval: 1m
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-del", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+100x60
  - series: velero_hcp_backup_success_total{cluster="mgmt-del", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+100x60
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-del", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: 0+100x60
  - series: velero_hcp_backup_partial_failure_total{cluster="mgmt-del", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: 0+100x60
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-del", namespace="ns-live"}'
    values: 0+0x60
  # ns-del is marked for deletion: a non-zero deletionTimestamp (Unix seconds).
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-del", namespace="ns-del"}'
    values: 1700000000+0x60
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Errors: the deleted-cluster tail. The HostedCluster is fully gone, so its
# hostedClusterAPI_deletion_timestamp_seconds series is ABSENT, but velero's process
# counters keep exporting ns-del's partial_failure increment for the rest of the
# 6h rate() window (the reason the real incident's alert kept firing for hours
# after the cluster was deleted). Gating on the continued existence of a live,
# not-marked-for-deletion HostedCluster still drops ns-del here: ungated ratio is
# 22/(22+1) = 0.9565 (would fire), gated ratio is 22/22 = 1.0 (no fire).
# ========================================
- name: errors_excludes_deleted_cluster_tail
  interval: 1m
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-tail", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+22x60
  - series: velero_hcp_backup_success_total{cluster="mgmt-tail", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+22x60
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-tail", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: 0+1x60
  - series: velero_hcp_backup_partial_failure_total{cluster="mgmt-tail", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: 0+1x60
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-tail", namespace="ns-live"}'
    values: 0+0x60
  # No hostedClusterAPI_deletion_timestamp_seconds for ns-del: the HostedCluster CR has
  # been deleted, yet velero still exports its lingering partial_failure counter.
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Errors: the gate does not over-suppress. A live, not-marked-for-deletion
# HostedCluster (ns-live) with a real failure still breaches the SLO even while a
# peer HostedCluster (ns-del) on the same management cluster is being deleted.
# Gated ratio counts only ns-live: 99/(99+1) = 0.99 < 0.995 -> fires.
# ========================================
- name: errors_fires_on_live_failures_despite_deleting_peer
  interval: 1m
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-mix", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+100x60
  - series: velero_hcp_backup_success_total{cluster="mgmt-mix", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+99x60
  - series: velero_hcp_backup_failure_total{cluster="mgmt-mix", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: 0+1x60
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-mix", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: 0+100x60
  - series: velero_hcp_backup_partial_failure_total{cluster="mgmt-mix", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: 0+100x60
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-mix", namespace="ns-live"}'
    values: 0+0x60
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-mix", namespace="ns-del"}'
    values: 1700000000+0x60
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupErrors
        cluster: mgmt-mix
        component: slo
        severity: "3"
        slo: backup-errors
      exp_annotations:
        summary: "Velero backup failure rate above SLO (>0.5%) on mgmt-mix"
        description: "Velero backup failed-attempt share on management cluster mgmt-mix is above the 0.5% SLO boundary (99.5% success budget), sustained over a 6h window for 30m."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
# ========================================
# Errors: gated volume floor on a mixed, low-eligible-volume cluster. One live
# backup fails (ns-live: 1 attempt, 1 failure) alongside many excluded deleting
# peers (ns-del: 20 attempts). Ungated, the floor would count 21 >= 5 and fire on
# that single eligible failure; gated, the floor counts only ns-live's 1 attempt
# (< 5), so the low-volume noise the floor exists to suppress stays suppressed.
# ========================================
- interval: 1m
  name: errors_volume_floor_gated_mixed_low_eligible_volume
  input_series:
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-lowvol", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: "0 1+0x60"
  - series: velero_hcp_backup_failure_total{cluster="mgmt-lowvol", namespace="ns-live", schedule="ns-live-6-hourly"}
    values: "0 1+0x60"
  - series: velero_hcp_backup_attempt_total{cluster="mgmt-lowvol", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: "0+20x60"
  - series: velero_hcp_backup_partial_failure_total{cluster="mgmt-lowvol", namespace="ns-del", schedule="ns-del-6-hourly"}
    values: "0+20x60"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-lowvol", namespace="ns-live"}'
    values: "0+0x60"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-lowvol", namespace="ns-del"}'
    values: "1700000000+0x60"
  alert_rule_test:
  - eval_time: 40m
    alertname: userJourneyBackupErrors
    exp_alerts: []
# ========================================
# Latency: slow backups from a HostedCluster being deleted (ARO-30442) must not
# push p99 over the SLO. ns-del's backups all land in (1200,1800] with ample
# volume, but it is marked for deletion (deletion_timestamp > 0), so the gate
# drops its buckets; only the fast live peer (ns-live, all <=60s) remains, so the
# p99 stays well under 1200s. Ungated, the slow share (10/60) would interpolate
# the p99 above 1200s and fire.
# ========================================
- interval: 1m
  name: latency_excludes_deleting_cluster
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-del", namespace="ns-live", schedule="ns-live-6-hourly", le="60"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-del", namespace="ns-live", schedule="ns-live-6-hourly", le="1800"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-del", namespace="ns-live", schedule="ns-live-6-hourly", le="+Inf"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-lat-del", namespace="ns-live", schedule="ns-live-6-hourly"}'
    values: "0+50x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-del", namespace="ns-del", schedule="ns-del-6-hourly", le="1200"}'
    values: "0x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-del", namespace="ns-del", schedule="ns-del-6-hourly", le="1800"}'
    values: "0+10x50"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-del", namespace="ns-del", schedule="ns-del-6-hourly", le="+Inf"}'
    values: "0+10x50"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-lat-del", namespace="ns-del", schedule="ns-del-6-hourly"}'
    values: "0+10x50"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-lat-del", namespace="ns-live"}'
    values: "0+0x50"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-lat-del", namespace="ns-del"}'
    values: "1700000000+0x50"
  alert_rule_test:
  - eval_time: 45m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Latency: gated volume floor on a mixed, low-eligible-volume cluster. One live
# slow backup (ns-live: 1 sample in (1200,1800]) alongside many excluded deleting
# peers (ns-del: 10 slow samples). Ungated, the count floor would reach >= 5 and
# fire on that single eligible slow backup; gated, it counts only ns-live's 1
# sample (< 5), so a one-sample p99 can't trip the alert.
# ========================================
- interval: 1m
  name: latency_volume_floor_gated_mixed_low_eligible_volume
  input_series:
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-lowvol", namespace="ns-live", schedule="ns-live-6-hourly", le="1200"}'
    values: "0x61"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-lowvol", namespace="ns-live", schedule="ns-live-6-hourly", le="1800"}'
    values: "0 1+0x60"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-lowvol", namespace="ns-live", schedule="ns-live-6-hourly", le="+Inf"}'
    values: "0 1+0x60"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-lat-lowvol", namespace="ns-live", schedule="ns-live-6-hourly"}'
    values: "0 1+0x60"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-lowvol", namespace="ns-del", schedule="ns-del-6-hourly", le="1200"}'
    values: "0x61"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-lowvol", namespace="ns-del", schedule="ns-del-6-hourly", le="1800"}'
    values: "0+10x60"
  - series: 'velero_hcp_backup_duration_seconds_bucket{cluster="mgmt-lat-lowvol", namespace="ns-del", schedule="ns-del-6-hourly", le="+Inf"}'
    values: "0+10x60"
  - series: 'velero_hcp_backup_duration_seconds_count{cluster="mgmt-lat-lowvol", namespace="ns-del", schedule="ns-del-6-hourly"}'
    values: "0+10x60"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-lat-lowvol", namespace="ns-live"}'
    values: "0+0x60"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-lat-lowvol", namespace="ns-del"}'
    values: "1700000000+0x60"
  alert_rule_test:
  - eval_time: 45m
    alertname: userJourneyBackupLatency
    exp_alerts: []
# ========================================
# Gate health (Simon #372 / Copilot #407): the deletion gate fails closed, so a
# management cluster that still reports velero backups but has lost its
# deletion-timestamp gauge must raise userJourneyBackupDeletionGaugeAbsent rather
# than silently disabling every gated alert. Cluster-level, so a single deleting
# HC (gauge gone, velero lingering) does not false-fire while the MC still has a
# gauge for its other HCs.
# ========================================
- interval: 1m
  name: gate_gauge_absent_fires
  input_series:
  - series: 'velero_hcp_backup_last_status{cluster="mgmt-nogauge", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "1+0x120"
  alert_rule_test:
  # for: 1h not yet elapsed
  - eval_time: 30m
    alertname: userJourneyBackupDeletionGaugeAbsent
    exp_alerts: []
  - eval_time: 65m
    alertname: userJourneyBackupDeletionGaugeAbsent
    exp_alerts:
    - exp_labels:
        alertname: userJourneyBackupDeletionGaugeAbsent
        cluster: mgmt-nogauge
        component: slo
        severity: "3"
        slo: backup-availability
      exp_annotations:
        summary: "deletion-timestamp gauge missing while velero backups are reported on mgmt-nogauge"
        description: "Management cluster mgmt-nogauge exports velero backup-schedule metrics but no hostedClusterAPI_deletion_timestamp_seconds series. The backup SLO alerts gate on that gauge and fail closed, so they are currently blind on this cluster. Check kube-state-metrics health and the metric's relabeling/routing to the HCP workspace. Until this clears, backup failures on this cluster will not alert."
        runbook_url: "https://aka.ms/arohcp-runbook-backup"
        correlationId: "userJourneyBackupDeletionGaugeAbsent/mgmt-nogauge"
- interval: 1m
  name: gate_gauge_present_does_not_fire
  input_series:
  - series: 'velero_hcp_backup_last_status{cluster="mgmt-ok", namespace="ns-hc1", schedule="ns-hc1-6-hourly"}'
    values: "1+0x120"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-ok", namespace="ns-hc1"}'
    values: "0+0x120"
  alert_rule_test:
  - eval_time: 65m
    alertname: userJourneyBackupDeletionGaugeAbsent
    exp_alerts: []
- interval: 1m
  name: gate_single_deleted_hc_does_not_fire_when_cluster_has_other_gauge
  input_series:
  # ns-del is deleting: velero lingers, its gauge is gone...
  - series: 'velero_hcp_backup_last_status{cluster="mgmt-mixed", namespace="ns-del", schedule="ns-del-6-hourly"}'
    values: "1+0x120"
  # ...but ns-live is healthy with a gauge, so the cluster still has one.
  - series: 'velero_hcp_backup_last_status{cluster="mgmt-mixed", namespace="ns-live", schedule="ns-live-6-hourly"}'
    values: "1+0x120"
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-mixed", namespace="ns-live"}'
    values: "0+0x120"
  alert_rule_test:
  - eval_time: 65m
    alertname: userJourneyBackupDeletionGaugeAbsent
    exp_alerts: []
- interval: 1m
  name: gate_no_velero_schedules_does_not_fire
  input_series:
  - series: 'hostedClusterAPI_deletion_timestamp_seconds{cluster="mgmt-empty", namespace="ns-hc1"}'
    values: "0+0x120"
  alert_rule_test:
  - eval_time: 65m
    alertname: userJourneyBackupDeletionGaugeAbsent
    exp_alerts: []
