# promtool unit tests for cluster-deletion-slo-prometheusRule.yaml
# Run with: promtool test rules cluster-deletion-slo-prometheusRule_test.yaml
#
# Design notes:
# - backend_resource_operation_phase_info is a gauge always equal to 1.
#   count() over N such series returns N (one per operation).
# - The error alerts now use windowed recording rules
#   (errors:backend_cluster_deletion_operation:{failed,total,error_rate}_{1h,6h,3d})
#   which filter operations by (time() - last_transition_time_seconds) < W.
#   Every error-test operation therefore needs BOTH phase_info AND
#   last_transition_time_seconds so the windowed rules can evaluate.
# - Recording rules are evaluated first at each step; alert expressions then
#   reference those results.
# - time() at eval_time Nm = N * 60 seconds (promtool starts at Unix epoch 0).
#   This matters for stuck-operations and windowed recording rules.
rule_files:
- cluster-deletion-slo-prometheusRule.yaml
- cluster-deletion-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ─────────────────────────────────────────────────────────────────────────────
# userJourneyClusterDeletionErrors1h5m
# Fast burn: error_rate_1h > 0.72 AND failed_1h >= 3, sustained for 5 minutes.
# Setup: 8 failed + 3 succeeded = 8/11 = 72.7 % > 72 % threshold.
# last_transition_time = 100; at eval_time 10m, time() = 600,
# (600 - 100) = 500 < 3600 → all ops inside 1h window.
# ─────────────────────────────────────────────────────────────────────────────
- name: fast_burn_fires_above_72pct
  interval: 1m
  input_series:
  # 8 failed operations (phase_info + last_transition_time for each)
