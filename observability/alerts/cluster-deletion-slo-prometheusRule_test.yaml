# Stuck operation that flaps (backend retry resets last_transition_time)
# A genuinely-wedged delete stays in "deleting" the whole time, but the backend
# retries the operation at t=70m and resets last_transition_time, so
# (time() - last_transition_time) briefly drops below the 3600s threshold.
# The max_over_time(...[6h:5m]) hold must keep the SAME alert firing across
# this gap so a continuously-stuck resource maps to a single long-lived IcM
# incident instead of a fresh incident every few hours.
- name: stuck_flap_holds_through_retry
  interval: 1m
  input_series:
  # phase stays "deleting" throughout
  - series: 'backend_resource_operation_phase_info{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="deleting",resource_id="flap1",subscription_id="sub1",cluster="svc-1"}'
    values: "1+0x200"
  # last_transition_time=0 until t=69m (age crosses 3600s at t=60m);
  # backend retries at t=70m so last_transition_time jumps to 4200s
  # and age re-crosses 3600s only at t=130m.
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="deleting",resource_id="flap1",subscription_id="sub1",cluster="svc-1"}'
    values: "0+0x70 4200+0x130"
  alert_rule_test:
  # Raw condition true (age 5400s > 3600s) → firing.
  - eval_time: 90m
    alertname: userJourneyClusterDeletionStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: svc-1
        severity: "4"
        slo: cluster-deletion-stuck
        component: slo
        exclude_internal_subscriptions: "true"
        operation_type: delete
        phase: deleting
        resource_id: flap1
        resource_type: microsoft.redhatopenshift/hcpopenshiftclusters
        subscription_id: sub1
      exp_annotations:
        title: "Cluster deletion operation stuck in non-terminal phase for over 1 hour"
        summary: "Cluster deletion operation flap1 stuck in deleting for over 1 hour"
        correlationId: "userJourneyClusterDeletionStuckOperation/svc-1/sub1"
        description: "Cluster delete operation for flap1 has been in deleting phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
  # Raw condition FALSE here (last_transition_time reset → age < 3600s) but the
  # resource is still wedged. The 6h hold keeps the same alert firing → no
  # resolve, no duplicate IcM incident.
  - eval_time: 100m
    alertname: userJourneyClusterDeletionStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: svc-1
        severity: "4"
        slo: cluster-deletion-stuck
        component: slo
        exclude_internal_subscriptions: "true"
        operation_type: delete
        phase: deleting
        resource_id: flap1
        resource_type: microsoft.redhatopenshift/hcpopenshiftclusters
        subscription_id: sub1
      exp_annotations:
        title: "Cluster deletion operation stuck in non-terminal phase for over 1 hour"
        summary: "Cluster deletion operation flap1 stuck in deleting for over 1 hour"
        correlationId: "userJourneyClusterDeletionStuckOperation/svc-1/sub1"
        description: "Cluster delete operation for flap1 has been in deleting phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
# Alert clears when operation reaches terminal state.
# A stuck delete fires the alert, then the operation succeeds. Even though
# max_over_time would hold the stale value for up to 6h, the top-level
# 'and on (...)' gate checks the live phase_info is still in a non-terminal
# phase (== 1). Once the operation completes, phase_info drops to 0 → the
# gate filters it out → alert clears.
- name: stuck_clears_on_terminal_state
  interval: 1m
  input_series:
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="deleting",resource_id="clears1",subscription_id="sub1",cluster="svc-1"}'
    values: "0+0x120"
  # phase_info=1 (deleting) until t=85m, then 0 (operation reached terminal state)
  - series: 'backend_resource_operation_phase_info{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="deleting",resource_id="clears1",subscription_id="sub1",cluster="svc-1"}'
    values: "1+0x85 0+0x35"
  alert_rule_test:
  # Alert fires: threshold 3600s crossed at 60m + 15m for = 75m. Eval at 80m confirms.
  - eval_time: 80m
    alertname: userJourneyClusterDeletionStuckOperation
    exp_alerts:
    - exp_labels:
        cluster: svc-1
        severity: "4"
        slo: cluster-deletion-stuck
        component: slo
        exclude_internal_subscriptions: "true"
        operation_type: delete
        phase: deleting
        resource_id: clears1
        resource_type: microsoft.redhatopenshift/hcpopenshiftclusters
        subscription_id: sub1
      exp_annotations:
        title: "Cluster deletion operation stuck in non-terminal phase for over 1 hour"
        summary: "Cluster deletion operation clears1 stuck in deleting for over 1 hour"
        correlationId: "userJourneyClusterDeletionStuckOperation/svc-1/sub1"
        description: "Cluster delete operation for clears1 has been in deleting phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
  # Alert clears: operation reached terminal state at t=86m, phase_info dropped
  # to 0, 'and on (...)' gate removes the series despite max_over_time hold.
  - eval_time: 95m
    alertname: userJourneyClusterDeletionStuckOperation
    exp_alerts: []
# Stuck does NOT fire for operations that are less than 1 hour old
