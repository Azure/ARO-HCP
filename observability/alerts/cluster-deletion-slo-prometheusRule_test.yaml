    values: "1+0x20"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="failed",resource_id="r1",subscription_id="sub1", cluster="svc-1"}'
    values: "100+0x20"
