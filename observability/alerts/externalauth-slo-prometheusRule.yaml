apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: externalauth-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # ExternalAuth SLO Alerts — Errors
  # ========================================
  # Multi-window burn-rate alerting using unified recording rules from
  # backend-operation-slo-recordingRule.yaml (PR #7370).
  #
  # SLO: 95% of ExternalAuth operations (create/update/delete) should succeed.
  # Error Budget: 5% (1 - 0.95)
  #
  # Each operation_type keeps its own series, matching the unified recording
  # rules (PR #7370). A failing create does not burn the update or delete budget.
  #
  # Noise guard: >= 2 failures of that operation_type before the rate fires.
  # ExternalAuth traffic is low (~24 ops/hr), so a single failure could produce
  # a misleadingly high error rate. The >= 2 guard prevents alert spam.
  #
  # Burn rate thresholds calculated from 95% SLO (5% error budget):
  #   Fast (14.4x): 14.4 * 0.05 = 0.72 → 72% error rate
  #   Medium (6x):  6 * 0.05 = 0.30 → 30% error rate
  #   Slow (1x):    1 * 0.05 = 0.05 → 5% error rate
  #
  # The 'for' duration enforces sustained observation, approximating the
  # short window of multi-window burn rate alerting.
  - name: arohcp_externalauth_slo_error_alerts
    labels:
      component: slo
    rules:
    # ----------------------------------------
    # Fast Burn Alert (IcM Sev 3 — RP lane / customer-facing user journey)
    # ----------------------------------------
    # 14.4x burn rate → >72% failure rate sustained for 5 minutes
    # Would exhaust 7-day error budget in ~12 hours
    - alert: userJourneyExternalAuthErrors1h5m
      expr: |
        (
          errors:backend_resource_operation:failed_1h{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          }
          /
          clamp_min(
            errors:backend_resource_operation:total_1h{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
            },
            1
          )
          > 0.72
        )
        and
        (
          errors:backend_resource_operation:failed_1h{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          } >= 2
        )
      for: 5m
      labels:
        severity: "3"
        slo: externalauth-errors
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} error rate critically high (>72%)"
        description: "More than 72% of ExternalAuth {{ $labels.operation_type }} operations have failed in the last hour, indicating a fast error budget burn (14.4x) that would exhaust the 95% SLO budget in ~12 hours."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
    # ----------------------------------------
    # Medium Burn Alert (IcM Sev 3)
    # ----------------------------------------
    # 6x burn rate → >30% failure rate sustained for 30 minutes
    # Would exhaust 7-day error budget in ~28 hours
    - alert: userJourneyExternalAuthErrors6h30m
      expr: |
        (
          errors:backend_resource_operation:failed_6h{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          }
          /
          clamp_min(
            errors:backend_resource_operation:total_6h{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
            },
            1
          )
          > 0.30
        )
        and
        (
          errors:backend_resource_operation:failed_6h{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          } >= 2
        )
      for: 30m
      labels:
        severity: "3"
        slo: externalauth-errors
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} error rate elevated (>30%) for 30+ minutes"
        description: "More than 30% of ExternalAuth {{ $labels.operation_type }} operations have failed in the last 6 hours sustained over 30 minutes, indicating a medium error budget burn (6x) that would exhaust the 95% SLO budget in ~28 hours."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
    # ----------------------------------------
    # Slow Burn Alert (IcM Sev 4 — ticket)
    # ----------------------------------------
    # Per ADR: slow burn alerts generate a ticket, not a page.
    # 1x burn rate → >5% failure rate sustained for 6 hours
    # Would exhaust 7-day error budget in ~7 days
    - alert: userJourneyExternalAuthErrors3d
      expr: |
        (
          errors:backend_resource_operation:failed_3d{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          }
          /
          clamp_min(
            errors:backend_resource_operation:total_3d{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
            },
            1
          )
          > 0.05
        )
        and
        (
          errors:backend_resource_operation:failed_3d{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          } >= 2
        )
      for: 6h
      labels:
        severity: "4"
        slo: externalauth-errors
        long_window: 3d
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} error rate exceeds SLO target (>5%) for 6+ hours"
        description: "More than 5% of ExternalAuth {{ $labels.operation_type }} operations have failed in the last 3 days sustained over 6 hours, indicating persistent degradation at the 95% SLO boundary that would exhaust the error budget in ~7 days."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
    # ----------------------------------------
    # Degradation Alert (IcM Sev 4 — ticket)
    # ----------------------------------------
    # With a 95% SLO, the fast-burn threshold only fires at ~72% failure rate.
    # This provides early warning at 15% failure rate before burn-rate alerts fire.
    # Precursor signal → Sev 4 per ADR.
    - alert: userJourneyExternalAuthErrorsDegradation
      expr: |
        (
          errors:backend_resource_operation:failed_1h{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          }
          /
          clamp_min(
            errors:backend_resource_operation:total_1h{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
            },
            1
          )
          > 0.15
        )
        and
        (
          errors:backend_resource_operation:failed_1h{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
          } >= 2
        )
      for: 30m
      labels:
        severity: "4"
        slo: externalauth-errors
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} failure rate exceeds 15% for 30 minutes"
        description: "The ExternalAuth {{ $labels.operation_type }} failure rate has been above 15% for 30 minutes. This provides early warning of degradation before SLO-based burn rate alerts fire."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
  # ========================================
  # ExternalAuth SLO Alerts — Latency
  # ========================================
  # Multi-window burn rate of succeeded operations that exceeded the per-verb
  # latency SLO, using externalauth-slo-recordingRule.yaml. Same tiers and
  # sample floor as the cluster deletion latency alerts.
  #
  # SLO: 95% of succeeded operations complete within the verb timeout
  # (create 900s, update 600s, delete 900s). operation_type stays on the series.
  #
  # Sample guard: >= 5 succeeded samples in the long window, so one slow
  # operation on a quiet window cannot page.
  #
  # Burn rate thresholds from the 95% latency SLO (5% budget):
  #   Fast (14.4x):  >72% slow over 1h and 5m
  #   Medium (6x):   >30% slow over 6h and 30m
  #   Slow (1x):     >5% slow over 3d
  - name: arohcp_externalauth_slo_latency_alerts
    labels:
      component: slo
    rules:
    # 14.4x burn → >72% slow, sustained 5m. Sev 3.
    - alert: userJourneyExternalAuthLatency1h5m
      expr: |
        errors:backend_externalauth_operation:latency_total_1h >= 5
        and
        errors:backend_externalauth_operation:latency_error_rate_1h > 0.72
        and
        errors:backend_externalauth_operation:latency_error_rate_5m > 0.72
      for: 5m
      labels:
        severity: "3"
        slo: externalauth-latency
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} latency SLO fast burn (>72% slow for 5m)"
        description: "More than 72% of succeeded ExternalAuth {{ $labels.operation_type }} operations exceeded the latency SLO (create 15m, update 10m, delete 15m) over the last hour and the last 5 minutes, with at least 5 samples. Fast burn (14.4x) against the 95% latency SLO."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
    # 6x burn → >30% slow, sustained 30m. Sev 3.
    - alert: userJourneyExternalAuthLatency6h30m
      expr: |
        errors:backend_externalauth_operation:latency_total_6h >= 5
        and
        errors:backend_externalauth_operation:latency_error_rate_6h > 0.30
        and
        errors:backend_externalauth_operation:latency_error_rate_30m > 0.30
      for: 30m
      labels:
        severity: "3"
        slo: externalauth-latency
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} latency SLO medium burn (>30% slow for 30m)"
        description: "More than 30% of succeeded ExternalAuth {{ $labels.operation_type }} operations exceeded the latency SLO (create 15m, update 10m, delete 15m) over the last 6 hours and the last 30 minutes, with at least 5 samples. Medium burn (6x) against the 95% latency SLO."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
    # 1x burn → >5% slow, sustained 6h. Sev 4 ticket.
    - alert: userJourneyExternalAuthLatency3d
      expr: |
        errors:backend_externalauth_operation:latency_total_3d >= 5
        and
        errors:backend_externalauth_operation:latency_error_rate_3d > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: externalauth-latency
        long_window: 3d
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth {{ $labels.operation_type }} latency SLO slow burn (>5% slow for 6h)"
        description: "More than 5% of succeeded ExternalAuth {{ $labels.operation_type }} operations exceeded the latency SLO (create 15m, update 10m, delete 15m) over the last 3 days, with at least 5 samples. Slow burn (1x) against the 95% latency SLO."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
  # ========================================
  # ExternalAuth SLO Alerts — Stuck Operations
  # ========================================
  # SLO-grade stuck operation alert with stickiness (max_over_time hold).
  # Complements the per-verb stuck alerts in backend/alerts/ by preventing
  # incident duplication when backend retries reset start_time.
  #
  # Threshold: 1 hour (3600s). ExternalAuth operations involve no VM
  # provisioning and should complete within 15 minutes (E2E timeout).
  # 1 hour provides a generous backstop.
  #
  # Stickiness (max_over_time ... [6h:]): while a resource stays wedged, the
  # raw condition can transiently clear when the backend retries the operation
  # and resets backend_resource_operation_start_time_seconds. Each clear
  # auto-resolves the IcM incident and the next re-fire opens a new one.
  # Holding the condition firing over a 6h look-back collapses a
  # continuously-stuck resource into a single long-lived incident.
  #
  # AwaitingSecret is not a stuck phase. The operation is waiting on the
  # customer's client secret, not on the platform.
  - name: arohcp_externalauth_slo_stuck_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyExternalAuthStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (
              (
                (time() - backend_resource_operation_start_time_seconds{
                  resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths"
                })
                and
                backend_resource_operation_phase_info{
                  resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths",
                  phase=~"accepted|provisioning|updating|deleting"
                } == 1
              ) > 3600
            )[6h:5m]
          )
        )
        and on (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase)
        (
          backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/externalauths",
            phase=~"accepted|provisioning|updating|deleting"
          } == 1
        )
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth operation for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 1 hour"
        description: "ExternalAuth operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
  # ========================================
  # ExternalAuth Alerts — Saturation
  # ========================================
  # Queue depth impacts ExternalAuth operations directly,
  # making these user journey signals per ADR. Sev 4 (precursor).
  - name: arohcp_externalauth_saturation_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyExternalAuthSaturationQueueDepth
      expr: |
        max by (name, cluster) (
          max without(prometheus_replica) (
            workqueue_depth{namespace="aro-hcp", name=~".*ExternalAuth.*"}
          )
        ) > 10
      for: 5m
      labels:
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: ExternalAuth controller workqueue {{ $labels.name }} depth is high"
        description: "ExternalAuth controller workqueue {{ $labels.name }} has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "https://aka.ms/arohcp-runbook-externalauth"
