apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: access-cluster-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Access the Cluster SLO Alerts — Errors
  # ========================================
  # Error-rate burn-rate alerting for credential operations lives in the
  # windowed, volume-aware group arohcp_access_cluster_slo_windowed_error_alerts,
  # which counts only operations whose terminal transition landed inside the
  # window instead of the trailing 7-day gauge ratio. This group retains the
  # stuck-operation detector, which catches operations wedged in a non-terminal
  # phase (invisible to the success/failure SLIs).
  - name: arohcp_access_cluster_slo_error_alerts
    labels:
      component: slo
    rules:
    # ----------------------------------------
    # Stuck Operations Alert
    # ----------------------------------------
    # Operations stuck in non-terminal phases are invisible to success/failure SLIs.
    # Threshold: 1 hour (3600s) with 15m sustained observation.
    # Credential operations are expected to complete faster than node pool operations
    # (no VM provisioning), so 1 hour is appropriate (vs. 2 hours for node pools).
    - alert: userJourneyAccessClusterStuckOperation
      expr: |
        (
          (time() - backend_resource_operation_start_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type=~"requestcredential|revokecredentials"
          })
          and
          backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type=~"requestcredential|revokecredentials",
            phase=~"accepted|provisioning|deleting"
          } == 1
        ) > 3600
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: Credential operation for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 1 hour"
        description: "Credential operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
  # ========================================
  # Access the Cluster Alerts — Saturation
  # ========================================
  # Queue depth and retry rates for credential controllers.
  # IcM Sev 4 (precursor).
  - name: arohcp_access_cluster_saturation_alerts
    labels:
      component: slo
    rules:
    # Queue depth: credential controller workqueue accumulating work
    - alert: userJourneyAccessClusterSaturationQueueDepth
      expr: |
        max by (name, cluster) (
          max without(prometheus_replica) (
            workqueue_depth{namespace="aro-hcp", name=~".*(RequestCredential|RevokeCredentials).*"}
          )
        ) > 10
      for: 5m
      labels:
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: Credential controller workqueue {{ $labels.name }} depth is high"
        description: "Credential controller workqueue {{ $labels.name }} has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
    # Retry hot loop: high retry ratio on credential workqueue
    - alert: userJourneyAccessClusterSaturationRetryHotLoop
      expr: |
        (
          sum by (name, cluster) (
            max without(prometheus_replica) (
              rate(workqueue_retries_total{namespace="aro-hcp", name=~".*(RequestCredential|RevokeCredentials).*"}[10m])
            )
          )
          /
          sum by (name, cluster) (
            max without(prometheus_replica) (
              rate(workqueue_adds_total{namespace="aro-hcp", name=~".*(RequestCredential|RevokeCredentials).*"}[10m])
            )
          )
        ) > 0.5
        and
        sum by (name, cluster) (
          max without(prometheus_replica) (
            rate(workqueue_adds_total{namespace="aro-hcp", name=~".*(RequestCredential|RevokeCredentials).*"}[10m])
          )
        ) > 0.008
      for: 10m
      labels:
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: Credential controller workqueue {{ $labels.name }} retry hot loop"
        description: "Credential controller workqueue {{ $labels.name }} has a retry ratio > 50% sustained over 10 minutes, indicating most queue activity is failed retries rather than fresh work."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
  # ========================================
  # Access the Cluster SLO Alerts: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # These read the windowed recording rules
  # (errors:backend_credential_operation:{failed,total,error_rate}_{1h,6h,3d}),
  # which count only credential operations whose terminal transition landed
  # inside the window, so each tier evaluates a real event window instead of the
  # trailing 7-day gauge ratio. Stateless and level-driven: no new metric and no
  # backend change, matching what the access-cluster SLO dashboard already does.
  #
  # Volume guard: credential operation volume per cluster is low, so a pure ratio
  # is dominated by tiny denominators; each tier also requires an absolute floor
  # of completions/failures in the window so a single failure cannot page. The
  # floors below mirror cluster-provision and should be tuned to real credential
  # traffic per region.
  - name: arohcp_access_cluster_slo_windowed_error_alerts
    labels:
      component: slo
    rules:
    # Fast Burn (IcM Sev 3, page). 14.4x burn: >72% failures over 1h, >=3 failures.
    - alert: UserJourneyAccessClusterErrorBurst1h
      expr: |
        errors:backend_credential_operation:failed_1h >= 3
        and
        errors:backend_credential_operation:error_rate_1h > 0.72
      for: 5m
      labels:
        severity: "3"
        slo: access-cluster-errors
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.cluster }}: Credential operations failing fast (>72% of recent operations)"
        description: "More than 72% of completed credential operations (requestcredential/revokecredentials) on {{ $labels.cluster }} failed over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
    # Medium Burn (IcM Sev 3, page). 6x burn: >30% failures over 6h, >=5 completions.
    - alert: UserJourneyAccessClusterErrorBurst6h
      expr: |
        errors:backend_credential_operation:total_6h >= 5
        and
        errors:backend_credential_operation:error_rate_6h > 0.30
      for: 30m
      labels:
        severity: "3"
        slo: access-cluster-errors
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.cluster }}: Credential operation error rate elevated (>30% over 6h)"
        description: "More than 30% of completed credential operations on {{ $labels.cluster }} failed over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
    # Slow Burn / Budget (IcM Sev 4, ticket). 1x burn: >5% failures over 3d, >=10 completions, >=2 failures.
    - alert: UserJourneyAccessClusterErrorBudget3d
      expr: |
        errors:backend_credential_operation:total_3d >= 10
        and
        errors:backend_credential_operation:failed_3d >= 2
        and
        errors:backend_credential_operation:error_rate_3d > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: access-cluster-errors
        long_window: 3d
      annotations:
        summary: "{{ $labels.cluster }}: Credential operation error budget burning (>5% over 3d)"
        description: "More than 5% of completed credential operations on {{ $labels.cluster }} failed over the last 3 days (at least 10 completions and 2 failures), a 1x burn that exhausts the 95% SLO error budget over the window."
        runbook_url: "aka.ms/arohcp-runbook-access-cluster"
