- interval: 1m
  name: "Empty MC: idle operator with no HostedClusters does not fire hypershiftOperatorIdle"
  # Same flat reconcile counter as the idle case, but the last HostedCluster
  # was deleted at 10m, so there is nothing to reconcile.
  input_series:
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", result="success", cluster="mc1"}'
    values: "5+0x100"
  - series: 'hypershift_hostedclusters{platform="Azure", cluster="mc1"}'
    values: "1+0x9 0+0x90"
  alert_rule_test:
  - eval_time: 60m
    alertname: hypershiftOperatorIdle
    exp_alerts: []
  - eval_time: 100m
    alertname: hypershiftOperatorIdle
    exp_alerts: []
- interval: 1m
  name: "Operator scaled to zero then up: Availability tiers are not silenced by 0/0"
  # spec=0 for 300m (0/0), then spec=2 with 1 available (0.5).
  # Unguarded, the scaled-down period records NaN and avg_over_time stays NaN
  # until those samples leave the long window (1h tier ~370m, 6h tier ~690m).
  # Guarded, it records nothing and each tier fires once its sample-count
  # guard and for: allow.
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "0x299 1x500"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "0x299 2x500"
