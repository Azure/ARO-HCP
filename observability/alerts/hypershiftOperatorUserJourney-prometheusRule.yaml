apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-user-journey-services-alerts
  namespace: prometheus
spec:
  # HyperShift Operator threshold alerts - services workspace.
  # prometheus.yaml remote-write sends inputs from the "hypershift" namespace
  # here; HCP-namespace-backed alerts live in hypershiftUserJourney-prometheusRule.yaml.
  # Burn-rate alerts are deferred until the shared recordings are live in
  # production, stakeholders approve the targets, and an alert-tester report
  # validates the proposed alerts. Threshold alerts do not depend on those targets.
  #
  # summary omits {{ $labels.cluster }}: the RP bicep prefixes the IcM title
  # with the cluster label.
  groups:
  # HyperShift Operator health, one operator per management cluster.
  - name: hypershift-operator-monitor-rules
    labels:
      component: slo
    rules:
    # Severity is tied to the number of unavailable pods (desired - available)
    # rather than a burn rate: with only a few replicas a ratio burn rate adds
    # nothing. max by (cluster) dedupes KSM and HA Prometheus replicas.
    # Both are Sev 3 (customer-facing journey degraded): per the ARO HCP
    # alerting ADR, Sev 2 is reserved for direct SLA breach (KAS availability).
    # PodsDown fires sooner for a larger outage.
    - alert: userJourneyHypershiftOperatorAvailabilityPodsUnavailable
      expr: |
        max by (cluster) (kube_deployment_spec_replicas{namespace="hypershift", deployment="operator"})
        - max by (cluster) (kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator"})
        >= 1
      for: 15m
      labels:
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "hypershift-operator pods unavailable"
        description: |
          {{ $value }} hypershift-operator pod(s) have been unavailable for 15 minutes.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyHypershiftOperatorAvailabilityPodsUnavailable/{{ $labels.cluster }}"
    - alert: userJourneyHypershiftOperatorAvailabilityPodsDown
      expr: |
        max by (cluster) (kube_deployment_spec_replicas{namespace="hypershift", deployment="operator"})
        - max by (cluster) (kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator"})
        >= 2
      for: 5m
      labels:
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "hypershift-operator pods down"
        description: |
          {{ $value }} hypershift-operator pods have been unavailable for 5 minutes.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyHypershiftOperatorAvailabilityPodsDown/{{ $labels.cluster }}"
    # Zero reconciles for 30m: a live operator always requeues, so a flat zero
    # means it is wedged. Gated on HostedClusters being present: an empty MC
    # (last HostedCluster deleted) legitimately has nothing to reconcile. With
    # no operator pods there is no reconcile series, so this stays quiet and
    # the pod alerts fire instead.
    - alert: userJourneyHypershiftOperatorTrafficIdle
      expr: |
        hypershift:operator:reconcile:rate5m == 0
        and on (cluster)
        sum by (cluster) (max by (cluster, platform) (hypershift_hostedclusters)) > 0
      for: 30m
      labels:
        severity: "3"
        slo: hypershift-operator-traffic
        service: hypershift-operator
      annotations:
        summary: "hypershift-operator has not reconciled anything for 30 minutes"
        description: |
          hypershift-operator has not reconciled anything for 30 minutes while HostedClusters exist.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyHypershiftOperatorTrafficIdle/{{ $labels.cluster }}"
