apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-user-journey-services-alerts
  namespace: prometheus
spec:
  # HyperShift Operator threshold alerts (services workspace).
  # CPO alerts: hypershiftUserJourney-prometheusRule.yaml.
  # Burn-rate alerts require production recordings, approved targets, and alert-tester validation.
  # RP deployment prefixes summaries with the cluster label.
  groups:
  # HyperShift Operator health, one operator per management cluster.
  - name: hypershift-operator-monitor-rules
    labels:
      component: slo
    rules:
    # Unavailable pods = desired - available; max by (cluster) dedupes KSM/HA replicas.
    # Both tiers are Sev 3; PodsDown fires sooner for larger outages.
    # Share a per-cluster correlation ID so overlapping tiers open one incident.
    - alert: userJourneyHypershiftOperatorAvailabilityPodsUnavailable
      expr: |
        max by (cluster) (kube_deployment_spec_replicas{namespace="hypershift", deployment="operator"})
        - max by (cluster) (kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator"})
        >= 1
      for: 15m
      labels:
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "hypershift-operator pods unavailable"
        description: |
          {{ $value }} hypershift-operator pod(s) have been unavailable for 15 minutes.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyHypershiftOperatorAvailabilityPodsUnavailable/{{ $labels.cluster }}"
    - alert: userJourneyHypershiftOperatorAvailabilityPodsDown
      expr: |
        max by (cluster) (kube_deployment_spec_replicas{namespace="hypershift", deployment="operator"})
        - max by (cluster) (kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator"})
        >= 2
      for: 5m
      labels:
        severity: "3"
        slo: hypershift-operator-availability
        service: hypershift-operator
      annotations:
        summary: "hypershift-operator pods down"
        description: |
          {{ $value }} hypershift-operator pods have been unavailable for 5 minutes.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyHypershiftOperatorAvailabilityPodsUnavailable/{{ $labels.cluster }}"
    # Require HostedClusters so empty management clusters do not alert.
    # Missing reconcile telemetry leaves pod outages to the availability alerts.
    - alert: userJourneyHypershiftOperatorTrafficIdle
      expr: |
        hypershift:operator:reconcile:rate5m == 0
        and on (cluster)
        sum by (cluster) (max by (cluster, platform) (hypershift_hostedclusters)) > 0
      for: 30m
      labels:
        severity: "3"
        slo: hypershift-operator-traffic
        service: hypershift-operator
      annotations:
        summary: "hypershift-operator has not reconciled anything for 30 minutes"
        description: |
          hypershift-operator has not reconciled anything for 30 minutes while HostedClusters exist.
          Management Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-hypershift
        correlationId: "userJourneyHypershiftOperatorTrafficIdle/{{ $labels.cluster }}"
