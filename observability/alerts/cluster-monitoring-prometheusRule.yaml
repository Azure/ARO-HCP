apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-monitoring-rules
  namespace: monitoring
spec:
  groups:
  # Cluster Monitoring user journey (ARO-26147 / ARO-26272).
  # Candidate rules for SAW alert-tester validation before raising severity.
  # Registered only in alerts-rp-hcps.yaml so the Azure prometheusRuleGroup name
  # does not collide with the DEV HCP module's action-group routing.
  #
  # Only monitoring ClusterOperator alerts ship for now. Guest Alertmanager /
  # prometheus-operator rules need openshift-monitoring StatefulSet and
  # prometheus-operator series from the guest; mgmt-agent ksmhcp currently
  # scrapes only nodes + ingress-controller (resources.go), so those alerts
  # are deferred until collection is expanded.
  - name: cluster-monitoring-rules
    labels:
      component: slo
    rules:
    # Monitoring ClusterOperator Available=false on an HCP that has workers.
    - alert: UJClusterMonitoringOperatorUnavailable
      expr: |
        max by (cluster, namespace) (
          cluster_operator_conditions{name="monitoring", condition="available"}
        ) == 0
        and on (cluster, namespace)
        (
          sum by (cluster, namespace) (node_collector_zone_size) > 0
        )
      for: 30m
      labels:
        severity: "4"
        slo: cluster-monitoring-availability
        service: cluster-monitoring
      annotations:
        summary: "{{ $labels.cluster }}: Cluster Monitoring operator unavailable on {{ $labels.namespace }}"
        description: |
          The monitoring ClusterOperator on hosted cluster {{ $labels.namespace }}
          (management cluster {{ $labels.cluster }}) has been Available=false for 30 minutes
          while worker nodes are present. Customer/platform monitoring (CMO, Alertmanager,
          prometheus-operator) may be down or not reconciling.
        correlationId: "UJClusterMonitoringOperatorUnavailable/{{ $labels.cluster }}/{{ $labels.namespace }}"
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"

    # Monitoring ClusterOperator Degraded=true on an HCP that has workers.
    - alert: UJClusterMonitoringOperatorDegraded
      expr: |
        max by (cluster, namespace) (
          cluster_operator_conditions{name="monitoring", condition="degraded"}
        ) == 1
        and on (cluster, namespace)
        (
          sum by (cluster, namespace) (node_collector_zone_size) > 0
        )
      for: 2h
      labels:
        severity: "4"
        slo: cluster-monitoring-availability
        service: cluster-monitoring
      annotations:
        summary: "{{ $labels.cluster }}: Cluster Monitoring operator degraded on {{ $labels.namespace }}"
        description: |
          The monitoring ClusterOperator on hosted cluster {{ $labels.namespace }}
          (management cluster {{ $labels.cluster }}) has been Degraded=true for 2 hours
          while worker nodes are present. Alert routing or scrape targets may be impaired.
        correlationId: "UJClusterMonitoringOperatorDegraded/{{ $labels.cluster }}/{{ $labels.namespace }}"
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
