apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-autoscaler-slo-rules
  namespace: monitoring
spec:
  groups:
  # Recording rules consumed by these alerts live in
  # observability/recording-rules/cluster-autoscaler-slo-recordingRule.yaml
  # (deployed to the HCP Azure Monitor Workspace via recording-rules-hcps.yaml).
  #
  # ========================================
  # Cluster Autoscaler Alerts — Autoscaler Health
  # ========================================
  # The autoscaler itself is broken/degraded: not looping, refusing to act, or
  # throwing internal errors. These are unambiguously SRE-owned.
  - name: arohcp_cluster_autoscaler_health_alerts
    labels:
      component: slo
    rules:
    # The autoscaler main loop has not run recently: the control loop is wedged
    # while the pod is still running. NOTE: this alert does NOT fire when the
    # autoscaler pod is down — the upstream metric disappears and the recording
    # rule produces no series. A separate absent-detection alert is needed for
    # the down-pod case (follow-up).
    - alert: UserJourneyClusterAutoscalerStalled
      expr: |
        health:cluster_autoscaler:seconds_since_last_activity > 600
      for: 15m
      labels:
        severity: "4"
        slo: cluster-autoscaler-health
      annotations:
        summary: "{{ $labels.namespace }}: cluster autoscaler main loop stalled"
        description: "The cluster autoscaler for hosted cluster {{ $labels.namespace }} has not completed a main loop iteration in over 10 minutes, sustained for 15 minutes. The autoscaler pod is running but its control loop is wedged; no scaling is happening for this hosted cluster. Note: this alert only fires while the pod is running — a truly dead autoscaler pod produces no metric and requires separate absent-detection. This is an autoscaler malfunction, independent of the customer's autoscaling configuration."
        correlationId: 'UserJourneyClusterAutoscalerStalled/{{ $labels.cluster }}/{{ $labels.namespace }}'
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-autoscaler"
    # The autoscaler has declared the cluster unsafe to autoscale and stopped
    # making scaling decisions (usually unready/unregistered/long-unregistered
    # nodes). Scaling is frozen by a condition the autoscaler detected, not by the
    # customer's settings.
    - alert: UserJourneyClusterAutoscalerSafetyDisabled
      expr: |
        health:cluster_autoscaler:safe_to_autoscale == 0
      for: 15m
      labels:
        severity: "4"
        slo: cluster-autoscaler-health
      annotations:
        summary: "{{ $labels.namespace }}: cluster autoscaler is not safe to autoscale"
        description: "The cluster autoscaler for hosted cluster {{ $labels.namespace }} has reported cluster_safe_to_autoscale=0 for over 15 minutes. While unsafe, the autoscaler makes no scaling decisions. This is usually caused by unready, unregistered, or long-unregistered nodes and requires SRE investigation of node health."
        correlationId: 'UserJourneyClusterAutoscalerSafetyDisabled/{{ $labels.cluster }}/{{ $labels.namespace }}'
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-autoscaler"
    # All cluster autoscaler metrics across the fleet have been absent for
    # 5 minutes (recording rule window) sustained for 5 minutes. This
    # indicates a total loss of autoscaler telemetry — e.g. PrometheusAgent
    # or remote-write pipeline failure — rather than individual pods being
    # down. Per-hosted-cluster absence detection is a follow-up.
    - alert: UserJourneyClusterAutoscalerMetricsAbsent
      expr: |
        health:cluster_autoscaler:fleet_metrics_availability == 0
      for: 5m
      labels:
        severity: "3"
        slo: cluster-autoscaler-health
      annotations:
        summary: "Fleet-wide cluster autoscaler metrics absent"
        description: "No cluster autoscaler metrics have been received from any hosted cluster for over 5 minutes (sustained for 5 minutes). This indicates a total loss of autoscaler telemetry — likely a PrometheusAgent or remote-write pipeline failure rather than individual autoscaler pods being down. Investigate the monitoring pipeline on the affected management cluster(s)."
        correlationId: 'UserJourneyClusterAutoscalerMetricsAbsent'
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-autoscaler"
    # The autoscaler is logging internal errors (cloud provider errors, API
    # errors, etc.) at a sustained rate — the scaling controller is malfunctioning.
    - alert: UserJourneyClusterAutoscalerErrors
      expr: |
        errors:cluster_autoscaler:errors:rate15m > 0
      for: 15m
      labels:
        severity: "4"
        slo: cluster-autoscaler-health
      annotations:
        summary: "{{ $labels.namespace }}: cluster autoscaler is reporting internal errors"
        description: "The cluster autoscaler for hosted cluster {{ $labels.namespace }} has been recording internal errors (cluster_autoscaler_errors_total) for over 15 minutes. This points at a malfunction in the scaling controller (cloud provider or API errors) that an SRE should investigate; it is independent of the customer's autoscaling configuration."
        correlationId: 'UserJourneyClusterAutoscalerErrors/{{ $labels.cluster }}/{{ $labels.namespace }}'
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-autoscaler"
  # ========================================
  # Cluster Autoscaler Alerts — Scaling Blocked
  # ========================================
  # The autoscaler is running but cannot carry out a scale-up: attempts fail, or
  # there is headroom below the customer's max yet pending pods are not getting
  # nodes. Both mean the scaling operation itself is impaired (infra/quota, not a
  # customer ceiling), so they are SRE-actionable.
  - name: arohcp_cluster_autoscaler_scaling_alerts
    labels:
      component: slo
    rules:
    # Scale-up attempts are actively failing (quota exhaustion, no capacity in the
    # zone/VM size, provider errors). The scaling operation is failing.
    - alert: UserJourneyClusterAutoscalerScaleUpFailures
      expr: |
        errors:cluster_autoscaler:failed_scale_ups:rate15m > 0
      for: 15m
      labels:
        severity: "3"
        slo: cluster-autoscaler-scaling
      annotations:
        summary: "{{ $labels.namespace }}: cluster autoscaler scale-up attempts are failing"
        description: "The cluster autoscaler for hosted cluster {{ $labels.namespace }} has been recording failed scale-up attempts for over 15 minutes. Common causes are Azure quota exhaustion, lack of capacity in the target zone/VM size, or provider errors — all SRE/infra concerns. Pending pods will not receive new nodes until this clears."
        correlationId: 'UserJourneyClusterAutoscalerScaleUpFailures/{{ $labels.cluster }}/{{ $labels.namespace }}'
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-autoscaler"
    # Scale-up is stuck: pods are unschedulable AND there is still headroom below
    # the max (ready < max) AND the autoscaler is safe to act (safe_to_autoscale=1),
    # yet the demand is not being resolved. The autoscaler is allowed and needs to
    # add nodes but isn't succeeding — a blocked scaling operation. This is kept
    # distinct from (a) a customer simply hitting their configured ceiling (not
    # alerted) and (b) the autoscaler having disabled itself for safety, which is
    # owned by UserJourneyClusterAutoscalerSafetyDisabled. The safe_to_autoscale==1
    # gate prevents a duplicate incident for that same root cause.
    - alert: UserJourneyClusterAutoscalerScaleUpStuck
      expr: |
        (
          pods:cluster_autoscaler:unschedulable_count > 0
        )
        and on (cluster, namespace)
        (
          nodes:cluster_autoscaler:ready_count < nodes:cluster_autoscaler:max_count
        )
        and on (cluster, namespace)
        (
          health:cluster_autoscaler:safe_to_autoscale == 1
        )
      for: 20m
      labels:
        severity: "3"
        slo: cluster-autoscaler-scaling
      annotations:
        summary: "{{ $labels.namespace }}: cluster autoscaler scale-up appears stuck (pending pods with headroom)"
        description: "For over 20 minutes the cluster autoscaler for hosted cluster {{ $labels.namespace }} has had unschedulable pods while still below its maximum node count (headroom available) and while it is safe to act (safe_to_autoscale=1). Demand exists and the autoscaler is willing to add nodes, but the pods are not being scheduled — the scale-up operation is blocked (e.g. provisioning stuck or a small number of nodes failing to join). This is distinct from a cluster at its configured max (not alerted) and from the autoscaler having disabled itself for safety (see UserJourneyClusterAutoscalerSafetyDisabled). SRE investigation needed."
        correlationId: 'UserJourneyClusterAutoscalerScaleUpStuck/{{ $labels.cluster }}/{{ $labels.namespace }}'
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-autoscaler"
