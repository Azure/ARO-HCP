apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: user-journey-cluster-upgrade-alerts
  namespace: monitoring
spec:
  groups:
  - name: rp-user-journey-cluster-upgrade-monitor-rules-v2
    rules:
    - alert: userJourneyClusterUpgradeStuck
      expr: |
        hosted_control_plane_upgrade:stuck:bool == 1
      for: 5m
      labels:
        severity: "4"
        slo: cluster-upgrade
        component: slo
      annotations:
        summary: "{{ $labels.cluster }}: Cluster upgrade on {{ $labels.resource_id }} is stuck"
        description: |
          The cluster version change (upgrade or rollback) has not converged. The target exceeded 20 minutes in desired or 30 minutes in progress, with a further 5-minute alert pending window. This cluster-level condition remains active across target and phase changes until the current observed targets complete or deletion/uninstallation is confirmed. Inspect backend_cluster_version_info and backend_cluster_upgrade_target_info for version details.
          Service Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-cluster-upgrade
        correlationId: "userJourneyClusterUpgradeStuck/{{ $labels.cluster }}{{ $labels.resource_id }}"
