  - series: 'konnectivity_network_proxy_server_stream_errors_total{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3", pod="konnectivity-0", segment="to_agent", code="error-b", packet_type="DIAL_RSP"}'
    values: "0+2x10"
  promql_expr_test:
  - expr: 'konnectivity:stream_errors:rate5m{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3"} > bool 0.04'
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3"}'
      value: 1
