  - series: 'konnectivity_network_proxy_server_stream_errors_total{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3", pod="konnectivity-0", segment="to_agent", code="error-b", packet_type="DIAL_RSP"}'
    values: "0+2x10"
  promql_expr_test:
  - expr: 'konnectivity:stream_errors:rate5m{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3"} > bool 0.04'
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3"}'
      value: 1
# Test 29: A shortfall counts only after eleven consecutive 1m samples (10 minutes).
- interval: 1m
  input_series:
  - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", cluster="mgmt-sustain", namespace="ocm-prod-abc123", deployment="router"}'
    values: "3+0x50"
  - series: 'kube_deployment_status_replicas_available{job="kube-state-metrics", cluster="mgmt-sustain", namespace="ocm-prod-abc123", deployment="router"}'
    values: "3+0x9 2+0x10 3+0x30"
  promql_expr_test:
  - expr: 'swift_router_replicas:unavailable_sustained{cluster="mgmt-sustain"}'
    eval_time: 19m
    exp_samples:
    - labels: '{__name__="swift_router_replicas:unavailable_sustained", cluster="mgmt-sustain"}'
      value: 0
  - expr: 'swift_router_replicas:unavailable_sustained{cluster="mgmt-sustain"}'
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="swift_router_replicas:unavailable_sustained", cluster="mgmt-sustain"}'
      value: 1
  - expr: 'swift_router_replicas:unavailable_sustained{cluster="mgmt-sustain"}'
    eval_time: 30m
    exp_samples:
    - labels: '{__name__="swift_router_replicas:unavailable_sustained", cluster="mgmt-sustain"}'
      value: 0
# Test 30: A shortfall of ten samples or fewer is never counted, which covers
# node eviction (5 minutes) plus AKS auto-repair reboot.
- interval: 1m
  input_series:
  - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", cluster="mgmt-brief", namespace="ocm-prod-abc123", deployment="router"}'
    values: "3+0x50"
  - series: 'kube_deployment_status_replicas_available{job="kube-state-metrics", cluster="mgmt-brief", namespace="ocm-prod-abc123", deployment="router"}'
    values: "3+0x9 0+0x9 3+0x31"
  promql_expr_test:
  - expr: 'max_over_time(swift_router_replicas:unavailable_sustained{cluster="mgmt-brief"}[50m])'
    eval_time: 50m
    exp_samples:
    - labels: '{cluster="mgmt-brief"}'
      value: 0
