# Test 26: Absolute Konnectivity errors remain visible when packet telemetry is absent.
- interval: 1m
  input_series:
  - series: 'konnectivity_network_proxy_server_stream_errors_total{cluster="mgmt-errors-no-packets", namespace="ocm-prod-abc123", region="westus3"}'
    values: "0+1x10"
  promql_expr_test:
  - expr: 'konnectivity:stream_error_rate:5m{cluster="mgmt-errors-no-packets", namespace="ocm-prod-abc123"}'
    eval_time: 5m
    exp_samples: []
  - expr: 'konnectivity:stream_errors:rate5m{cluster="mgmt-errors-no-packets", namespace="ocm-prod-abc123"} > bool 0'
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="mgmt-errors-no-packets", namespace="ocm-prod-abc123", region="westus3"}'
      value: 1
# Test 27: The normalized stream-error ratio may exceed 1 when errors outnumber packets.
- interval: 1m
  input_series:
  - series: 'konnectivity_network_proxy_server_stream_errors_total{cluster="mgmt-error-ratio", namespace="ocm-prod-abc123"}'
    values: "0+10x10"
  - series: 'konnectivity_network_proxy_server_stream_packets_total{cluster="mgmt-error-ratio", namespace="ocm-prod-abc123"}'
    values: "0+5x10"
  promql_expr_test:
  - expr: 'count(konnectivity:stream_error_rate:5m{cluster="mgmt-error-ratio", namespace="ocm-prod-abc123"} > 1)'
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
# Test 28: Absolute error rate sums distinct error categories from the same pod.
- interval: 1m
  input_series:
  - series: 'konnectivity_network_proxy_server_stream_errors_total{cluster="mgmt-error-categories", namespace="ocm-prod-abc123", region="westus3", pod="konnectivity-0", segment="from_agent", code="error-a", packet_type="DIAL_REQ"}'
