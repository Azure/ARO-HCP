apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: metrics-proxy-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: metrics-proxy
    labels:
      component: monitoring-infrastructure
    rules:
    # Maestro agent sidecar nginx (container metrics-proxy, port 8080) is the
    # scrape path for maestro-agent /metrics. Platform Prometheus already has
    # its own rules in prometheus-prometheusRule.yaml — do not duplicate them.
    #
    # HyperShift CP metrics-proxy (guest CMO metrics-forwarding in ocm-*
    # namespaces) is not deployed by ARO-HCP today; do not page on its absence.
    #
    # Pattern matches MiseEnvoyScrapeDown: kube-state-metrics up series exists
    # for the management cluster (existence signal; value 0 still counts), but
    # the maestro-agent metrics scrape is not up==1. Catches both up=0 and a
    # missing target. Svc clusters do not run maestro-agent, so the existence
    # signal is scoped to *-mgmt-*.
    - alert: MaestroAgentMetricsProxyDown
      expr: |
        group by (cluster) (up{job="kube-state-metrics", cluster=~".*-mgmt(-[0-9]+)?$"})
        unless on (cluster)
        group by (cluster) (up{namespace="maestro", endpoint="metrics", pod=~"maestro-agent-.*"} == 1)
      for: 10m
      labels:
        severity: "3"
      annotations:
        summary: "Maestro agent metrics-proxy scrape is down"
        description: "Prometheus has not scraped maestro-agent /metrics through the metrics-proxy sidecar (namespace=maestro, endpoint=metrics) for 10 minutes, while a kube-state-metrics scrape series still exists for this management cluster. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
