apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: metrics-proxy-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: metrics-proxy
    labels:
      component: monitoring-infrastructure
    rules:
    # Maestro agent sidecar nginx (container metrics-proxy, port 8080) is the
    # scrape path for maestro-agent /metrics. Platform Prometheus already has
    # its own rules in prometheus-prometheusRule.yaml — do not duplicate them.
    #
    # HyperShift CP metrics-proxy (guest CMO metrics-forwarding in ocm-*
    # namespaces) is not deployed by ARO-HCP today; do not page on its absence.
    #
    # Pattern matches MiseEnvoyScrapeDown: enumerate management clusters via a
    # guaranteed-present kube-state-metrics series (kube_node_info), then remove
    # the clusters where the maestro-agent pod is Ready. The `up` scrape-health
    # series is dropped under AMA, so health is derived from KSM pod readiness
    # instead of scrape state. Svc clusters do not run maestro-agent, so the
    # existence signal is scoped to *-mgmt-*.
    - alert: MaestroAgentMetricsProxyDown
      expr: |
        group by (cluster) (kube_node_info{cluster=~".*-mgmt(-[0-9]+)?$"})
        unless on (cluster)
        group by (cluster) (kube_pod_status_ready{namespace="maestro", pod=~"maestro-agent-.*", condition="true"} == 1)
      for: 10m
      labels:
        severity: "3"
      annotations:
        summary: "Maestro agent pod is not ready"
        description: "The maestro-agent pod (namespace=maestro) has not been Ready for 10 minutes on this management cluster, so maestro-agent /metrics are not being served through the metrics-proxy sidecar. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
