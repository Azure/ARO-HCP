apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: metrics-proxy-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: metrics-proxy
    labels:
      component: monitoring-infrastructure
    rules:
    # Maestro agent sidecar nginx (container metrics-proxy, port 8080) is the
    # scrape path for maestro-agent /metrics. Platform Prometheus already has
    # its own rules in prometheus-prometheusRule.yaml — do not duplicate them.
    #
    # HyperShift CP metrics-proxy (guest CMO metrics-forwarding in ocm-*
    # namespaces) is not deployed by ARO-HCP today; do not page on its absence.
    #
    # Use declared inventory so missing cluster telemetry cannot hide an outage.
    # Service clusters do not run maestro-agent.
    - alert: MaestroAgentMetricsProxyDown
      expr: |
        group by (cluster) (underlay_clusters{cluster=~".*-mgmt(-[0-9]+)?$"})
        unless on (cluster)
        group by (cluster) (kube_pod_status_ready{namespace="maestro", pod=~"maestro-agent-.*", condition="true"} == 1)
      for: 10m
      labels:
        severity: "3"
      annotations:
        summary: "Maestro agent pod is not ready"
        description: "No maestro-agent pod is Ready in namespace maestro on this declared management cluster, or its readiness metrics are missing. Maestro agent metrics and any alerts that depend on them may be missing."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-monitoring"
