apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-availability
  namespace: monitoring
spec:
  groups:
  - name: etcd-availability
    rules:
    # ========================================
    # Burn-rate tiers per ADR-001 (MWMBR):
    #   Fast  (1h/5m):  fires in 5m   — severity: 3
    #   Medium (6h/30m): fires in 30m  — severity: 3
    #   Slow  (3d):     fires in 6h   — severity: 4
    # For histogram metrics the rate window matches the short window,
    # with a dual-window (short AND long) confirmation for fast/medium.
    # For gauge/increase metrics only the 'for' duration varies.
    # ========================================

    # ----------------------------------------
    # userJourneyEtcdBackendCommitDurationHigh
    # ----------------------------------------
    - alert: userJourneyEtcdBackendCommitDurationHigh1h5m
      expr: |
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[5m]))) > 0.025
        and
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[1h]))) > 0.025
      for: 5m
      labels:
        component: hcp
        severity: "3"
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.instance }} etcd backend commit duration is high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has 99th percentile backend commit duration of {{ $value }}s (threshold: 25ms). Slow disk performance may impact write performance. Fast burn (1h/5m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdBackendCommitDurationHigh6h30m
      expr: |
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[30m]))) > 0.025
        and
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[6h]))) > 0.025
      for: 30m
      labels:
        component: hcp
        severity: "3"
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.instance }} etcd backend commit duration is high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has 99th percentile backend commit duration of {{ $value }}s (threshold: 25ms). Slow disk performance may impact write performance. Medium burn (6h/30m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdBackendCommitDurationHigh3d
      expr: |
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[6h]))) > 0.025
      for: 6h
      labels:
        component: hcp
        severity: "4"
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.instance }} etcd backend commit duration is chronically high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has 99th percentile backend commit duration of {{ $value }}s (threshold: 25ms). Slow disk performance may impact write performance. Slow burn (3d)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd

    # ----------------------------------------
    # userJourneyEtcdDatabaseHighFragmentation
    # ----------------------------------------
    - alert: userJourneyEtcdDatabaseHighFragmentation1h5m
      expr: |
        (etcd_mvcc_db_total_size_in_use_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"} / etcd_mvcc_db_total_size_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}) < 0.5
      for: 5m
      labels:
        component: hcp
        severity: "3"
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.instance }} etcd database fragmentation is high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} database in-use ratio is {{ $value | humanizePercentage }} (threshold: 50%). Database defragmentation may be needed to reclaim space. Fast burn (1h/5m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdDatabaseHighFragmentation6h30m
      expr: |
        (etcd_mvcc_db_total_size_in_use_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"} / etcd_mvcc_db_total_size_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}) < 0.5
      for: 30m
      labels:
        component: hcp
        severity: "3"
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.instance }} etcd database fragmentation is high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} database in-use ratio is {{ $value | humanizePercentage }} (threshold: 50%). Database defragmentation may be needed to reclaim space. Medium burn (6h/30m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdDatabaseHighFragmentation3d
      expr: |
        (etcd_mvcc_db_total_size_in_use_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"} / etcd_mvcc_db_total_size_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}) < 0.5
      for: 6h
      labels:
        component: hcp
        severity: "4"
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.instance }} etcd database fragmentation is chronically high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} database in-use ratio is {{ $value | humanizePercentage }} (threshold: 50%). Database defragmentation may be needed to reclaim space. Slow burn (3d)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd

    # ----------------------------------------
    # userJourneyEtcdDatabaseSizeExceeded
    # ----------------------------------------
    - alert: userJourneyEtcdDatabaseSizeExceeded1h5m
      expr: |
        etcd_mvcc_db_total_size_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"} > 8589934592
      for: 5m
      labels:
        component: hcp
        severity: "3"
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.instance }} etcd database size is too large for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} database size is {{ $value | humanize }}B (threshold: 8GB). Database may need compaction or quota increase. Fast burn (1h/5m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdDatabaseSizeExceeded6h30m
      expr: |
        etcd_mvcc_db_total_size_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"} > 8589934592
      for: 30m
      labels:
        component: hcp
        severity: "3"
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.instance }} etcd database size is too large for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} database size is {{ $value | humanize }}B (threshold: 8GB). Database may need compaction or quota increase. Medium burn (6h/30m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdDatabaseSizeExceeded3d
      expr: |
        etcd_mvcc_db_total_size_in_bytes{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"} > 8589934592
      for: 6h
      labels:
        component: hcp
        severity: "4"
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.instance }} etcd database size is chronically too large for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} database size is {{ $value | humanize }}B (threshold: 8GB). Database may need compaction or quota increase. Slow burn (3d)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd

    # ----------------------------------------
    # userJourneyEtcdFrequentLeaderChanges
    # ----------------------------------------
    - alert: userJourneyEtcdFrequentLeaderChanges1h5m
      expr: |
        increase(etcd_server_leader_changes_seen_total{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[15m]) > 3
      for: 5m
      labels:
        component: hcp
        severity: "3"
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.instance }} etcd cluster experiencing frequent leader changes for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has seen {{ $value }} leader changes in the last 15 minutes (threshold: 3). This may indicate network issues or cluster instability. Fast burn (1h/5m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdFrequentLeaderChanges6h30m
      expr: |
        increase(etcd_server_leader_changes_seen_total{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[15m]) > 3
      for: 30m
      labels:
        component: hcp
        severity: "3"
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "{{ $labels.instance }} etcd cluster experiencing frequent leader changes for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has seen {{ $value }} leader changes in the last 15 minutes (threshold: 3). This may indicate network issues or cluster instability. Medium burn (6h/30m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
    - alert: userJourneyEtcdFrequentLeaderChanges3d
      expr: |
        increase(etcd_server_leader_changes_seen_total{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[15m]) > 3
      for: 6h
      labels:
        component: hcp
        severity: "4"
        long_window: 3d
        short_window: 6h
      annotations:
        summary: "{{ $labels.instance }} etcd cluster experiencing chronic frequent leader changes for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has seen {{ $value }} leader changes in the last 15 minutes (threshold: 3). This may indicate network issues or cluster instability. Slow burn (3d)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd

    # ----------------------------------------
    # userJourneyEtcdPeerRoundTripTimeHigh
    # ----------------------------------------
    - alert: userJourneyEtcdPeerRoundTripTimeHigh1h5m
      expr: |
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_network_peer_round_trip_time_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[5m]))) > 0.1
        and
        histogram_quantile(0.99, sum by (cluster, subscription_id, resource_id, instance, le) (rate(etcd_network_peer_round_trip_time_seconds_bucket{subscription_id!~"974ebd46-8ad3-41e3-afef-7ef25fd5c371|e8c5a115-842d-4d7e-98ad-cfb2c50b209e|e627aa70-36a3-40b0-8e68-975269e39d7b|6ed122d1-7e03-4a01-baae-9020abf350d4|64f0619f-ebc2-4156-9d91-c4c781de7e54|dee2f1be-a999-4e19-b027-221e7adaf7d3|8d696692-794f-4cdb-ba25-9250c9e9ec4c|ec435068-e722-475f-8504-c91b72a5dc51|403d9de9-132b-4974-94a5-5b78bdfa191e"}[1h]))) > 0.1
      for: 5m
      labels:
        component: hcp
        severity: "3"
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "{{ $labels.instance }} etcd peer round-trip time is high for {{ $labels.resource_id }}"
        description: "{{ $labels.resource_id }} etcd instance {{ $labels.instance }} has 99th percentile peer round-trip time of {{ $value }}s (threshold: 100ms). Network latency between peers may be affecting cluster performance. Fast burn (1h/5m)."
        runbook_url: https://aka.ms/arohcp-runbook-etcd
