apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: arobit-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: arobit-rules
    labels:
      component: monitoring-infrastructure
    rules:
    - alert: ArobitForwarderJobUp
      expr: group by (cluster) (up{job="kube-state-metrics"}) unless on(cluster) group by (cluster) (up{job="arobit-forwarder",namespace="arobit"} == 1)
      for: 15m
      labels:
        severity: warning
      annotations:
        description: |
          The Arobit forwarder metrics endpoint on cluster {{ $labels.cluster }} has been unreachable for 15 minutes.
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        summary: Arobit forwarder metrics endpoint is unreachable on cluster {{ $labels.cluster }}.
    - alert: FluentBitIngestionPaused
      expr: sum(fluentbit_input_ingestion_paused) by (cluster, pod) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: |
          Fluent Bit pod {{ $labels.pod }} on cluster {{ $labels.cluster }} has paused collecting new log data for at least 5 minutes.
          Ingestion pauses when Fluent Bit's internal memory or storage buffers are full, typically caused by backpressure from a slow or failing output.
          Investigate the Fluent Bit logs for the specific error details and check the Kusto instance health.
        summary: Fluent Bit {{ $labels.pod }} on {{ $labels.cluster }} ingestion paused due to backpressure
    - alert: FluentBitHighOutputRetries
      expr: sum(increase(fluentbit_output_retries_total{name=~"azure_kusto.*"}[5m])) by (cluster, pod) > 3
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: |
          Fluent Bit pod {{ $labels.pod }} on cluster {{ $labels.cluster }} is retrying chunk delivery.
          Retries occur when the azure_kusto output encounters a recoverable error (e.g. transient network failure, HTTP 429/5xx from Kusto).
          Investigate the Fluent Bit logs for the specific error details and check the Kusto instance health.
        summary: Fluent Bit {{ $labels.pod }} on {{ $labels.cluster }} has high Kusto output retries
    - alert: FluentBitOutputErrors
      expr: sum(increase(fluentbit_output_errors_total{name=~"azure_kusto.*"}[5m])) by (cluster, pod) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: |
          Fluent Bit pod {{ $labels.pod }} on cluster {{ $labels.cluster }} is encountering errors sending log chunks to Kusto.
          Investigate the Fluent Bit logs for the specific error details and check the Kusto instance health.
        summary: Fluent Bit {{ $labels.pod }} on {{ $labels.cluster }} dropping logs due to unrecoverable Kusto errors
    - alert: FluentBitOutputRetriesExhausted
      expr: sum(increase(fluentbit_output_retries_failed_total{name=~"azure_kusto.*"}[5m])) by (cluster, pod) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: |
          Fluent Bit pod {{ $labels.pod }} on cluster {{ $labels.cluster }} has chunks that exceeded the configured Retry_Limit for the Kusto output.
          Investigate the Fluent Bit logs for the specific error details and check the Kusto instance health.
        summary: Fluent Bit {{ $labels.pod }} on {{ $labels.cluster }} Kusto retries exhausted, chunks discarded
    - alert: FluentBitMultilineTruncated
      # These counters may first appear with a nonzero value. Catch that first
      # observation as well as later increments; do not wait through a for period.
      expr: |
        max by (cluster, pod, name) (increase(fluentbit_filter_emit_truncated_total[5m])) > 0
        or
        (
          max by (cluster, pod, name) (fluentbit_filter_emit_truncated_total) > 0
          unless
          max by (cluster, pod, name) (fluentbit_filter_emit_truncated_total offset 5m)
        )
      labels:
        severity: warning
      annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: |
          Fluent Bit filter {{ $labels.name }} in pod {{ $labels.pod }} on cluster {{ $labels.cluster }} has truncated multiline log records.
          The multiline assembly buffer reached its per-message limit, so partial records were emitted and message content may be missing.
          Inspect multiline_truncated metadata and review the message size and multiline_buffer_limit setting.
        summary: Fluent Bit {{ $labels.name }} in {{ $labels.pod }} on {{ $labels.cluster }} truncated multiline records
    - alert: FluentBitTailRingBufferDropped
      expr: |
        max by (cluster, pod, name) (increase(fluentbit_input_ring_buffer_retry_failures_total{name="tail.container"}[5m])) > 0
        or
        (
          max by (cluster, pod, name) (fluentbit_input_ring_buffer_retry_failures_total{name="tail.container"}) > 0
          unless
          max by (cluster, pod, name) (fluentbit_input_ring_buffer_retry_failures_total{name="tail.container"} offset 5m)
        )
      labels:
        severity: warning
      annotations:
        runbook_url: https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/arobit.html
        description: |
          Fluent Bit input {{ $labels.name }} in pod {{ $labels.pod }} on cluster {{ $labels.cluster }} has discarded log batches after exhausting ring-buffer enqueue retries.
          These batches were lost before filesystem buffering or Kusto output retries could protect them; the counter counts batches, not records.
          Investigate collector saturation and backpressure in the multiline and rewrite-tag emitters.
        summary: Fluent Bit {{ $labels.name }} in {{ $labels.pod }} on {{ $labels.cluster }} dropped container log batches
