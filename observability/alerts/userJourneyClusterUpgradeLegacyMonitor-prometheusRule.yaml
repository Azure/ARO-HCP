apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: user-journey-cluster-upgrade-legacy-alerts
  namespace: monitoring
spec:
  groups:
  - name: rp-user-journey-cluster-upgrade-monitor-rules
    rules:
    - alert: userJourneyClusterUpgradeStuckInDesired
      expr: |
        hosted_control_plane_upgrade:duration_in_desired:seconds > 1200
      for: 5m
      labels:
        severity: "4"
        slo: cluster-upgrade-reach-partial
        component: slo
      annotations:
        summary: "{{ $labels.cluster }}: Cluster version change on {{ $labels.resource_id }} to version {{ $labels.version }} not progressing"
        description: |
          Cluster version change (upgrade or rollback) to {{ $labels.version }} has been in desired for over 20 minutes without reaching partial. With the alert pending for 5 minutes, paging starts after ~25 minutes. Partial is when the target version becomes active (recognized as active) on the HCP cluster; the version change is in progress but not yet complete. Investigate backend_cluster_version_info on the affected cluster.
          Service Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-cluster-upgrade
        correlationId: "userJourneyClusterUpgradeStuckInDesired/{{ $labels.cluster }}{{ $labels.resource_id }}/{{ $labels.version }}"
    - alert: userJourneyClusterUpgradeStuckInProgress
      expr: |
        hosted_control_plane_upgrade:duration_in_progress:seconds > 1800
      for: 5m
      labels:
        severity: "4"
        slo: cluster-upgrade-complete
        component: slo
      annotations:
        summary: "{{ $labels.cluster }}: Cluster version change on {{ $labels.resource_id }} to version {{ $labels.version }} stuck"
        description: |
          Cluster version change (upgrade or rollback) to {{ $labels.version }} has been in progress for over 30 minutes without reaching completed. With the alert pending for 5 minutes, paging starts after ~35 minutes. Completed is when the target version change has finished and is reported as complete on the HCP cluster. Investigate backend_cluster_version_info on the affected cluster.
          Service Cluster: {{ $labels.cluster }}
        runbook_url: https://aka.ms/arohcp-runbook-cluster-upgrade
        correlationId: "userJourneyClusterUpgradeStuckInProgress/{{ $labels.cluster }}{{ $labels.resource_id }}/{{ $labels.version }}"
