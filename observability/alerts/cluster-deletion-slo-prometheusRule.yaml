apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-deletion-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Deletion SLO Alerts: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # These read the windowed recording rules
  # (errors:backend_cluster_deletion_operation:{failed,total,error_rate}_{1h,6h,3d}),
  # which count only cluster delete operations whose terminal transition landed
  # inside the window, so each tier evaluates a real event window instead of the
  # trailing 7-day gauge ratio. Stateless and level-driven: no new metric and no
  # backend change.
  #
  # Burn rate thresholds calculated from 95% SLO (5% error budget):
  #   Fast (14.4x):  14.4 * 0.05 = 0.72 → 72% error rate
  #   Medium (6x):   6   * 0.05 = 0.30 → 30% error rate
  #   Slow (1x):     1   * 0.05 = 0.05 →  5% error rate
  #
  # Volume guard: each tier requires an absolute floor of completions/failures
  # in the window so a single failure on a quiet window cannot page.
  - name: arohcp_cluster_deletion_slo_windowed_error_alerts
    labels:
      component: slo
    rules:
    # ----------------------------------------
    # Fast Burn Alert (Sev 3)
    # ----------------------------------------
    # 14.4x burn rate → >72% failures over 1h, >=3 failures
    - alert: userJourneyClusterDeletionErrors1h5m
      expr: |
        errors:backend_cluster_deletion_operation:failed_1h >= 3
        and
        errors:backend_cluster_deletion_operation:error_rate_1h > 0.72
      for: 5m
      labels:
        severity: "3"
        slo: cluster-deletion-errors
        long_window: 1h
        short_window: 5m
      annotations:
        title: "{{ $labels.cluster }}: Cluster delete operations failing fast (>72% over 1h)"
        summary: "{{ $labels.cluster }}: Cluster delete operations failing fast (>72% over 1h)"
        description: "More than 72% of completed cluster delete operations on {{ $labels.cluster }} failed or were canceled over the last hour with at least 3 failures, a 14.4x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionErrors/{{ $labels.cluster }}"
    # ----------------------------------------
    # Medium Burn Alert (Sev 3)
    # ----------------------------------------
    # 6x burn rate → >30% failures over 6h, >=5 completions
    - alert: userJourneyClusterDeletionErrors6h30m
      expr: |
        errors:backend_cluster_deletion_operation:total_6h >= 5
        and
        errors:backend_cluster_deletion_operation:error_rate_6h > 0.30
      for: 30m
      labels:
        severity: "3"
        slo: cluster-deletion-errors
        long_window: 6h
        short_window: 30m
      annotations:
        title: "{{ $labels.cluster }}: Cluster delete operation error rate elevated (>30% over 6h)"
        summary: "{{ $labels.cluster }}: Cluster delete operation error rate elevated (>30% over 6h)"
        description: "More than 30% of completed cluster delete operations on {{ $labels.cluster }} failed or were canceled over the last 6 hours (at least 5 completions), a 6x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionErrors/{{ $labels.cluster }}"
    # ----------------------------------------
    # Slow Burn Alert (Sev 4)
    # ----------------------------------------
    # 1x burn rate → >5% failures over 3d, >=10 completions, >=2 failures
    - alert: userJourneyClusterDeletionErrors3d
      expr: |
        errors:backend_cluster_deletion_operation:total_3d >= 10
        and
        errors:backend_cluster_deletion_operation:failed_3d >= 2
        and
        errors:backend_cluster_deletion_operation:error_rate_3d > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: cluster-deletion-errors
        long_window: 3d
      annotations:
        title: "{{ $labels.cluster }}: Cluster delete operation error budget burning (>5% over 3d)"
        summary: "{{ $labels.cluster }}: Cluster delete operation error budget burning (>5% over 3d)"
        description: "More than 5% of completed cluster delete operations on {{ $labels.cluster }} failed or were canceled over the last 3 days (at least 10 completions and 2 failures), a 1x burn that exhausts the 95% SLO error budget over the window."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionErrors/{{ $labels.cluster }}"
    # ----------------------------------------
    # Degradation Alert (Sev 4)
    # ----------------------------------------
    # Early warning: >15% failures over 6h before the burn-rate alerts fire
    - alert: userJourneyClusterDeletionErrorsDegradation
      expr: |
        errors:backend_cluster_deletion_operation:total_6h >= 5
        and
        errors:backend_cluster_deletion_operation:failed_6h >= 2
        and
        errors:backend_cluster_deletion_operation:error_rate_6h > 0.15
      for: 30m
      labels:
        severity: "4"
        slo: cluster-deletion-errors
        long_window: 6h
      annotations:
        title: "{{ $labels.cluster }}: Cluster delete operation failure rate exceeds 15% over 6h"
        summary: "{{ $labels.cluster }}: Cluster delete operation failure rate exceeds 15% over 6h"
        description: "More than 15% of completed cluster delete operations on {{ $labels.cluster }} failed or were canceled over the last 6 hours (at least 5 completions and 2 failures), an early warning of degradation before the burn-rate alerts fire."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionErrors/{{ $labels.cluster }}"
    # ----------------------------------------
    # Latency SLO — Fast Burn (Sev 3)
    # ----------------------------------------
    # 14.4x burn rate → >72% of successful deletes exceeded 30m, sustained 5m
    - alert: userJourneyClusterDeletionLatency1h5m
      expr: |
        errors:backend_cluster_deletion_operation:latency_total_1h >= 5
        and
        errors:backend_cluster_deletion_operation:latency_error_rate_1h > 0.72
      for: 5m
      labels:
        severity: "3"
        slo: cluster-deletion-latency
        long_window: 1h
        short_window: 5m
      annotations:
        title: "Cluster deletion Latency SLO fast burn (>72% slow for 5m)"
        summary: "Cluster deletion Latency SLO fast burn (>72% slow for 5m)"
        description: "More than 72% of successful cluster deletes exceeded 30 minutes, sustained for 5 minutes. Fast burn rate (14.4x) against the 95% Latency SLO — on track to exhaust the budget in ~12 hours."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionLatency/{{ $labels.cluster }}"
    # ----------------------------------------
    # Latency SLO — Medium Burn (Sev 3)
    # ----------------------------------------
    # 6x burn rate → >30% of successful deletes exceeded 30m, sustained 30m
    - alert: userJourneyClusterDeletionLatency6h30m
      expr: |
        errors:backend_cluster_deletion_operation:latency_total_6h >= 5
        and
        errors:backend_cluster_deletion_operation:latency_error_rate_6h > 0.30
      for: 30m
      labels:
        severity: "3"
        slo: cluster-deletion-latency
        long_window: 6h
        short_window: 30m
      annotations:
        title: "Cluster deletion Latency SLO medium burn (>30% slow for 30m)"
        summary: "Cluster deletion Latency SLO medium burn (>30% slow for 30m)"
        description: "More than 30% of successful cluster deletes exceeded 30 minutes, sustained for 30 minutes. Medium burn rate (6x) against the 95% Latency SLO — on track to exhaust the budget in ~28 hours."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionLatency/{{ $labels.cluster }}"
    # ----------------------------------------
    # Latency SLO — Slow Burn (Sev 4)
    # ----------------------------------------
    # 1x burn rate → >5% of successful deletes exceeded 30m, sustained 6h
    - alert: userJourneyClusterDeletionLatency3d
      expr: |
        errors:backend_cluster_deletion_operation:latency_total_3d >= 5
        and
        errors:backend_cluster_deletion_operation:latency_error_rate_3d > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: cluster-deletion-latency
        long_window: 3d
      annotations:
        title: "Cluster deletion Latency SLO slow burn (>5% slow for 6h)"
        summary: "Cluster deletion Latency SLO slow burn (>5% slow for 6h)"
        description: "More than 5% of successful cluster deletes exceeded 30 minutes, sustained for 6 hours. Slow burn rate (1x) against the 95% Latency SLO — budget will be exhausted in ~7 days."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionLatency/{{ $labels.cluster }}"
    # ----------------------------------------
    # Stuck Operations Alert (Sev 4)
    # ----------------------------------------
    # This alert fires when time in the CURRENT phase
    #     (last_transition_time_seconds) > 1h.
    # Delete operations only transit accepted → deleting → terminal.
    #
    # Stickiness (max_over_time ... [6h:5m]): while a resource stays wedged,
    # the raw condition can transiently clear — most commonly when the backend
    # retries the operation and resets last_transition_time_seconds,
    # briefly dropping (time() - last_transition_time) below the 3600s threshold.
    # Each clear auto-resolves the IcM incident and the next re-fire opens a
    # brand-new one. Holding the condition firing over a 6h look-back collapses
    # a continuously-stuck resource into a single long-lived incident; genuinely
    # distinct stuck episodes more than 6h apart still get their own incident.
    - alert: userJourneyClusterDeletionStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (
              (
                max by (
                  cluster,
                  environment,
                  region,
                  subscription_id,
                  resource_id,
                  resource_type,
                  operation_type,
                  phase
                ) (
                  backend_resource_operation_phase_info{
                    resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                    operation_type="delete",
                    phase=~"accepted|deleting"
                  } == 1
                )
                and
                (
                  time() - max by (
                    cluster,
                    environment,
                    region,
                    subscription_id,
                    resource_id,
                    resource_type,
                    operation_type,
                    phase
                  ) (
                    backend_resource_operation_last_transition_time_seconds{
                      resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                      operation_type="delete",
                      phase=~"accepted|deleting"
                    }
                  )
                ) > 3600
              )
            )[6h:5m]
          )
        )
        and on (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase)
        (
          max by (
            cluster,
            environment,
            region,
            subscription_id,
            resource_id,
            resource_type,
            operation_type,
            phase
          ) (
            backend_resource_operation_phase_info{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase=~"accepted|deleting"
            }
          ) == 1
        )
      for: 15m
      labels:
        severity: "4"
        slo: cluster-deletion-stuck
        exclude_internal_subscriptions: "true"
      annotations:
        title: "Cluster deletion operation stuck in non-terminal phase for over 1 hour"
        summary: "Cluster deletion operation {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 1 hour"
        description: "Cluster delete operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 1 hour. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionStuckOperation/{{ $labels.cluster }}/{{ $labels.subscription_id }}"
  # ========================================
  # Cluster Deletion Alerts — Saturation
  # ========================================
  - name: arohcp_cluster_deletion_saturation_alerts
    labels:
      component: slo
    rules:
    # Queue depth: cluster deletion controller workqueue accumulating work
    - alert: userJourneyClusterDeletionQueueDepth
      expr: |
        max by (name, cluster) (
          max without(prometheus_replica) (
            workqueue_depth{namespace="aro-hcp", name="OperationClusterDelete"}
          )
        ) > 10
      for: 5m
      labels:
        severity: "4"
      annotations:
        title: "Cluster deletion controller workqueue depth is high"
        summary: "Cluster deletion controller workqueue {{ $labels.name }} depth is high"
        description: "Cluster deletion controller workqueue {{ $labels.name }} has had a depth > 10 for more than 5 minutes, indicating work is accumulating faster than it can be processed."
        runbook_url: "https://aka.ms/cluster-deletion-tsg"
        correlationId: "userJourneyClusterDeletionQueueDepth/{{ $labels.cluster }}/{{ $labels.name }}"
