{{- define "resources" -}}
{ {{- $first := true -}}{{- range $kind, $values := . -}}
{{- $cpu := printf "%v" $values.cpu -}}
{{- $memory := printf "%v" $values.memory -}}
{{- $setCPU := and (ne $cpu "NONE") (ne $cpu "unlimited") -}}
{{- $setMemory := and (ne $memory "NONE") (ne $memory "unlimited") -}}
{{- if or $setCPU $setMemory -}}
{{- if not $first }},{{ end -}}{{- $first = false -}}
"{{ $kind }}": {
{{- if $setCPU }}"cpu": "{{ $cpu }}"{{ end -}}
{{- if and $setCPU $setMemory }},{{ end -}}
{{- if $setMemory }}"memory": "{{ $memory }}"{{ end -}}
}
{{- end -}}{{- end -}} }
{{- end -}}
{{- define "quantity" -}}
{{- if eq (printf "%v" .) "unlimited" -}}NONE{{- else -}}{{ . }}{{- end -}}
{{- end -}}
schedulingRole: "infra"
kube-prometheus-stack:
  fullnameOverride: "prometheus"
  crds:
    enabled: true
  global:
    rbac:
      create: true
  alertmanager:
    enabled: false
  grafana:
    enabled: false
  # Azure Managed Prometheus will scrape or expose these metrics
  coreDns:
    enabled: false
  kubeDns:
    enabled: false
  nodeExporter:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  kubelet:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeStateMetrics:
    enabled: true
  prometheus:
    enabled: false # Prometheus is deployed using templates/prometheus.yaml
  prometheusOperator:
    enabled: true
    # Auxiliary components share service-cluster sizing; the agent has separate opstool sizing below.
    resources: {{ template "resources" .svc.prometheus.prometheusOperator.resources }}
    fullnameOverride: ""
    admissionWebhooks:
      enabled: true
    image:
      registry: "{{ .opstool.prometheus.prometheusOperator.image.registry }}"
      repository: "{{ .opstool.prometheus.prometheusOperator.image.repository }}"
      sha: "{{ .opstool.prometheus.prometheusOperator.image.sha }}"
    prometheusConfigReloader:
      resources: {{ template "resources" .svc.prometheus.prometheusConfigReloader.resources }}
      image:
        registry: "{{ .opstool.prometheus.prometheusConfigReloader.image.registry }}"
        repository: "{{ .opstool.prometheus.prometheusConfigReloader.image.repository }}"
        sha: "{{ .opstool.prometheus.prometheusConfigReloader.image.sha }}"
  cleanPrometheusOperatorObjectNames: true
  kube-state-metrics:
    resources: {{ template "resources" .svc.prometheus.kubeStateMetrics.resources }}
    image:
      registry: "{{ .opstool.prometheus.kubeStateMetrics.image.registry }}"
      repository: "{{ .opstool.prometheus.kubeStateMetrics.image.repository }}"
      sha: "{{ .opstool.prometheus.kubeStateMetrics.image.digest }}"
# config for the files in templates/
prometheusSpec:
  image:
    registry: "{{ .opstool.prometheus.prometheusSpec.image.registry }}"
    repository: "{{ .opstool.prometheus.prometheusSpec.image.repository }}"
    sha: "{{ .opstool.prometheus.prometheusSpec.image.sha }}"
  version: ""
  externalLabels:
    cluster: "{{ .opstool.aks.name }}"
    region: "{{ .region }}"
    environment: "{{ .environmentName }}"
  remoteWriteUrl: "__dcrRemoteWriteUrl__"
  hcpRemoteWriteUrl: "__dcrRemoteWriteUrl__"
  zoneCount: 1
  maximumStartupDurationSeconds: 360
  resources:
    requests:
      cpu: "{{ template "quantity" .svc.prometheus.opstoolResources.requests.cpu }}"
      memory: "{{ template "quantity" .svc.prometheus.opstoolResources.requests.memory }}"
    limits:
      cpu: "{{ template "quantity" .svc.prometheus.opstoolResources.limits.cpu }}"
      memory: "{{ template "quantity" .svc.prometheus.opstoolResources.limits.memory }}"
  replicas: 1
  shards: 1
prometheus:
  serviceAccount:
    managedIdentity: "__prometheusUAMIClientId__"
environment: "opstool"
remoteWrite:
  url: "__dcrRemoteWriteUrl__"
  clientId: "__prometheusUAMIClientId__"
