apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: konnectivity-server
  name: konnectivity-server
  namespace: '{{ .Release.Namespace }}'
spec:
  podMetricsEndpoints:
  - port: konnect-health
    path: /metrics
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: kube-apiserver
