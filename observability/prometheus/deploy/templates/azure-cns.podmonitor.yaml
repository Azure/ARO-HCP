apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: azure-cns
  name: azure-cns
  namespace: kube-system
spec:
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    relabelings:
    - action: replace
      replacement: service
      targetLabel: microsoft_metrics_include_label
  selector:
    matchLabels:
      k8s-app: azure-cns
