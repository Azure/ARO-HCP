{{- if or (eq .Values.monitoringApiGroup "monitoring.coreos.com") (ne .Values.prometheusSpec.hcpRemoteWriteUrl "NONE") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: prometheus
  name: prometheus
  namespace: '{{ .Release.Namespace }}'
spec:
  podMetricsEndpoints:
  - portNumber: 9090
    path: /metrics
    metricRelabelings:
    - action: replace
      replacement: service
      targetLabel: microsoft_metrics_include_label
  selector:
    matchLabels:
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/managed-by: prometheus-operator
{{- end }}
