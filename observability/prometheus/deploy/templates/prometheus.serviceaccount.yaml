{{- if or (eq .Values.monitoringApiGroup "monitoring.coreos.com") (ne .Values.prometheusSpec.hcpRemoteWriteUrl "NONE") }}
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: '{{ .Release.Namespace }}'
  annotations:
    azure.workload.identity/client-id: '{{ .Values.prometheus.serviceAccount.managedIdentity }}'
{{- end }}
