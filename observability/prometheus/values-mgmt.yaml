schedulingRole: "infra"
kube-prometheus-stack:
  fullnameOverride: "prometheus"
  crds:
    enabled: true
  global:
    rbac:
      create: true
  alertmanager:
    enabled: false # Disabled for now.
  grafana:
    enabled: false
  # Azure Managed Prometheus will scrape or expose these metrics
  coreDns:
    enabled: false
  kubeDns:
    enabled: false
  nodeExporter:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  kubelet:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeStateMetrics:
    enabled: true # OSS prometheus scrapes kube-state-metrics so the HCP ksm are routed to the hcp Azure Monitor Workspace
  prometheus:
    enabled: false # Prometheus is deployed using templates/prometheus.yaml
  prometheusOperator:
    enabled: true
    fullnameOverride: ""
    image:
      registry: "{{ .mgmt.prometheus.prometheusOperator.image.registry }}"
      repository: "{{ .mgmt.prometheus.prometheusOperator.image.repository }}"
      sha: "{{ .mgmt.prometheus.prometheusOperator.image.sha }}"
    thanosImage:
      registry: "{{ .acr.svc.name }}.{{ .acrDNSSuffix }}"
      repository: "{{ .mgmt.prometheus.thanos.image.repository }}"
      tag: "{{ .mgmt.prometheus.thanos.image.tag }}"
      sha: "{{ .mgmt.prometheus.thanos.image.sha }}"
    prometheusConfigReloader:
      image:
        registry: "{{ .mgmt.prometheus.prometheusConfigReloader.image.registry }}"
        repository: "{{ .mgmt.prometheus.prometheusConfigReloader.image.repository }}"
        sha: "{{ .mgmt.prometheus.prometheusConfigReloader.image.sha }}"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: aro-hcp.azure.com/role
              operator: In
              values:
              - "infra"
    tolerations:
    - key: "infra"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    admissionWebhooks:
      patch:
        enabled: true
        image:
          registry: "{{ .acr.svc.name }}.{{ .acrDNSSuffix }}"
          repository: "{{ .mgmt.prometheus.admissionWebhook.patch.image.repository }}"
          sha: "{{ .mgmt.prometheus.admissionWebhook.patch.image.sha }}"
  ## Setting to true produces cleaner resource names, but requires a data migration because the name of the persistent volume changes. Therefore this should only be set once on initial installation.
  cleanPrometheusOperatorObjectNames: true
  # config for kube-state-metrics subchart that is imported by the kube-prometheus-stack chart conditionally
  kube-state-metrics:
    metricLabelsAllowlist:
    - nodes=[node.kubernetes.io/instance-type,kubernetes.azure.com/agentpool]
    prometheus:
      monitor:
        relabelings:
        - action: replace
          replacement: service
          targetLabel: microsoft_metrics_include_label
        # Schedule CRs live in namespace velero as
        # {hostedClusterNamespace}-{cadence}. Promote namespace from the
        # schedule name to ocm-* so remoteWrite routes them to the HCP
        # workspace (ARO-30331; same idea as #7860 for velero_* scrapes).
        metricRelabelings:
        - action: replace
          sourceLabels: [__name__, schedule]
          separator: ;
          regex: 'veleroSchedule_[^;]+;(ocm-[^-]+-[^-]+)-.+'
          targetLabel: namespace
          replacement: '${1}'
    image:
      registry: "{{ .mgmt.prometheus.kubeStateMetrics.image.registry }}"
      repository: "{{ .mgmt.prometheus.kubeStateMetrics.image.repository }}"
      sha: "{{ .mgmt.prometheus.kubeStateMetrics.image.digest }}"
    rbac:
      extraRules:
      - apiGroups: ["hypershift.openshift.io"]
        resources: ["hostedclusters"]
        verbs: ["list", "watch"]
      - apiGroups: ["velero.io"]
        resources: ["backups"]
        verbs: ["list", "watch"]
      - apiGroups: ["velero.io"]
        resources: ["deletebackuprequests"]
        verbs: ["list", "watch"]
      - apiGroups: ["velero.io"]
        resources: ["schedules"]
        verbs: ["list", "watch"]
      - apiGroups: ["cluster.x-k8s.io"]
        resources: ["machines"]
        verbs: ["list", "watch"]
    customResourceState:
      enabled: true
      create: true
      name: "kube-state-metric-custom-resource-config"
      key: config.yaml
      config:
        spec:
          resources:
          - groupVersionKind:
              group: hypershift.openshift.io
              kind: "HostedCluster"
              version: "v1beta1"
            metricNamePrefix: hostedClusterAPI
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
              api_url: [spec, services, "[service=APIServer]", servicePublishingStrategy, route, hostname]
              _id: [spec, clusterID]
              subscription_id: [spec, platform, azure, subscriptionID]
              resource_id: [metadata, annotations, "azure.microsoft.com/hcp-cluster-azure-resource-id"]
            metrics:
            - name: "kubeapiserver_available"
              help: "KubeAPIServer availability condition"
              each:
                type: StateSet
                stateSet:
                  path: [status, conditions, "[type=KubeAPIServerAvailable]", status]
                  labelName: status
                  list: ["True", "False", "Unknown"]
            - name: "available"
              help: "Cluster availability condition"
              each:
                type: StateSet
                stateSet:
                  path: [status, conditions, "[type=Available]", status]
                  labelName: status
                  list: ["True", "False", "Unknown"]
            - name: "progressing"
              help: "Cluster progressing condition"
              each:
                type: StateSet
                stateSet:
                  path: [status, conditions, "[type=Progressing]", status]
                  labelName: status
                  list: ["True", "False", "Unknown"]
            - name: "valid_azure_kms_config"
              help: "Azure KMS configuration validity condition"
              each:
                type: StateSet
                stateSet:
                  path: [status, conditions, "[type=ValidAzureKMSConfig]", status]
                  labelName: status
                  list: ["True", "False", "Unknown"]
            - name: "deletion_timestamp_seconds"
              help: "HostedCluster deletion timestamp in Unix seconds, or zero when deletion has not been requested."
              each:
                type: Gauge
                gauge:
                  path: [metadata, deletionTimestamp]
                  nilIsZero: true
          - groupVersionKind:
              group: velero.io
              kind: "Backup"
              version: "v1"
            metricNamePrefix: veleroBackup
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
              schedule: [metadata, labels, "velero.io/schedule-name"]
            metrics:
            - name: "phase"
              help: "Backup phase"
              each:
                type: StateSet
                stateSet:
                  path: [status, phase]
                  labelName: phase
                  list: ["New", "Queued", "ReadyToStart", "FailedValidation", "InProgress", "WaitingForPluginOperations", "WaitingForPluginOperationsPartiallyFailed", "Finalizing", "FinalizingPartiallyFailed", "Completed", "PartiallyFailed", "Failed", "Deleting"]
            # Velero leaves status.phase unset until processing starts, so the
            # StateSet above emits no rows for enqueued Backups. This Info
            # metric emits one row per CR for presence/backlog detection.
            # KSM Info metrics only emit when the metric itself declares
            # labelsFromPath (GVK-level labels alone are not enough).
            - name: "info"
              help: "Backup CR presence indicator, independent of status.phase - one row per existing CR"
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
                    namespace: [metadata, namespace]
          - groupVersionKind:
              group: velero.io
              kind: "DeleteBackupRequest"
              version: "v1"
            metricNamePrefix: veleroDeleteBackupRequest
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
              backupName: [spec, backupName]
            metrics:
            - name: "phase"
              help: "DeleteBackupRequest phase"
              each:
                type: StateSet
                stateSet:
                  path: [status, phase]
                  labelName: phase
                  list: ["New", "InProgress", "Processed"]
            # Same as Backup info: status.phase is unset while enqueued, so
            # an always-present Info metric is required for backlog detection.
            - name: "info"
              help: "DeleteBackupRequest CR presence indicator, independent of status.phase - one row per existing CR"
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
                    namespace: [metadata, namespace]
          # Velero Schedule CRs (ARO-30331): presence + paused for
          # insufficient-schedule / HCP-lane alerts. schedule label =
          # metadata.name so metricRelabelings can route to HCP.
          - groupVersionKind:
              group: velero.io
              kind: "Schedule"
              version: "v1"
            metricNamePrefix: veleroSchedule
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
              schedule: [metadata, name]
            metrics:
            - name: "info"
              help: "Schedule CR presence indicator - one row per existing Schedule"
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
                    namespace: [metadata, namespace]
                    schedule: [metadata, name]
            - name: "paused"
              help: "1 when Schedule.spec.paused is true, 0 otherwise"
              each:
                type: Gauge
                gauge:
                  path: [spec, paused]
                  nilIsZero: true
          # CAPI Machines for the hosted clusters live in the hosted control plane
          # namespaces (ocm-*) on this management cluster, so these metrics are routed
          # to the HCP Azure Monitor Workspace by the remoteWrite rules in
          # templates/prometheus.yaml and dropped from the service workspace.
          # CAPI serves both v1beta1 and v1beta2; v1beta2 is the storage version and is
          # what we must use here. Under v1beta1 the Machine's status.conditions still
          # holds the pre-v1beta2 condition set, which has no Deleting condition at all
          # -- that one lives at status.v1beta2.conditions. Pinning v1beta1 therefore
          # silently yields no deleting_stage series (verified on a live management
          # cluster). Note this is a different answer from swift-recorder, which reads
          # Machines as v1beta1 (see its clusterv1 import comment); that is fine because
          # it only touches fields common to both.
          - groupVersionKind:
              group: cluster.x-k8s.io
              kind: "Machine"
              version: "v1beta2"
            metricNamePrefix: capiMachine
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
              node: [status, nodeRef, name]
              node_pool: [metadata, labels, "cluster.x-k8s.io/deployment-name"]
            metrics:
            - name: "node_drain_start_time_seconds"
              help: "Unix time at which CAPI started draining this Machine's node. Set once the Machine is deleting and the drain has begun; a series exists only for Machines being deleted, so this costs nothing on a steady-state cluster. nilIsZero is deliberately omitted to keep it that way -- with it, every worker Machine would carry a series. CAVEAT: CAPI does NOT clear nodeDrainStartTime when the drain finishes, so on its own this cannot distinguish a wedged drain from a Machine whose drain succeeded but whose Azure VM deletion is slow. Prefer the recording rule duration:capiMachine_node_draining:seconds, which gates this on deleting_stage{reason=\"DrainingNode\"} and is the supported way to ask how long a node has been draining."
              # Scoped to this metric on purpose, NOT to the whole resource block.
              # An unresolved path is the normal case here (most Machines are not
              # draining), but KSM has no "absent means no metric" mode: in
              # registry_factory.go it either honours nilIsZero and emits 0, or returns
              # "got nil while resolving path" as an error logged once per object per
              # scrape. Verified on a live management cluster -- one line per
              # non-draining Machine, every scrape, per Prometheus replica, all landing
              # in the containerLogs Kusto table. errorLogV demotes those to V(10).
              # Keeping it per-metric matters: the resource-level form also silences
              # genuinely broken paths in sibling metrics, which is how a misconfigured
              # deleting_stage first showed up as "no series and no explanation".
              errorLogV: 10
              each:
                type: Gauge
                gauge:
                  path: [status, deletion, nodeDrainStartTime]
            - name: "deleting_stage"
              help: "Which stage of the CAPI deletion workflow a Machine is in, from the reason on its Deleting condition (DrainingNode, WaitingForVolumeDetach, WaitingForInfrastructureDeletion, NotDeleting, ...). The value is the condition's lastTransitionTime in Unix seconds. One series per Machine, since CAPI keeps a Deleting=False/NotDeleting condition on idle Machines too. Combined with node_drain_start_time_seconds by the recording rule duration:capiMachine_node_draining:seconds; also useful on its own to see which deletion stage a Machine is wedged in."
              each:
                type: Gauge
                gauge:
                  path: [status, conditions, "[type=Deleting]"]
                  labelsFromPath:
                    reason: [reason]
                  valueFrom: [lastTransitionTime]
# this is our own config for the files in templates/
prometheusSpec:
  image:
    registry: "{{ .mgmt.prometheus.prometheusSpec.image.registry }}"
    repository: "{{ .mgmt.prometheus.prometheusSpec.image.repository }}"
    sha: "{{ .mgmt.prometheus.prometheusSpec.image.sha }}"
  version: "" # derived from the sha
  externalLabels:
    cluster: "{{ .mgmt.aks.name }}"
    region: "{{ .region }}"
    environment: "{{ .environmentName }}"
  remoteWriteUrl: "__dcrRemoteWriteUrl__"
  hcpRemoteWriteUrl: "__hcpDcrRemoteWriteUrl__"
  zoneCount: {{ .azureRegionAvailabilityZoneCount }}
  maximumStartupDurationSeconds: 360
  resources:
    requests:
      cpu: {{ .mgmt.prometheus.prometheusSpec.resources.requests.cpu }}
      memory: {{ .mgmt.prometheus.prometheusSpec.resources.requests.memory }}
    limits:
      memory: {{ .mgmt.prometheus.prometheusSpec.resources.limits.memory }}
  replicas: {{ .mgmt.prometheus.prometheusSpec.replicas }}
  shards: {{ .mgmt.prometheus.prometheusSpec.shards }}
prometheus:
  serviceAccount:
    managedIdentity: "__prometheusUAMIClientId__"
environment: "{{ .clustersService.environment }}"
