            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1248Mi
          volumeMounts:
            - name: var-kusto
              mountPath: /var/kusto
            - name: var-log
              mountPath: /var/log
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: flb-storage
              mountPath: /var/fluent-bit/flb-storage
            - name: var-lib-docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: flb-config
              mountPath: /forwarder/etc
              readOnly: true
            - name: shoebox-mappings
              mountPath: /shoebox-config
              readOnly: true
        - name: watson-agent
          image: mcr.microsoft.com/azure-watson/agent/azlinux3@sha256:1234567890
          imagePullPolicy: 'IfNotPresent'
          env:
            - name: INCOMING_QUEUE
              value: "/azure-watson/cores"
            - name: REPORT_QUEUE
              value: "/azure-watson/queue"
            - name: MDSD_ROLE_PREFIX
              value: "/var/run/mdsd/asa/"
            - name: WA_CORE_PATTERN
              value: "/azure-watson/cores/%e.%p.%h.%t"
            - name: AUTHENTICATION_ID
              value: "MsiClientId#__msiClientId__"
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
            requests:
