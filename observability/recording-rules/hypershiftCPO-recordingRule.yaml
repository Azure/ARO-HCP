apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-cpo-recording-rules
  namespace: prometheus
spec:
  groups:
  - name: hypershift-cpo-recording-rules
    interval: 1m
    rules:
    # HCP deployment metrics are routed to the HCP workspace. Summarize raw
    # scrapes so short outages survive the one-minute recording interval.
    # Keep each HCP separate; scaled-to-zero deployments are not eligible.
    # Keep the lowest replica window so staggered HA scrapes cannot hide outages.
    - record: hypershift:cpo:availability:ratio1m
      expr: |
        clamp_max(
          min by (cluster, namespace) (avg_over_time(kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="control-plane-operator"}[1m]))
          /
          (max by (cluster, namespace) (avg_over_time(kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="control-plane-operator"}[1m])) > 0),
          1
        )
