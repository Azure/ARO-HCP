apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: cluster-provision-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Provisioning SLO Recording Rules
  # ========================================
  # These rules track the Errors SLO for HCP cluster provisioning (install).
  # SLO: 95% of cluster create operations should succeed (not reach "failed"
  # terminal phase). Error Budget: 5% (1 - 0.95).
  #
  # The SLO denominator counts only succeeded and failed operations. Canceled
  # operations (superseded or aborted before completion) are excluded from both
  # the numerator and the denominator, so a user-initiated cancellation neither
  # counts as a failure nor dilutes the rate; success_rate and error_rate then
  # sum to 1.
  #
  # Metrics are gauge-based (backend_resource_operation_phase_info) from Cosmos DB,
  # so we use count() aggregations rather than rate() on counters.
  #
  # NOTE: the instantaneous records below are a trailing ~7-day cumulative
  # ratio, because the phase gauge is retained for the Cosmos 7-day TTL, so a
  # single stale failure keeps the ratio elevated for days. Prefer the windowed
  # records in arohcp_cluster_provision_slo_windowed_recording_rules for
  # alerting; these instantaneous records are kept for dashboards / compatibility
  # only.
  #
  # Scope: covers create operations on hcpOpenShiftClusters (the cluster install
  # user journey). Update/delete are covered by the async-operations stuck alert;
  # node pool operations have their own SLO (nodepool-slo-prometheusRule.yaml).
  #
  # Grouping is by the `cluster` label (the management cluster serving the
  # request), which is a per-region proxy: a regional install failure (e.g. the
  # ACR canary-replica endpoint outage in AROSLSRE-1592 that failed ~100% of
  # eastus2 installs) surfaces as a spike in the per-management-cluster error rate.
  - name: arohcp_cluster_provision_slo_recording_rules
    interval: 1m
    rules:
    # Instantaneous count of succeeded cluster create operations per cluster
    - record: errors:backend_cluster_provision:succeeded_total
      expr: |
        count by (cluster) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="create",
          phase="succeeded"
        })
    # Instantaneous count of all terminal cluster create operations per cluster
    - record: errors:backend_cluster_provision:terminal_total
      expr: |
        count by (cluster) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="create",
          phase=~"succeeded|failed"
        })
    # Instantaneous error rate per cluster: fraction of terminal operations that failed
    - record: errors:backend_cluster_provision:error_rate
      expr: |
        (
          count by (cluster) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase="failed"
          })
          or
          0 * count by (cluster) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"succeeded|failed"
          })
        )
        /
        clamp_min(
          count by (cluster) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"succeeded|failed"
          }),
          1
        )
  # ========================================
  # Cluster Provisioning SLO Recording Rules: Windowed Errors (stateless)
  # ========================================
  # These windowed records count only cluster create operations whose terminal
  # transition landed inside the window, via
  # (time() - backend_resource_operation_last_transition_time_seconds) < W,
  # so a stale failure ages out of the window instead of smearing for the full
  # Cosmos 7-day TTL. No new metric and no backend change.
  #
  # The `or 0 * ...` term pins the failure count to 0 (not absent) when a
  # cluster has create operations but none failed in-window.
  - name: arohcp_cluster_provision_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): terminal transition within 3600s ---
    - record: errors:backend_cluster_provision:failed_1h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase="failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create"
          }) < 3600)
        )
        or
        0 * count by (cluster) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="create"
        })
    - record: errors:backend_cluster_provision:total_1h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"succeeded|failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create"
          }) < 3600)
        )
    - record: errors:backend_cluster_provision:error_rate_1h
      expr: |
        errors:backend_cluster_provision:failed_1h
        /
        clamp_min(errors:backend_cluster_provision:total_1h, 1)
    # --- 6h window (medium burn): terminal transition within 21600s ---
    - record: errors:backend_cluster_provision:failed_6h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase="failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create"
          }) < 21600)
        )
        or
        0 * count by (cluster) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="create"
        })
    - record: errors:backend_cluster_provision:total_6h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"succeeded|failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create"
          }) < 21600)
        )
    - record: errors:backend_cluster_provision:error_rate_6h
      expr: |
        errors:backend_cluster_provision:failed_6h
        /
        clamp_min(errors:backend_cluster_provision:total_6h, 1)
    # --- 3d window (slow burn / budget): terminal transition within 259200s ---
    - record: errors:backend_cluster_provision:failed_3d
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase="failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create"
          }) < 259200)
        )
        or
        0 * count by (cluster) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="create"
        })
    - record: errors:backend_cluster_provision:total_3d
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"succeeded|failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create"
          }) < 259200)
        )
    - record: errors:backend_cluster_provision:error_rate_3d
      expr: |
        errors:backend_cluster_provision:failed_3d
        /
        clamp_min(errors:backend_cluster_provision:total_3d, 1)
  # ========================================
  # Cluster Provisioning SLO Recording Rules — Latency
  # ========================================
  # These rules track the Latency SLI for HCP cluster provisioning (install).
  # The SLI measures how long each cluster create operation has been in flight
  # (time since operation start, for operations still in non-terminal phase).
  #
  # Metrics are gauge-based: backend_resource_operation_start_time_seconds
  # (unix timestamp) joined with backend_resource_operation_phase_info to
  # filter to in-flight operations only.
  #
  # This is a per-resource metric (not fleet-aggregate) — each in-flight
  # operation produces its own duration series, enabling per-cluster stuck
  # operation detection and dashboard drill-down.
  - name: arohcp_cluster_provision_latency_recording_rules
    interval: 1m
    rules:
    # Current age (seconds) of each in-flight cluster create operation.
    # Only emits for operations in non-terminal phases (accepted, provisioning).
    # Terminal operations (succeeded, failed, canceled) are excluded — they
    # have already completed and their outcome is covered by the Errors SLI.
    - record: latency:backend_cluster_provision:inflight_duration_seconds
      expr: |
        max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (
          (
            time() - backend_resource_operation_start_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="create"
            }
          )
          and
          backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"accepted|provisioning"
          } == 1
        )
