apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: cluster-update-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Update Current-State Recording Rule
  # ========================================
  # Current state of each cluster update (PUT/PATCH) operation on
  # hcpOpenShiftClusters, for the Cluster Update SLO dashboard
  # (observability/grafana-dashboards/sre/user-journey/cluster-update-slo.json).
  #
  # The SLO error rates and burn-rate alerts
  # (observability/alerts/cluster-update-slo-prometheusRule.yaml) do not use this
  # record: they are built on the unified backend operation records
  # (errors:backend_resource_operation:* in backend-operation-slo-recordingRule.yaml),
  # filtered to resource_type="microsoft.redhatopenshift/hcpopenshiftclusters"
  # and operation_type="update".
  #
  # SCOPE: every customer change carried by the generic cluster "update"
  # operation is included: imageDigestMirrors changes (the IDMS image registry
  # mirror journey), authorizedCIDRs and other cluster spec changes, and control
  # plane version upgrades. Nothing on backend_resource_operation_phase_info
  # distinguishes one change from another.
  #
  # WHAT IS RECORDED: the phase gauge holds at most one series per
  # (resource, operation_type), because the Backend replaces the previous series
  # with the newest retained operation by start time (Cosmos document key breaks
  # ties). (Newest-operation selection is implemented by the operation phase
  # metrics handler fix "select newest retained operation for operation phase
  # gauges"; before it, the last synced operation wins.) Dashboard counts of
  # this record are therefore counts of CLUSTERS by the outcome of their latest
  # retained update, not counts of individual operations: a failed update that
  # is later retried successfully is overwritten and never counted.
  #
  # ONE STATE PER OPERATION: the record holds exactly one series per
  # (cluster, resource, operation_type), with the current phase as a label and
  # the last transition time as its value. Two sources can otherwise report the
  # same resource: HA Prometheus replicas (prometheus_replica), and Backend
  # targets (pod/instance), because a former leader keeps exporting its last
  # snapshot after losing leadership. Two Backend targets may disagree on the
  # phase of an operation, or even retain different operations, so
  # deduplicating per phase is not enough. The record collapses replicas only,
  # then selects one target snapshot per resource using the emitter's own rule:
  # the operation with the newest start time wins, and for the same operation
  # the latest transition wins. Missing start or transition gauges count as time
  # 0. An exact tie on both start and transition time keeps one arbitrary target.
  #
  # The record is not filtered by internal_subscription:info, so the dashboard
  # can still inspect internal traffic; use its Exclude Subscriptions variable.
  - name: arohcp_cluster_update_slo_recording_rules
    interval: 1m
    rules:
    # Current state of each cluster update operation: one series per operation,
    # labelled with its current phase, valued with its last transition time.
    # Each Backend target exposes one retained operation per resource. Across
    # targets, the operation with the newest start time wins (the emitter's own
    # selection rule); for the same operation reported by several targets, the
    # latest transition wins. Missing start or transition gauges count as 0.
    - record: current:backend_cluster_update:last_transition_time_seconds
      expr: |
        max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (
          topk by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type) (
            1,
            (
              max without (prometheus_replica) (backend_resource_operation_last_transition_time_seconds{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="update"
              })
              or
              0 * max without (prometheus_replica) (backend_resource_operation_phase_info{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="update"
              })
            )
            and
            (
              (
                max without (prometheus_replica) (backend_resource_operation_start_time_seconds{
                  resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                  operation_type="update"
                })
                or
                0 * max without (prometheus_replica) (backend_resource_operation_phase_info{
                  resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                  operation_type="update"
                })
              )
              == on (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type) group_left
              max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type) (
                max without (prometheus_replica) (backend_resource_operation_start_time_seconds{
                  resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                  operation_type="update"
                })
                or
                0 * max without (prometheus_replica) (backend_resource_operation_phase_info{
                  resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                  operation_type="update"
                })
              )
            )
          )
        )
