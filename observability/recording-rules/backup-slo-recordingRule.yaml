apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: backup-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # HCP Backup SLO recording rules (ARO-29950).
  # Cluster-wide completed-outcome rates for recurring 6-hourly/daily/weekly
  # schedules on the HCP AMW. Zero-fill each outcome with `or 0 * attempt`
  # (not success) so failure-only clusters stay visible. sum30d uses a 1m
  # subquery step matching the rule interval so short-lived rate bumps are
  # not under-weighted.
  - name: arohcp_backup_slo_recording_rules
    interval: 1m
    rules:
    # Failed completed outcomes / sec (failure + partial + validation).
    - record: errors:velero_hcp_backup:failed_outcomes:rate5m
      expr: |
        (
          sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_failure_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
          or
          0 * sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_attempt_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
        )
        +
        (
          sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_partial_failure_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
          or
          0 * sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_attempt_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
        )
        +
        (
          sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_validation_failure_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
          or
          0 * sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_attempt_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
        )
    # All completed outcomes / sec (success + failed outcomes above).
    - record: sli:velero_hcp_backup:completed_outcomes:rate5m
      expr: |
        (
          sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_success_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
          or
          0 * sum by (cluster) (
            max without (prometheus_replica) (
              rate(velero_hcp_backup_attempt_total{schedule=~".+-(6-hourly|daily|weekly)"}[5m])
            )
          )
        )
        +
        errors:velero_hcp_backup:failed_outcomes:rate5m
    # 30d integrals of the 1m-recorded 5m rates.
    - record: errors:velero_hcp_backup:failed_outcomes:sum30d
      expr: |
        sum_over_time(errors:velero_hcp_backup:failed_outcomes:rate5m[30d:1m])
    - record: sli:velero_hcp_backup:completed_outcomes:sum30d
      expr: |
        sum_over_time(sli:velero_hcp_backup:completed_outcomes:rate5m[30d:1m])
