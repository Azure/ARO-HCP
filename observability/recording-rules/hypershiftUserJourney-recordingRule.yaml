apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-user-journey-services-recording-rules
  namespace: prometheus
spec:
  # ========================================
  # HyperShift User Journey SLI Recording Rules - services workspace (ARO-27787)
  # ========================================
  # Inputs come from the HyperShift Operator (namespace "hypershift"), which
  # remote-write routes to the services workspace. The ServiceMonitor does not
  # set honorLabels, so the HostedCluster namespace is exported_namespace.
  # Every series is aggregated to cluster = one management cluster.
  # max without(prometheus_replica) dedupes HA scrapes before summing.
  groups:
  - name: hypershift-operator-recording-rules
    interval: 1m
    rules:
    # Shared by the dashboard and operator traffic/error alerts.
    - record: hypershift:operator:reconcile:rate5m
      expr: |
        sum by (cluster) (max without (prometheus_replica) (rate(controller_runtime_reconcile_total{namespace="hypershift", pod=~"operator-.*"}[5m])))
    # Bad reconciliation events for the burn-rate alerts in Azure/ARO-HCP#7989.
    # Missing error telemetry emits no sample rather than a healthy zero.
    - record: hypershift:operator:reconcile_errors:rate5m
      expr: |
        sum by (cluster) (max without (prometheus_replica) (rate(controller_runtime_reconcile_total{namespace="hypershift", pod=~"operator-.*", result="error"}[5m])))
    # Point-in-time bad fraction for component availability burn-rate alerts.
    # Zero-desired and missing deployment inputs do not contribute observations.
    - record: hypershift:operator:replicas_unavailable:ratio
      expr: |
        1 - clamp_max(
          max by (cluster) (kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator"})
          /
          (max by (cluster) (kube_deployment_spec_replicas{namespace="hypershift", deployment="operator"}) > 0),
          1
        )
    # Aggregate raw scrape samples before recording: point sampling a ratio
    # would miss outages between rule evaluations. Zero desired replicas and
    # missing deployment telemetry are not healthy availability observations.
    # Keep the lowest replica window so staggered HA scrapes cannot hide outages.
    # Dashboard availability/coverage/budgets use this one-minute good fraction.
    # Burn-rate alerts in Azure/ARO-HCP#7989 instead use
    # hypershift:operator:replicas_unavailable:ratio, a point-in-time bad fraction.
    # Different sampling and HA aggregation mean these are not exact complements.
    # Both recordings share this group; see docs/alerts/hypershift-operators.md.
    - record: hypershift:operator:availability:ratio1m
      expr: |
        clamp_max(
          min by (cluster) (
            avg_over_time(kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator"}[1m])
            /
            (avg_over_time(kube_deployment_spec_replicas{namespace="hypershift", deployment="operator"}[1m]) > 0)
          ),
          1
        )
  # HostedCluster condition health is a separate journey signal, not component
  # replica availability. Multiple failure conditions can count one cluster twice.
  - name: hypershift-hostedcluster-recording-rules
    rules:
    - record: hypershift:hostedclusters:failure_conditions:ratio
      expr: |
        clamp_max(
          sum by (cluster) (max by (cluster, platform, condition) (hypershift_hostedclusters_failure_conditions))
          /
          (sum by (cluster) (max by (cluster, platform) (hypershift_hostedclusters)) > 0),
          1
        )
