apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: nodepool-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Node Pool SLO Recording Rules
  # ========================================
  # These rules track the Errors SLO for Node Pool operations.
  # SLO: 95% of node pool operations should succeed (not reach "failed" terminal phase)
  # Error Budget: 5% (1 - 0.95)
  #
  # The SLO denominator counts only succeeded and failed operations. Canceled
  # operations (superseded or aborted before completion) are excluded from both
  # the numerator and the denominator, so a user-initiated cancellation neither
  # counts as a failure nor dilutes the rate; success_rate and error_rate then
  # sum to 1.
  #
  # Metrics are gauge-based (backend_resource_operation_phase_info) from Cosmos DB,
  # so we use count() aggregations rather than rate() on counters.
  #
  # NOTE (prototype): the instantaneous records below are a trailing ~7-day
  # cumulative ratio (phase gauge retained for the Cosmos 7-day TTL), so a stale
  # failure keeps the ratio elevated for days. Prefer the windowed records in
  # arohcp_nodepool_slo_windowed_recording_rules for alerting; the instantaneous
  # records are kept for dashboards / compatibility only.
  #
  # Scope: covers node pool update and delete operations.
  # Node pool creation has its own SLI/SLO work tracked in ARO-26179 (owner: Rael).
  - name: arohcp_nodepool_slo_recording_rules
    interval: 1m
    rules:
    # Instantaneous count of succeeded node pool operations per cluster
    - record: errors:backend_nodepool_operation:succeeded_total
      expr: |
        count by (cluster) (backend_resource_operation_phase_info{
          resource_type=~".*nodepools",
          operation_type=~"update|delete",
          phase="succeeded"
        })
    # Instantaneous count of all terminal node pool operations per cluster
    - record: errors:backend_nodepool_operation:terminal_total
      expr: |
        count by (cluster) (backend_resource_operation_phase_info{
          resource_type=~".*nodepools",
          operation_type=~"update|delete",
          phase=~"succeeded|failed"
        })
    # Instantaneous error rate per cluster: fraction of terminal operations that failed
    - record: errors:backend_nodepool_operation:error_rate
      expr: |
        (
          count by (cluster) (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase="failed"
          })
          or
          0 * count by (cluster) (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase=~"succeeded|failed"
          })
        )
        /
        clamp_min(
          count by (cluster) (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase=~"succeeded|failed"
          }),
          1
        )
    # Node pool provisioning state distribution (for dashboards)
    - record: nodepool:provision_state:count_by_phase
      expr: |
        count by (phase) (backend_nodepool_provision_state)
  # ========================================
  # Node Pool SLO Recording Rules: Windowed Errors (stateless)
  # ========================================
  # Windowed counterparts of the instantaneous records above: they count only
  # node pool operations whose terminal transition landed inside the window, via
  # (time() - backend_resource_operation_last_transition_time_seconds) < W, so a
  # stale failure ages out of the window instead of smearing for the Cosmos
  # 7-day TTL. No new metric and no backend change. The `or 0 * ...` term pins the
  # failure count to 0 (not absent).
  #
  # Caveat: the backend deletes the prior series for a (resource_id,
  # operation_type) on every new emission, so for the repeatable node pool
  # update/delete operations a failure followed by a later success on the same
  # resource leaves only the success series. These records therefore measure the
  # failure state of the most recent in-window operation per resource (a
  # systemic-failure proxy), not an event-exact per-operation error rate, and
  # can miss an individual failure that was quickly retried to success. The
  # windowing still fixes the 7-day smear; an event-exact rate needs a monotonic
  # completed-operations counter (Tier 2).
  - name: arohcp_nodepool_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): terminal transition within 3600s ---
    - record: errors:backend_nodepool_operation:failed_1h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase="failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type=~".*nodepools",
            operation_type=~"update|delete"
          }) < 3600)
        )
        or
        0 * count by (cluster) (backend_resource_operation_phase_info{
          resource_type=~".*nodepools",
          operation_type=~"update|delete"
        })
    - record: errors:backend_nodepool_operation:total_1h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase=~"succeeded|failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type=~".*nodepools",
            operation_type=~"update|delete"
          }) < 3600)
        )
    - record: errors:backend_nodepool_operation:error_rate_1h
      expr: |
        errors:backend_nodepool_operation:failed_1h
        /
        clamp_min(errors:backend_nodepool_operation:total_1h, 1)
    # --- 6h window (medium burn): terminal transition within 21600s ---
    - record: errors:backend_nodepool_operation:failed_6h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase="failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type=~".*nodepools",
            operation_type=~"update|delete"
          }) < 21600)
        )
        or
        0 * count by (cluster) (backend_resource_operation_phase_info{
          resource_type=~".*nodepools",
          operation_type=~"update|delete"
        })
    - record: errors:backend_nodepool_operation:total_6h
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase=~"succeeded|failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type=~".*nodepools",
            operation_type=~"update|delete"
          }) < 21600)
        )
    - record: errors:backend_nodepool_operation:error_rate_6h
      expr: |
        errors:backend_nodepool_operation:failed_6h
        /
        clamp_min(errors:backend_nodepool_operation:total_6h, 1)
    # --- 3d window (slow burn / budget): terminal transition within 259200s ---
    - record: errors:backend_nodepool_operation:failed_3d
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase="failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type=~".*nodepools",
            operation_type=~"update|delete"
          }) < 259200)
        )
        or
        0 * count by (cluster) (backend_resource_operation_phase_info{
          resource_type=~".*nodepools",
          operation_type=~"update|delete"
        })
    - record: errors:backend_nodepool_operation:total_3d
      expr: |
        count by (cluster) (
          (backend_resource_operation_phase_info{
            resource_type=~".*nodepools",
            operation_type=~"update|delete",
            phase=~"succeeded|failed"
          } == 1)
          and
          ((time() - backend_resource_operation_last_transition_time_seconds{
            resource_type=~".*nodepools",
            operation_type=~"update|delete"
          }) < 259200)
        )
    - record: errors:backend_nodepool_operation:error_rate_3d
      expr: |
        errors:backend_nodepool_operation:failed_3d
        /
        clamp_min(errors:backend_nodepool_operation:total_3d, 1)
