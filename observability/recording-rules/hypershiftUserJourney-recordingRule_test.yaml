rule_files:
- hypershiftUserJourney-recordingRule.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  name: "Journey ratios"
  input_series:
  - series: 'hypershift_hostedclusters{platform="Azure", cluster="mc1", prometheus_replica="r1"}'
    values: "4+0x100"
  - series: 'hypershift_hostedclusters_failure_conditions{platform="Azure", condition="ValidReleaseInfo", cluster="mc1", prometheus_replica="r1"}'
    values: "1+0x100"
  - series: 'hypershift_cluster_waiting_initial_availability_duration_seconds{name="slow", namespace="hypershift", exported_namespace="clusters", _id="a", cluster="mc1", prometheus_replica="r1"}'
    values: "2000+0x100"
  - series: 'hypershift_cluster_waiting_initial_availability_duration_seconds{name="fast", namespace="hypershift", exported_namespace="clusters", _id="b", cluster="mc1", prometheus_replica="r1"}'
    values: "600+0x100"
  - series: 'hypershift_hosted_cluster_transition_seconds_count{condition="ValidReleaseInfo", cluster="mc1", prometheus_replica="r1"}'
    values: "0+1x100"
  promql_expr_test:
  - expr: hypershift:hostedclusters_unhealthy:ratio
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedclusters_unhealthy:ratio{cluster="mc1"}'
      value: 0.25
  - expr: hypershift:hostedclusters_waiting_over_30m:ratio
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedclusters_waiting_over_30m:ratio{cluster="mc1"}'
      value: 0.5
  - expr: hypershift:hostedcluster_creation_over_30m:ratio_30d
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedcluster_creation_over_30m:ratio_30d{cluster="mc1"}'
      value: 0.5
  - expr: hypershift:hostedcluster_creations:count_30d
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedcluster_creations:count_30d{cluster="mc1"}'
      value: 2
  - expr: hypershift:hostedcluster_creations_over_30m:count_30d
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedcluster_creations_over_30m:count_30d{cluster="mc1"}'
      value: 1
  - expr: hypershift:hostedclusters_waiting:count
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedclusters_waiting:count{cluster="mc1"}'
      value: 2
  - expr: hypershift:hostedclusters_waiting_over_30m:count
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedclusters_waiting_over_30m:count{cluster="mc1"}'
      value: 1
  - expr: hypershift:hostedcluster_transitions:increase1h
    eval_time: 70m
    exp_samples:
    - labels: 'hypershift:hostedcluster_transitions:increase1h{cluster="mc1"}'
      value: 60
- interval: 1m
  name: "Reused namespace/name keeps separate creations by _id"
  input_series:
  - series: 'hypershift_cluster_waiting_initial_availability_duration_seconds{name="reused", namespace="hypershift", exported_namespace="clusters", _id="old", cluster="mc2"}'
    values: "2000+0x20"
  - series: 'hypershift_cluster_waiting_initial_availability_duration_seconds{name="reused", namespace="hypershift", exported_namespace="clusters", _id="new", cluster="mc2"}'
    values: "_x30 600+0x30"
  promql_expr_test:
  - expr: hypershift:hostedcluster_creation_over_30m:ratio_30d
    eval_time: 55m
    exp_samples:
    - labels: 'hypershift:hostedcluster_creation_over_30m:ratio_30d{cluster="mc2"}'
      value: 0.5
- interval: 1m
  name: "No slow creations: ratios and over-30m counts are 0, not absent"
  input_series:
  - series: 'hypershift_cluster_waiting_initial_availability_duration_seconds{name="fast", namespace="hypershift", exported_namespace="clusters", _id="c", cluster="mc3"}'
    values: "600+0x10"
  promql_expr_test:
  - expr: hypershift:hostedcluster_creations_over_30m:count_30d
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedcluster_creations_over_30m:count_30d{cluster="mc3"}'
      value: 0
  - expr: hypershift:hostedcluster_creation_over_30m:ratio_30d
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedcluster_creation_over_30m:ratio_30d{cluster="mc3"}'
      value: 0
  - expr: hypershift:hostedclusters_waiting_over_30m:count
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedclusters_waiting_over_30m:count{cluster="mc3"}'
      value: 0
  - expr: hypershift:hostedclusters_waiting_over_30m:ratio
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:hostedclusters_waiting_over_30m:ratio{cluster="mc3"}'
      value: 0
- interval: 1m
  name: "No HyperShift creation data: ratios are absent, never NaN"
  input_series:
  - series: 'hypershift_hostedclusters{platform="Azure", cluster="mc4"}'
    values: "1+0x10"
  promql_expr_test:
  - expr: hypershift:hostedcluster_creation_over_30m:ratio_30d
    eval_time: 10m
    exp_samples: []
  - expr: hypershift:hostedclusters_waiting_over_30m:ratio
    eval_time: 10m
    exp_samples: []
- interval: 1m
  name: "HyperShift Operator ratios"
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "1+0x100"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "2+0x100"
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="success", cluster="mc1", prometheus_replica="r1"}'
    values: "0+9x100"
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="error", cluster="mc1", prometheus_replica="r1"}'
    values: "0+1x100"
  - series: 'controller_runtime_reconcile_time_seconds_bucket{namespace="hypershift", pod="operator-abc", le="10", cluster="mc1", prometheus_replica="r1"}'
    values: "0+9x100"
  - series: 'controller_runtime_reconcile_time_seconds_count{namespace="hypershift", pod="operator-abc", cluster="mc1", prometheus_replica="r1"}'
    values: "0+10x100"
  - series: 'workqueue_depth{namespace="hypershift", pod="operator-abc", name="hc", cluster="mc1", prometheus_replica="r1"}'
    values: "200+0x100"
  - series: 'workqueue_adds_total{namespace="hypershift", pod="operator-abc", name="hc", cluster="mc1", prometheus_replica="r1"}'
    values: "0+6x100"
  promql_expr_test:
  - expr: hypershift:operator:replica_availability:ratio
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:operator:replica_availability:ratio{cluster="mc1"}'
      value: 0.5
  - expr: hypershift:operator:reconcile_error:ratio_rate5m
    eval_time: 30m
    exp_samples:
    - labels: 'hypershift:operator:reconcile_error:ratio_rate5m{cluster="mc1"}'
      value: 0.1
  - expr: hypershift:operator:reconcile_slow:ratio_rate5m
    eval_time: 30m
    exp_samples:
    - labels: 'hypershift:operator:reconcile_slow:ratio_rate5m{cluster="mc1"}'
      value: 0.09999999999999998
  - expr: hypershift:operator:saturation_signal
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:operator:saturation_signal{cluster="mc1", signal="workqueue_depth"}'
      value: 1
  - expr: hypershift:operator:saturated
    eval_time: 10m
    exp_samples:
    - labels: 'hypershift:operator:saturated{cluster="mc1"}'
      value: 1
  - expr: hypershift:operator:workqueue_adds:rate5m
    eval_time: 30m
    exp_samples:
    - labels: 'hypershift:operator:workqueue_adds:rate5m{cluster="mc1"}'
      value: 0.1
