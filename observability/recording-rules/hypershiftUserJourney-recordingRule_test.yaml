rule_files:
- hypershiftUserJourney-recordingRule.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  name: "Operator reconcile rate"
  input_series:
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="success", cluster="mc1", prometheus_replica="r1"}'
    values: "0+9x100"
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="success", cluster="mc1", prometheus_replica="r2"}'
    values: "0+9x100"
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="error", cluster="mc1", prometheus_replica="r1"}'
    values: "0+3x100"
  promql_expr_test:
  # HA Prometheus replicas are collapsed before summing: (9 + 3) per minute = 0.2/s.
  - expr: hypershift:operator:reconcile:rate5m
    eval_time: 30m
    exp_samples:
    - labels: 'hypershift:operator:reconcile:rate5m{cluster="mc1"}'
      value: 0.2
- interval: 30s
  name: "A scrape-length outage between evaluation points counts against availability"
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1", pod="ksm-a", prometheus_replica="r1"}'
    values: "3 0 3+0x18"
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1", pod="ksm-b", prometheus_replica="r2"}'
    values: "3 0 3+0x18"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1", pod="ksm-a", prometheus_replica="r1"}'
    values: "3+0x20"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1", pod="ksm-b", prometheus_replica="r2"}'
    values: "3+0x20"
  promql_expr_test:
  - expr: hypershift:operator:availability:ratio1m
    eval_time: 1m
    exp_samples:
    - labels: 'hypershift:operator:availability:ratio1m{cluster="mc1"}'
      value: 0.5
  - expr: hypershift:operator:replicas_unavailable:ratio
    eval_time: 1m
    exp_samples:
    - labels: 'hypershift:operator:replicas_unavailable:ratio{cluster="mc1"}'
      value: 0
  - expr: avg_over_time(hypershift:operator:availability:ratio1m[10m])
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="mc1"}'
      value: 0.95
  - expr: round(100 * (1 - (1 - avg_over_time(hypershift:operator:availability:ratio1m[10m])) / (1 - 0.9995)))
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="mc1"}'
      value: -9900
- interval: 15s
  name: "Staggered HA scrapes preserve an outage spanning two evaluation windows"
  input_series:
  # Thirty-second scrapes offset by 15s observe an outage from 55s through 85s.
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1", prometheus_replica="r1"}'
    values: "3 _ 3 _ 0 _ 3 _ 3"
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1", prometheus_replica="r2"}'
    values: "_ 3 _ 3 _ 0 _ 3 _"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1", prometheus_replica="r1"}'
    values: "3 _ 3 _ 3 _ 3 _ 3"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1", prometheus_replica="r2"}'
    values: "_ 3 _ 3 _ 3 _ 3 _"
  promql_expr_test:
  - expr: hypershift:operator:availability:ratio1m
    eval_time: 1m
    exp_samples:
    - labels: 'hypershift:operator:availability:ratio1m{cluster="mc1"}'
      value: 0.5
  - expr: hypershift:operator:availability:ratio1m
    eval_time: 2m
    exp_samples:
    - labels: 'hypershift:operator:availability:ratio1m{cluster="mc1"}'
      value: 0.5
- interval: 1m
  name: "Scaled-to-zero and missing deployment telemetry do not count as healthy"
  input_series:
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="scaled-down"}'
    values: "0+0x10"
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="scaled-down"}'
    values: "0+0x10"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="missing-availability"}'
    values: "3+0x10"
  promql_expr_test:
  - expr: hypershift:operator:availability:ratio1m
    eval_time: 10m
    exp_samples: []
  - expr: hypershift:operator:replicas_unavailable:ratio
    eval_time: 10m
    exp_samples: []
- interval: 1m
  name: "Historical availability does not mask a current telemetry outage"
  input_series:
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "3+0x2 stale"
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "3+0x2 stale"
  promql_expr_test:
  - expr: avg_over_time(hypershift:operator:availability:ratio1m[30d]) and hypershift:operator:availability:ratio1m
    eval_time: 10m
    exp_samples: []
- interval: 1m
  name: "Operator reconcile error rate dedupes HA replicas"
  input_series:
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="success", cluster="mc1"}'
    values: "0+9x100"
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="error", cluster="mc1", prometheus_replica="r1"}'
    values: "0+3x100"
  - series: 'controller_runtime_reconcile_total{namespace="hypershift", pod="operator-abc", controller="hc", result="error", cluster="mc1", prometheus_replica="r2"}'
    values: "0+3x100"
  promql_expr_test:
  - expr: hypershift:operator:reconcile_errors:rate5m
    eval_time: 30m
    exp_samples:
    - labels: 'hypershift:operator:reconcile_errors:rate5m{cluster="mc1"}'
      value: 0.05
- interval: 1m
  name: "Operator replica unavailability is capped and skips zero-desired"
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "2+0x10"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc1"}'
    values: "4+0x10"
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc2"}'
    values: "3+0x10"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc2"}'
    values: "2+0x10"
  - series: 'kube_deployment_status_replicas_available{namespace="hypershift", deployment="operator", cluster="mc3"}'
    values: "0+0x10"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc3"}'
    values: "0+0x10"
  - series: 'kube_deployment_spec_replicas{namespace="hypershift", deployment="operator", cluster="mc4"}'
    values: "2+0x10"
  promql_expr_test:
  - expr: hypershift:operator:replicas_unavailable:ratio
    eval_time: 5m
    exp_samples:
    - labels: 'hypershift:operator:replicas_unavailable:ratio{cluster="mc1"}'
      value: 0.5
    - labels: 'hypershift:operator:replicas_unavailable:ratio{cluster="mc2"}'
      value: 0
