apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: cluster-autoscaler-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Autoscaler Recording Rules
  # ========================================
  # These distil the upstream HyperShift cluster-autoscaler metrics
  # (cluster_autoscaler_*) into per-hosted-cluster signals. One autoscaler
  # Deployment runs per hosted control plane in its ocm-* namespace on the
  # management cluster; the PrometheusAgent remote-writes those series (identified
  # by namespace=~"ocm-.*") to the HCP Azure Monitor Workspace, so grouping by
  # (cluster, namespace) yields one series per hosted cluster: `cluster` is the
  # management cluster, `namespace` identifies the hosted control plane.
  #
  # These are absolute counts and >0-threshold rates (not ratios), so — like
  # frontend-slo-recordingRule.yaml — each raw selector is wrapped in
  # `max without (prometheus_replica) (...)` to collapse the two PrometheusAgent
  # replicas (which scrape the same autoscaler pods) into one before aggregation;
  # otherwise sum()/rate() would double-count. (Ratio-only rule sets such as
  # nodepool-slo can skip this because doubling cancels in numerator/denominator.)
  #
  # These metrics only exist for hosted clusters that have at least one NodePool
  # with autoscaling enabled — HyperShift scales the autoscaler Deployment to zero
  # otherwise, so absence of series is expected and must not be read as failure.
  - name: arohcp_cluster_autoscaler_recording_rules
    interval: 1m
    rules:
    # Ready worker nodes the autoscaler currently manages for the hosted cluster.
    - record: nodes:cluster_autoscaler:ready_count
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            cluster_autoscaler_nodes_count{state="ready", namespace=~"ocm-.*"}
          )
        )
    # Ceiling the autoscaler may scale to (maximum number of nodes in all node groups).
    - record: nodes:cluster_autoscaler:max_count
      expr: |
        max by (cluster, namespace) (
          max without (prometheus_replica) (
            cluster_autoscaler_max_nodes_count{namespace=~"ocm-.*"}
          )
        )
    # Fraction of the ceiling currently in use. 1.0 means the autoscaler is at
    # its limit and cannot add capacity for further pending pods.
    - record: nodes:cluster_autoscaler:capacity_ratio
      expr: |
        nodes:cluster_autoscaler:ready_count
        /
        clamp_min(nodes:cluster_autoscaler:max_count, 1)
    # Pods the scheduler could not place that the autoscaler is trying to make
    # room for. Sustained non-zero means demand is unmet.
    - record: pods:cluster_autoscaler:unschedulable_count
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            cluster_autoscaler_unschedulable_pods_count{namespace=~"ocm-.*"}
          )
        )
    # 1 while the autoscaler considers the cluster healthy enough to act; 0 when
    # it has switched itself off (e.g. too many unready/unregistered nodes).
    - record: health:cluster_autoscaler:safe_to_autoscale
      expr: |
        min by (cluster, namespace) (
          max without (prometheus_replica) (
            cluster_autoscaler_cluster_safe_to_autoscale{namespace=~"ocm-.*"}
          )
        )
    # Seconds since the autoscaler's main loop last ran. A growing value means the
    # control loop is wedged while the pod is still running. NOTE: when the
    # autoscaler pod is down (or scaled to zero), the upstream metric disappears
    # and this rule produces no series — it does NOT detect a dead pod. A
    # separate absent-detection mechanism is needed for that case (follow-up).
    - record: health:cluster_autoscaler:seconds_since_last_activity
      expr: |
        time()
        -
        max by (cluster, namespace) (
          max without (prometheus_replica) (
            cluster_autoscaler_last_activity{activity="main", namespace=~"ocm-.*"}
          )
        )
    # Rate of failed scale-up attempts (quota, capacity, provider errors).
    - record: errors:cluster_autoscaler:failed_scale_ups:rate15m
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(cluster_autoscaler_failed_scale_ups_total{namespace=~"ocm-.*"}[15m])
          )
        )
    # Rate of internal autoscaler errors, by type.
    - record: errors:cluster_autoscaler:errors:rate15m
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(cluster_autoscaler_errors_total{namespace=~"ocm-.*"}[15m])
          )
        )
    # Worker nodes the autoscaler has marked for deletion but not yet removed
    # (scale-down in flight). Non-zero is normal during scale-down.
    - record: nodes:cluster_autoscaler:pending_node_deletions
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            cluster_autoscaler_pending_node_deletions{namespace=~"ocm-.*"}
          )
        )
    # Rate of nodes added by scale-up.
    - record: nodes:cluster_autoscaler:scaled_up:rate15m
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(cluster_autoscaler_scaled_up_nodes_total{namespace=~"ocm-.*"}[15m])
          )
        )
    # Rate of nodes removed by scale-down.
    - record: nodes:cluster_autoscaler:scaled_down:rate15m
      expr: |
        sum by (cluster, namespace) (
          max without (prometheus_replica) (
            rate(cluster_autoscaler_scaled_down_nodes_total{namespace=~"ocm-.*"}[15m])
          )
        )
    # Per-cluster autoscaler telemetry availability, keyed on (cluster, namespace):
    #   1   = the autoscaler emitted metrics for this hosted cluster within 1m.
    #   0   = an autoscaler is expected here (its Deployment still desires more
    #         than zero replicas) but no metrics arrived for the whole 1m window.
    #   gap = no autoscaler is expected: HyperShift sets the Deployment's
    #         replicas to 0 when no NodePool enables autoscaling, so the absence
    #         of series is normal and must not page.
    #
    # Why not absent_over_time(): its output is label-less — a missing series has
    # no cluster/namespace to attribute the absence to — so it can never be
    # bifurcated per hosted cluster. present_over_time keeps the labels and
    # answers "any samples in the window, per group".
    #
    # Why the Deployment's desired replicas rather than a control-plane liveness
    # proxy: it is the only signal that says whether an autoscaler is supposed to
    # exist here. It is read from the Deployment object, so it stays above zero
    # while the pod is down or crash-looping — exactly when this metric should
    # read 0 — and is 0 when the customer has not enabled autoscaling, which is
    # when this metric should not exist at all. kube_deployment_spec_replicas
    # comes from kube-state-metrics, which is scraped and remote-written to the
    # same HCP Azure Monitor Workspace as the autoscaler metrics.
    - record: health:cluster_autoscaler:metrics_availability
      expr: |
        max by (cluster, namespace) (
          present_over_time(cluster_autoscaler_last_activity{activity="main", namespace=~"ocm-.*"}[1m])
        )
        or on (cluster, namespace)
        (
          (
            max by (cluster, namespace) (
              kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="cluster-autoscaler"}
            ) > 0
          ) * 0
        )
