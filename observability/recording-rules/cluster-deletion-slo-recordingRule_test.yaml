# Boundary: exactly 1800s (30 min) does NOT count as slow because the threshold is > 1800.
# 1 boundary op (1800s) + 4 fast (600s) = 0/5 = 0.
# A value of 1801s would be counted as slow.
- name: latency_error_rate_exactly_30min_counts_as_fast
  interval: 1m
  input_series:
  # 1 operation at exactly the threshold: duration = 1800 - 0 = 1800s (> 1800 → fast, not slow)
  - series: 'backend_resource_operation_phase_info{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="succeeded",resource_id="boundary1",subscription_id="sub1",cluster="svc-1"}'
