# ═════════════════════════════════════════════════════════════════════════════
# Windowed recording rules
# ═════════════════════════════════════════════════════════════════════════════
# These rules use (time() - last_transition_time_seconds) < W to filter
# operations into 1h, 6h, and 3d buckets. Each window produces
# failed_Xh, total_Xh, error_rate_Xh.
# In promtool, time() at eval_time Nm = N * 60 seconds.
# --- 1h window: 8 failed + 2 succeeded, all inside window ---
# At eval_time 5m, time() = 300. last_transition_time = 100.
# (300 - 100) = 200 < 3600 → all inside 1h window.
# failed_1h = 8, total_1h = 10, error_rate_1h = 8/10 = 0.8
- name: windowed_1h_arithmetic
  interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="failed",resource_id="f1",subscription_id="sub1",cluster="svc-1"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="failed",resource_id="f1",subscription_id="sub1",cluster="svc-1"}'
    values: "100+0x15"
  - series: 'backend_resource_operation_phase_info{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="failed",resource_id="f2",subscription_id="sub1",cluster="svc-1"}'
