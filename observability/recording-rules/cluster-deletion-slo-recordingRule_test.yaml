# ═════════════════════════════════════════════════════════════════════════════
# Windowed latency recording rules
# ═════════════════════════════════════════════════════════════════════════════
# These rules use (time() - last_transition_time_seconds) < W to filter
# succeeded operations into 1h, 6h, and 3d buckets. Each window produces
# latency_slow_Xh (duration > 1800s), latency_total_Xh (all succeeded),
# latency_error_rate_Xh (slow / total).
# In promtool, time() at eval_time Nm = N * 60 seconds.
# --- 1h window: 3 slow + 2 fast succeeded, all inside window ---
# At eval_time 5m, time() = 300.
# slow ops: start_time=0, last_transition_time=2000 → duration=2000 > 1800 (slow)
#   window: (300 - 2000) = -1700 < 3600 → inside window
# fast ops: start_time=0, last_transition_time=100 → duration=100 < 1800 (fast)
#   window: (300 - 100) = 200 < 3600 → inside window
# latency_slow_1h = 3, latency_total_1h = 5, latency_error_rate_1h = 3/5 = 0.6
- name: windowed_latency_1h_arithmetic
  interval: 1m
  input_series:
  # 3 slow operations: duration = 2000 - 0 = 2000s > 1800s
  - series: 'backend_resource_operation_phase_info{resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",operation_type="delete",phase="succeeded",resource_id="slow1",subscription_id="sub1",cluster="svc-1"}'
    values: "1+0x15"
