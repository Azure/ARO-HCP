rule_files:
- cluster-autoscaler-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Recording rules produce expected values from input series.
# ready(3), max(6), unschedulable(2), safe(1), main loop tracks wall clock,
# failed scale-ups incrementing, no internal errors.
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_nodes_count{state="ready", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "3x30"
  # A non-ocm namespace must be excluded by the namespace=~"ocm-.*" selector. If
  # filtering regressed, ready_count would emit an extra kube-system series and
  # the assertion below (which lists only the ocm series) would fail.
  - series: 'cluster_autoscaler_nodes_count{state="ready", cluster="mgmt-1", namespace="kube-system"}'
    values: "99x30"
  - series: 'cluster_autoscaler_max_nodes_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "6x30"
  - series: 'cluster_autoscaler_unschedulable_pods_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "2x30"
  - series: 'cluster_autoscaler_cluster_safe_to_autoscale{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "1x30"
  # last_activity increments 60/min so it equals time() at every step -> seconds_since == 0
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0+60x30"
  - series: 'cluster_autoscaler_failed_scale_ups_total{reason="failed", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0+1x30"
  - series: 'cluster_autoscaler_errors_total{type="cloudProviderError", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0x30"
  promql_expr_test:
  - expr: nodes:cluster_autoscaler:ready_count
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:ready_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 3
  - expr: nodes:cluster_autoscaler:max_count
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:max_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 6
  - expr: nodes:cluster_autoscaler:capacity_ratio
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:capacity_ratio{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0.5
  - expr: pods:cluster_autoscaler:unschedulable_count
    eval_time: 20m
    exp_samples:
    - labels: 'pods:cluster_autoscaler:unschedulable_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 2
  - expr: health:cluster_autoscaler:safe_to_autoscale
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:safe_to_autoscale{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
  - expr: health:cluster_autoscaler:seconds_since_last_activity
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:seconds_since_last_activity{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0
  # rate is a non-integer (1/60); assert it is strictly positive rather than an exact float.
  - expr: errors:cluster_autoscaler:failed_scale_ups:rate15m > bool 0
    eval_time: 20m
    exp_samples:
    - labels: '{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
  - expr: errors:cluster_autoscaler:errors:rate15m
    eval_time: 20m
    exp_samples:
    - labels: 'errors:cluster_autoscaler:errors:rate15m{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0
# ========================================
# metrics_availability: 1 while telemetry flows, 0 once it stops while an
# autoscaler is still expected, and no series at all when no autoscaler is
# expected. "Expected" is signalled by the cluster-autoscaler Deployment's
# desired replicas (kube_deployment_spec_replicas), not by a control-plane
# liveness proxy.
#   mgmt-1: autoscaler keeps emitting                       -> 1
#   mgmt-2: autoscaler stops after minute 9 but the
#           Deployment still desires 1 replica (pod down)    -> 1 then 0
#   mgmt-3: autoscaler and Deployment both disappear after
#           minute 9 (hosted cluster deleted)                -> 1 then absent
#   mgmt-4: no NodePool enables autoscaling, so the
#           Deployment desires 0 replicas and no autoscaler
#           metrics have ever existed                        -> always absent
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0+60x30"
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-2", namespace="ocm-dev-abc-cluster22-01"}'
    values: "0+60x9"
  # An autoscaler is expected: the Deployment still desires one replica.
  - series: 'kube_deployment_spec_replicas{deployment="cluster-autoscaler", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "1x30"
  - series: 'kube_deployment_spec_replicas{deployment="cluster-autoscaler", cluster="mgmt-2", namespace="ocm-dev-abc-cluster22-01"}'
    values: "1x30"
  # mgmt-3: the whole hosted cluster is deleted after minute 9, so the Deployment
  # disappears too. With no autoscaler expected any more the rule must emit
  # nothing (neither 1 nor 0) rather than flag a gone cluster as a failure.
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-3", namespace="ocm-dev-abc-cluster23-01"}'
    values: "0+60x9"
  - series: 'kube_deployment_spec_replicas{deployment="cluster-autoscaler", cluster="mgmt-3", namespace="ocm-dev-abc-cluster23-01"}'
    values: "1x9"
  # mgmt-4: autoscaling is not enabled (no NodePool has spec.autoScaling), so
  # HyperShift scales the Deployment to zero and no autoscaler metrics ever
  # exist. The rule must stay silent instead of reporting 0.
  - series: 'kube_deployment_spec_replicas{deployment="cluster-autoscaler", cluster="mgmt-4", namespace="ocm-dev-abc-cluster24-01"}'
    values: "0x30"
  promql_expr_test:
  - expr: health:cluster_autoscaler:metrics_availability
    eval_time: 5m
    exp_samples:
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-2", namespace="ocm-dev-abc-cluster22-01"}'
      value: 1
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-3", namespace="ocm-dev-abc-cluster23-01"}'
      value: 1
  - expr: health:cluster_autoscaler:metrics_availability
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-2", namespace="ocm-dev-abc-cluster22-01"}'
      value: 0
# ========================================
# seconds_since_last_activity grows when the main loop stops updating
# (last_activity constant while time advances).
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0x30"
  promql_expr_test:
  - expr: health:cluster_autoscaler:seconds_since_last_activity
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:seconds_since_last_activity{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1200
# ========================================
# Pending deletions + scale up/down rates. Two prometheus_replica series per
# metric exercise the dedup (max without (prometheus_replica)) — results must
# NOT double-count across replicas.
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_pending_node_deletions{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01", prometheus_replica="prometheus-0"}'
    values: "2x30"
  - series: 'cluster_autoscaler_pending_node_deletions{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01", prometheus_replica="prometheus-1"}'
    values: "2x30"
  - series: 'cluster_autoscaler_scaled_up_nodes_total{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01", prometheus_replica="prometheus-0"}'
    values: "0+2x30"
  - series: 'cluster_autoscaler_scaled_up_nodes_total{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01", prometheus_replica="prometheus-1"}'
    values: "0+2x30"
  - series: 'cluster_autoscaler_scaled_down_nodes_total{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01", prometheus_replica="prometheus-0"}'
    values: "0+1x30"
  - series: 'cluster_autoscaler_scaled_down_nodes_total{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01", prometheus_replica="prometheus-1"}'
    values: "0+1x30"
  promql_expr_test:
  # two replicas each reporting 2 must dedup to 2 (not sum to 4)
  - expr: nodes:cluster_autoscaler:pending_node_deletions
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:pending_node_deletions{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 2
  # rates are non-integer (per-second); assert strictly positive rather than an exact float.
  - expr: nodes:cluster_autoscaler:scaled_up:rate15m > bool 0
    eval_time: 20m
    exp_samples:
    - labels: '{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
  - expr: nodes:cluster_autoscaler:scaled_down:rate15m > bool 0
    eval_time: 20m
    exp_samples:
    - labels: '{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
# ========================================
# metrics_availability recovery: a cluster goes silent then resumes. It must
# transition 1 -> 0 -> 1 and NOT stay stuck at 0 after the autoscaler returns.
# The autoscaler emits 0-9m, is silent 10-19m, and emits again from 20m while
# the Deployment keeps desiring one replica, so the gap reads 0 (firing) rather
# than absent.
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    # value is irrelevant here (metrics_availability only checks presence):
    # up 0-9m, silent 10-19m, up again from 20m.
    values: "1x9 _x10 1x11"
  - series: 'kube_deployment_spec_replicas{deployment="cluster-autoscaler", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "1x31"
  promql_expr_test:
  # healthy -> 1
  - expr: health:cluster_autoscaler:metrics_availability
    eval_time: 5m
    exp_samples:
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
  # firing (autoscaler silent while still expected) -> 0
  - expr: health:cluster_autoscaler:metrics_availability
    eval_time: 15m
    exp_samples:
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0
  # resolved (autoscaler resumed) -> back to 1
  - expr: health:cluster_autoscaler:metrics_availability
    eval_time: 25m
    exp_samples:
    - labels: 'health:cluster_autoscaler:metrics_availability{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
