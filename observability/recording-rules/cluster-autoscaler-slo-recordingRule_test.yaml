rule_files:
- cluster-autoscaler-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# ========================================
# Recording rules produce expected values from input series.
# ready(3), max(6), unschedulable(2), safe(1), main loop tracks wall clock,
# failed scale-ups incrementing, no internal errors.
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_nodes_count{state="ready", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "3x30"
  - series: 'cluster_autoscaler_max_nodes_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "6x30"
  - series: 'cluster_autoscaler_unschedulable_pods_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "2x30"
  - series: 'cluster_autoscaler_cluster_safe_to_autoscale{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "1x30"
  # last_activity increments 60/min so it equals time() at every step -> seconds_since == 0
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0+60x30"
  - series: 'cluster_autoscaler_failed_scale_ups_total{reason="failed", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0+1x30"
  - series: 'cluster_autoscaler_errors_total{type="cloudProviderError", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0x30"
  promql_expr_test:
  - expr: nodes:cluster_autoscaler:ready_count
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:ready_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 3
  - expr: nodes:cluster_autoscaler:max_count
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:max_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 6
  - expr: nodes:cluster_autoscaler:capacity_ratio
    eval_time: 20m
    exp_samples:
    - labels: 'nodes:cluster_autoscaler:capacity_ratio{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0.5
  - expr: pods:cluster_autoscaler:unschedulable_count
    eval_time: 20m
    exp_samples:
    - labels: 'pods:cluster_autoscaler:unschedulable_count{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 2
  - expr: health:cluster_autoscaler:safe_to_autoscale
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:safe_to_autoscale{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
  - expr: health:cluster_autoscaler:seconds_since_last_activity
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:seconds_since_last_activity{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0
  # rate is a non-integer (1/60); assert it is strictly positive rather than an exact float.
  - expr: errors:cluster_autoscaler:failed_scale_ups:rate15m > bool 0
    eval_time: 20m
    exp_samples:
    - labels: '{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1
  - expr: errors:cluster_autoscaler:errors:rate15m
    eval_time: 20m
    exp_samples:
    - labels: 'errors:cluster_autoscaler:errors:rate15m{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 0
# ========================================
# seconds_since_last_activity grows when the main loop stops updating
# (last_activity constant while time advances).
# ========================================
- interval: 1m
  input_series:
  - series: 'cluster_autoscaler_last_activity{activity="main", cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
    values: "0x30"
  promql_expr_test:
  - expr: health:cluster_autoscaler:seconds_since_last_activity
    eval_time: 20m
    exp_samples:
    - labels: 'health:cluster_autoscaler:seconds_since_last_activity{cluster="mgmt-1", namespace="ocm-dev-abc-cluster21-01"}'
      value: 1200
