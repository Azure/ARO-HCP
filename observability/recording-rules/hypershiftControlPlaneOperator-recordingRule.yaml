apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: hypershift-control-plane-operator-recording-rules
  namespace: monitoring
spec:
  # HCP deployment and CPO metrics are routed to the HCP workspace.
  # Keep both dashboard accounting and burn-rate inputs in this shared source.
  groups:
  - name: hypershift-cpo-recording-rules
    interval: 1m
    rules:
    # Point-in-time bad fraction used by the component burn-rate alerts.
    # Missing inputs and zero-desired deployments emit no observation.
    - record: hypershift:cpo:replicas_unavailable:ratio
      expr: |
        1 - clamp_max(
          max by (cluster, namespace) (kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="control-plane-operator"})
          /
          (max by (cluster, namespace) (kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="control-plane-operator"}) > 0),
          1
        )
    - record: hypershift:cpo:reconcile:rate5m
      expr: |
        sum by (cluster, namespace) (max without (prometheus_replica) (rate(controller_runtime_reconcile_total{namespace=~"ocm-.*", pod=~"control-plane-operator-.*"}[5m])))
    - record: hypershift:cpo:reconcile_errors:rate5m
      expr: |
        sum by (cluster, namespace) (max without (prometheus_replica) (rate(controller_runtime_reconcile_total{namespace=~"ocm-.*", pod=~"control-plane-operator-.*", result="error"}[5m])))
    # Keep one long-window rate per HCP, rather than scanning every CPO counter
    # on dashboard refresh. Sum rates before division for fleet event weighting.
    - record: hypershift:cpo:reconcile:rate30d
      expr: |
        sum by (cluster, namespace) (max without (prometheus_replica) (rate(controller_runtime_reconcile_total{namespace=~"ocm-.*", pod=~"control-plane-operator-.*"}[30d])))
    - record: hypershift:cpo:reconcile_errors:rate30d
      expr: |
        sum by (cluster, namespace) (max without (prometheus_replica) (rate(controller_runtime_reconcile_total{namespace=~"ocm-.*", pod=~"control-plane-operator-.*", result="error"}[30d])))
    - record: hypershift:cpo:reconcile_within_10s:rate30d
      expr: |
        sum by (cluster, namespace) (max without (prometheus_replica) (rate(controller_runtime_reconcile_time_seconds_bucket{namespace=~"ocm-.*", pod=~"control-plane-operator-.*", le="10"}[30d])))
    - record: hypershift:cpo:reconcile_duration_count:rate30d
      expr: |
        sum by (cluster, namespace) (max without (prometheus_replica) (rate(controller_runtime_reconcile_time_seconds_count{namespace=~"ocm-.*", pod=~"control-plane-operator-.*"}[30d])))
    # HCP deployment metrics are routed to the HCP workspace. Summarize raw
    # scrapes so short outages survive the one-minute recording interval.
    # Keep each HCP separate; scaled-to-zero deployments are not eligible.
    # Keep the lowest replica window so staggered HA scrapes cannot hide outages.
    # Dashboard accounting uses this one-minute good fraction; burn-rate alerts
    # in Azure/ARO-HCP#7989 use hypershift:cpo:replicas_unavailable:ratio instead.
    # Their point-in-time bad fraction is not the exact complement of this rule.
    # Both recordings share this hypershift-cpo-recording-rules group.
    - record: hypershift:cpo:availability:ratio1m
      expr: |
        clamp_max(
          min by (cluster, namespace) (avg_over_time(kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="control-plane-operator"}[1m]))
          /
          (max by (cluster, namespace) (avg_over_time(kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="control-plane-operator"}[1m])) > 0),
          1
        )
