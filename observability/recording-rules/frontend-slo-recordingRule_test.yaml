rule_files:
- frontend-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# Availability 0.75 / Errors 0.25 / Traffic 1 RPS / Latency diagnostics
# Rates use exact binary fractions (see HCPkas latency tests) to avoid float drift.
- interval: 1m
  input_series:
  # 45 non-5xx/min + 15 5xx/min = 60/min = 1 RPS; availability 0.75
  - series: 'frontend_http_requests_total{cluster="svc-1", code="200", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+45x15"
  - series: 'frontend_http_requests_total{cluster="svc-1", code="500", method="PUT", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+15x15"
  - series: 'frontend_http_requests_total{cluster="svc-1", code="200", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    # Duplicate replica must be collapsed by max without (prometheus_replica)

    values: "0+45x15"
  - series: 'frontend_http_requests_total{cluster="svc-1", code="500", method="PUT", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    values: "0+15x15"
  - series: 'frontend_http_requests_total{cluster="svc-1", code="200", method="GET", route="/subscriptions/{subscriptionid}/providers/microsoft.redhatopenshift/locations/{location}/hcpoperationresults/{operationid}", prometheus_replica="a"}'
    # ARM async poll traffic must be excluded from SLIs (results + statuses)

    values: "0+1000x15"
  - series: 'frontend_http_requests_total{cluster="svc-1", code="200", method="GET", route="/subscriptions/{subscriptionid}/providers/microsoft.redhatopenshift/locations/{location}/hcpoperationstatuses/{operationid}", prometheus_replica="a"}'
    values: "0+1000x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="0.8", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    # Latency histogram: 60/min, 50 within 0.8s, all within 1s → p99 < 1s.

    # Finite le="15" is required so histogram_quantile can interpolate (not +Inf).
    values: "0+50x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="1.0", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="15", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="+Inf", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  - series: 'frontend_http_requests_duration_seconds_count{cluster="svc-1", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="0.8", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    # Replica b has a different valid distribution and volume. Summing both
    # histograms yields p99=0.964 and p95=0.82; max per bucket does not.
    values: "0+120x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="1.0", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    values: "0+120x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="15", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    values: "0+120x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-1", le="+Inf", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    values: "0+120x15"
  - series: 'frontend_http_requests_duration_seconds_count{cluster="svc-1", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="b"}'
    values: "0+120x15"
  - series: 'kube_deployment_status_replicas_available{cluster="svc-1", namespace="aro-hcp", deployment="aro-hcp-frontend", prometheus_replica="a"}'
    values: "2+0x15"
  - series: 'kube_deployment_spec_replicas{cluster="svc-1", namespace="aro-hcp", deployment="aro-hcp-frontend", prometheus_replica="a"}'
    values: "2+0x15"
  - series: 'container_cpu_usage_seconds_total{cluster="svc-1", namespace="aro-hcp", container="aro-hcp-frontend", pod="aro-hcp-frontend-0", prometheus_replica="a"}'
    # Saturation: 0.5 CPU cores used / 1.0 requested; 512Mi / 1024Mi memory

    values: "0+30x15"
  - series: 'kube_pod_container_resource_requests{cluster="svc-1", namespace="aro-hcp", container="aro-hcp-frontend", pod="aro-hcp-frontend-0", resource="cpu", unit="core", job="kube-state-metrics", prometheus_replica="a"}'
    values: "1+0x15"
  - series: 'container_memory_working_set_bytes{cluster="svc-1", namespace="aro-hcp", container="aro-hcp-frontend", pod="aro-hcp-frontend-0", prometheus_replica="a"}'
    values: "536870912+0x15"
  - series: 'kube_pod_container_resource_limits{cluster="svc-1", namespace="aro-hcp", container="aro-hcp-frontend", pod="aro-hcp-frontend-0", resource="memory", unit="byte", job="kube-state-metrics", prometheus_replica="a"}'
    values: "1073741824+0x15"
  promql_expr_test:
  - expr: sli:frontend_http:availability:rate5m{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:availability:rate5m", cluster="svc-1"}'
      value: 0.75
  - expr: errors:frontend_http:request_rate:sum30d{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="errors:frontend_http:request_rate:sum30d", cluster="svc-1"}'
      value: 0.25
  - expr: traffic:frontend_http:request_rate:sum30d{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="traffic:frontend_http:request_rate:sum30d", cluster="svc-1"}'
      value: 1
  - expr: errors:frontend_http:error_rate:rate5m{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="errors:frontend_http:error_rate:rate5m", cluster="svc-1"}'
      value: 0.25
  # Allow only sub-picosecond rounding differences in interpolated quantiles.
  # The bool comparison still requires a sample with the expected cluster label.
  - expr: abs(sli:frontend_http:latency_p99:rate5m{cluster="svc-1"} - 0.964) < bool 1e-12
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-1"}'
      value: 1
  - expr: abs(sli:frontend_http:latency_p95:rate5m{cluster="svc-1"} - 0.82) < bool 1e-12
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-1"}'
      value: 1
  - expr: sli:frontend:ready:ratio5m{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend:ready:ratio5m", cluster="svc-1"}'
      value: 1
  - expr: traffic:frontend_http:request_rate:rate5m{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="traffic:frontend_http:request_rate:rate5m", cluster="svc-1"}'
      value: 1
  - expr: sli:frontend:saturation_cpu:ratio5m{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend:saturation_cpu:ratio5m", cluster="svc-1"}'
      value: 0.5
  - expr: sli:frontend:saturation_memory:ratio5m{cluster="svc-1"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend:saturation_memory:ratio5m", cluster="svc-1"}'
      value: 0.5
- interval: 1m
  # Perfect availability (all 2xx)

  input_series:
  - series: 'frontend_http_requests_total{cluster="svc-2", code="200", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  promql_expr_test:
  - expr: sli:frontend_http:availability:rate5m{cluster="svc-2"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:availability:rate5m", cluster="svc-2"}'
      value: 1
  - expr: errors:frontend_http:error_rate:rate5m{cluster="svc-2"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="errors:frontend_http:error_rate:rate5m", cluster="svc-2"}'
      value: 0
  - expr: 1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-2"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-2"})
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="svc-2"}'
      value: 1
  - expr: clamp_min(((1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-2"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-2"})) - 0.9995) / (1 - 0.9995) * 100, 0)
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="svc-2"}'
      value: 100
- interval: 1m
  # All-5xx traffic: availability must emit 0 (not drop), errors 1

  input_series:
  - series: 'frontend_http_requests_total{cluster="svc-3", code="500", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  promql_expr_test:
  - expr: sli:frontend_http:availability:rate5m{cluster="svc-3"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:availability:rate5m", cluster="svc-3"}'
      value: 0
  - expr: errors:frontend_http:error_rate:rate5m{cluster="svc-3"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="errors:frontend_http:error_rate:rate5m", cluster="svc-3"}'
      value: 1
  - expr: 1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-3"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-3"})
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="svc-3"}'
      value: 0
  - expr: clamp_min(((1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-3"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-3"})) - 0.9995) / (1 - 0.9995) * 100, 0)
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="svc-3"}'
      value: 0
- interval: 1m
  # Slow p99: 45/min in the 1s bucket, 15/min in (1s, 15s] → p99 interpolates near 15s.

  input_series:
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-slow", le="1.0", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+45x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-slow", le="15", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-slow", le="+Inf", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  - series: 'frontend_http_requests_duration_seconds_count{cluster="svc-slow", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+60x15"
  promql_expr_test:
  - expr: sli:frontend_http:latency_p99:rate5m{cluster="svc-slow"}
    eval_time: 10m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:latency_p99:rate5m", cluster="svc-slow"}'
      value: 14.44
- interval: 1m
  # The lower histogram buckets stop advancing in the newest five minutes.
  # offset 5m keeps the diagnostic quantiles on the last settled window.
  input_series:
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-delay", le="0.8", route="/test", prometheus_replica="a"}'
    values: "0+50x15 750+0x5"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-delay", le="1", route="/test", prometheus_replica="a"}'
    values: "0+60x15 900+0x5"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-delay", le="15", route="/test", prometheus_replica="a"}'
    values: "0+60x20"
  - series: 'frontend_http_requests_duration_seconds_bucket{cluster="svc-delay", le="+Inf", route="/test", prometheus_replica="a"}'
    values: "0+60x20"
  - series: 'frontend_http_requests_duration_seconds_count{cluster="svc-delay", route="/test", prometheus_replica="a"}'
    values: "0+60x20"
  promql_expr_test:
  - expr: sli:frontend_http:latency_p99:rate5m{cluster="svc-delay"}
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:latency_p99:rate5m", cluster="svc-delay"}'
      value: 0.988
  - expr: sli:frontend_http:latency_p95:rate5m{cluster="svc-delay"}
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:latency_p95:rate5m", cluster="svc-delay"}'
      value: 0.94
- interval: 1m
  # Full replica outage: ready emits 0 (not absent).

  input_series:
  - series: 'kube_deployment_status_replicas_available{cluster="svc-down", namespace="aro-hcp", deployment="aro-hcp-frontend", prometheus_replica="a"}'
    values: "0+0x15"
  - series: 'kube_deployment_spec_replicas{cluster="svc-down", namespace="aro-hcp", deployment="aro-hcp-frontend", prometheus_replica="a"}'
    values: "2+0x15"
  promql_expr_test:
  - expr: sli:frontend:ready:ratio5m{cluster="svc-down"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend:ready:ratio5m", cluster="svc-down"}'
      value: 0
- interval: 1m
  # Idle but healthy: ready=1, no ARM HTTP series → HTTP SLIs/traffic/latency
  # emit no sample (not 0/NaN). Protects long-window aggregates.
  input_series:
  - series: 'kube_deployment_status_replicas_available{cluster="svc-idle", namespace="aro-hcp", deployment="aro-hcp-frontend", prometheus_replica="a"}'
    values: "2+0x15"
  - series: 'kube_deployment_spec_replicas{cluster="svc-idle", namespace="aro-hcp", deployment="aro-hcp-frontend", prometheus_replica="a"}'
    values: "2+0x15"
  promql_expr_test:
  - expr: sli:frontend_http:availability:rate5m{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: errors:frontend_http:request_rate:sum30d{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: traffic:frontend_http:request_rate:sum30d{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: 1 - sum by (cluster) (sum_over_time((errors:frontend_http:error_rate:rate5m{cluster="svc-idle"} * traffic:frontend_http:request_rate:rate5m{cluster="svc-idle"})[30d:5m])) / sum by (cluster) (sum_over_time(traffic:frontend_http:request_rate:rate5m{cluster="svc-idle"}[30d:5m]))
    eval_time: 5m
    exp_samples: []
  - expr: 1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-idle"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-idle"})
    eval_time: 5m
    exp_samples: []
  - expr: errors:frontend_http:error_rate:rate5m{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: sli:frontend_http:latency_p99:rate5m{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: sli:frontend_http:latency_p95:rate5m{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: traffic:frontend_http:request_rate:rate5m{cluster="svc-idle"}
    eval_time: 5m
    exp_samples: []
  - expr: sli:frontend:ready:ratio5m{cluster="svc-idle"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend:ready:ratio5m", cluster="svc-idle"}'
      value: 1
- interval: 1m
  # A present but idle request counter produces zero traffic and no error rate.
  input_series:
  - series: 'frontend_http_requests_total{cluster="svc-zero", code="200", route="/test", prometheus_replica="a"}'
    values: "0+0x15"
  promql_expr_test:
  - expr: traffic:frontend_http:request_rate:sum30d{cluster="svc-zero"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="traffic:frontend_http:request_rate:sum30d", cluster="svc-zero"}'
      value: 0
  - expr: 1 - sum by (cluster) (sum_over_time((errors:frontend_http:error_rate:rate5m{cluster="svc-zero"} * traffic:frontend_http:request_rate:rate5m{cluster="svc-zero"})[30d:5m])) / sum by (cluster) (sum_over_time(traffic:frontend_http:request_rate:rate5m{cluster="svc-zero"}[30d:5m]))
    eval_time: 5m
    exp_samples: []
  - expr: 1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-zero"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-zero"})
    eval_time: 5m
    exp_samples: []
- interval: 1m
  # Request-weighted 30d vs avg-of-ratios. Two 5m windows:
  #   t=0-5m: 10,000 good requests; t=7m: 1 failed request (inside the
  #   second 5m rate window so rate() observes the increase).
  # avg_over_time of the 5m *ratio* is 50%. Weighted 30d is 10000/10001.
  input_series:
  - series: 'frontend_http_requests_total{cluster="svc-skew", code="200", method="GET", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+2000x5 10000+0x12"
  - series: 'frontend_http_requests_total{cluster="svc-skew", code="500", method="PUT", route="/subscriptions/{subscriptionid}/resourcegroups/{resourcegroupname}/providers/microsoft.redhatopenshift/hcpopenshiftclusters/{resourcename}", prometheus_replica="a"}'
    values: "0+0x6 1+0x11"
  promql_expr_test:
  - expr: sli:frontend_http:availability:rate5m{cluster="svc-skew"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:availability:rate5m", cluster="svc-skew"}'
      value: 1
  - expr: sli:frontend_http:availability:rate5m{cluster="svc-skew"}
    eval_time: 10m
    exp_samples:
    - labels: '{__name__="sli:frontend_http:availability:rate5m", cluster="svc-skew"}'
      value: 0
  - expr: avg_over_time(sli:frontend_http:availability:rate5m{cluster="svc-skew"}[30d:5m])
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-skew"}'
      value: 0.5
  # Compare the recorded sums with the original dashboard calculation at the
  # same evaluation time, as well as checking the request-weighted result.
  - expr: abs((1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-skew"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-skew"})) - 0.9999000099990001) < bool 1e-12
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-skew"}'
      value: 1
  - expr: |
      (1 - sum by (cluster) (sum_over_time((errors:frontend_http:error_rate:rate5m{cluster="svc-skew"} * traffic:frontend_http:request_rate:rate5m{cluster="svc-skew"})[30d:5m])) / sum by (cluster) (sum_over_time(traffic:frontend_http:request_rate:rate5m{cluster="svc-skew"}[30d:5m])))
      == bool
      (1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-skew"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-skew"}))
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-skew"}'
      value: 1
  - expr: abs(clamp_min(((1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-skew"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-skew"})) - 0.9995) / (1 - 0.9995) * 100, 0) - 80.00199980001447) < bool 1e-9
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-skew"}'
      value: 1
  - expr: |
      clamp_min(((1 - sum by (cluster) (sum_over_time((errors:frontend_http:error_rate:rate5m{cluster="svc-skew"} * traffic:frontend_http:request_rate:rate5m{cluster="svc-skew"})[30d:5m])) / sum by (cluster) (sum_over_time(traffic:frontend_http:request_rate:rate5m{cluster="svc-skew"}[30d:5m]))) - 0.9995) / (1 - 0.9995) * 100, 0)
      == bool
      clamp_min(((1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-skew"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-skew"})) - 0.9995) / (1 - 0.9995) * 100, 0)
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-skew"}'
      value: 1
- interval: 1m
  # Two label sets, with a stale error sample in one region at t=5m.
  # The numerator omits that sample but the denominator retains its traffic,
  # matching the original dashboard's missing-data behavior.
  input_series:
  - series: 'errors:frontend_http:error_rate:rate5m{cluster="svc-regions", region="a"}'
    values: "0.25+0x4 stale _ _ _ _ 0.25+0x5"
  - series: 'traffic:frontend_http:request_rate:rate5m{cluster="svc-regions", region="a"}'
    values: "4+0x15"
  - series: 'errors:frontend_http:error_rate:rate5m{cluster="svc-regions", region="b"}'
    values: "0.5+0x15"
  - series: 'traffic:frontend_http:request_rate:rate5m{cluster="svc-regions", region="b"}'
    values: "2+0x15"
  promql_expr_test:
  - expr: errors:frontend_http:request_rate:sum30d{cluster="svc-regions"}
    eval_time: 10m
    exp_samples:
    - labels: '{__name__="errors:frontend_http:request_rate:sum30d", cluster="svc-regions", region="a"}'
      value: 2
    - labels: '{__name__="errors:frontend_http:request_rate:sum30d", cluster="svc-regions", region="b"}'
      value: 3
  - expr: traffic:frontend_http:request_rate:sum30d{cluster="svc-regions"}
    eval_time: 10m
    exp_samples:
    - labels: '{__name__="traffic:frontend_http:request_rate:sum30d", cluster="svc-regions", region="a"}'
      value: 12
    - labels: '{__name__="traffic:frontend_http:request_rate:sum30d", cluster="svc-regions", region="b"}'
      value: 6
  - expr: 1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-regions"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-regions"})
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-regions"}'
      value: 0.7222222222222222
  - expr: |
      (1 - sum by (cluster) (sum_over_time((errors:frontend_http:error_rate:rate5m{cluster="svc-regions"} * traffic:frontend_http:request_rate:rate5m{cluster="svc-regions"})[30d:5m])) / sum by (cluster) (sum_over_time(traffic:frontend_http:request_rate:rate5m{cluster="svc-regions"}[30d:5m])))
      == bool
      (1 - sum by (cluster) (errors:frontend_http:request_rate:sum30d{cluster="svc-regions"}) / sum by (cluster) (traffic:frontend_http:request_rate:sum30d{cluster="svc-regions"}))
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="svc-regions"}'
      value: 1
