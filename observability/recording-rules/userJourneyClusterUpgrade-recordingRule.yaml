apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: user-journey-cluster-upgrade-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Upgrade recording rules
  # ========================================
  # Eligibility, first-seen timestamps, in-progress fleet counts, and per-upgrade
  # duration metrics used by stuck alerts and the cluster-upgrade SLO dashboard.
  #
  # upgrade_eligible:info must be evaluated before version_state_first_seen (same cycle).
  # Eligibility: per resource_id, at least two distinct version labels and at least one completed.
  # Excludes initial install. Cluster create bounds when install ends (operation_cluster_create.go):
  # https://github.com/Azure/ARO-HCP/blob/main/backend/pkg/controllers/operationcontrollers/operation_cluster_create.go#L316-L320
  #
  # Naming: level:metric:operations per https://prometheus.io/docs/practices/rules/#naming
  - name: arohcp_user_journey_cluster_upgrade_recording_rules
    interval: 1m
    rules:
    - record: hosted_control_plane_upgrade:upgrade_eligible:info
      expr: |
        (
          (
            count by (cluster, resource_id, subscription_id, cluster_uuid) (
              count by (cluster, resource_id, subscription_id, cluster_uuid, version) (
                backend_cluster_version_info == 1
              )
            ) >= 2
          )
          and on (cluster, resource_id) (
            count by (cluster, resource_id) (
              backend_cluster_version_info{state="completed"} == 1
            ) >= 1
          )
        ) * 0 + 1
    - record: hosted_control_plane_upgrade:version_state_first_seen:timestamp
      # When each upgrade target version first entered desired or partial (start time for SLO durations).

      # Stop recording once the version reaches completed so latched timestamps do not persist forever.
      expr: |
        min without(prometheus_replica) (
          min by (cluster, resource_id, subscription_id, cluster_uuid, version, state) (
            (
              hosted_control_plane_upgrade:version_state_first_seen:timestamp
              or
              (
                timestamp(backend_cluster_version_info{state=~"desired|partial"} == 1)
                and on (cluster, resource_id) (
                  hosted_control_plane_upgrade:upgrade_eligible:info == 1
                )
              )
            )
            unless on(cluster, resource_id, subscription_id, cluster_uuid, version) (
              max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
                backend_cluster_version_info{state="completed"} == 1
              )
            )
          )
        )
    - record: hosted_control_plane_upgrade:in_progress:count
      # Count of clusters with an upgrade currently in progress (desired or partial on a target version, without being completed).

      expr: |
        count by (cluster) (
          count by (cluster, resource_id) (
            (
              max by (cluster, resource_id, subscription_id, cluster_uuid, version, state) (
                backend_cluster_version_info{state=~"desired|partial"} == 1
              )
              unless on(cluster, resource_id, subscription_id, cluster_uuid, version)
                max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
                  backend_cluster_version_info{state="completed"} == 1
                )
            )
          ) >= 1
          and on (cluster, resource_id) (
            hosted_control_plane_upgrade:upgrade_eligible:info == 1
          )
        )
        or
        0 * count by (cluster) (backend_cluster_version_info)
    - record: hosted_control_plane_upgrade:duration_in_desired:seconds
      # Seconds the target version has been in desired without reaching partial or completed.

      expr: |
        (
          time() - hosted_control_plane_upgrade:version_state_first_seen:timestamp{state="desired"}
        )
        and on(cluster, resource_id, subscription_id, cluster_uuid, version) (
          max by (cluster, resource_id, subscription_id, cluster_uuid, version, state) (
            backend_cluster_version_info{state="desired"} == 1
            unless on(cluster, resource_id, subscription_id, cluster_uuid, version) (
              max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
                backend_cluster_version_info{state="partial"} == 1
                or
                backend_cluster_version_info{state="completed"} == 1
              )
            )
          )
        )
        and on (cluster, resource_id) (
          hosted_control_plane_upgrade:upgrade_eligible:info == 1
        )
    - record: hosted_control_plane_upgrade:duration_in_progress:seconds
      # Seconds since the target version was first seen as desired or partial until it completes.

      expr: |
        (
          (
            time()
            -
            min without(state) (
              hosted_control_plane_upgrade:version_state_first_seen:timestamp{state=~"desired|partial"}
            )
          )
          and on (cluster, resource_id) (
            hosted_control_plane_upgrade:upgrade_eligible:info == 1
          )
          unless on(cluster, resource_id, subscription_id, cluster_uuid, version) (
            max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
              backend_cluster_version_info{state="completed"} == 1
            )
          )
        )
        * on(cluster, resource_id, subscription_id, cluster_uuid, version) group_left(state)
          (
            max by (cluster, resource_id, subscription_id, cluster_uuid, version, state) (
              backend_cluster_version_info{state="partial"} == 1
              or
              (
                backend_cluster_version_info{state="desired"} == 1
                unless on(cluster, resource_id, subscription_id, cluster_uuid, version)
                  max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
                    backend_cluster_version_info{state="partial"} == 1
                  )
              )
            )
          )
    - record: hosted_control_plane_upgrade:inventory_observations_complete:bool
      expr: |
        (
          count without (resource_id, subscription_id, deletion_confirmed) (
            backend_cluster_upgrade_inventory_info
            and
            (
              timestamp(backend_cluster_upgrade_inventory_info)
              == ignoring (resource_id, subscription_id, deletion_confirmed) group_left
                timestamp(backend_cluster_upgrade_inventory_size)
            )
          )
          or
          0 * backend_cluster_upgrade_inventory_size
        )
        == bool backend_cluster_upgrade_inventory_size
        and
          (time() - timestamp(backend_cluster_upgrade_inventory_size) < 60)
    - record: hosted_control_plane_upgrade:target_snapshots_complete:bool
      expr: |
        (
          (
            (
              count without (version) (
                backend_cluster_upgrade_target_info == 1
                and
                (
                  timestamp(backend_cluster_upgrade_target_info)
                  == ignoring (version) group_left
                    timestamp(backend_cluster_upgrade_target_count)
                )
              )
              or
              0 * backend_cluster_upgrade_target_count
            )
            == bool backend_cluster_upgrade_target_count
          )
          * (backend_cluster_upgrade_target_count > bool 0)
          *
          (
            timestamp(backend_cluster_upgrade_target_count)
            == bool ignoring (backend_process) group_left
            max without (version, state) (
              timestamp(backend_cluster_version_info)
            )
          )
          *
          (
            timestamp(backend_cluster_upgrade_converged)
            == bool timestamp(backend_cluster_upgrade_target_count)
          )
          * (time() - timestamp(backend_cluster_upgrade_target_count) < bool 60)
        )
        or
          0 * backend_cluster_upgrade_target_count
        or
          0 * count without (version) (backend_cluster_upgrade_target_info == 1)
        or ignoring (backend_process)
          0 * count without (version, state) (backend_cluster_version_info == 1)
    - record: hosted_control_plane_upgrade:current_targets:count
      expr: |
        count by (cluster, resource_id, subscription_id) (
          max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
            backend_cluster_upgrade_target_info == 1
          )
        )
    - record: hosted_control_plane_upgrade:target_observations_complete:bool
      expr: |
        (
          (
            count by (cluster, resource_id, subscription_id) (
              max by (cluster, resource_id, subscription_id, cluster_uuid, version) (
                backend_cluster_version_info{state=~"desired|partial|completed"} == 1
              )
              and on (cluster, resource_id, subscription_id, cluster_uuid, version)
                backend_cluster_upgrade_target_info == 1
            )
            or on (cluster, resource_id, subscription_id)
              0 * hosted_control_plane_upgrade:current_targets:count
          )
          == bool on (cluster, resource_id, subscription_id)
            hosted_control_plane_upgrade:current_targets:count
        )
        * on (cluster, resource_id, subscription_id)
        min by (cluster, resource_id, subscription_id) (
          hosted_control_plane_upgrade:target_snapshots_complete:bool
        )
    - record: hosted_control_plane_upgrade:lifecycle_observed:bool
      expr: |
        max by (cluster, resource_id, subscription_id) (
          backend_cluster_upgrade_inventory_info{deletion_confirmed="true"} == 1
          and
          (time() - timestamp(backend_cluster_upgrade_inventory_info) < 60)
        )
        or on (cluster, resource_id, subscription_id)
        (
          0 * max by (cluster, resource_id, subscription_id) (
            backend_cluster_upgrade_monitoring_enabled == 0
            and
            (time() - timestamp(backend_cluster_upgrade_monitoring_enabled) < 60)
          ) + 1
        )
        or on (cluster, resource_id, subscription_id)
        (
          (
            (
              0 * last_over_time(hosted_control_plane_upgrade:stuck:bool[24h]) + 1
              or on (cluster, resource_id, subscription_id)
                0 * last_over_time(hosted_control_plane_upgrade:firing:bool[24h]) + 1
            )
            and on (cluster)
            max by (cluster) (
              hosted_control_plane_upgrade:inventory_observations_complete:bool == 1
            )
          )
          unless on (cluster, resource_id, subscription_id)
          max by (cluster, resource_id, subscription_id) (
            backend_cluster_upgrade_inventory_info == 1
          )
        )
        or on (cluster, resource_id, subscription_id)
        (
          0 * max by (cluster, resource_id, subscription_id) (
            backend_cluster_upgrade_monitoring_enabled == 1
            and
            (time() - timestamp(backend_cluster_upgrade_monitoring_enabled) < 60)
          )
        )
    - record: hosted_control_plane_upgrade:retired:info
      # Use prior confirmations: publish a clear zero before retiring a removed resource.

      expr: |
        (
          0 * max by (cluster, resource_id, subscription_id) (
            last_over_time(hosted_control_plane_upgrade:clear_confirmations:count{reason="lifecycle"}[24h]) >= 3
          ) + 1
        )
        and on (cluster, resource_id, subscription_id)
          last_over_time(hosted_control_plane_upgrade:stuck:bool[24h]) == 0
        and on (cluster)
        max by (cluster) (
          hosted_control_plane_upgrade:inventory_observations_complete:bool == 1
        )
        unless on (cluster, resource_id, subscription_id)
        max by (cluster, resource_id, subscription_id) (
          backend_cluster_upgrade_inventory_info
          or backend_cluster_version_info
          or backend_cluster_upgrade_target_info
          or backend_cluster_upgrade_target_count
          or backend_cluster_upgrade_converged
          or backend_cluster_upgrade_monitoring_enabled
        )
    - record: hosted_control_plane_upgrade:clear_observed:bool
      expr: |
        label_replace(
          (
            min by (cluster, resource_id, subscription_id) (
              backend_cluster_upgrade_converged
            )
            and on (cluster, resource_id, subscription_id)
              hosted_control_plane_upgrade:target_observations_complete:bool == 1
          ),
          "reason", "completed", "", ""
        )
        or
        label_replace(
          hosted_control_plane_upgrade:lifecycle_observed:bool,
          "reason", "lifecycle", "", ""
        )
    - record: hosted_control_plane_upgrade:clear_confirmations:count
      expr: |
        (
          (
            clamp_max(
              (
                last_over_time(hosted_control_plane_upgrade:clear_confirmations:count[24h])
                or 0 * hosted_control_plane_upgrade:clear_observed:bool
              ) + 1,
              3
            )
            and (hosted_control_plane_upgrade:clear_observed:bool == 1)
          )
          or
          (0 * (hosted_control_plane_upgrade:clear_observed:bool == 0))
          or
          last_over_time(hosted_control_plane_upgrade:clear_confirmations:count[24h])
        )
        unless on (cluster, resource_id, subscription_id)
          hosted_control_plane_upgrade:retired:info
    - record: hosted_control_plane_upgrade:lifecycle_excluded:info
      expr: |
        (
          0 * max by (cluster, resource_id, subscription_id) (
            hosted_control_plane_upgrade:clear_confirmations:count{reason="lifecycle"} >= 3
          ) + 1
        )
        and on (cluster, resource_id, subscription_id)
        max by (cluster, resource_id, subscription_id) (
          hosted_control_plane_upgrade:clear_observed:bool{reason="lifecycle"} == 1
        )
    - record: hosted_control_plane_upgrade:completion_confirmed:info
      expr: |
        (
          0 * max by (cluster, resource_id, subscription_id) (
            hosted_control_plane_upgrade:clear_confirmations:count{reason="completed"} >= 3
          ) + 1
        )
        and on (cluster, resource_id, subscription_id)
        max by (cluster, resource_id, subscription_id) (
          hosted_control_plane_upgrade:clear_observed:bool{reason="completed"} == 1
        )
    - record: hosted_control_plane_upgrade:current_condition:bool
      expr: |
        (
          (
            max by (cluster, resource_id, subscription_id) (
              (
                (hosted_control_plane_upgrade:duration_in_desired:seconds > bool 1200)
                or
                (hosted_control_plane_upgrade:duration_in_progress:seconds > bool 1800)
              )
              and on (cluster, resource_id, subscription_id, cluster_uuid, version)
                backend_cluster_upgrade_target_info == 1
            ) == 1
          )
          or on (cluster, resource_id, subscription_id)
            0 * (hosted_control_plane_upgrade:target_observations_complete:bool == 1)
        )
        and on (cluster, resource_id, subscription_id)
          hosted_control_plane_upgrade:target_observations_complete:bool == 1
    - record: hosted_control_plane_upgrade:firing:bool
      # Establish once after Pending; a later skipped evaluation does not reset the latch.

      expr: |
        (
          0 * hosted_control_plane_upgrade:lifecycle_excluded:info
          or on (cluster, resource_id, subscription_id)
            0 * hosted_control_plane_upgrade:completion_confirmed:info
          or on (cluster, resource_id, subscription_id)
            (last_over_time(hosted_control_plane_upgrade:firing:bool[24h]) == 1)
          or on (cluster, resource_id, subscription_id)
          (
            min_over_time(hosted_control_plane_upgrade:stuck:bool[5m] offset 1m) == 1
            and
            count_over_time(hosted_control_plane_upgrade:stuck:bool[5m] offset 1m) >= 5
            unless on (cluster, resource_id, subscription_id)
              hosted_control_plane_upgrade:current_condition:bool == 0
          )
          or on (cluster, resource_id, subscription_id)
          (
            0 * (hosted_control_plane_upgrade:target_observations_complete:bool == 1)
            and on (cluster, resource_id, subscription_id)
            max by (cluster, resource_id, subscription_id) (
              backend_cluster_upgrade_monitoring_enabled == 1
              and
              (time() - timestamp(backend_cluster_upgrade_monitoring_enabled) < 60)
            )
          )
        )
        unless on (cluster, resource_id, subscription_id)
          hosted_control_plane_upgrade:retired:info
    - record: hosted_control_plane_upgrade:stuck:bool
      expr: |
        (
          0 * hosted_control_plane_upgrade:lifecycle_excluded:info
          or on (cluster, resource_id, subscription_id)
            0 * hosted_control_plane_upgrade:completion_confirmed:info
          or on (cluster, resource_id, subscription_id)
          (
            last_over_time(hosted_control_plane_upgrade:stuck:bool[24h]) == 1
            and on (cluster, resource_id, subscription_id)
            max by (cluster, resource_id, subscription_id) (
              hosted_control_plane_upgrade:clear_confirmations:count > 0
            )
          )
          or on (cluster, resource_id, subscription_id)
          (
            (
            (last_over_time(hosted_control_plane_upgrade:firing:bool[24h]) == 1)
            or on (cluster, resource_id, subscription_id)
              hosted_control_plane_upgrade:current_condition:bool
            )
            and on (cluster, resource_id, subscription_id)
            max by (cluster, resource_id, subscription_id) (
              backend_cluster_upgrade_monitoring_enabled == 1
              and
              (time() - timestamp(backend_cluster_upgrade_monitoring_enabled) < 60)
            )
          )
          or on (cluster, resource_id, subscription_id)
            (last_over_time(hosted_control_plane_upgrade:firing:bool[24h]) == 1)
          or on (cluster, resource_id, subscription_id)
            last_over_time(hosted_control_plane_upgrade:stuck:bool[24h])
        )
        unless on (cluster, resource_id, subscription_id)
          hosted_control_plane_upgrade:retired:info
