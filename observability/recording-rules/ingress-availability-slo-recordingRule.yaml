apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: ingress-availability-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Ingress Availability SLO Recording Rules
  # ========================================
  # Metrics source: Managed_Prometheus_hcps-* (HCP AMW, hcps layer)
  #
  # SLO: 99.5% ingress canary route availability
  # Error Budget: 0.5% (1 - 0.995)
  #
  # SLI scope: ingress_canary_route_reachable is an END-TO-END synthetic route
  # check performed by ingress-operator against the cluster's canary route. A
  # value of 0 means the canary route observation failed somewhere along the
  # path (DNS, load balancer, ingress routing, or router pods) -- it is NOT a
  # direct router-pod-availability signal. Downstream TSGs must treat a breach
  # as "the ingress data path is not reachable end to end", then triage which
  # hop failed. Series are differentiated by `host` (the canary route hostname);
  # they have NOT been validated to map 1:1 to router or canary pods, so the
  # ratio is expressed as "fraction of synthetic canary route observations that
  # succeed", not "fraction of healthy pods".
  #
  # Validated on 2026-07-29 against INT AMW (Managed_Prometheus_hcps-uksouth):
  # - ingress_canary_route_reachable: _id label confirmed, 26 HCP clusters visible,
  #   emitted by ingress-operator (control plane, authoritative source)
  #
  # Production label set for ingress_canary_route_reachable (confirmed 2026-08-14):
  #   _id, cluster, container, endpoint, environment, host, instance, job,
  #   namespace, pod, prometheus, prometheus_replica, region
  # Note: subscription_id and resource_id are NOT present on this metric.
  # by(_id, cluster, region) preserves per-HCP identity, the management cluster,
  # and the region dimension used by downstream alerts and dashboards.
  #
  # No-data behavior: when all canary series disappear, sum/count returns empty
  # (no series), consistent with kube-apiserver SLI pattern. A separate
  # userJourneyIngressCanaryAbsent alert (see
  # ingress-availability-slo-prometheusRule.yaml) detects this case directly
  # against the raw metric, since a missing series cannot be observed through
  # these recording rules by definition.
  - name: arohcp_ingress_availability_slo_recording_rules
    interval: 1m
    rules:
    # Availability SLI: fraction of synthetic canary route observations reporting
    # the ingress route as reachable, aggregated per HCP cluster.
    # Ratio format per ADR: good events / total events
    # Uses sum/count (not min) so that a single failed observation in a redundant
    # setup does not report the entire cluster as unavailable. Deduped with max
    # without (prometheus_replica) before the per-HCP aggregation, same as the
    # windowed group below -- otherwise a replica that misses a scrape the other
    # catches can skew this ratio instead of just doubling a volume floor.
    - record: availability:ingress_canary:ratio
      expr: |
        sum by (_id, cluster, region) (max without (prometheus_replica) (ingress_canary_route_reachable))
        /
        count by (_id, cluster, region) (max without (prometheus_replica) (ingress_canary_route_reachable))
    # Error rate derived from the availability SLI.
    # Instantaneous (last-scrape) value only -- kept for dashboards / SLI
    # reporting. NOT used for alerting: see the windowed group below.
    - record: errors:ingress_canary:error_rate
      expr: |
        1 - availability:ingress_canary:ratio
  # ========================================
  # Ingress Availability SLO Recording Rules: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # errors:ingress_canary:error_rate above is instantaneous: it reflects only the
  # samples returned by the last scrape. A true multi-window multi-burn-rate
  # (MWMBR) alert requires BOTH a short-window and a long-window error rate to
  # independently cross the same threshold (see
  # ingress-availability-slo-prometheusRule.yaml) -- the short window confirms
  # the burn is still active right now (so a recovered incident stops paging
  # once the short window clears), and the long window confirms the burn has
  # done enough damage to the error budget to matter (so a single blip that
  # ages out of the short window doesn't re-fire on its own). Gating only a
  # `for:` duration on an instantaneous ratio provides neither property, and
  # with few redundant canary routes a single failed observation (e.g. 1 of 2,
  # a 50% instantaneous ratio) can exceed every threshold outright regardless
  # of real history. This follows the same paired short/long window design as
  # UserJourneyKubeApiserverAvailabilityMonitor-prometheusRule-KSM.yaml.
  #
  # Windows needed across the three burn-rate tiers: 5m, 30m, 1h, 6h, 3d.
  # Tier pairing (see the alert file): fast=1h/5m, medium=6h/30m, slow=3d/6h --
  # note 6h is reused as both the medium tier's long window and the slow
  # tier's short window, so it is only computed once here.
  #
  # These records accumulate real observation counts over each window via
  # sum_over_time/count_over_time (the metric is a gauge sampled on scrape,
  # not a counter, so rate()/increase() do not apply). The alert layer
  # additionally requires a volume floor on *_total_W for each window in the
  # pair, so a sparse or freshly-started window cannot page.
  #
  # Per-sample dedup happens once, in its own 1m-tick rule pair below, not
  # inside each window: max without (prometheus_replica) (...) is applied
  # AT EACH EVALUATION (every 1m), and the windowed rules then read that
  # already-deduped series with a plain range-vector sum_over_time/
  # count_over_time -- no subquery. Deduping AFTER sum_over_time instead
  # (comparing whole-window totals via a plain range-vector selector) would
  # compare the two replicas' whole-window totals rather than their
  # individual samples: if replica A sees failure then success while
  # replica B sees success then failure (one replica's scrape genuinely
  # diverging from the other's at a given tick, not just redundant
  # double-counting of the same observation), both replicas sum to the same
  # total either way in that example, but in general comparing whole-window
  # sums can silently combine two different failure histories and misreport
  # a healthy window as degraded (or vice versa). Per-sample dedup --
  # "healthy at this tick if either replica saw success" -- avoids that.
  #
  # An earlier version of this file did the dedup with a [W:1m] subquery
  # directly in each window (`sum_over_time((max without (prometheus_replica)
  # (...))[3d:1m])`), mirroring the KAS gauge recording rules. That re-runs
  # the inner max-without expression at every one of window/step virtual
  # timestamps -- 4,320 of them for the 3d window -- on every 1m evaluation,
  # 4,319 of which were already computed on the previous evaluation, and this
  # is the per-HCP lane, so the cost scales with fleet size. Materializing the
  # dedup as its own 1m-interval recording rule means each evaluation does the
  # dedup work exactly once, and the windowed rules' sum_over_time/
  # count_over_time read back already-computed samples from that series --
  # the normal, cheap range-vector case, not a subquery.
  #
  # `without (prometheus_replica)` (not `by (_id, cluster, region, host)`)
  # keeps every other label -- including `instance` -- intact: a host can
  # legitimately have more than one real, independently-counted observation
  # source sharing no prometheus_replica label at all (see the "aaa" test
  # case, two instances summing to double the single-instance count), and
  # collapsing on `host` instead of dropping only `prometheus_replica` would
  # wrongly max those together instead of summing them. The outer
  # `sum`/`count by (_id, cluster, region)` still rolls the per-HCP total
  # across hosts/instances. The 1m tick matches the ~1/min scrape cadence
  # this file's volume floors assume.
  #
  # Split into two groups (fast/medium windows here, slow window below)
  # because Microsoft.AlertsManagement/prometheusRuleGroups caps Rules.Count
  # at 20: the 1m-tick pair plus all five windows' succeeded/total/failed/
  # error_rate would be 22. The slow group below recomputes its own 1m-tick
  # pair under distinct names (succeeded_1m_slow/total_1m_slow) rather than
  # reusing these two -- a rule can only read another rule's current-
  # evaluation output when both are in the same group, and recording rules
  # are ingested back into the workspace as real time series, so two
  # separate prometheusRuleGroups resources both writing the *same* record
  # name and label set would be two independent writers racing on one
  # series. Distinct names avoid that; the dedup math itself is O(1) per
  # tick, so recomputing it in the second group costs nothing material.
  - name: arohcp_ingress_availability_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1m tick (per-sample dedup, computed once and reused by every window in this group) ---
    - record: errors:ingress_canary:succeeded_1m
      expr: |
        sum by (_id, cluster, region) (max without (prometheus_replica) (ingress_canary_route_reachable))
    - record: errors:ingress_canary:total_1m
      expr: |
        count by (_id, cluster, region) (max without (prometheus_replica) (ingress_canary_route_reachable))
    # --- 5m window (fast burn, short) ---
    - record: errors:ingress_canary:succeeded_5m
      expr: |
        sum_over_time(errors:ingress_canary:succeeded_1m[5m])
    - record: errors:ingress_canary:total_5m
      expr: |
        sum_over_time(errors:ingress_canary:total_1m[5m])
    - record: errors:ingress_canary:failed_5m
      expr: |
        errors:ingress_canary:total_5m - errors:ingress_canary:succeeded_5m
    - record: errors:ingress_canary:error_rate_5m
      expr: |
        errors:ingress_canary:failed_5m / clamp_min(errors:ingress_canary:total_5m, 1)
    # --- 30m window (medium burn, short) ---
    - record: errors:ingress_canary:succeeded_30m
      expr: |
        sum_over_time(errors:ingress_canary:succeeded_1m[30m])
    - record: errors:ingress_canary:total_30m
      expr: |
        sum_over_time(errors:ingress_canary:total_1m[30m])
    - record: errors:ingress_canary:failed_30m
      expr: |
        errors:ingress_canary:total_30m - errors:ingress_canary:succeeded_30m
    - record: errors:ingress_canary:error_rate_30m
      expr: |
        errors:ingress_canary:failed_30m / clamp_min(errors:ingress_canary:total_30m, 1)
    # --- 1h window (fast burn, long) ---
    - record: errors:ingress_canary:succeeded_1h
      expr: |
        sum_over_time(errors:ingress_canary:succeeded_1m[1h])
    - record: errors:ingress_canary:total_1h
      expr: |
        sum_over_time(errors:ingress_canary:total_1m[1h])
    - record: errors:ingress_canary:failed_1h
      expr: |
        errors:ingress_canary:total_1h - errors:ingress_canary:succeeded_1h
    - record: errors:ingress_canary:error_rate_1h
      expr: |
        errors:ingress_canary:failed_1h / clamp_min(errors:ingress_canary:total_1h, 1)
  # ========================================
  # Ingress Availability SLO Recording Rules: Windowed Errors, slow tier
  # ========================================
  # Continuation of the group above, split out solely to stay under the
  # 20-rules-per-group ARM limit -- see that group's header comment for the
  # full rationale (MWMBR pairing, per-sample dedup, the windowed-rules
  # split).
  #
  # This group recomputes its own 1m-tick pair under distinct names
  # (*_1m_slow, not *_1m) rather than reusing errors:ingress_canary:
  # succeeded_1m/total_1m from the group above. Recording rules are ingested
  # back into the Azure Monitor workspace as real time series (not just
  # evaluated in-memory), so two separate prometheusRuleGroups resources
  # both writing a record with the *same* name and label set would be two
  # independent writers targeting one series -- the backend's duplicate-
  # sample handling for that (reject, last-write-wins, or something else)
  # isn't something to depend on. Distinct names make each group's pair an
  # independently-owned series with exactly one writer; the per-tick dedup
  # math itself is still O(1) and cheap to recompute per group.
  - name: arohcp_ingress_availability_slo_windowed_recording_rules_slow
    interval: 1m
    rules:
    # --- 1m tick (own copy, distinct names -- see this group's header comment) ---
    - record: errors:ingress_canary:succeeded_1m_slow
      expr: |
        sum by (_id, cluster, region) (max without (prometheus_replica) (ingress_canary_route_reachable))
    - record: errors:ingress_canary:total_1m_slow
      expr: |
        count by (_id, cluster, region) (max without (prometheus_replica) (ingress_canary_route_reachable))
    # --- 6h window (medium burn long / slow burn short) ---
    - record: errors:ingress_canary:succeeded_6h
      expr: |
        sum_over_time(errors:ingress_canary:succeeded_1m_slow[6h])
    - record: errors:ingress_canary:total_6h
      expr: |
        sum_over_time(errors:ingress_canary:total_1m_slow[6h])
    - record: errors:ingress_canary:failed_6h
      expr: |
        errors:ingress_canary:total_6h - errors:ingress_canary:succeeded_6h
    - record: errors:ingress_canary:error_rate_6h
      expr: |
        errors:ingress_canary:failed_6h / clamp_min(errors:ingress_canary:total_6h, 1)
    # --- 3d window (slow burn, long) ---
    - record: errors:ingress_canary:succeeded_3d
      expr: |
        sum_over_time(errors:ingress_canary:succeeded_1m_slow[3d])
    - record: errors:ingress_canary:total_3d
      expr: |
        sum_over_time(errors:ingress_canary:total_1m_slow[3d])
    - record: errors:ingress_canary:failed_3d
      expr: |
        errors:ingress_canary:total_3d - errors:ingress_canary:succeeded_3d
    - record: errors:ingress_canary:error_rate_3d
      expr: |
        errors:ingress_canary:failed_3d / clamp_min(errors:ingress_canary:total_3d, 1)
  # ========================================
  # Ingress Latency SLO Recording Rules
  # ========================================
  # SLO: 99.5% of synthetic canary route checks complete within 200ms
  # Error Budget: 0.5% (1 - 0.995)
  #
  # SLI scope: ingress_canary_check_duration measures the END-TO-END duration of
  # the same synthetic canary route check as availability above. Elevated latency
  # reflects a slow ingress data path (DNS, load balancer, routing, or router
  # pods), not a single component.
  #
  # Production label set for ingress_canary_check_duration_bucket (confirmed 2026-08-17):
  #   _id, cluster, container, endpoint, environment, host, instance, job,
  #   le, namespace, pod, prometheus, prometheus_replica, region
  # Histogram buckets: 25, 50, 100, 200, 400, 800, 1600, +inf (milliseconds).
  # The overflow bucket's `le` value is the lowercase string "+inf", not the
  # "+Inf" most Prometheus client libraries emit on the wire -- confirmed
  # against prod via the Grafana metrics browser's label-values picker for
  # `le` on 2026-11-11 (which reads the raw stored value; `count by (le)
  # (...)`'s own table/graph rendering is not reliable evidence here -- it
  # reformats recognized histogram `le` values for readability, displaying
  # the overflow bucket as the word "Infinity" regardless of the actual
  # stored string, which is what misled an earlier version of this comment
  # into using le="Infinity" -- that matches zero series, same failure mode
  # as the original "+Inf" bug it was meant to fix). Using the wrong case
  # here silently matches zero series (total_Xm always empty), which
  # neither errors nor shows up in unit tests seeded with matching fixtures
  # -- it only surfaces as every latency alert being permanently
  # un-fireable. If `le` casing drifts again, verify against the metrics
  # browser's label-values list, not against any query *result* rendering.
  #
  # 99.5% of checks within 200ms is closer to a P99 latency objective than a
  # P95 one (99.5% is much nearer 99% than 95%), so alerts on this SLI are
  # named LatencyP99 (see ingress-availability-slo-prometheusRule.yaml).
  - name: arohcp_ingress_latency_slo_recording_rules
    interval: 1m
    rules:
    # Latency SLI: fraction of synthetic canary route checks completing within
    # 200ms, aggregated per HCP cluster.
    # Ratio format per ADR: good events / total events
    #
    # HA replica dedup for a histogram cannot be `max without (prometheus_replica)`
    # applied separately to each `le` bucket: that picks the numerator's bucket
    # from whichever replica happens to report the larger le="200" value and the
    # denominator's bucket from whichever replica happens to report the larger
    # le="+inf" value -- independently. If the two replicas' counters
    # genuinely diverge (not just redundantly duplicate each other), this can
    # pair one replica's "fast" count with the other replica's "total" count,
    # producing a ratio that belongs to neither replica's actual observations
    # (the repository's frontend SLO notes this same per-bucket-max hazard).
    # `topk(1, ...) by (host, instance)` on le="+inf" instead picks ONE
    # winning replica (by total volume, the most complete-looking scrape) per
    # (host, instance), keeping its `prometheus_replica` label; `and on (...,
    # prometheus_replica)` then restricts le="200" to that same winning
    # replica, so every host/instance's fast and total figures always come
    # from one consistent replica. This also keeps the dedup from
    # double-counting fully redundant replicas (Test 10/12's requirement):
    # topk still picks exactly one value per (host, instance) regardless of
    # how many replicas reported it.
    - record: latency:ingress_canary:ratio
      expr: |
        sum by (_id, cluster, region) (
          rate(ingress_canary_check_duration_bucket{le="200"}[5m])
          and on (_id, cluster, region, host, instance, prometheus_replica) (
            topk(1, rate(ingress_canary_check_duration_bucket{le="+inf"}[5m])) by (_id, cluster, region, host, instance)
          )
        )
        /
        sum by (_id, cluster, region) (
          topk(1, rate(ingress_canary_check_duration_bucket{le="+inf"}[5m])) by (_id, cluster, region, host, instance)
        )
    # Error rate derived from the latency SLI.
    # Instantaneous (5m rate) value only -- kept for dashboards / SLI
    # reporting. NOT used for alerting: see the windowed group below.
    - record: errors:ingress_canary_latency:error_rate
      expr: |
        1 - latency:ingress_canary:ratio
  # ========================================
  # Ingress Latency SLO Recording Rules: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # Same paired short/long window rationale as the availability windowed group
  # above. ingress_canary_check_duration_bucket is a cumulative histogram
  # counter, so increase() over each window is used directly (no rate()
  # normalization needed, unlike the instantaneous 5m SLI). Same window/tier
  # pairing as availability: fast=1h/5m, medium=6h/30m, slow=3d/6h. Same
  # topk-based winning-replica dedup as the instantaneous ratio above, for
  # the same per-bucket-mixing reason -- see that rule's comment.
  - name: arohcp_ingress_latency_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 5m window (fast burn, short) ---
    - record: errors:ingress_canary_latency:total_5m
      expr: |
        sum by (_id, cluster, region) (
          topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[5m])) by (_id, cluster, region, host, instance)
        )
    - record: errors:ingress_canary_latency:fast_5m
      expr: |
        sum by (_id, cluster, region) (
          increase(ingress_canary_check_duration_bucket{le="200"}[5m])
          and on (_id, cluster, region, host, instance, prometheus_replica) (
            topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[5m])) by (_id, cluster, region, host, instance)
          )
        )
    - record: errors:ingress_canary_latency:slow_5m
      expr: |
        errors:ingress_canary_latency:total_5m - errors:ingress_canary_latency:fast_5m
    - record: errors:ingress_canary_latency:error_rate_5m
      expr: |
        errors:ingress_canary_latency:slow_5m / clamp_min(errors:ingress_canary_latency:total_5m, 1)
    # --- 30m window (medium burn, short) ---
    - record: errors:ingress_canary_latency:total_30m
      expr: |
        sum by (_id, cluster, region) (
          topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[30m])) by (_id, cluster, region, host, instance)
        )
    - record: errors:ingress_canary_latency:fast_30m
      expr: |
        sum by (_id, cluster, region) (
          increase(ingress_canary_check_duration_bucket{le="200"}[30m])
          and on (_id, cluster, region, host, instance, prometheus_replica) (
            topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[30m])) by (_id, cluster, region, host, instance)
          )
        )
    - record: errors:ingress_canary_latency:slow_30m
      expr: |
        errors:ingress_canary_latency:total_30m - errors:ingress_canary_latency:fast_30m
    - record: errors:ingress_canary_latency:error_rate_30m
      expr: |
        errors:ingress_canary_latency:slow_30m / clamp_min(errors:ingress_canary_latency:total_30m, 1)
    # --- 1h window (fast burn, long) ---
    - record: errors:ingress_canary_latency:total_1h
      expr: |
        sum by (_id, cluster, region) (
          topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[1h])) by (_id, cluster, region, host, instance)
        )
    - record: errors:ingress_canary_latency:fast_1h
      expr: |
        sum by (_id, cluster, region) (
          increase(ingress_canary_check_duration_bucket{le="200"}[1h])
          and on (_id, cluster, region, host, instance, prometheus_replica) (
            topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[1h])) by (_id, cluster, region, host, instance)
          )
        )
    - record: errors:ingress_canary_latency:slow_1h
      expr: |
        errors:ingress_canary_latency:total_1h - errors:ingress_canary_latency:fast_1h
    - record: errors:ingress_canary_latency:error_rate_1h
      expr: |
        errors:ingress_canary_latency:slow_1h / clamp_min(errors:ingress_canary_latency:total_1h, 1)
    # --- 6h window (medium burn long / slow burn short) ---
    - record: errors:ingress_canary_latency:total_6h
      expr: |
        sum by (_id, cluster, region) (
          topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[6h])) by (_id, cluster, region, host, instance)
        )
    - record: errors:ingress_canary_latency:fast_6h
      expr: |
        sum by (_id, cluster, region) (
          increase(ingress_canary_check_duration_bucket{le="200"}[6h])
          and on (_id, cluster, region, host, instance, prometheus_replica) (
            topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[6h])) by (_id, cluster, region, host, instance)
          )
        )
    - record: errors:ingress_canary_latency:slow_6h
      expr: |
        errors:ingress_canary_latency:total_6h - errors:ingress_canary_latency:fast_6h
    - record: errors:ingress_canary_latency:error_rate_6h
      expr: |
        errors:ingress_canary_latency:slow_6h / clamp_min(errors:ingress_canary_latency:total_6h, 1)
    # --- 3d window (slow burn, long) ---
    - record: errors:ingress_canary_latency:total_3d
      expr: |
        sum by (_id, cluster, region) (
          topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[3d])) by (_id, cluster, region, host, instance)
        )
    - record: errors:ingress_canary_latency:fast_3d
      expr: |
        sum by (_id, cluster, region) (
          increase(ingress_canary_check_duration_bucket{le="200"}[3d])
          and on (_id, cluster, region, host, instance, prometheus_replica) (
            topk(1, increase(ingress_canary_check_duration_bucket{le="+inf"}[3d])) by (_id, cluster, region, host, instance)
          )
        )
    - record: errors:ingress_canary_latency:slow_3d
      expr: |
        errors:ingress_canary_latency:total_3d - errors:ingress_canary_latency:fast_3d
    - record: errors:ingress_canary_latency:error_rate_3d
      expr: |
        errors:ingress_canary_latency:slow_3d / clamp_min(errors:ingress_canary_latency:total_3d, 1)
