apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: ingress-availability-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Ingress Availability SLO Recording Rules
  # ========================================
  # Metrics source: Managed_Prometheus_hcps-* (HCP AMW, hcps layer)
  #
  # SLO: 99.5% ingress canary route availability
  # Error Budget: 0.5% (1 - 0.995)
  #
  # SLI scope: ingress_canary_route_reachable is an END-TO-END synthetic route
  # check performed by ingress-operator against the cluster's canary route. A
  # value of 0 means the canary route observation failed somewhere along the
  # path (DNS, load balancer, ingress routing, or router pods) -- it is NOT a
  # direct router-pod-availability signal. Downstream TSGs must treat a breach
  # as "the ingress data path is not reachable end to end", then triage which
  # hop failed. Series are differentiated by `host` (the canary route hostname);
  # they have NOT been validated to map 1:1 to router or canary pods, so the
  # ratio is expressed as "fraction of synthetic canary route observations that
  # succeed", not "fraction of healthy pods".
  #
  # Validated on 2026-07-29 against INT AMW (Managed_Prometheus_hcps-uksouth):
  # - ingress_canary_route_reachable: _id label confirmed, 26 HCP clusters visible,
  #   emitted by ingress-operator (control plane, authoritative source)
  #
  # Production label set for ingress_canary_route_reachable (confirmed 2026-08-14):
  #   _id, cluster, container, endpoint, environment, host, instance, job,
  #   namespace, pod, prometheus, prometheus_replica, region
  # Note: subscription_id and resource_id are NOT present on this metric.
  # by(_id, cluster, region) preserves per-HCP identity, the management cluster,
  # and the region dimension used by downstream alerts and dashboards.
  #
  # No-data behavior: when all canary series disappear, sum/count returns empty
  # (no series), consistent with kube-apiserver SLI pattern. A separate absent()
  # alert should detect canary liveness (follow-up in ARO-25969).
  #
  # On-call routing sequencing: burn-rate alerts (MWMBR) and the canary-absence
  # alert are delivered in ARO-25969; the Ingress runbook and TSG will be
  # published alongside those alerts. Until ARO-25969 merges, no on-call paging
  # path exists for these SLI series -- these recording rules are a foundation
  # only and do not route any alerts by themselves.
  - name: arohcp_ingress_availability_slo_recording_rules
    interval: 1m
    rules:
    # Availability SLI: fraction of synthetic canary route observations reporting
    # the ingress route as reachable, aggregated per HCP cluster.
    # Ratio format per ADR: good events / total events
    # Uses sum/count (not min) so that a single failed observation in a redundant
    # setup does not report the entire cluster as unavailable.
    - record: availability:ingress_canary:ratio
      expr: |
        sum by (_id, cluster, region) (ingress_canary_route_reachable)
        /
        count by (_id, cluster, region) (ingress_canary_route_reachable)
    # Error rate derived from the availability SLI.
    # Instantaneous (last-scrape) value only -- kept for dashboards / SLI
    # reporting. NOT used for alerting: see the windowed group below.
    - record: errors:ingress_canary:error_rate
      expr: |
        1 - availability:ingress_canary:ratio
  # ========================================
  # Ingress Availability SLO Recording Rules: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # errors:ingress_canary:error_rate above is instantaneous: it reflects only the
  # samples returned by the last scrape, so gating an alert on it via `for:` alone
  # never actually evaluates the 1h/6h/3d windows the burn-rate tiers are named
  # for -- and with few redundant canary routes, a single failed observation
  # (e.g. 1 of 2, a 50% instantaneous ratio) can already exceed the 7.2%/3%
  # thresholds outright regardless of how much real history exists.
  #
  # These records instead accumulate real observation counts over each window
  # via sum_over_time/count_over_time (the metric is a gauge sampled on scrape,
  # not a counter, so rate()/increase() do not apply). The alert layer
  # additionally requires a volume floor on *_total_W (see
  # ingress-availability-slo-prometheusRule.yaml) so a handful of samples on a
  # freshly-started or sparse window cannot page.
  - name: arohcp_ingress_availability_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn) ---
    - record: errors:ingress_canary:succeeded_1h
      expr: |
        sum by (_id, cluster, region) (sum_over_time(ingress_canary_route_reachable[1h]))
    - record: errors:ingress_canary:total_1h
      expr: |
        sum by (_id, cluster, region) (count_over_time(ingress_canary_route_reachable[1h]))
    - record: errors:ingress_canary:failed_1h
      expr: |
        errors:ingress_canary:total_1h - errors:ingress_canary:succeeded_1h
    - record: errors:ingress_canary:error_rate_1h
      expr: |
        errors:ingress_canary:failed_1h / clamp_min(errors:ingress_canary:total_1h, 1)
    # --- 6h window (medium burn) ---
    - record: errors:ingress_canary:succeeded_6h
      expr: |
        sum by (_id, cluster, region) (sum_over_time(ingress_canary_route_reachable[6h]))
    - record: errors:ingress_canary:total_6h
      expr: |
        sum by (_id, cluster, region) (count_over_time(ingress_canary_route_reachable[6h]))
    - record: errors:ingress_canary:failed_6h
      expr: |
        errors:ingress_canary:total_6h - errors:ingress_canary:succeeded_6h
    - record: errors:ingress_canary:error_rate_6h
      expr: |
        errors:ingress_canary:failed_6h / clamp_min(errors:ingress_canary:total_6h, 1)
    # --- 3d window (slow burn / budget) ---
    - record: errors:ingress_canary:succeeded_3d
      expr: |
        sum by (_id, cluster, region) (sum_over_time(ingress_canary_route_reachable[3d]))
    - record: errors:ingress_canary:total_3d
      expr: |
        sum by (_id, cluster, region) (count_over_time(ingress_canary_route_reachable[3d]))
    - record: errors:ingress_canary:failed_3d
      expr: |
        errors:ingress_canary:total_3d - errors:ingress_canary:succeeded_3d
    - record: errors:ingress_canary:error_rate_3d
      expr: |
        errors:ingress_canary:failed_3d / clamp_min(errors:ingress_canary:total_3d, 1)
  # ========================================
  # Ingress Latency SLO Recording Rules
  # ========================================
  # SLO: 99.5% of synthetic canary route checks complete within 200ms
  # Error Budget: 0.5% (1 - 0.995)
  #
  # SLI scope: ingress_canary_check_duration measures the END-TO-END duration of
  # the same synthetic canary route check as availability above. Elevated latency
  # reflects a slow ingress data path (DNS, load balancer, routing, or router
  # pods), not a single component.
  #
  # Production label set for ingress_canary_check_duration_bucket (confirmed 2026-08-17):
  #   _id, cluster, container, endpoint, environment, host, instance, job,
  #   le, namespace, pod, prometheus, prometheus_replica, region
  # Histogram buckets: 25, 50, 100, 200, 400, 800, 1600, +Inf (milliseconds)
  - name: arohcp_ingress_latency_slo_recording_rules
    interval: 1m
    rules:
    # Latency SLI: fraction of synthetic canary route checks completing within
    # 200ms, aggregated per HCP cluster.
    # Ratio format per ADR: good events / total events
    # Uses rate() over 5m to smooth out per-scrape noise.
    - record: latency:ingress_canary:ratio
      expr: |
        sum by (_id, cluster, region) (rate(ingress_canary_check_duration_bucket{le="200"}[5m]))
        /
        sum by (_id, cluster, region) (rate(ingress_canary_check_duration_bucket{le="+Inf"}[5m]))
    # Error rate derived from the latency SLI.
    # Instantaneous (5m rate) value only -- kept for dashboards / SLI
    # reporting. NOT used for alerting: see the windowed group below.
    - record: errors:ingress_canary_latency:error_rate
      expr: |
        1 - latency:ingress_canary:ratio
  # ========================================
  # Ingress Latency SLO Recording Rules: Windowed Errors (burn-rate, volume-aware)
  # ========================================
  # Same rationale as the availability windowed group above: the 1h/6h/3d
  # burn-rate tiers must evaluate a real accumulated window, and alerts need a
  # volume floor on *_total_W. ingress_canary_check_duration_bucket is a
  # cumulative histogram counter, so increase() over the alert window is used
  # directly (no rate() normalization needed, unlike the instantaneous 5m SLI).
  - name: arohcp_ingress_latency_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn) ---
    - record: errors:ingress_canary_latency:total_1h
      expr: |
        sum by (_id, cluster, region) (increase(ingress_canary_check_duration_bucket{le="+Inf"}[1h]))
    - record: errors:ingress_canary_latency:fast_1h
      expr: |
        sum by (_id, cluster, region) (increase(ingress_canary_check_duration_bucket{le="200"}[1h]))
    - record: errors:ingress_canary_latency:slow_1h
      expr: |
        errors:ingress_canary_latency:total_1h - errors:ingress_canary_latency:fast_1h
    - record: errors:ingress_canary_latency:error_rate_1h
      expr: |
        errors:ingress_canary_latency:slow_1h / clamp_min(errors:ingress_canary_latency:total_1h, 1)
    # --- 6h window (medium burn) ---
    - record: errors:ingress_canary_latency:total_6h
      expr: |
        sum by (_id, cluster, region) (increase(ingress_canary_check_duration_bucket{le="+Inf"}[6h]))
    - record: errors:ingress_canary_latency:fast_6h
      expr: |
        sum by (_id, cluster, region) (increase(ingress_canary_check_duration_bucket{le="200"}[6h]))
    - record: errors:ingress_canary_latency:slow_6h
      expr: |
        errors:ingress_canary_latency:total_6h - errors:ingress_canary_latency:fast_6h
    - record: errors:ingress_canary_latency:error_rate_6h
      expr: |
        errors:ingress_canary_latency:slow_6h / clamp_min(errors:ingress_canary_latency:total_6h, 1)
    # --- 3d window (slow burn / budget) ---
    - record: errors:ingress_canary_latency:total_3d
      expr: |
        sum by (_id, cluster, region) (increase(ingress_canary_check_duration_bucket{le="+Inf"}[3d]))
    - record: errors:ingress_canary_latency:fast_3d
      expr: |
        sum by (_id, cluster, region) (increase(ingress_canary_check_duration_bucket{le="200"}[3d]))
    - record: errors:ingress_canary_latency:slow_3d
      expr: |
        errors:ingress_canary_latency:total_3d - errors:ingress_canary_latency:fast_3d
    - record: errors:ingress_canary_latency:error_rate_3d
      expr: |
        errors:ingress_canary_latency:slow_3d / clamp_min(errors:ingress_canary_latency:total_3d, 1)
