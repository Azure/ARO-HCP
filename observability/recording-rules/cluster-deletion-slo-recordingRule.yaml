apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: cluster-deletion-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Deletion SLO Recording Rules
  # ========================================
  # These rules track the Errors and Latency SLOs for cluster delete operations.
  # SLO: 95% of cluster delete operations should succeed (not reach "failed" or "canceled" terminal phase)
  # Error Budget: 5% (1 - 0.95)
  # Scope: covers cluster delete operations only.
  #
  # Metrics are gauge-based (backend_resource_operation_phase_info) from Cosmos DB,
  # so we use count() aggregations rather than rate() on counters.
  #
  # NOTE: the instantaneous records below are a trailing ~7-day cumulative
  # ratio, because the phase gauge is retained for the Cosmos 7-day TTL, so a
  # single stale failure keeps the ratio elevated for days. Prefer the windowed
  # records in arohcp_cluster_deletion_slo_windowed_recording_rules for
  # alerting; these instantaneous records are kept for dashboards / compatibility
  # only.
  - name: arohcp_cluster_deletion_slo_recording_rules
    interval: 1m
    rules:
    # Instantaneous error rate: fraction of terminal operations that failed or were canceled.
    # The "or 0 * count by (cluster)" fallback returns zero with the cluster label when
    # there are no failures, avoiding lost label context (vs "or vector(0)").
    - record: errors:backend_cluster_deletion_operation:error_rate
      expr: |
        (
          count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"failed|canceled"
          }))
          or
          0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"succeeded|failed|canceled"
          }))
        )
        /
        clamp_min(
          count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"succeeded|failed|canceled"
          })),
          1
        )
    # Latency error rate: fraction of succeeded operations that exceeded the 30-minute target.
    # Uses count by (cluster) to preserve the cluster label per nodepool production pattern.
    - record: errors:backend_cluster_deletion_operation:latency_error_rate
      expr: |
        (
          count by (cluster) (
            (
              max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="delete",
                phase="succeeded"
              })
              -
              max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_start_time_seconds{
                resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
                operation_type="delete",
                phase="succeeded"
              })
            ) > 1800
            and
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            }) == 1
          )
          or
          0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1)
        )
        /
        clamp_min(
          count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1),
          1
        )
  # ========================================
  # Cluster Deletion SLO Recording Rules: Windowed Errors (stateless)
  # ========================================
  # These windowed records count only cluster delete operations whose terminal
  # transition landed inside the window, via
  # (time() - backend_resource_operation_last_transition_time_seconds) < W,
  # so a stale failure ages out of the window instead of smearing for the full
  # Cosmos 7-day TTL. No new metric and no backend change.
  #
  # The `or 0 * ...` term pins the failure count to 0 (not absent) when a
  # cluster has delete operations but none failed in-window.
  - name: arohcp_cluster_deletion_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): terminal transition within 3600s ---
    - record: errors:backend_cluster_deletion_operation:failed_1h
      expr: |
        count by (cluster) (
          (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"failed|canceled"
          }) == 1)
          and
          ((time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete"
          })) < 3600)
        )
        or
        0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="delete"
        }))
    - record: errors:backend_cluster_deletion_operation:total_1h
      expr: |
        count by (cluster) (
          (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"succeeded|failed|canceled"
          }) == 1)
          and
          ((time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete"
          })) < 3600)
        )
    - record: errors:backend_cluster_deletion_operation:error_rate_1h
      expr: |
        errors:backend_cluster_deletion_operation:failed_1h
        /
        clamp_min(errors:backend_cluster_deletion_operation:total_1h, 1)
    # --- 6h window (medium burn): terminal transition within 21600s ---
    - record: errors:backend_cluster_deletion_operation:failed_6h
      expr: |
        count by (cluster) (
          (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"failed|canceled"
          }) == 1)
          and
          ((time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete"
          })) < 21600)
        )
        or
        0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="delete"
        }))
    - record: errors:backend_cluster_deletion_operation:total_6h
      expr: |
        count by (cluster) (
          (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"succeeded|failed|canceled"
          }) == 1)
          and
          ((time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete"
          })) < 21600)
        )
    - record: errors:backend_cluster_deletion_operation:error_rate_6h
      expr: |
        errors:backend_cluster_deletion_operation:failed_6h
        /
        clamp_min(errors:backend_cluster_deletion_operation:total_6h, 1)
    # --- 3d window (slow burn / budget): terminal transition within 259200s ---
    - record: errors:backend_cluster_deletion_operation:failed_3d
      expr: |
        count by (cluster) (
          (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"failed|canceled"
          }) == 1)
          and
          ((time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete"
          })) < 259200)
        )
        or
        0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="delete"
        }))
    - record: errors:backend_cluster_deletion_operation:total_3d
      expr: |
        count by (cluster) (
          (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase=~"succeeded|failed|canceled"
          }) == 1)
          and
          ((time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete"
          })) < 259200)
        )
    - record: errors:backend_cluster_deletion_operation:error_rate_3d
      expr: |
        errors:backend_cluster_deletion_operation:failed_3d
        /
        clamp_min(errors:backend_cluster_deletion_operation:total_3d, 1)
  # ========================================
  # Cluster Deletion SLO Recording Rules: Windowed Latency (stateless)
  # ========================================
  # These windowed records count only succeeded cluster delete operations whose
  # completion landed inside the window, via
  # (time() - backend_resource_operation_last_transition_time_seconds) < W,
  # so a stale slow delete ages out of the window instead of smearing for the
  # full Cosmos 7-day TTL. No new metric and no backend change.
  #
  # Latency SLI: fraction of succeeded deletes that exceeded 30 minutes (1800s).
  # The `or 0 * ...` term pins the slow count to 0 (not absent) when a
  # cluster has succeeded deletes but none were slow in-window.
  - name: arohcp_cluster_deletion_slo_windowed_latency_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): succeeded within 3600s ---
    - record: errors:backend_cluster_deletion_operation:latency_slow_1h
      expr: |
        count by (cluster) (
          (
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            })
            -
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_start_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            })
          ) > 1800
          and
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1
          and
          (time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          })) < 3600
        )
        or
        0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="delete",
          phase="succeeded"
        }) == 1)
    - record: errors:backend_cluster_deletion_operation:latency_total_1h
      expr: |
        count by (cluster) (
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1
          and
          (time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          })) < 3600
        )
    - record: errors:backend_cluster_deletion_operation:latency_error_rate_1h
      expr: |
        errors:backend_cluster_deletion_operation:latency_slow_1h
        /
        clamp_min(errors:backend_cluster_deletion_operation:latency_total_1h, 1)
    # --- 6h window (medium burn): succeeded within 21600s ---
    - record: errors:backend_cluster_deletion_operation:latency_slow_6h
      expr: |
        count by (cluster) (
          (
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            })
            -
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_start_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            })
          ) > 1800
          and
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1
          and
          (time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          })) < 21600
        )
        or
        0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="delete",
          phase="succeeded"
        }) == 1)
    - record: errors:backend_cluster_deletion_operation:latency_total_6h
      expr: |
        count by (cluster) (
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1
          and
          (time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          })) < 21600
        )
    - record: errors:backend_cluster_deletion_operation:latency_error_rate_6h
      expr: |
        errors:backend_cluster_deletion_operation:latency_slow_6h
        /
        clamp_min(errors:backend_cluster_deletion_operation:latency_total_6h, 1)
    # --- 3d window (slow burn / budget): succeeded within 259200s ---
    - record: errors:backend_cluster_deletion_operation:latency_slow_3d
      expr: |
        count by (cluster) (
          (
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            })
            -
            max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_start_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="delete",
              phase="succeeded"
            })
          ) > 1800
          and
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1
          and
          (time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          })) < 259200
        )
        or
        0 * count by (cluster) (max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
          resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
          operation_type="delete",
          phase="succeeded"
        }) == 1)
    - record: errors:backend_cluster_deletion_operation:latency_total_3d
      expr: |
        count by (cluster) (
          max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          }) == 1
          and
          (time() - max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (backend_resource_operation_last_transition_time_seconds{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="delete",
            phase="succeeded"
          })) < 259200
        )
    - record: errors:backend_cluster_deletion_operation:latency_error_rate_3d
      expr: |
        errors:backend_cluster_deletion_operation:latency_slow_3d
        /
        clamp_min(errors:backend_cluster_deletion_operation:latency_total_3d, 1)
