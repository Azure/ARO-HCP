rule_files:
- namespace-hcp-cluster-resource-id-recordingRule.yaml
evaluation_interval: 1m
tests:

# Scenario 1: namespace carries the annotation — value is copied onto hcp_cluster_resource_id
- interval: 1m
  input_series:
  - series: 'kube_namespace_annotations{job="kube-state-metrics", namespace="ocm-test-hcp-namespace", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster"}'
    values: "1+0x5"
  promql_expr_test:
  - expr: info:kube_namespace:hcp_cluster_resource_id{namespace="ocm-test-hcp-namespace"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="info:kube_namespace:hcp_cluster_resource_id", job="kube-state-metrics", namespace="ocm-test-hcp-namespace", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster", hcp_cluster_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster"}'
      value: 1
  - expr: info:kube_namespace:hcp_cluster_subscription_id{namespace="ocm-test-hcp-namespace"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="info:kube_namespace:hcp_cluster_subscription_id", job="kube-state-metrics", namespace="ocm-test-hcp-namespace", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster", hcp_cluster_subscription_id="00000000-0000-0000-0000-000000000000"}'
      value: 1

# Scenario 1b: annotation uses the lowercase casing observed in production
# (resourcegroups / microsoft.redhatopenshift / hcpopenshiftclusters) —
# the case-insensitive regex must still extract the subscription ID.
- interval: 1m
  input_series:
  - series: 'kube_namespace_annotations{job="kube-state-metrics", namespace="ocm-test-hcp-namespace-lowercase", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/11111111-1111-1111-1111-111111111111/resourcegroups/test-rg/providers/microsoft.redhatopenshift/hcpopenshiftclusters/test-hcp-cluster"}'
    values: "1+0x5"
  promql_expr_test:
  - expr: info:kube_namespace:hcp_cluster_subscription_id{namespace="ocm-test-hcp-namespace-lowercase"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="info:kube_namespace:hcp_cluster_subscription_id", job="kube-state-metrics", namespace="ocm-test-hcp-namespace-lowercase", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/11111111-1111-1111-1111-111111111111/resourcegroups/test-rg/providers/microsoft.redhatopenshift/hcpopenshiftclusters/test-hcp-cluster", hcp_cluster_subscription_id="11111111-1111-1111-1111-111111111111"}'
      value: 1

# Scenario 2: namespace has no hcp-cluster-azure-resource-id annotation — no series emitted
- interval: 1m
  input_series:
  - series: 'kube_namespace_annotations{job="kube-state-metrics", namespace="kube-system"}'
    values: "1+0x5"
  promql_expr_test:
  - expr: info:kube_namespace:hcp_cluster_resource_id{namespace="kube-system"}
    eval_time: 1m
    exp_samples: []
  - expr: info:kube_namespace:hcp_cluster_subscription_id{namespace="kube-system"}
    eval_time: 1m
    exp_samples: []

# Scenario 3: namespace annotations scraped by two HA Prometheus agent replicas
# (same kube-state-metrics pod, differing only by prometheus_replica) — must
# collapse to exactly one series, not a duplicate that breaks downstream joins.
- interval: 1m
  input_series:
  - series: 'kube_namespace_annotations{job="kube-state-metrics", instance="10.0.0.1:8080", pod="kube-state-metrics-abc", prometheus_replica="prom-agent-prometheus-0", namespace="ocm-test-hcp-namespace-ha", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster-ha"}'
    values: "1+0x5"
  - series: 'kube_namespace_annotations{job="kube-state-metrics", instance="10.0.0.1:8080", pod="kube-state-metrics-abc", prometheus_replica="prom-agent-prometheus-1", namespace="ocm-test-hcp-namespace-ha", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster-ha"}'
    values: "1+0x5"
  promql_expr_test:
  - expr: info:kube_namespace:hcp_cluster_resource_id{namespace="ocm-test-hcp-namespace-ha"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="info:kube_namespace:hcp_cluster_resource_id", job="kube-state-metrics", namespace="ocm-test-hcp-namespace-ha", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster-ha", hcp_cluster_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster-ha"}'
      value: 1
  - expr: info:kube_namespace:hcp_cluster_subscription_id{namespace="ocm-test-hcp-namespace-ha"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="info:kube_namespace:hcp_cluster_subscription_id", job="kube-state-metrics", namespace="ocm-test-hcp-namespace-ha", annotation_azure_microsoft_com_hcp_cluster_azure_resource_id="/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.RedHatOpenShift/hcpOpenShiftClusters/test-hcp-cluster-ha", hcp_cluster_subscription_id="00000000-0000-0000-0000-000000000000"}'
      value: 1
