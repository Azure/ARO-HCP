rule_files:
- cluster-update-slo-recordingRule.yaml
evaluation_interval: 1m
tests:
# Only operation_type="update" on hcpOpenShiftClusters is in scope: create, delete
# and node pool updates are excluded.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="create", phase="failed", cluster="mgmt-1"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/c", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="delete", phase="failed", cluster="mgmt-1"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/d/nodepool/x", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters/nodepools", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1+0x15"
  promql_expr_test:
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"})'
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 1
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="failed"})'
    eval_time: 5m
    exp_samples: []
# HA scrapes are deduplicated. The same 3 operations (2 succeeded, 1 failed) are
# reported by two Prometheus replicas. Without deduplication the counts would be
# 4 and 6 rather than 2 and 3, because count() counts series.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", prometheus_replica="prometheus-k8s-0"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", prometheus_replica="prometheus-k8s-1"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", prometheus_replica="prometheus-k8s-0"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", prometheus_replica="prometheus-k8s-1"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/c", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", prometheus_replica="prometheus-k8s-0"}'
    values: "1+0x15"
  - series: 'backend_resource_operation_phase_info{resource_id="/sub/1/cluster/c", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", prometheus_replica="prometheus-k8s-1"}'
    values: "1+0x15"
  promql_expr_test:
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="succeeded"})'
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 2
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"})'
    eval_time: 5m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 3
# Backend targets are deduplicated. A former leader keeps exporting its gauges
# after losing leadership, so two Backend pods can report the same operation with
# different pod/instance target labels. /f1 (failed) and /s1 (succeeded) are each
# reported by both pods and both Prometheus replicas, but are counted once.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0", instance="10.0.0.1:8081", prometheus_replica="prometheus-k8s-0"}'
    values: "1x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1", instance="10.0.0.2:8081", prometheus_replica="prometheus-k8s-1"}'
    values: "1x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0", instance="10.0.0.1:8081", prometheus_replica="prometheus-k8s-0"}'
    values: "0x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/f1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1", instance="10.0.0.2:8081", prometheus_replica="prometheus-k8s-1"}'
    values: "0x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0", instance="10.0.0.1:8081", prometheus_replica="prometheus-k8s-0"}'
    values: "1x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1", instance="10.0.0.2:8081", prometheus_replica="prometheus-k8s-1"}'
    values: "1x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0", instance="10.0.0.1:8081", prometheus_replica="prometheus-k8s-0"}'
    values: "0x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/s1", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1", instance="10.0.0.2:8081", prometheus_replica="prometheus-k8s-1"}'
    values: "0x30"
  promql_expr_test:
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="succeeded"})'
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 1
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"})'
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 2
# Backend targets disagreeing on phase are reduced to one current state. During
# failover the former leader keeps its last snapshot while the new leader reports
# the operation's later state. backend-0 is the stale former leader. /a: stale
# failed (transition 0s) vs current succeeded (transition 300s). /b: stale
# succeeded (0s) vs current failed (300s). The later transition wins, so each
# operation is recorded once with its current phase.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0"}'
    values: "1x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0"}'
    values: "0x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1"}'
    values: "1x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1"}'
    values: "300x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0"}'
    values: "1x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0"}'
    values: "0x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1"}'
    values: "1x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1"}'
    values: "300x30"
  promql_expr_test:
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="succeeded"})'
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 1
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase=~"succeeded|failed"})'
    eval_time: 10m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 2
# Backend targets exposing different retained operations are resolved the same
# way as the emitter: the operation with the newest start time wins, even if an
# older operation transitioned later. backend-0 (stale former leader) retains op1
# (started 0s, last transition 500s); backend-1 (current leader) retains op2
# (started 300s, last transition 400s). /a: stale op1 failed vs current op2
# succeeded -> succeeded. /b: stale op1 succeeded vs current op2 failed -> failed.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0"}'
    values: "1x30"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0"}'
    values: "0x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-0"}'
    values: "500x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1"}'
    values: "1x30"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1"}'
    values: "300x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-1"}'
    values: "400x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0"}'
    values: "1x30"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0"}'
    values: "0x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1", pod="backend-0"}'
    values: "500x30"
  - series: 'backend_resource_operation_phase_info{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1"}'
    values: "1x30"
  - series: 'backend_resource_operation_start_time_seconds{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1"}'
    values: "300x30"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/b", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1", pod="backend-1"}'
    values: "400x30"
  promql_expr_test:
  - expr: current:backend_cluster_update:last_transition_time_seconds
    eval_time: 10m
    exp_samples:
    - labels: 'current:backend_cluster_update:last_transition_time_seconds{cluster="mgmt-1", operation_type="update", phase="succeeded", resource_id="/a", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", subscription_id="sub-1"}'
      value: 400
    - labels: 'current:backend_cluster_update:last_transition_time_seconds{cluster="mgmt-1", operation_type="update", phase="failed", resource_id="/b", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", subscription_id="sub-1"}'
      value: 400
# Known limitation: a failed update overwritten by a successful retry is not
# counted. /a fails at 0m and is retried successfully at 10m; the Backend replaces
# the failed series, so at 20m the current state shows one success and no failure.
- interval: 1m
  input_series:
  - series: 'backend_resource_operation_phase_info{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "1x10"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="failed", cluster="mgmt-1"}'
    values: "0x10"
  - series: 'backend_resource_operation_phase_info{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "_x10 1x20"
  - series: 'backend_resource_operation_last_transition_time_seconds{resource_id="/a", subscription_id="sub-1", resource_type="microsoft.redhatopenshift/hcpopenshiftclusters", operation_type="update", phase="succeeded", cluster="mgmt-1"}'
    values: "_x10 600x20"
  promql_expr_test:
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="succeeded"})'
    eval_time: 20m
    exp_samples:
    - labels: '{cluster="mgmt-1"}'
      value: 1
  - expr: 'count by (cluster) (current:backend_cluster_update:last_transition_time_seconds{phase="failed"})'
    eval_time: 20m
    exp_samples: []
