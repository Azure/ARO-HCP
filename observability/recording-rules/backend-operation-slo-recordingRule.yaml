# ========================================
# Backend Operation SLO Recording Rules (Unified)
# ========================================
# Unified recording rules for ALL backend resource operations tracked via
# backend_resource_operation_phase_info gauges.
#
# These rules replace per-family recording rules with a single set that preserves
# resource_type and operation_type as output labels. Alerts and dashboards
# can now filter by those labels to select the family they need.
#
# The SLO denominator counts only succeeded and failed operations. Canceled
# operations (superseded or aborted before completion by users) are excluded from both
# the numerator and the denominator, so a user-initiated cancellation neither
# counts as a failure nor dilutes the rate; success_rate and error_rate sum
# to 1.
#
# HA dedup: max by (grouping set) collapses duplicate series from
# prometheus_replica HA pairs.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: backend-operation-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Windowed Errors (stateless, last_transition-windowed)
  # ========================================
  # These windowed records count only operations whose terminal transition
  # landed inside the window, via
  # (time() - backend_resource_operation_last_transition_time_seconds) < W,
  # so a stale failure ages out of the window instead of smearing for the full
  # Cosmos 7-day TTL.
  #
  # The `or 0 * ...` term on failed counts pins the value to 0 (not absent)
  # when a cluster has operations but none failed in-window.
  - name: arohcp_backend_operation_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 1h window (fast burn): terminal transition within 3600s ---
    - record: errors:backend_resource_operation:failed_1h
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase="failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 3600)
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    - record: errors:backend_resource_operation:total_1h
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 3600)
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    - record: errors:backend_resource_operation:error_rate_1h
      expr: |
        errors:backend_resource_operation:failed_1h
        /
        clamp_min(errors:backend_resource_operation:total_1h, 1)
    # --- 6h window (medium burn): terminal transition within 21600s ---
    - record: errors:backend_resource_operation:failed_6h
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase="failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 21600)
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    - record: errors:backend_resource_operation:total_6h
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 21600)
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    - record: errors:backend_resource_operation:error_rate_6h
      expr: |
        errors:backend_resource_operation:failed_6h
        /
        clamp_min(errors:backend_resource_operation:total_6h, 1)
    # --- 3d window (slow burn / budget): terminal transition within 259200s ---
    - record: errors:backend_resource_operation:failed_3d
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase="failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 259200)
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    - record: errors:backend_resource_operation:total_3d
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 259200)
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    - record: errors:backend_resource_operation:error_rate_3d
      expr: |
        errors:backend_resource_operation:failed_3d
        /
        clamp_min(errors:backend_resource_operation:total_3d, 1)
  # ========================================
  # Latency: Completed Operation Duration (windowed percentiles)
  # ========================================
  # System-wide percentiles (p50, p95, p99) of completed operation duration
  # for operations whose terminal transition landed inside the window.
  #
  # Duration = last_transition_time - start_time for terminal (succeeded|failed)
  # operations. Canceled operations are excluded (consistent with the error
  # rate denominator). Windowed by last_transition_time, same as the error
  # rate rules.
  #
  # Phase segmentation: the quantile aggregation includes `phase` in the
  # grouping key, producing separate series for succeeded and failed
  # operations. SLO dashboards filter on phase="succeeded"; failed latency
  # is available for debugging via phase="failed".
  #
  # Stuck operation detection (per-resource, in-flight duration) is simple
  # enough to live inline in alert expressions.
  #
  # Aggregation: by (cluster, region, resource_type, operation_type, phase),
  # extending the error rate grouping key with phase. Alerts and dashboards
  # filter by resource_type, operation_type, and phase to select the family
  # and result they need.
  - name: arohcp_backend_operation_latency_recording_rules
    interval: 1m
    rules:
    # --- 1h window: completed operations whose terminal transition is within 3600s ---
    - record: latency:backend_resource_operation:p50_1h
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.5,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 3600)
        )
    - record: latency:backend_resource_operation:p95_1h
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.95,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 3600)
        )
    - record: latency:backend_resource_operation:p99_1h
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.99,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 3600)
        )
    # --- 6h window: completed operations whose terminal transition is within 21600s ---
    - record: latency:backend_resource_operation:p50_6h
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.5,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 21600)
        )
    - record: latency:backend_resource_operation:p95_6h
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.95,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 21600)
        )
    - record: latency:backend_resource_operation:p99_6h
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.99,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 21600)
        )
    # --- 3d window: completed operations whose terminal transition is within 259200s ---
    - record: latency:backend_resource_operation:p50_3d
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.5,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 259200)
        )
    - record: latency:backend_resource_operation:p95_3d
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.95,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 259200)
        )
    - record: latency:backend_resource_operation:p99_3d
      expr: |
        quantile by (cluster, region, resource_type, operation_type, phase) (0.99,
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_last_transition_time_seconds{}
            )
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{phase=~"succeeded|failed"}
          ) == 1)
          and
          ((time() - max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_last_transition_time_seconds{}
          )) < 259200)
        )
  # ========================================
  # In-Flight Operation Duration (current state)
  # ========================================
  # Computes time() - start_time for operations currently in a non-terminal
  # phase (not succeeded, not failed, not canceled).
  #
  # Expiry: no explicit time window is needed. The phase_info gauge drops
  # to 0 the moment an operation reaches a terminal phase, and the == 1
  # filter excludes it immediately.
  #
  # HA dedup: same max by (grouping set) pattern as the error-rate and
  # latency rules collapses HA replica duplicates.
  #
  # or-pin: anchors the metric to 0 when operations exist but none are
  # currently in-flight, preventing absent-series gaps in dashboards and
  # alert evaluation.
  - name: arohcp_backend_operation_inflight_recording_rules
    interval: 1m
    rules:
    # --- max in-flight duration: worst-case staleness per group ---
    # Idle state is max_duration_seconds=0 paired with count=0. A
    # max_duration_seconds=0 alone (without checking count) can also mean
    # an operation just started at the current scrape timestamp.
    - record: inflight:backend_resource_operation:max_duration_seconds
      expr: |
        max by (cluster, region, resource_type, operation_type) (
          (
            time()
            -
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_start_time_seconds{}
            )
          )
          and
          (
            max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
              backend_resource_operation_phase_info{phase!~"succeeded|failed|canceled"}
            ) == 1
          )
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
    # --- in-flight count: number of active non-terminal operations ---
    # Inner max omits phase from the grouping key so a resource with
    # two simultaneous non-terminal phase_info=1 series (transient
    # during a phase transition) is counted once, not twice.
    - record: inflight:backend_resource_operation:count
      expr: |
        count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type) (
            backend_resource_operation_phase_info{phase!~"succeeded|failed|canceled"}
          ) == 1
        )
        or
        0 * count by (cluster, region, resource_type, operation_type) (
          max by (cluster, environment, region, resource_id, resource_type, operation_type, phase) (
            backend_resource_operation_phase_info{}
          )
        )
