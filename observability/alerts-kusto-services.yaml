prometheusRules:
  rulesFolders:
  - alerts/kubernetesControlPlane-prometheusRule.yaml
  - ../frontend/alerts/frontend-path-latency-prometheusRule.yaml
  - alerts/serviceMemoryResources-prometheusRule.yaml
  prometheusOperatorVersion: e02554298cb62b5533f3407c8eacc664e80bc74b
  outputBicep: ../dev-infrastructure/modules/metrics/rules/generatedKustoOnlyServicePrometheusAlertingRules.bicep
  groupNamePrefix: "svc-"
  outputReplacements:
  # Shared Kubernetes Down rules use hosted-cluster discovery by default.
  # Only the services workspace can enumerate clusters from underlay inventory.
  - from: '(kube_node_info) unless on (cluster)'
    to: '(underlay_clusters) unless on (cluster)'
  - from: 'job="kube-scheduler"'
    to: 'job="controlplane-kube-scheduler"'
  - from: 'job="apiserver"'
    to: 'job="controlplane-apiserver"'
  - from: 'job="etcd"'
    to: 'job="controlplane-etcd"'
  - from: 'job="cluster-autoscaler"'
    to: 'job="controlplane-cluster-autoscaler"'
  - from: 'job="kube-controller-manager"'
    to: 'job="controlplane-kube-controller-manager"'
