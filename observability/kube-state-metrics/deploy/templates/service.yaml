apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-crs
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
spec:
  ports:
  - name: http-metrics
    port: 8080
    targetPort: http-metrics
    protocol: TCP
  - name: telemetry
    port: 8081
    targetPort: telemetry
    protocol: TCP
  selector:
    app.kubernetes.io/name: kube-state-metrics-crs
