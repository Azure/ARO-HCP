apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics-crs
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics-crs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics-crs
    spec:
      automountServiceAccountToken: true
      serviceAccountName: kube-state-metrics-crs
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        image: '{{ .Values.image.registry }}/{{ .Values.image.repository }}@sha256:{{ .Values.image.digest }}'
        args:
        - --resources=certificatesigningrequests
        - --metric-allowlist={{ join "," .Values.metricAllowlist }}
        - --custom-resource-state-config-file=/etc/customresourcestate/config.yaml
        ports:
        - name: http-metrics
          containerPort: 8080
          protocol: TCP
        - name: telemetry
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: http-metrics
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: crs-config
          mountPath: /etc/customresourcestate
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: aro-hcp.azure.com/role
                operator: In
                values:
                - infra
      tolerations:
      - key: infra
        operator: Equal
        value: "true"
        effect: NoSchedule
      volumes:
      - name: crs-config
        configMap:
          name: kube-state-metrics-crs-config
