version: "2"
run:
  timeout: 10m
  modules-download-mode: readonly
issues:
  # We want to make sure we get a full report every time. Setting these
  # to zero disables the limit.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  exclusions:
    presets:
    - std-error-handling
    rules:
    # forbidigo patterns with "in test files" in their message are scoped to the
    # root test/ directory only. Other forbidigo patterns remain unrestricted.
    - path-except: "^test/"
      linters:
      - forbidigo
      text: "in test files"
  default: none
  enable:
  - errcheck
  - forbidigo
  - govet
  - importas
  - ineffassign
  - staticcheck
  - unused
  settings:
    forbidigo:
      analyze-types: true
      forbid:
      - pattern: "^fmt\\.Print(f|ln)?$"
        msg: "do not use fmt.Print* in test files - use Ginkgo's GinkgoLogr or GinkgoWriter instead"
      - pattern: "^log\\.Print(f|ln)?$"
        msg: "do not use log.Print* in test files - use Ginkgo's GinkgoLogr or GinkgoWriter instead"
      - pattern: "^print(ln)?$"
        msg: "do not use builtin print/println in test files - use Ginkgo's GinkgoLogr or GinkgoWriter instead"
    importas:
      no-unaliased: true
      alias:
      - pkg: github.com/openshift-online/ocm-sdk-go/aro_hcp/v1alpha1
        alias: arohcpv1alpha1
      - pkg: github.com/openshift-online/ocm-sdk-go/clustersmgmt/v1
        alias: cmv1
      - pkg: github.com/Azure/azure-sdk-for-go/sdk/azcore/arm
        alias: azcorearm
      - pkg: github.com/openshift/api/(\w+)/(v[\w\d]+)
        alias: $1$2
      - pkg: github.com/Azure/ARO-HCP/test/sdk/v20240610preview/resourcemanager/redhatopenshifthcp/armredhatopenshifthcp"
        alias: hcpsdk20240610preview
      - pkg: github.com/Azure/ARO-HCP/backend/pkg/azure/client
        alias: azureclient
    staticcheck:
      dot-import-whitelist:
      - "github.com/onsi/ginkgo"
      - "github.com/onsi/ginkgo/v2"
      - "github.com/onsi/gomega"
formatters:
  enable:
  - gci
  - gofmt
  settings:
    gci:
      custom-order: true
      sections:
      - standard
      - blank
      - dot
      - default
      - prefix(k8s.io)
      - prefix(sigs.k8s.io)
      - prefix(github.com/Azure)
      - prefix(github.com/openshift)
      - prefix(github.com/Azure/ARO-HCP)
