deployment:
  replicas: {{ .maestro.server.k8s.replicas }}
  resources:
    requests:
      cpu: "{{ .maestro.server.k8s.resources.requests.cpu }}"
      memory: "{{ .maestro.server.k8s.resources.requests.memory }}"
    limits:
      memory: "{{ .maestro.server.k8s.resources.limits.memory }}"
  zoneCount: {{ .azureRegionAvailabilityZoneCount }}
broker:
  host: "__brokerHost__"
  port: 8883
migrationResources:
  requests:
    cpu: "{{ .maestro.server.migrationResources.requests.cpu }}"
    memory: "{{ .maestro.server.migrationResources.requests.memory }}"
  limits:
    cpu: "{{ .maestro.server.migrationResources.limits.cpu }}"
    memory: "{{ .maestro.server.migrationResources.limits.memory }}"
waitForDBResources:
  requests:
    cpu: "{{ .maestro.server.waitForDBResources.requests.cpu }}"
    memory: "{{ .maestro.server.waitForDBResources.requests.memory }}"
  limits:
    cpu: "{{ .maestro.server.waitForDBResources.limits.cpu }}"
    memory: "{{ .maestro.server.waitForDBResources.limits.memory }}"
database:
  azureDb: {{ .maestro.postgres.deploy }}
  containerizedDbImage: "{{ .maestro.postgres.containerizedDb.image }}"
  containerizedDbPvcCapacity: "{{ .maestro.postgres.containerizedDb.pvcCapacity }}"
  resources:
    requests:
      cpu: "{{ .maestro.postgres.containerizedDb.resources.requests.cpu }}"
      memory: "{{ .maestro.postgres.containerizedDb.resources.requests.memory }}"
    limits:
      cpu: "{{ .maestro.postgres.containerizedDb.resources.limits.cpu }}"
      memory: "{{ .maestro.postgres.containerizedDb.resources.limits.memory }}"
  host: "__databaseHost__"
  port: 5432
  name: "{{ .maestro.postgres.databaseName }}"
  password: "{{ .maestro.postgres.password }}"
  user: "maestro-server"
  maxOpenConnections: 50
  debug: false
maestro:
  serviceAccount: "{{ .maestro.server.k8s.serviceAccountName }}"
  httpReadTimeout: 60s
  httpWriteTimeout: 60s
  labelMetricsInclusionDuration: 168h
  httpBindPort: 8000
  grpcBindPort: 8090
  healthCheckBindPort: 8083
  glog_v: {{ .maestro.server.loglevel }}
clustersService:
  namespace: "{{ .clustersService.k8s.namespace }}"
  serviceAccount: "{{ .clustersService.k8s.serviceAccountName }}"
backend:
  namespace: "{{ .backend.k8s.namespace }}"
  serviceAccount: "{{ .backend.k8s.serviceAccountName }}"
fleet:
  namespace: "{{ .fleet.k8s.namespace }}"
  serviceAccount: "{{ .fleet.k8s.serviceAccountName }}"
istio:
  restrictIngress: {{ .maestro.restrictIstioIngress }}
azure:
  cloudEnvironmentName: "{{ .cloudEnvironmentName }}"
  clientId: "__maestroMsiClientId__"
  tenantId: "__tenantId__"
image:
  registry: "{{ .acr.svc.name }}.azurecr.io"
  repository: "{{ .maestro.image.repository }}"
  digest: "{{ .maestro.image.digest }}"
credsKeyVault:
  name: "{{ .serviceKeyVault.name }}"
  secret: "{{ .maestro.server.mqttClientName }}"
# Pull binding configuration for ACR Pull Operator
pullBinding:
  registry: "{{ .acr.svc.name }}.azurecr.io"
  scope: "repository:{{ .maestro.image.repository }}:pull"
  workloadIdentityClientId: "__imagePullerMsiClientId__"
  workloadIdentityTenantId: "__tenantId__"
