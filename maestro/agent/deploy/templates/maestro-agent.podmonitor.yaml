apiVersion: {{ .Values.monitoringApiGroup }}/v1
kind: PodMonitor
metadata:
  name: maestro-agent
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    matchLabels:
      app: maestro-agent
  namespaceSelector:
    matchNames:
    - '{{ .Release.Namespace }}'
  podMetricsEndpoints:
  - path: /metrics
    port: metrics
    scheme: http
    metricRelabelings:
    - action: replace
      replacement: service
      targetLabel: microsoft_metrics_include_label
