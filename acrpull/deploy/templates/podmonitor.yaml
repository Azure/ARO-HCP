apiVersion: {{ .Values.monitoringApiGroup }}/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: acrpull
    app.kubernetes.io/managed-by: Helm
  name: acrpull
  namespace: '{{ .Values.namespace }}'
spec:
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    metricRelabelings:
    - action: replace
      replacement: service
      targetLabel: microsoft_metrics_include_label
  selector:
    matchLabels:
      app.kubernetes.io/name: acrpull
