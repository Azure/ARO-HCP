apiVersion: {{ .Values.monitoringApiGroup }}/v1
kind: PodMonitor
metadata:
  name: velero
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    matchLabels:
      deploy: velero
  namespaceSelector:
    matchNames:
    - '{{ .Release.Namespace }}'
  podMetricsEndpoints:
  - path: /metrics
    port: metrics
    scheme: http
    interval: 30s
    relabelings:
    - action: replace
      replacement: service
      targetLabel: microsoft_metrics_include_label
    metricRelabelings:
    # Route hcp specific Velero metrics to the HCP Azure Monitor Workspace.
    - action: replace
      sourceLabels: [__name__, schedule]
      separator: ;
      regex: 'velero_[^;]+;(ocm-[^-]+-[^-]+)-.+'
      targetLabel: namespace
      replacement: '${1}'
    - action: replace
      sourceLabels: [__name__, schedule]
      separator: ;
      regex: 'velero_([^;]+);ocm-[^-]+-[^-]+-.+'
      targetLabel: __name__
      replacement: 'velero_hcp_${1}'
