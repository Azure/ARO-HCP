apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-kustomize-patch
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  kustomization.yaml: |
    resources:
    - velero.yaml
    patchesStrategicMerge:
    - scheduling-patch.yaml
  scheduling-patch.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: velero
      namespace: {{ .Release.Namespace }}
    spec:
      template:
        spec:
          priorityClassName: service-lifecycle-critical
          nodeSelector:
            aro-hcp.azure.com/role: infra
          tolerations:
          - key: "infra"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
          {{- $plugins := list }}
          {{- range list .Values.azurePlugin .Values.hypershiftPlugin }}
          {{- $resources := include "velero.resources" .resources | fromYaml }}
          {{- if $resources }}
          {{- $plugins = append $plugins (merge (dict "name" .initContainerName) $resources) }}
          {{- end }}
          {{- end }}
          {{- with $plugins }}
          initContainers:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: node-agent
      namespace: {{ .Release.Namespace }}
    spec:
      template:
        spec:
          priorityClassName: service-lifecycle-critical
