apiVersion: batch/v1
kind: Job
metadata:
  name: install-hypershift-crds
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: install
        image: "{{ .Values.image }}@{{ .Values.imageDigest }}"
        command:
        - /bin/sh
        - -c
        - |
          hypershift install \
            --install-scope=crds \
            --managed-service ARO-HCP \
            --limit-crd-install=Azure \
            --hypershift-image {{ .Values.image }}@{{ .Values.imageDigest }}
      restartPolicy: Never
      serviceAccountName: hypershift-installer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-hypershift
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      initContainers:
      - name: render
        image: "{{ .Values.image }}@{{ .Values.imageDigest }}"
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          hypershift install render \
            --outputs=resources \
            --render-sensitive \
            --output-file=/manifests/hypershift.yaml \
            --enable-conversion-webhook=false \
            --managed-service ARO-HCP \
            --aro-hcp-key-vault-users-client-id {{ .Values.azureKeyVaultClientId }} \
            --registry-overrides "{{ .Values.registryOverrides }}" \
            --hypershift-image {{ .Values.image }}@{{ .Values.imageDigest }} \
            --platform-monitoring=None \
            --metrics-set=SRE \
            --enable-size-tagging=true \
            --limit-crd-install=Azure \
            {{- if .Values.operatorEnvVars.sharedIngressIPTag }}
            --additional-operator-env-vars SHARED_INGRESS_AZURE_PIP_IP_TAGS={{ .Values.operatorEnvVars.sharedIngressIPTag }} \
            {{- end }}
            {{- if .Values.operatorEnvVars.sharedIngressImage }}
            --additional-operator-env-vars IMAGE_SHARED_INGRESS_HAPROXY={{ .Values.operatorEnvVars.sharedIngressImage }} \
            {{- end }}
            {{ .Values.additionalArgs }}
        volumeMounts:
        - name: manifests
          mountPath: /manifests
      containers:
      - name: install
        image: "{{ .Values.installJobImage }}"
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          cp /overlay/kustomization.yaml /manifests/kustomization.yaml
          kubectl kustomize /manifests > /manifests/rendered.yaml
          kubectl create --dry-run=client --validate=false -f /manifests/rendered.yaml -o json |
            jq -s '{apiVersion: "v1", kind: "List", items: [.[] | if .kind == "List" then .items[] else . end]}' > /manifests/resources.json
          jq -c '.items[] | select(.kind == "PriorityClass")' /manifests/resources.json > /manifests/priorityclasses.jsonl
          # Upstream creates PriorityClasses without updating existing immutable values.
          while IFS= read -r priorityclass; do
            if output=$(kubectl create -f - <<< "$priorityclass" 2>&1); then
              printf '%s\n' "$output"
            elif [[ "$output" == 'Error from server (AlreadyExists): '* ]]; then
              printf '%s\n' "$output"
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done < /manifests/priorityclasses.jsonl
          jq '.items |= map(select(.kind != "PriorityClass"))' /manifests/resources.json > /manifests/apply.json
          # Match the upstream install field manager and force-ownership policy.
          kubectl apply --server-side --force-conflicts --field-manager=hypershift -f /manifests/apply.json
        volumeMounts:
        - name: manifests
          mountPath: /manifests
        - name: overlay
          mountPath: /overlay
          readOnly: true
      volumes:
      - name: manifests
        emptyDir: {}
      - name: overlay
        configMap:
          name: hypershift-operator-resources
      restartPolicy: Never
      serviceAccountName: hypershift-installer
