apiVersion: v1
version: 0.1.0
description: A Helm chart to manage Hypershift Operator and dependencies for ARO HCP
name: aro-hcp-hypershift-operator
image: "{{ .acr.svc.name }}.{{ .acrDNSSuffix }}/{{ .hypershift.image.repository }}"
imageDigest: "{{ .hypershift.image.digest }}"
registryOverrides: "quay.io/openshift-release-dev/ocp-v4.0-art-dev={{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/openshift-release-dev/ocp-v4.0-art-dev,quay.io/openshift-release-dev/ocp-v5.0-art-dev={{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/openshift-release-dev/ocp-v5.0-art-dev,quay.io/openshift-release-dev/ocp-release={{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/openshift-release-dev/ocp-release,quay.io/openshift-release-dev/ocp-release-nightly={{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/openshift-release-dev/ocp-release-nightly,registry.redhat.io/redhat={{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/redhat,quay.io/redhat-user-workloads/crt-redhat-acm-tenant={{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/quay-cache/redhat-user-workloads/crt-redhat-acm-tenant"
azureKeyVaultClientId: "__csiSecretStoreClientId__"
additionalArgs: "{{ .hypershift.additionalInstallArg }}"
operatorEnvVars:
  sharedIngressIPTag: "{{ .hypershift.sharedIngressIPTag }}"
  sharedIngressImage: "{{ .acr.ocp.name }}.{{ .acrDNSSuffix }}/{{ .hypershift.sharedIngressImage.repository }}@{{ .hypershift.sharedIngressImage.digest }}"
limitClusterSizes: {{ .hypershift.limitClusterSizes }}
additionalMinimalResourceRequests:{{ if not .hypershift.additionalMinimalResourceRequests }} {}{{ end }}
{{- range $name, $request := .hypershift.additionalMinimalResourceRequests }}
  {{ $name }}:
    deploymentName: {{ printf "%q" $request.deploymentName }}
    containerName: {{ printf "%q" $request.containerName }}
    {{- if index $request "cpu" }}
    cpu: {{ printf "%q" $request.cpu }}
    {{- end }}
    {{- if index $request "memory" }}
    memory: {{ printf "%q" $request.memory }}
    {{- end }}
{{- end }}
operatorResources:
  requests:
    cpu: "{{ .hypershift.operatorResources.requests.cpu }}"
    memory: "{{ .hypershift.operatorResources.requests.memory }}"
installJobImage: "{{ .aksCommandRuntime.image.registry }}/{{ .aksCommandRuntime.image.repository }}@{{ .aksCommandRuntime.image.digest }}"
metricsSet:
  performanceMetrics: {{ .hypershift.metricsSet.performanceMetrics }}
