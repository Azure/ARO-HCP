$schema: config-dev-ci.schema.json
#
# Usage (from repo root):
#   PROJECT_ROOT_DIR="$(pwd)" && \
#   ./tooling/templatize/templatize-$(uname -m) pipeline run \
#     --config-file="${PROJECT_ROOT_DIR}/config/config-dev-ci.yaml" \
#     --topology-file="${PROJECT_ROOT_DIR}/topology-dev-ci.yaml" \
#     --dev-settings-file="${PROJECT_ROOT_DIR}/tooling/templatize/settings.yaml" \
#     --dev-environment dev-ci \
#     --service-group Microsoft.Azure.ARO.HCP.DevCI.Unprivileged
#
# Prerequisites for manual deployment:
#   - Build templatize: make templatize
#   - Azure login: az login

clouds:
  dev:
    defaults:
      environmentName: "{{ .ctx.environment }}"
      region: "{{ .ctx.region }}"
      svc:
        rg: "opstool-{{ .ctx.region }}"
        subscription:
          key: "ARO Hosted Control Planes (EA Subscription 1)"
        acr:
          name: "arohcpsvcdev"
          resourceGroup: "global"
      monitoring:
        alertRuleOwningTeamTag: ""
      global:
        rg: "global"
        subscription:
          key: "ARO Hosted Control Planes (EA Subscription 1)"
        globalMSIName: "global-rollout-identity"
      dns:
        regionalSubdomain: "{{ .ctx.regionShort }}"
      entraAppOwnerIds: "e4022ba9-7428-4de4-9afa-f40c521c1a33,cc1cceaf-e7fa-4cbb-9379-f6fbd70c9cf1,28c69853-0f40-49de-ad85-b9de0165e5b6,c1824db4-7152-429b-a58a-2170eaa74a53,772a02e3-1df6-48dd-86ab-dfe98438ab1e,9ff7a250-d897-41ee-982e-dc4ec28c4920,1daf5200-78ea-454d-84a1-a15f98876f5d,2a42baa4-f7b2-4856-8bc7-67fe5327cae7,55236c0a-cada-46da-8985-8282535f77ac,48522ac4-74b2-426d-b56c-4a4abca49d12,770ce6b0-5afe-472d-ac0d-1fae72acc4e4,d2f4cb88-b929-4f6c-8944-221108a41f57,f5b85e91-2303-4094-9cd1-73dab9585935,16ea1e12-7ef3-4613-bea4-3d4a20cbc38c,71185b05-072a-4683-ab19-0fb016b58101" # aro-hcp-owners members
      opstool:
        aks:
          name: "opstool-{{ .ctx.regionShort }}"
          tags: "clusterType=opstool-cluster,persist=true"
          vnetAddressPrefix: "10.0.0.0/16"
          subnetPrefix: "10.0.1.0/24"
          podSubnetPrefix: "10.0.2.0/24"
          kubernetesVersion: "1.35"
          networkDataplane: "cilium"
          networkPolicy: "cilium"
          upgradeSettings:
            maxSurge: "10%"
            maxUnavailable: "0"
          clusterOutboundIPAddressIPTags: ""
          etcd:
            name: "opstool-etcd-{{ .ctx.regionShort }}"
            tagKey: "aroHCPPurpose"
            tagValue: "opstool"
            softDelete: false
          systemAgentPool:
            minCount: 1
            maxCount: 3
            vmSize: "Standard_D4s_v3"
            osDiskSizeGB: 64
            zones: "1"
            zoneRedundantMode: "Disabled"
          userAgentPool:
            count: 1
            minCount: 1
            maxCount: 3
            vmSize: "Standard_D4s_v3"
            osDiskSizeGB: 64
            zones: "1"
            zoneRedundantMode: "Disabled"
          infraAgentPool:
            count: 1
            minCount: 1
            maxCount: 1
            vmSize: "Standard_D4s_v3"
            osDiskSizeGB: 64
            zones: "1"
            zoneRedundantMode: "Disabled"
        istio:
          versions: "asm-1-28"
        monitoring:
          workspaceName: "opstool-monitor-{{ .ctx.regionShort }}"
        prometheus:
          kubeStateMetrics:
            image:
              registry: "mcr.microsoft.com/oss/v2"
              repository: "kubernetes/kube-state-metrics"
              digest: "sha256:4893b3f6e4d9b2d960a6afbce18ba025d47955d10d400587bf5450d5a3f9c5bc"
          prometheusOperator:
            image:
              registry: "mcr.microsoft.com/oss/v2"
              repository: "prometheus/prometheus-operator"
              sha: "024d81f047c4b57adf38bc1ed2893ec06d468caa090ac248984e5808f37e117e"
          prometheusConfigReloader:
            image:
              registry: "mcr.microsoft.com/oss/v2"
              repository: "prometheus/prometheus-config-reloader"
              sha: "d3787bb11a5dcce60a843d50e1b2ed6a6d79a8078884f87d07cbbb93c21f6a63"
          prometheusSpec:
            image:
              registry: "mcr.microsoft.com/oss/v2"
              repository: "prometheus/prometheus"
              sha: "70296b2f2cc69c88d070fe8b627d347bd070e084c14babbc93e91583e03eca06"
        keyVault:
          name: "opstool-kv-{{ .ctx.regionShort }}"
        gateway:
          enabled: true
          name: "opstool-gateway"
          namespace: "aks-istio-ingress"
          sectionName: "tools-https"
          wildcardHostname: "*.tools.hcpsvc.osadev.cloud"
          credentialName: "tools-ingress-credential"
          publicIpName: "opstool-gateway-{{ .ctx.regionShort }}"
          publicIpResourceGroup: "opstool-{{ .ctx.region }}"
          dns:
            parentZoneName: "hcpsvc.osadev.cloud"
            parentZoneResourceGroup: "global"
            childZoneSubdomain: "tools"
            recordName: "*"
        certManager:
          namespace: "cert-manager"
          clusterIssuer:
            name: "letsencrypt-dns01"
            email: "aro-hcp-service-lifecycle-team@redhat.com"
            privateKeySecretName: "letsencrypt-dns01-account-key"
            server: "https://acme-v02.api.letsencrypt.org/directory"
            azureDNS:
              environment: "AzurePublicCloud"
        cihealth:
          image:
            registry: "quay.io"
            repository: "roivaz/cihealth"
            digest: sha256:d6be00b644b6b69bd412fc475629905ab5225e2de2ffbdfda66850f4bb9d53d0 # d07a0f1 (2026-08-05 13:40)
          disableRuntimeWorkloads: false
          app:
            replicas: 2
          postgres:
            usernameKeyVaultSecretName: "cihealth-postgres-username"
            passwordKeyVaultSecretName: "cihealth-postgres-password"
            databaseKeyVaultSecretName: "cihealth-postgres-database"
          httpRoute:
            enabled: true
            host: "cihealth.tools.hcpsvc.osadev.cloud"
            gatewayName: "opstool-gateway"
            gatewayNamespace: "aks-istio-ingress"
            sectionName: "tools-https"
            blockReviewPath: true
        batchAnalysis:
          storageAccount:
            name: "arohcpdevcibatch{{ .ctx.regionShort }}"
            location: "{{ .ctx.region }}"
            containerName: "analyses"
          chaiBot:
            # app registration associated with chai-bot (same principal used as
            # the shared Kusto viewerIdentity)
            principalId: "5990dc26-1b73-4547-9bba-9a5bd64a0165"
        alerting:
          email: "aro-hcp-service-lifecycle-team@redhat.com"
          enabled: true
        tenantQuota:
          image:
            registry: "arohcpsvcdev.azurecr.io"
            repository: "tenant-quota-collector"
            digest: sha256:32c9a228ae21260bc4b25760793d93dafc0da93dc4014e5b32cd73eca32b7082 # 2d7a67b6fb974eddf922120679dabe397f292db8 (2026-08-26 21:51)
          prow:
            enabled: true
            baseURL: "https://prow.ci.openshift.org"
            interval: "5m"
            retention: "24h"
            repository:
              org: "Azure"
              name: "ARO-HCP"
            excludeJobs: []
          tenants:
          - tenantId: "64dc69e4-d083-49fc-9569-ebece1dd1408"
            tenantName: "RedHat0"
            servicePrincipalClientId: "1ef710d1-afd7-4bf3-8095-e8126650607f"
            keyVaultSecretName: "custom-metrics-collector-redhat0-client-secret"
            directoryQuota: true
            subscriptions:
            - name: "ARO Hosted Control Planes (EA Subscription 1)"
              regions:
              - westus3
              - centralus
              - canadacentral
            - name: "ARO HCP E2E Hosted Clusters (EA Subscription)"
              regions:
              - westus3
              - centralus
              - canadacentral
            - name: "ARO HCP E2E Hosted Clusters 2 (EA Subscription)"
              regions:
              - westus3
              - centralus
              - canadacentral
            - name: "ARO HCP E2E Hosted Clusters - Dev - 02"
              regions:
              - westus3
              - centralus
              - canadacentral
            - name: "ARO HCP E2E Hosted Clusters - Dev - 03"
              regions:
              - westus3
              - centralus
              - canadacentral
            - name: "ARO HCP E2E Infrastructure (EA Subscription)"
              regions:
              - westus3
              - centralus
              - canadacentral
            - name: "ARO SRE Team - INT (EA Subscription 3)"
              regions:
              - uksouth
            - name: "ARO HCP E2E Hosted Clusters - Stage - 00"
              regions:
              - uksouth
            - name: "ARO HCP E2E Hosted Clusters - Prod - 00"
              regions:
              - uksouth
            - name: "ARO HCP E2E Hosted Clusters - Prod - 01"
              regions:
              - uksouth
          # Test Test Azure Red Hat OpenShift (Microsoft E2E tenant); directory quota off — subscription ARM only.
          - tenantId: "93b21e64-4824-439a-b893-46c9b2a51082"
            tenantName: "TestTestARO"
            servicePrincipalClientId: "e46ecbd4-9ef3-439e-a28a-74a4d8270349"
            keyVaultSecretName: "custom-metrics-collector-test-test-azure-arohcp-client-secret"
            directoryQuota: false
            subscriptions:
            - name: "ARO HCP E2E"
              regions:
              - eastus2euap
              - uksouth
              - switzerlandnorth
              - canadacentral
              - australiaeast
              - westeurope
              - centralindia
              - brazilsouth
              - eastus2
      ci:
        dev:
          bot:
            applicationName: "OpenShift Release Bot"
          e2eSubscriptions:
          - name: "ARO HCP E2E Hosted Clusters (EA Subscription)"
            id: "974ebd46-8ad3-41e3-afef-7ef25fd5c371"
          - name: "ARO HCP E2E Hosted Clusters 2 (EA Subscription)"
            id: "e8c5a115-842d-4d7e-98ad-cfb2c50b209e"
          - name: "ARO HCP E2E Hosted Clusters - Dev - 02"
            id: "e627aa70-36a3-40b0-8e68-975269e39d7b"
          - name: "ARO HCP E2E Hosted Clusters - Dev - 03"
            id: "6ed122d1-7e03-4a01-baae-9020abf350d4"
          infrastructureSubscriptions:
          - name: "ARO Hosted Control Planes (EA Subscription 1)"
            id: "1d3378d3-5a3f-4712-85a1-2485495dfc4b"
            isGlobalSubscription: true
          - name: "ARO HCP E2E Infrastructure (EA Subscription)"
            id: "0ef1ad54-9296-44cd-9600-5dc8e9a74034"
          mockIdentities:
            vaultUrl: "https://aro-hcp-dev-svc-kv.vault.azure.net"
            firstParty:
              applicationName: "aro-dev-first-party2"
              certName: "firstPartyCert2"
              certDns: "firstparty.hcp.osadev.cloud"
            armHelper:
              applicationName: "aro-dev-arm-helper2"
              certName: "armHelperCert2"
              certDns: "armhelper.hcp.osadev.cloud"
            armHelperPool:
              appBaseName: "aro-dev-arm-helper-pool"
              certBaseName: "armHelperPoolCert"
              certBaseDns: "armhelperpool.hcp.osadev.cloud"
              size: 50
            msiMock:
              applicationName: "aro-dev-msi-mock2"
              certName: "msiMockCert2"
              certDns: "msimock.hcp.osadev.cloud"
            pool:
              appBaseName: "aro-dev-msi-mock-pool"
              certBaseName: "msiMockPoolCert"
              certBaseDns: "msimockpool.hcp.osadev.cloud"
              size: 50
        int:
          bot:
            applicationName: "OpenShift Release Bot - INT"
          e2eSubscriptions:
          - name: "ARO SRE Team - INT (EA Subscription 3)"
            id: "64f0619f-ebc2-4156-9d91-c4c781de7e54"
          mockIdentities:
            vaultUrl: "https://aro-hcp-int-kv.vault.azure.net"
            firstParty:
              applicationName: "aro-hcp-int-fp"
              certName: "intFirstPartyCert"
              certDns: "intfirstparty.hcp.osadev.cloud"
            armHelper:
              applicationName: "aro-hcp-int-arm-helper"
              certName: "intArmHelperCert"
              certDns: "intarmhelper.hcp.osadev.cloud"
            clustersServiceArmHelper:
              applicationName: "aro-hcp-int-cs-arm-helper"
              certName: "intCsArmHelperCert"
              certDns: "intcsarmhelper.hcp.osadev.cloud"
            msiMock:
              applicationName: "aro-hcp-int-msi-mock"
              certName: "intMsiMockCert"
              certDns: "intmsimock.hcp.osadev.cloud"
            pool:
              appBaseName: "aro-hcp-int-msi-mock-pool"
              certBaseName: "intMsiMockPoolCert"
              certBaseDns: "intmsimockpool.hcp.osadev.cloud"
              size: 0
        stg:
          bot:
            applicationName: "OpenShift Release Bot - STG"
          e2eSubscriptions:
          - name: "ARO HCP E2E Hosted Clusters - Stage - 00"
            id: "dee2f1be-a999-4e19-b027-221e7adaf7d3"
        prod:
          bot:
            applicationName: "OpenShift Release Bot - Prod"
          e2eSubscriptions:
          - name: "ARO HCP E2E Hosted Clusters - Prod - 00"
            id: "8d696692-794f-4cdb-ba25-9250c9e9ec4c"
          - name: "ARO HCP E2E Hosted Clusters - Prod - 01"
            id: "ec435068-e722-475f-8504-c91b72a5dc51"
    environments:
      dev-ci:
        regions:
          westus3: {}
