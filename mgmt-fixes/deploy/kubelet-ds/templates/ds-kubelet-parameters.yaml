{{ if .Values.enabled }}
# Alter kubelet config for better stability at higher scales
# Ref: https://issues.redhat.com/browse/ARO-13357
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    component: kubelet-parameters
  name: set-kubelet-parameters-for-scale
  namespace: kube-system
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      component: kubelet-parameters
      tier: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      creationTimestamp: null
      labels:
        component: kubelet-parameters
        tier: node
    spec:
      nodeSelector:
        aro-hcp.azure.com/role: worker
      containers:
      # The host root filesystem is mounted at /host and we chroot into it, so
      # every binary the script below uses (sh, sed, grep, systemctl) comes from
      # the node, not from the container image. The image only has to provide
      # chroot itself, which keeps us free to use a pinned MCR image.
      - command:
        - /usr/sbin/chroot
        - /host
        - sh
        - -c
        - |
          if cat /etc/default/kubelet | grep -q '\-\-system-reserved=cpu=3000m,memory=7550Mi,pid=1000';then
             echo "kube-reserved parameter already updated to system-reserved in kubelet configuration"
          else
             sed -i -E 's/--kube-reserved=[^ ]+/--system-reserved=cpu=3000m,memory=7550Mi,pid=1000/g' /etc/default/kubelet
             systemctl daemon-reload
             systemctl restart kubelet
             echo "kube-reserved parameter has been updated to system-reserved in kubelet configuration"
          fi
          if grep -q '\-\-collector.netclass.netlink' /usr/local/bin/node-exporter-startup.sh;then
             echo "collector.netclass.netlink parameter already updated in node-exporter configuration"
          else
             sed -i 's/--no-collector.arp.netlink/--no-collector.arp.netlink --collector.netclass.netlink/g' /usr/local/bin/node-exporter-startup.sh
             systemctl daemon-reload
             systemctl restart node-exporter
             echo "collector.netclass.netlink parameter has been updated in node-exporter configuration"
          fi
          sleep infinity
        image: "{{ .Values.kubeletParametersImage }}"
        imagePullPolicy: IfNotPresent
        name: kubelet-parameters
        resources:
          requests:
            cpu: 10m
        securityContext:
          privileged: true
          # chroot(2) and writing the node's systemd/kubelet config require uid 0;
          # set it explicitly so an image whose USER is non-root cannot break this.
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /host
          name: host-root
      dnsPolicy: ClusterFirst
      # Kept so systemd can resolve the caller's pid over its private socket
      # when the chrooted script runs systemctl.
      hostPID: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - hostPath:
          path: /
          type: Directory
        name: host-root
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
{{ end }}