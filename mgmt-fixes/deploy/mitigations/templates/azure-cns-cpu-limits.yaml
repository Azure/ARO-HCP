{{- if .Values.azureCnsCpuLimits.enabled }}
# Increase CPU requests and limits for the azure-cns DaemonSet to reduce DHCP
# timeout failures during HCP cluster creation.  At default limits (100m/500m),
# azure-cns is throttled at ~37% on CI management clusters, causing DHCP
# Discover packets to time out and blocking cluster-network bring-up.
# Ref: https://issues.redhat.com/browse/AROSLSRE-1956
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-cns-cpu-patcher
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azure-cns-cpu-patcher-role
  namespace: kube-system
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets
  resourceNames:
  - azure-cns
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azure-cns-cpu-patcher-binding
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: azure-cns-cpu-patcher-role
subjects:
- kind: ServiceAccount
  name: azure-cns-cpu-patcher
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: azure-cns-cpu-limits-patch
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: patcher
        image: "{{ .Values.jobImage }}"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        command:
        - /bin/sh
        - -c
        - |
          DESIRED_REQ="{{ .Values.azureCnsCpuLimits.cpuRequest }}"
          DESIRED_LIM="{{ .Values.azureCnsCpuLimits.cpuLimit }}"

          if ! kubectl get daemonset azure-cns -n kube-system > /dev/null 2>&1; then
            echo "azure-cns DaemonSet not found in kube-system, skipping patch"
            exit 0
          fi

          CURRENT_REQ=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="azure-cns")].resources.requests.cpu}')
          CURRENT_LIM=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="azure-cns")].resources.limits.cpu}')

          if [ "$CURRENT_REQ" = "$DESIRED_REQ" ] && [ "$CURRENT_LIM" = "$DESIRED_LIM" ]; then
            echo "azure-cns CPU resources already at desired values (request=$DESIRED_REQ limit=$DESIRED_LIM), skipping patch"
            exit 0
          fi

          echo "Patching azure-cns CPU: request $CURRENT_REQ->$DESIRED_REQ, limit $CURRENT_LIM->$DESIRED_LIM"
          kubectl patch daemonset azure-cns -n kube-system --type=strategic -p="{
            \"spec\": {
              \"template\": {
                \"spec\": {
                  \"containers\": [{
                    \"name\": \"azure-cns\",
                    \"resources\": {
                      \"requests\": {\"cpu\": \"$DESIRED_REQ\"},
                      \"limits\": {\"cpu\": \"$DESIRED_LIM\"}
                    }
                  }]
                }
              }
            }
          }"
          echo "Patch applied successfully"
      restartPolicy: OnFailure
      serviceAccountName: azure-cns-cpu-patcher
{{- end }}
