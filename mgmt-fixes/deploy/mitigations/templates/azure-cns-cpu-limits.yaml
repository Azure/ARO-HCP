{{- if .Values.azureCnsCpuLimits.enabled }}
# Remove the CPU limit from the azure-cns DaemonSet to eliminate DHCP timeout
# failures during HCP cluster creation. AKS sets a default CPU limit of 500m;
# at that ceiling azure-cns is throttled at ~37% on CI management clusters,
# causing DHCP Discover packets to time out and blocking cluster-network bring-up.
# The CPU request is retained for scheduling. No limit means the kernel will not
# throttle the container.
# Ref: https://issues.redhat.com/browse/AROSLSRE-1956
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-cns-cpu-patcher
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azure-cns-cpu-patcher-role
  namespace: kube-system
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets
  resourceNames:
  - azure-cns
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azure-cns-cpu-patcher-binding
  namespace: kube-system
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: azure-cns-cpu-patcher-role
subjects:
- kind: ServiceAccount
  name: azure-cns-cpu-patcher
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: azure-cns-cpu-limits-patch
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    spec:
      containers:
      - name: patcher
        image: "{{ .Values.jobImage }}"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        command:
        - /bin/sh
        - -c
        - |
          trap 'echo "ERROR: script failed at line $LINENO with exit code $?"' ERR
          set -e

          echo "=== azure-cns CPU limits patcher ==="
          echo "Desired CPU request={{ .Values.azureCnsCpuLimits.cpuRequest }}, limit=<none (removing)"
          echo "ServiceAccount: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)/azure-cns-cpu-patcher"

          DESIRED_REQ="{{ .Values.azureCnsCpuLimits.cpuRequest }}"

          echo "Checking if azure-cns DaemonSet exists in kube-system..."
          DS_NAME=$(kubectl get daemonset azure-cns -n kube-system --ignore-not-found -o name)
          if [ -z "$DS_NAME" ]; then
            echo "azure-cns DaemonSet not found in kube-system, skipping patch"
            exit 0
          fi
          echo "azure-cns DaemonSet found"

          echo "Reading current CPU resource values..."
          CURRENT_REQ=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="azure-cns")].resources.requests.cpu}')
          CURRENT_LIM=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="azure-cns")].resources.limits.cpu}')
          echo "Current CPU: request=$CURRENT_REQ, limit=$CURRENT_LIM"

          if [ "$CURRENT_REQ" = "$DESIRED_REQ" ] && [ -z "$CURRENT_LIM" ]; then
            echo "azure-cns CPU already at desired request with no limit, skipping patch"
            exit 0
          fi

          echo "Patching azure-cns CPU: request $CURRENT_REQ->$DESIRED_REQ, removing limit"
          kubectl patch daemonset azure-cns -n kube-system --type=json -p='[
            {"op": "replace", "path": "/spec/template/spec/containers/0/resources/requests/cpu", "value": "'"$DESIRED_REQ"'"},
            {"op": "remove", "path": "/spec/template/spec/containers/0/resources/limits/cpu"}
          ]'
          echo "Patch applied successfully"
      restartPolicy: OnFailure
      serviceAccountName: azure-cns-cpu-patcher
{{- end }}
