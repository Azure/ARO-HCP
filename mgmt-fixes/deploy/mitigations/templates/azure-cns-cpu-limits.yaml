{{- if .Values.azureCnsCpuLimits.enabled }}
# Remove the CPU limit from the azure-cns DaemonSet to eliminate DHCP timeout
# failures during HCP cluster creation. AKS sets a default CPU limit of 500m;
# at that ceiling azure-cns is throttled at ~37% on CI management clusters,
# causing DHCP Discover packets to time out and blocking cluster-network bring-up.
# The CPU request is retained for scheduling. No limit means the kernel will not
# throttle the container.
# Ref: https://issues.redhat.com/browse/AROSLSRE-1956
#
# The ServiceAccount/Role/RoleBinding are regular release-owned resources (not
# hooks) so Helm prunes them if the mitigation is later disabled; the Job runs
# as a post-install/post-upgrade hook, which executes after regular resources
# are applied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-cns-cpu-patcher
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azure-cns-cpu-patcher-role
  namespace: kube-system
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets
  resourceNames:
  - azure-cns
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azure-cns-cpu-patcher-binding
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: azure-cns-cpu-patcher-role
subjects:
- kind: ServiceAccount
  name: azure-cns-cpu-patcher
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: azure-cns-cpu-limits-patch
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    spec:
      containers:
      - name: patcher
        image: "{{ .Values.jobImage }}"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        # /bin/bash: the ERR trap and $LINENO are not POSIX; the
        # aks/command/runtime image ships bash (velero's install job
        # already relies on it).
        command:
        - /bin/bash
        - -c
        - |
          trap 'echo "ERROR: script failed at line $LINENO with exit code $?" >&2' ERR
          set -e

          echo "=== azure-cns CPU limits patcher ==="
          echo "Desired CPU request={{ .Values.azureCnsCpuLimits.cpuRequest }}, limit=<none (removing)"

          DESIRED_REQ="{{ .Values.azureCnsCpuLimits.cpuRequest }}"

          # Wait for the AKS-managed DaemonSet to appear: the hook can run
          # before the CNI is fully installed during cluster bring-up. Fail
          # loudly (the Job retries, and Helm reports the failure) rather
          # than silently skipping the mitigation.
          echo "Waiting for azure-cns DaemonSet to appear in kube-system (up to 5m)..."
          WAITED=0
          until kubectl get daemonset azure-cns -n kube-system --ignore-not-found -o name | grep -q .; do
            if [ "$WAITED" -ge 300 ]; then
              echo "ERROR: azure-cns DaemonSet did not appear in kube-system within 5m" >&2
              exit 1
            fi
            sleep 10
            WAITED=$((WAITED + 10))
          done
          echo "azure-cns DaemonSet found (waited ${WAITED}s)"

          # Resolve the azure-cns container index by name so the JSON patch
          # targets the right container even if AKS adds or reorders
          # sidecars.
          echo "Resolving azure-cns container index..."
          CNS_INDEX=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{"\n"}{end}' \
            | awk '$0 == "azure-cns" {print NR - 1}')
          if [ -z "$CNS_INDEX" ]; then
            echo "ERROR: container 'azure-cns' not found in the DaemonSet spec" >&2
            exit 1
          fi
          echo "azure-cns container index: $CNS_INDEX"

          echo "Reading current CPU resource values..."
          CURRENT_REQ=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{.spec.template.spec.containers['"$CNS_INDEX"'].resources.requests.cpu}')
          CURRENT_LIM=$(kubectl get daemonset azure-cns -n kube-system \
            -o jsonpath='{.spec.template.spec.containers['"$CNS_INDEX"'].resources.limits.cpu}')
          echo "Current CPU: request=$CURRENT_REQ, limit=$CURRENT_LIM"

          if [ "$CURRENT_REQ" = "$DESIRED_REQ" ] && [ -z "$CURRENT_LIM" ]; then
            echo "azure-cns CPU already at desired request with no limit, skipping patch"
            exit 0
          fi

          PATCH='[{"op": "replace", "path": "/spec/template/spec/containers/'"$CNS_INDEX"'/resources/requests/cpu", "value": "'"$DESIRED_REQ"'"}]'
          if [ -n "$CURRENT_LIM" ]; then
            PATCH='[{"op": "replace", "path": "/spec/template/spec/containers/'"$CNS_INDEX"'/resources/requests/cpu", "value": "'"$DESIRED_REQ"'"},{"op": "remove", "path": "/spec/template/spec/containers/'"$CNS_INDEX"'/resources/limits/cpu"}]'
          fi

          echo "Patching azure-cns CPU: request $CURRENT_REQ->$DESIRED_REQ, limit=${CURRENT_LIM:-(none)}->removed"
          kubectl patch daemonset azure-cns -n kube-system --type=json -p="$PATCH"
          echo "Patch applied successfully"

          # Wait for the patched DaemonSet rollout so CI does not begin
          # creating clusters while throttled azure-cns pods are still
          # running.
          echo "Waiting for azure-cns DaemonSet rollout to complete (up to 7m)..."
          kubectl rollout status daemonset/azure-cns -n kube-system --timeout=420s
          echo "azure-cns rollout complete"
      restartPolicy: OnFailure
      serviceAccountName: azure-cns-cpu-patcher
{{- end }}
