jobImage: ""
azureCnsCpuLimits:
  enabled: false
  # AKS sets a default CPU limit of 40m on the azure-cns DaemonSet's
  # cns-container (observed on k8s 1.35 CI management clusters); at that
  # ceiling the container is throttled on CI management clusters, causing
  # DHCP Discover timeouts during cluster network bring-up. We raise the
  # request for scheduling headroom and remove the limit entirely so the
  # kernel does not throttle the container. Ref: AROSLSRE-1956
  cpuRequest: "500m"
