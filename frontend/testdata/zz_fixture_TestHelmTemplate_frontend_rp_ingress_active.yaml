# Source: frontend/templates/rp-ingress-readiness.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: rp-ingress-check
  namespace: 'aro-hcp'
data:
  check.sh: |
    #!/bin/sh
    set -eu
    kctl() { kubectl --request-timeout=15s --cache-dir=/tmp/kubectl "$@"; }
    kctl -n aks-istio-ingress wait gateways.gateway.networking.k8s.io/rp-ingress-gateway --for=condition=Programmed --timeout=180s
    kctl -n aks-istio-ingress rollout status deployment/rp-ingress-gateway-istio --timeout=180s
    [ "$(kctl -n aks-istio-ingress get service/rp-ingress-gateway-istio -o jsonpath='{.spec.type}')" = LoadBalancer ] || { echo 'RP ingress is not a LoadBalancer Service' >&2; exit 1; }
    [ -n "$(kctl -n aks-istio-ingress get service/rp-ingress-gateway-istio -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" ] || { echo 'RP ingress has no load-balancer IP' >&2; exit 1; }

    # Do not accept conditions from an older HTTPRoute generation.
    attempt=0
    while [ "$attempt" -lt 60 ]; do
      status=$(kctl -n "$FRONTEND_NAMESPACE" get httproute/frontend-gateway-api -o jsonpath='{.metadata.generation}{" "}{.status.parents[0].conditions[?(@.type=="Accepted")].status}{" "}{.status.parents[0].conditions[?(@.type=="Accepted")].observedGeneration}{" "}{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}{" "}{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].observedGeneration}')
      set -- $status
      if [ "$#" -eq 5 ] && [ "$2" = True ] && [ "$4" = True ] && [ "$3" -ge "$1" ] && [ "$5" -ge "$1" ]; then
        break
      fi
      attempt=$((attempt + 1))
      sleep 2
    done
    [ "$attempt" -lt 60 ] || { echo 'RP HTTPRoute did not converge; DNS must not change' >&2; exit 1; }

    attempt=0
    while [ "$attempt" -lt 60 ]; do
      nodes=$(kctl -n aks-istio-ingress get endpointslices -l kubernetes.io/service-name=rp-ingress-gateway-istio -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.nodeName}{"\n"}{end}' | sort -u | sed '/^$/d')
      count=$(printf '%s\n' "$nodes" | grep -c . || true)
      if [ "$count" -ge 2 ]; then
        echo 'RP ingress has Ready endpoints on at least two nodes; DNS cutover may proceed'
        exit 0
      fi
      attempt=$((attempt + 1))
      sleep 2
    done
    echo 'RP ingress lacks Ready endpoints on two nodes; DNS must not change' >&2
    exit 1
