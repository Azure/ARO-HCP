apiVersion: v1
kind: ConfigMap
metadata:
  name: rp-ingress-options
  namespace: aks-istio-ingress
data:
  service: |
    spec:
      type: LoadBalancer
  deployment: |
    spec:
      template:
        spec:
          topologySpreadConstraints:
          - maxSkew: 1
            minDomains: 2
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: rp-ingress-gateway
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: rp-ingress-gateway
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 5
  podDisruptionBudget: |
    spec:
      minAvailable: 1
