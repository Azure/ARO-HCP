apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: mise-monitoring-rules
  namespace: monitoring
spec:
  groups:
  - name: mise
    labels:
      component: frontend
    rules:
    - alert: MiseEnvoyScrapeDown
      # Inventory remains present even when all cluster telemetry disappears.
      expr: |
        group by (cluster) (underlay_clusters{cluster=~".*-svc(-[0-9]+)?$"})
        unless on(cluster)
        group by (cluster) (kube_pod_status_ready{namespace="mise", pod=~"mise-.*", condition="true"} == 1)
      for: 5m
      labels:
        severity: info
      annotations:
        summary: "Mise pod not ready for namespace=mise"
        description: "No mise pod is Ready in namespace mise on this svc cluster, so the envoy-stats scrape target is unavailable."
        runbook_url: 'https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/mise-tsg.html'
