rule_files:
- mise-prometheusRule.yaml
evaluation_interval: 1s
tests:
# Declared service cluster without pod telemetry fires even without KSM telemetry.
- interval: 1s
  input_series:
  - series: 'underlay_clusters{cluster="test-svc-1", source="bicep"}'
    values: '1x600'
  alert_rule_test:
  - eval_time: 301s # alert should fire after 5m
    alertname: MiseEnvoyScrapeDown
    exp_alerts:
    - exp_labels:
        alertname: MiseEnvoyScrapeDown
        cluster: test-svc-1
        component: frontend
        severity: info
      exp_annotations:
        summary: "Mise pod not ready for namespace=mise"
        description: "No mise pod is Ready in namespace mise on this svc cluster, so the envoy-stats scrape target is unavailable."
        runbook_url: 'https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/mise-tsg.html'
# Ready mise pod suppresses the alert.
- interval: 1s
  input_series:
  - series: 'underlay_clusters{cluster="test-svc-1", source="bicep"}'
    values: '1x600'
  - series: 'kube_pod_status_ready{namespace="mise", pod="mise-abc-123", condition="true", cluster="test-svc-1"}'
    values: '1x600'
  alert_rule_test:
  - eval_time: 600s
    alertname: MiseEnvoyScrapeDown
    exp_alerts: []
# Mise pod becomes unready for five minutes.
- interval: 1s
  input_series:
  - series: 'underlay_clusters{cluster="test-svc-2", source="bicep"}'
    values: '1x600'
  - series: 'kube_pod_status_ready{namespace="mise", pod="mise-abc-123", condition="true", cluster="test-svc-2"}'
    values: '1x100 0x500' # 100s healthy, then down
  alert_rule_test:
  - eval_time: 401s # alert should fire after 5m of metric being down
    alertname: MiseEnvoyScrapeDown
    exp_alerts:
    - exp_labels:
        alertname: MiseEnvoyScrapeDown
        cluster: test-svc-2
        component: frontend
        severity: info
      exp_annotations:
        summary: "Mise pod not ready for namespace=mise"
        description: "No mise pod is Ready in namespace mise on this svc cluster, so the envoy-stats scrape target is unavailable."
        runbook_url: 'https://eng.ms/docs/cloud-ai-platform/azure-core/azure-cloud-native-and-management-platform/control-plane-bburns/azure-red-hat-openshift/azure-redhat-openshift-team-doc/hcp/troubleshooting/mise-tsg.html'
# Management clusters do not run mise.
- interval: 1s
  input_series:
  - series: 'underlay_clusters{cluster="test-mgmt-1", source="bicep"}'
    values: '1x600'
  alert_rule_test:
  - eval_time: 600s
    alertname: MiseEnvoyScrapeDown
    exp_alerts: []
