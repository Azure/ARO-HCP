yaml-files:
- '*.yaml'
- '*.yml'
- '.yamllint'
ignore:
- 'acrpull/deploy/templates/deployment.yaml'
- 'admin/deploy/templates/ext-authz.authorizationpolicy.yaml'
- 'admin/deploy/templates/admin.deployment.yaml'
- 'frontend/deploy/templates/ext-authz.authorizationpolicy.yaml'
- 'frontend/deploy/templates/allow-ingress.authorizationpolicy.yaml'
- 'frontend/deploy/templates/frontend.deployment.yaml'
- 'istio/deploy/charts/mise/templates/deployment.yaml'
- 'istio/deploy/templates/istio-shared-configmap.yml'
- 'cluster-service/deploy/templates/cs-keyvault.secret.yaml'
- 'cluster-service/deploy/templates/deployment.yaml'
- 'cluster-service/deploy/templates/azure-operators-managed-identities-config.configmap.yaml'
- 'cluster-service/deploy/templates/database.deployment.yaml'
- 'cluster-service/deploy/templates/database.pvc.yaml'
- 'cluster-service/deploy/templates/database.service.yaml'
- 'cluster-service/cs-debug-jobs/deploy/templates/configmap.yaml'
- 'cluster-service/cs-debug-jobs/deploy/templates/istio.yaml'
- 'cluster-service/cs-debug-jobs/deploy/templates/serviceaccount.yaml'
- 'cluster-service/cs-debug-jobs/deploy/templates/shell-script-executor.yaml'
- 'observability/prometheus/deploy/templates/prometheus.yaml'
# OSS-collector templates gated on monitoringApiGroup; the leading {{- if }}
# makes them unparseable as plain YAML.
- 'observability/prometheus/deploy/templates/prometheus.serviceaccount.yaml'
- 'observability/prometheus/deploy/templates/prometheus.clusterrole.yaml'
- 'observability/prometheus/deploy/templates/prometheus.clusterrolebinding.yaml'
- 'observability/prometheus/deploy/templates/prometheus.podmonitor.yaml'
# AMA-mode templates gated on monitoringApiGroup; the leading {{- if }} makes them
# unparseable as plain YAML.
- 'observability/prometheus/deploy/templates/kube-state-metrics.azmonitoring.servicemonitor.yaml'
- 'observability/prometheus/deploy/templates/ama-metrics-configmap-reader.yaml'
- 'secret-sync-controller/deploy/templates/*.yaml'
- 'observability/arobit/deploy/templates/forwarder-clusterrolebinding.yaml'
- 'observability/arobit/deploy/templates/forwarder-clusterrole.yaml'
- 'observability/arobit/deploy/templates/forwarder-daemonset.yaml'
- 'observability/arobit/deploy/templates/forwarder-exporter-configmap.yaml'
- 'observability/arobit/deploy/templates/forwarder-configmap.yaml'
- 'observability/arobit/deploy/templates/forwarder-service.yaml'
- 'observability/arobit/deploy/templates/forwarder-watchdog-rbac.yaml'
- 'observability/arobit/deploy/templates/serviceaccount.yaml'
- 'observability/arobit/deploy/templates/forwarder-secretprovider.yaml'
- 'observability/kube-events/deploy/templates/deployment.yaml'
- 'mgmt-agent/deploy/templates/deployment.yaml'
- 'mgmt-agent/deploy/templates/node-health-config.yaml'
- 'swift-recorder/deploy/templates/daemonset.yaml'
- 'swift-recorder/deploy/templates/metrics.yaml'
- 'swift-recorder/deploy/templates/rbac.yaml'
- 'swift-recorder/values.yaml'
- 'mgmt-fixes/deploy/kubelet-ds/templates/ds-kubelet-parameters.yaml'
- 'sessiongate/deploy/templates/deployment.yaml'
- 'sessiongate/deploy/templates/ext-authz.authorizationpolicy.yaml'
- '**/zz_fixture_TestHelmTemplate*.yaml'
- 'velero/deploy/templates/install-job.yaml'
- 'velero/deploy/templates/volumesnapshotclass.yaml'
- 'maestro/server/deploy/templates/maestro.deployment.yaml'
- 'maestro/server/deploy/templates/maestro.pdb.yaml'
- 'maestro/server/deploy/templates/allow-cluster-service.authorizationpolicy.yaml'
- 'maestro/server/deploy/templates/allow-backend.authorizationpolicy.yaml'
- 'maestro/server/deploy/templates/allow-fleet-controller.authorizationpolicy.yaml'
- 'backend/deploy/templates/backend.service-key-vault.secretproviderclass.yaml'
- 'backend/deploy/templates/backend.deployment.yaml'
- 'dev-infrastructure/dev-ci/cihealth/deploy/templates/*.yaml'
- 'dev-infrastructure/dev-ci/gateway/deploy/templates/gateway.yaml'
- 'tooling/aro-hcp-exporter/deploy/templates/deployment.yaml'
- 'fleet/registration/deploy/templates/registration.job.yaml'
- 'kube-applier/deploy/templates/deployment.yaml'
- 'image-registry-policy/deploy/templates/validatingadmissionpolicybinding.yaml'
- 'image-registry-policy/values.yaml'
- 'hypershiftoperator/deploy/templates/sre-metrics-set.configmap.yaml'
- 'hypershiftoperator/values.yaml'
- 'observability/arobit/values-mgmt.yaml'
- 'observability/arobit/values-svc.yaml'
- 'mgmt-agent/deploy/templates/servicemonitor.yaml'
# ServiceMonitor/PodMonitor templates whose apiVersion is derived from
# .Values.monitoringApiGroup (templated group selects OSS vs AMA collector).
- 'admin/deploy/templates/admin.servicemonitor.yaml'
- 'backend/deploy/templates/servicemonitor.yaml'
- 'cluster-service/deploy/templates/servicemonitor.yaml'
- 'fleet/deploy/templates/servicemonitor.yaml'
- 'frontend/deploy/templates/servicemonitor.yaml'
- 'istio/deploy/templates/envoy-stats.podmonitor.yml'
- 'istio/deploy/templates/istiod.servicemonitor.yml'
- 'maestro/server/deploy/templates/maestro.servicemonitor.yaml'
- 'maestro/agent/deploy/templates/maestro-agent.podmonitor.yaml'
- 'observability/arobit/deploy/templates/forwarder-servicemonitor.yaml'
- 'tooling/aro-hcp-exporter/deploy/templates/servicemonitor.yaml'
- 'acrpull/deploy/templates/podmonitor.yaml'
- 'kube-applier/deploy/templates/servicemonitor.yaml'
- 'velero/deploy/templates/node-agent-podmonitor.yaml'
- 'velero/deploy/templates/velero-podmonitor.yaml'
- 'acm/scaffold/metrics-servicemonitor.yaml'
- 'acm/deploy/helm/multicluster-engine/templates/clusterlifecycle-state-metrics-v2.servicemonitor.yaml'
rules:
  brackets: enable
  colons: enable
  commas: enable
  comments: disable
  comments-indentation: disable
  document-end: disable
  document-start: disable
  empty-lines: enable
  empty-values: disable
  hyphens: enable
  indentation: disable
  key-duplicates: enable
  key-ordering: disable
  line-length: disable
  new-line-at-end-of-file: enable
  new-lines: enable
  octal-values: disable
  quoted-strings: disable
  trailing-spaces: enable
  truthy:
    level: warning
    check-keys: false
