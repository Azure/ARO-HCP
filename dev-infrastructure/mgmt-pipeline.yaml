  - name: mitigations
    aksCluster: '{{ .mgmt.aks.name }}'
    action: Helm
    releaseName: 'mitigations'
    releaseNamespace: 'aro-hcp-mitigations'
    chartDir: ../mgmt-fixes/deploy/mitigations
    valuesFile: ../mgmt-fixes/mitigations.values.yaml
    # Bump timeout to help with scaling event related issues
    timeout: 15m
    kustoEndpoint:
      resourceGroup: kusto
      step: output
      name: kustoUri
    kustoDatabase: '{{ .kusto.serviceLogsDatabase }}'
    kustoTable: 'containerLogs'
    dependsOn:
    - resourceGroup: management
      step: upgrade-aks-cluster
    - resourceGroup: management
      step: image-registry-policy
    identityFrom:
      resourceGroup: global
      step: output
      name: globalMSIId
    automatedRetry:
      errorContainsAny:
      - "500 Internal Server Error"
      - "Internal error occurred"
      # Retry when the shell extension's backing ACI container is stuck pending
      # and never actually runs (empty log, exit code -1), a transient ACI-side
      # provisioning failure distinct from an app-level script error. Matches
      # only the "still waiting to run" detail status, not any Failed shell run.
      # See AROSLSRE-1945.
      - '"DetailStatus": "Waiting to run"'
      maximumRetryCount: 3
      durationBetweenRetries: 1m
