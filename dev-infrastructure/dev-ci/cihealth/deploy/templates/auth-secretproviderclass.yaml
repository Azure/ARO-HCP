{{- if .Values.authProxy.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "cihealth.authSecretProviderClassName" . }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "cihealth.authClientIDSecretName" . }}
      type: Opaque
      data:
        - objectName: client-id
          key: client-id
  parameters:
    clientID: '{{ if .Values.secretProvider.msiClientId }}{{ .Values.secretProvider.msiClientId }}{{ else }}{{ .Values.msiClientId }}{{ end }}'
    tenantId: "{{ .Values.secretProvider.tenantId }}"
    keyvaultName: "{{ .Values.secretProvider.keyVault }}"
    objects: |
      array:
        - |
          objectName: "{{ .Values.authProxy.keyVaultSecretNames.clientId }}"
          objectAlias: "client-id"
          objectType: secret
        - |
          objectName: "{{ .Values.authProxy.keyVaultSecretNames.clientSecret }}"
          objectAlias: "client-secret"
          objectType: secret
        - |
          objectName: "{{ .Values.authProxy.keyVaultSecretNames.cookieSecret }}"
          objectAlias: "cookie-secret"
          objectType: secret
    usePodIdentity: "false"
{{- end }}
