apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cihealth.appName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cihealth.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ ternary 0 .Values.app.replicas .Values.disableRuntimeWorkloads }}
  selector:
    matchLabels:
      {{- include "cihealth.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "cihealth.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        azure.workload.identity/use: "true"
        {{- if .Values.authProxy.enabled }}
        cihealth.azure.com/oauth-client-id-version: {{ .Values.authProxy.clientIdVersion | quote }}
        cihealth.azure.com/oauth-client-secret-version: {{ .Values.authProxy.clientSecretVersion | quote }}
        cihealth.azure.com/oauth-cookie-secret-version: {{ .Values.authProxy.cookieSecretVersion | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cihealth.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "cihealth.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export CIHEALTH_POSTGRES_USER="$(cat {{ include "cihealth.postgresUsernameFile" . }})"
              export CIHEALTH_POSTGRES_PASSWORD="$(cat {{ include "cihealth.postgresPasswordFile" . }})"
              export CIHEALTH_POSTGRES_DATABASE="$(cat {{ include "cihealth.postgresDatabaseFile" . }})"
              set -- \
                "app" \
                "--app.listen=0.0.0.0:{{ .Values.app.listenPort }}" \
                "--history.weeks={{ .Values.app.historyWeeks }}" \
                {{- if .Values.app.defaultWeek }}
                "--week={{ .Values.app.defaultWeek }}" \
                {{- end }}
                "--storage.postgres.enabled=true" \
                "--storage.postgres.embedded=false" \
                "--storage.postgres.host={{ include "cihealth.postgresName" . }}" \
                "--storage.postgres.port={{ .Values.postgres.service.port }}" \
                "--storage.postgres.user=$CIHEALTH_POSTGRES_USER" \
                "--storage.postgres.password=$CIHEALTH_POSTGRES_PASSWORD" \
                "--storage.postgres.database=$CIHEALTH_POSTGRES_DATABASE" \
                "--storage.postgres.sslmode={{ .Values.postgres.connection.sslMode }}" \
                "--storage.postgres.initialize={{ ternary "true" "false" .Values.postgres.connection.initialize }}" \
                "--storage.postgres.max-connections={{ .Values.postgres.connection.maxConnections }}" \
                "--storage.postgres.min-connections={{ .Values.postgres.connection.minConnections }}" \
                "--storage.postgres.connect-timeout-seconds={{ .Values.postgres.connection.connectTimeoutSeconds }}"
              {{- with .Values.app.extraArgs }}
              {{- range . }}
              set -- "$@" {{ . | quote }}
              {{- end }}
              {{- end }}
              exec /usr/local/bin/cihealth "$@"
          {{- with .Values.app.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.listenPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: secrets-store
              mountPath: {{ include "cihealth.secretsStoreMountPath" . | quote }}
              readOnly: true
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
        {{- if .Values.authProxy.enabled }}
        - name: auth-proxy
          image: {{ include "cihealth.authProxyImage" . | quote }}
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy | quote }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cihealth.authClientIDSecretName" . }}
                  key: client-id
          args:
            - --provider=entra-id
            - --oidc-issuer-url=https://login.microsoftonline.com/{{ .Values.authProxy.tenantId }}/v2.0
            - --client-secret-file={{ include "cihealth.authClientSecretFile" . }}
            - --redirect-url=https://{{ .Values.httpRoute.host }}/oauth2/callback
            - --upstream=http://127.0.0.1:{{ .Values.app.listenPort }}
            - --http-address=0.0.0.0:{{ .Values.authProxy.listenPort }}
            - --cookie-name=_cihealth_oauth2_proxy
            - --cookie-secret-file={{ include "cihealth.authCookieSecretFile" . }}
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --code-challenge-method=S256
            - --email-domain=*
            - --scope=openid profile
            - --oidc-email-claim=preferred_username
            - --oidc-groups-claim=groups
            - --allowed-group={{ .Values.authProxy.allowedGroupId }}
            - --reverse-proxy=true
            - --skip-provider-button=true
          ports:
            - name: auth-proxy
              containerPort: {{ .Values.authProxy.listenPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: auth-proxy
          livenessProbe:
            httpGet:
              path: /ping
              port: auth-proxy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: auth-secrets-store
              mountPath: {{ include "cihealth.authSecretsStoreMountPath" . | quote }}
              readOnly: true
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "cihealth.secretProviderClassName" . }}
        {{- if .Values.authProxy.enabled }}
        - name: auth-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "cihealth.authSecretProviderClassName" . }}
        {{- end }}
