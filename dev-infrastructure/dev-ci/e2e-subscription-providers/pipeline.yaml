$schema: "pipeline.schema.v1"
serviceGroup: Microsoft.Azure.ARO.HCP.DevCI.E2ESubscriptionProviders
rolloutName: Dev CI E2E Subscription Provider Registration Rollout
# PRIVILEGED pipeline: registers the required Azure resource providers on every
# ARO-HCP-managed E2E subscription. The provider list lives in
# config/config-dev-ci.yaml under ci.e2eSubscriptionProviders (the single
# source of truth); add new provider dependencies there, not here.
#
# Each resource group entry targets one E2E subscription. The resource group
# name is a placeholder — ProviderFeatureRegistration steps need only the
# subscription, not an existing resource group. Subscriptions are resolved from
# their display names via the Azure API using the invoking OWNERS member's CLI
# credentials (AZURE_TOKEN_CREDENTIALS=dev). Run with:
#   make dev-ci-privileged-local-run
#
# When adding a new subscription to ci.<env>.e2eSubscriptions, also add a
# corresponding resource group entry below.
resourceGroups:
# ── DEV ─────────────────────────────────────────────────────────────────────
- name: e2e-providers-dev-0
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters (EA Subscription)'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
- name: e2e-providers-dev-1
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters 2 (EA Subscription)'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
- name: e2e-providers-dev-2
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters - Dev - 02'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
- name: e2e-providers-dev-3
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters - Dev - 03'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
# ── INT ─────────────────────────────────────────────────────────────────────
- name: e2e-providers-int-0
  resourceGroup: provider-registration
  subscription: 'ARO SRE Team - INT (EA Subscription 3)'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
# ── STG ─────────────────────────────────────────────────────────────────────
- name: e2e-providers-stg-0
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters - Stage - 00'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
# ── PROD ────────────────────────────────────────────────────────────────────
- name: e2e-providers-prod-0
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters - Prod - 00'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
- name: e2e-providers-prod-1
  resourceGroup: provider-registration
  subscription: 'ARO HCP E2E Hosted Clusters - Prod - 01'
  steps:
  - name: register-providers
    action: ProviderFeatureRegistration
    providerConfigRef: ci.e2eSubscriptionProviders
