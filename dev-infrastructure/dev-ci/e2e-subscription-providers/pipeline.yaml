$schema: "pipeline.schema.v1"
serviceGroup: Microsoft.Azure.ARO.HCP.DevCI.E2ESubscriptionProviders
rolloutName: Dev CI E2E Subscription Provider Registration Rollout
# PRIVILEGED pipeline: registers the required Azure resource providers on every
# ARO-HCP-managed E2E subscription. Run with:
#   make dev-ci-privileged-local-run
#
# Both inputs live in config/config-dev-ci.yaml and are the single source of
# truth: ci.e2eSubscriptionProviders for the provider list, and the
# ci.<env>.e2eSubscriptions inventories for the targets. Onboarding a
# subscription there needs no edit here — the ranges below pick it up. Only a
# brand-new environment needs a new step.
#
# Targets are addressed by immutable subscription ID rather than by placing
# each subscription in its own resourceGroups entry. A resourceGroups
# subscription is a display-name key that templatize resolves by listing every
# subscription the caller can see and taking the first name match, which is
# neither unique nor stable; ids from the inventory are both.
resourceGroups:
# Single execution target: the registration script addresses each E2E
# subscription explicitly, so this group only anchors the run to the global
# subscription and supplies the shellIdentity below.
- name: providers
  resourceGroup: '{{ .global.rg }}'
  subscription: '{{ .global.subscription.key }}'
  steps:
  # Looks up the existing global rollout MSI so the registration steps have a
  # shellIdentity target. The template declares only an `existing` resource plus
  # an output, so this deploys nothing. shellIdentity is Ev2-only — templatize
  # never reads it at run time, where the script uses the invoking OWNERS
  # member's ambient `az` credentials — but the schema requires it, and it also
  # orders each step after this one.
  - name: global-identity
    action: ARM
    template: ../../templates/output-opstool-global-identity.bicep
    parameters: ../../configurations/output-opstool-global-identity.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
  - name: register-providers-dev
    action: Shell
    command: ./e2e-register-providers.sh
    workingDir: ../../scripts
    shellIdentity:
      input:
        resourceGroup: providers
        step: global-identity
        name: globalMSIId
    variables:
    - name: ENV_NAME
      value: dev
    - name: SUBSCRIPTION_IDS
      value: '{{ range .ci.dev.e2eSubscriptions }}{{ .id }} {{ end }}'
    - name: PROVIDER_NAMESPACES
      value: '{{ range .ci.e2eSubscriptionProviders }}{{ . }} {{ end }}'
  - name: register-providers-int
    action: Shell
    command: ./e2e-register-providers.sh
    workingDir: ../../scripts
    shellIdentity:
      input:
        resourceGroup: providers
        step: global-identity
        name: globalMSIId
    variables:
    - name: ENV_NAME
      value: int
    - name: SUBSCRIPTION_IDS
      value: '{{ range .ci.int.e2eSubscriptions }}{{ .id }} {{ end }}'
    - name: PROVIDER_NAMESPACES
      value: '{{ range .ci.e2eSubscriptionProviders }}{{ . }} {{ end }}'
  - name: register-providers-stg
    action: Shell
    command: ./e2e-register-providers.sh
    workingDir: ../../scripts
    shellIdentity:
      input:
        resourceGroup: providers
        step: global-identity
        name: globalMSIId
    variables:
    - name: ENV_NAME
      value: stg
    - name: SUBSCRIPTION_IDS
      value: '{{ range .ci.stg.e2eSubscriptions }}{{ .id }} {{ end }}'
    - name: PROVIDER_NAMESPACES
      value: '{{ range .ci.e2eSubscriptionProviders }}{{ . }} {{ end }}'
  - name: register-providers-prod
    action: Shell
    command: ./e2e-register-providers.sh
    workingDir: ../../scripts
    shellIdentity:
      input:
        resourceGroup: providers
        step: global-identity
        name: globalMSIId
    variables:
    - name: ENV_NAME
      value: prod
    - name: SUBSCRIPTION_IDS
      value: '{{ range .ci.prod.e2eSubscriptions }}{{ .id }} {{ end }}'
    - name: PROVIDER_NAMESPACES
      value: '{{ range .ci.e2eSubscriptionProviders }}{{ . }} {{ end }}'
