---
# Source: kube-state-metrics-crs/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics-crs
  namespace: 'prometheus'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
---
# Source: kube-state-metrics-crs/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-state-metrics-crs-config
  namespace: 'prometheus'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
data:
  config.yaml: |
    spec:
      resources:
      - groupVersionKind:
          group: hypershift.openshift.io
          kind: HostedCluster
          version: v1beta1
        labelsFromPath:
          _id:
          - spec
          - clusterID
          api_url:
          - spec
          - services
          - '[service=APIServer]'
          - servicePublishingStrategy
          - route
          - hostname
          name:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
          resource_id:
          - metadata
          - annotations
          - azure.microsoft.com/hcp-cluster-azure-resource-id
          subscription_id:
          - spec
          - platform
          - azure
          - subscriptionID
        metricNamePrefix: hostedClusterAPI
        metrics:
        - each:
            stateSet:
              labelName: status
              list:
              - "True"
              - "False"
              - Unknown
              path:
              - status
              - conditions
              - '[type=KubeAPIServerAvailable]'
              - status
            type: StateSet
          help: KubeAPIServer availability condition
          name: kubeapiserver_available
        - each:
            stateSet:
              labelName: status
              list:
              - "True"
              - "False"
              - Unknown
              path:
              - status
              - conditions
              - '[type=Available]'
              - status
            type: StateSet
          help: Cluster availability condition
          name: available
        - each:
            stateSet:
              labelName: status
              list:
              - "True"
              - "False"
              - Unknown
              path:
              - status
              - conditions
              - '[type=Progressing]'
              - status
            type: StateSet
          help: Cluster progressing condition
          name: progressing
        - each:
            stateSet:
              labelName: status
              list:
              - "True"
              - "False"
              - Unknown
              path:
              - status
              - conditions
              - '[type=ValidAzureKMSConfig]'
              - status
            type: StateSet
          help: Azure KMS configuration validity condition
          name: valid_azure_kms_config
---
# Source: kube-state-metrics-crs/templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-crs
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  verbs: ["list", "watch"]
- apiGroups: 
    - hypershift.openshift.io
  resources: 
    - hostedclusters
  verbs: 
    - list
    - watch
---
# Source: kube-state-metrics-crs/templates/clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-crs
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-crs
subjects:
- kind: ServiceAccount
  name: kube-state-metrics-crs
  namespace: 'prometheus'
---
# Source: kube-state-metrics-crs/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-crs
  namespace: 'prometheus'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
spec:
  ports:
  - name: http-metrics
    port: 8080
    targetPort: http-metrics
    protocol: TCP
  - name: telemetry
    port: 8081
    targetPort: telemetry
    protocol: TCP
  selector:
    app.kubernetes.io/name: kube-state-metrics-crs
---
# Source: kube-state-metrics-crs/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics-crs
  namespace: 'prometheus'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics-crs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics-crs
    spec:
      automountServiceAccountToken: true
      serviceAccountName: kube-state-metrics-crs
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        image: 'mcr.microsoft.com/oss/v2/kubernetes/kube-state-metrics@sha256:sha256:1234567890'
        args:
        - --resources=certificatesigningrequests
        - --metric-allowlist=hostedClusterAPI_kubeapiserver_available,hostedClusterAPI_available,hostedClusterAPI_progressing,hostedClusterAPI_valid_azure_kms_config
        - --custom-resource-state-config-file=/etc/customresourcestate/config.yaml
        ports:
        - name: http-metrics
          containerPort: 8080
          protocol: TCP
        - name: telemetry
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: http-metrics
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: crs-config
          mountPath: /etc/customresourcestate
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: aro-hcp.azure.com/role
                operator: In
                values:
                - infra
      tolerations:
      - key: infra
        operator: Equal
        value: "true"
        effect: NoSchedule
      volumes:
      - name: crs-config
        configMap:
          name: kube-state-metrics-crs-config
---
# Source: kube-state-metrics-crs/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-state-metrics-crs
  namespace: 'prometheus'
  labels:
    app.kubernetes.io/name: kube-state-metrics-crs
spec:
  endpoints:
  - port: http-metrics
    interval: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics-crs
  namespaceSelector:
    matchNames:
    - 'prometheus'

