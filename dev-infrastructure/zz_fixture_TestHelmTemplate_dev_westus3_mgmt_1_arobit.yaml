---
# Source: arobit/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: 'arobit-forwarder'
  namespace: 'arobit'
  labels:
    app.kubernetes.io/name: 'arobit-forwarder'
    app.kubernetes.io/instance: 'dev-westus3-mgmt-1-arobit'
  annotations:
    azure.workload.identity/client-id: '__msiClientId__'
---
# Source: arobit/templates/forwarder-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: arobit-forwarder
  namespace: 'arobit'
  labels:
    app.kubernetes.io/name: arobit-forwarder
    app.kubernetes.io/instance: 'dev-westus3-mgmt-1-arobit'
data:
  fluent-bit.conf: |
    @INCLUDE /forwarder/etc/service.conf

    @INCLUDE /forwarder/etc/input.conf

    @INCLUDE /forwarder/etc/filter.conf
    @INCLUDE /forwarder/etc/output.conf
  service.conf: |
    [SERVICE]
        Flush                     1
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf
        Parsers_File              /forwarder/etc/parsers_custom.conf
        Plugins_File              /fluent-bit/etc/plugins.conf
        HTTP_Server               On
        storage.path              /var/fluent-bit/flb-storage
        storage.max_chunks_up     128
        storage.backlog.mem_limit 15M
        storage.metrics           on
        storage.delete_irrecoverable_chunks on
        scheduler.cap             600
        Grace                     30
        # Based on the HC_Period, if the error number > HC_Errors_Count or the retry failure > HC_Retry_Failure_Count, fluent bit is considered as unhealthy.
        Health_Check              On
        HC_Errors_Count           5
        HC_Retry_Failure_Count    5
        HC_Period                 60
  parsers_custom.conf: |
    [PARSER]
        Name        containerlogs
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [MULTILINE_PARSER]
        name          klog
        type          regex
        flush_timeout 1000
        # A klog line starts with [IWEF] followed by 4 digits (mmdd) and a space
        rule          "start_state"  "/^[IWEF]\d{4} /"               "cont"
        # A JSON log line starts with { — treat as its own entry
        rule          "start_state"  "/^\{/"                          "cont"
        # A structured log line starts with an ISO 8601 timestamp
        rule          "start_state"  "/^\d{4}-\d{2}-\d{2}T\d{2}:/"   "cont"
        # Anything else is a continuation of the previous multiline entry
        rule          "cont"         "/^[^IWEF{\d]/"                  "cont"
        rule          "cont"         "/^[IWEF][^0-9]/"                "cont"
        rule          "cont"         "/^\d(?!\d{3}-\d{2}-\d{2}T\d{2}:)/"  "cont"

  input.conf: |
    [INPUT]
        Name              tail
        Alias             tail.container
        Tag               kubernetes.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*log-tailer*,/var/log/containers/*geneva-logger*,/var/log/containers/*arobit*
        multiline.parser  cri
        # Docker_Mode       On
        # Parser            none
        DB                /var/log/flb-tail.db
        DB.sync           normal
        DB.locking        true
        Refresh_Interval  15
        Read_from_Head    On
        Buffer_Chunk_Size 32K
        Buffer_Max_Size   256K
        Skip_Long_Lines   On
        storage.type      filesystem
        Threaded          On

    [INPUT]
        Name              forward
        Alias             input.forward
        Listen            0.0.0.0
        Port              24224
        Buffer_Chunk_Size 128K
        Buffer_Max_Size   2M
        Mem_Buf_Limit     50M

    [INPUT]
        Name            fluentbit_metrics
        Alias           metrics.fluentbit
        Tag             metrics.fluentbit
        scrape_interval 15

    [INPUT]
        Name   opentelemetry
        Alias  otlp
        Listen 0.0.0.0
        Port   4318
        Mem_Buf_Limit 50M

    [INPUT]
        Name            systemd
        Alias           systemd
        Tag             systemd.*
        Systemd_Filter  _SYSTEMD_UNIT=containerd.service
        Systemd_Filter  _SYSTEMD_UNIT=kubelet.service
        # AROSLSRE-1465: capture kernel ring-buffer (kmsg) messages so we can see
        # the guest kernel stack (hung_task/soft-lockup/panic) in the seconds
        # before a userswft node hard-freezes into NodeNotReady. Kernel journal
        # records carry no _SYSTEMD_UNIT; they are matched by _TRANSPORT=kernel.
        # Systemd_Filter entries are OR'd, so this only adds kernel lines. They
        # flow to the existing systemdLogs Kusto table (no schema change): the
        # full record is preserved in the `log` dynamic column, so _TRANSPORT /
        # SYSLOG_IDENTIFIER / PRIORITY stay queryable, and `message` maps from
        # $.log.MESSAGE. systemd_unit is simply empty for kernel lines.
        Systemd_Filter  _TRANSPORT=kernel
        Read_From_Tail  On
        Strip_Underscores On
        DB              /var/fluent-bit/flb-storage/flb-systemdb.db
        Threaded          On
        storage.type      filesystem
  filter.conf: |
    [FILTER]
        Name                  multiline
        Alias                 filter.multiline_klog
        Match                 kubernetes.*
        multiline.parser      klog
        multiline.key_content log
        Emitter_Mem_Buf_Limit 50M

    [FILTER]
        # Drop noisy kube-proxy topology.go INFO messages that generate 10x log volume
        # spikes during EndpointSlice reconciliation on mgmt clusters (ICM 825611890).
        Name    grep
        Alias   filter.drop_kube_proxy_topology_noise
        Match   kubernetes.var.log.containers.kube-proxy*
        Exclude log Ignoring same-(node|zone) topology hints

    [FILTER]
        # AROSLSRE-1465: the kernel journal (_TRANSPORT=kernel, captured by the
        # systemd input above) carries SELinux/audit-subsystem records that are
        # routed through kmsg: lines beginning with "audit:" (audit types such as
        # 1300/1325/1327/1130/1131 -- syscall, netfilter and service-state audit
        # events) and the "kauditd_printk_skb: N callbacks suppressed" throttle
        # notices. These are process/security audit events, NOT kernel-health
        # signals, and they account for ~87% of kernel-transport log volume. They
        # are useless for diagnosing node hard-freezes (hung_task, soft lockup,
        # RCU stall, OOM, MCE, kernel panic), so we drop them here and keep only
        # actionable kernel diagnostics. kubelet/containerd systemd records and
        # all non-audit kernel lines are unaffected (their MESSAGE never starts
        # with these prefixes).
        Name    grep
        Alias   filter.drop_kernel_audit_noise
        Match   systemd.*
        Exclude MESSAGE ^(audit:|kauditd_printk_skb:)

    [FILTER]
        Name modify
        Match systemd.*
        Add environment dev
        Add region westus3
        Add cluster dev-westus3-mgmt-1

    [FILTER]
        Name modify
        Match kubernetes.var.log.containers.*
        Add environment dev
        Add region westus3
        Add cluster dev-westus3-mgmt-1

    [FILTER]
        Name                kubernetes
        Alias               filter.kubernetes
        Match               kubernetes.var.log.containers.*
        Kube_Tag_Prefix     kubernetes.var.log.containers.
        Annotations         Off
        # Collect namespace annotations so the set-cluster-id-from-annotation lua
        # below can read the HCP cluster's Azure resource ID from the
        # azure.microsoft.com/hcp-cluster-azure-resource-id namespace annotation.
        # Namespace metadata is only fetched from the API server (the kubelet API
        # cannot serve namespace objects), so namespace-annotation enrichment
        # requires Use_Kubelet Off. Set it explicitly below (rather than relying on
        # the default) so enrichment stays robust across Fluent Bit versions and
        # config defaults. Pod annotations stay Off; only namespace annotations are
        # enabled.
        Use_Kubelet         Off
        Namespace_annotations On
        K8S-Logging.Exclude On
        Kube_Meta_Cache_TTL 300
        Buffer_Size         64k

    [FILTER]
        # Only re-tag ocm-* namespaces (minority of traffic). Non-ocm records keep
        # their original kubernetes.* tag and flow directly to outputs — no copy needed.
        Name            rewrite_tag
        Alias           filter.namespace_router
        Match           kubernetes.var.log.containers.*
        Rule            $kubernetes['namespace_name'] ^ocm-.* ocm.logs false
        Emitter_Name    re_emitted_namespace_router
        Emitter_Mem_Buf_Limit  20M
        Emitter_Storage.type   filesystem

    [FILTER]
        # Stamp the uppercased Azure ARM resource ID of the HCP cluster onto every
        # ocm.logs record as cluster_id, plus its resource group as resource_group,
        # read directly from the pod's namespace annotation
        # azure.microsoft.com/hcp-cluster-azure-resource-id (enriched by the kubernetes
        # filter's Namespace_annotations On). This is the namespace-annotation
        # alternative to resolving the ID from the ACM-managed /shoebox-config file
        # mapping. Only mgmt clusters emit ocm.logs to the containerLogs Kusto table.
        # Fail-soft: records without the annotation are left unchanged. This runs before
        # the shoebox re-tag so transform-shoebox.lua can reuse the normalized cluster_id.
        Name            lua
        Alias           lua.set_cluster_id_from_annotation
        Match           ocm.logs
        script          /forwarder/etc/set-cluster-id-from-annotation.lua
        call            set_cluster_id_from_annotation

    [FILTER]
        Name            rewrite_tag
        Alias           filter.container_name_router
        Match           kubernetes.var.log.containers.*
        Rule            $kubernetes['container_name'] ^aro-hcp-frontend* aro-hcp-frontend.logs false
        Rule            $kubernetes['container_name'] ^aro-hcp-backend* aro-hcp-backend.logs false
        Rule            $kubernetes['container_name'] ^clusters-service* clusters-service.logs false
        Rule            $kubernetes['container_name'] ^fleet-controller* fleet-controller.logs false
        Rule            $kubernetes['container_name'] ^kube-applier* kube-applier.logs false
        Rule            $kubernetes['container_name'] ^kube-events* kube-events.logs false
        Rule            $kubernetes['container_name'] ^mgmt-agent-controller* mgmt-agent.logs true
        Emitter_Name    re_emitted_container_name_router
        Emitter_Mem_Buf_Limit  20M
        Emitter_Storage.type   filesystem

    [FILTER]
        # Parse the log key and make it a json object again under $
        Name Parser
        Match_regex (aro-hcp-(frontend|backend)|kube-events|clusters-service|fleet-controller|kube-applier|mgmt-agent)\.logs
        Key_Name log
        Parser containerlogs
        Preserve_Key On
        Reserve_Data On

    [FILTER]
        # Route mgmt-agent logs with snapshotType=kubernetes
        # to a dedicated tag for the kubernetesResourceSnapshots Kusto table.
        Name            rewrite_tag
        Alias           filter.resource_snapshot_router
        Match           mgmt-agent.logs
        Rule            $snapshotType ^kubernetes$ resource-snapshots.logs false
        Emitter_Name    re_emitted_resource_snapshot_router
        Emitter_Mem_Buf_Limit  20M
        Emitter_Storage.type   filesystem

    [FILTER]
        # Route backend logs with snapshotType=cosmos
        # to a dedicated tag for the cosmosResourceSnapshots Kusto table.
        Name            rewrite_tag
        Alias           filter.cosmos_snapshot_router
        Match           aro-hcp-backend.logs
        Rule            $snapshotType ^cosmos$ cosmos-snapshots.logs false
        Emitter_Name    re_emitted_cosmos_snapshot_router
        Emitter_Mem_Buf_Limit  20M
        Emitter_Storage.type   filesystem

    [FILTER]
        # Route frontend logs with snapshotType=cosmos
        # to the same cosmosResourceSnapshots Kusto table.
        Name            rewrite_tag
        Alias           filter.cosmos_snapshot_router_frontend
        Match           aro-hcp-frontend.logs
        Rule            $snapshotType ^cosmos$ cosmos-snapshots.logs false
        Emitter_Name    re_emitted_cosmos_snapshot_router_frontend
        Emitter_Mem_Buf_Limit  20M
        Emitter_Storage.type   filesystem

    [FILTER]
        # Route fleet controller logs with snapshotType=cosmos
        # to the same cosmosResourceSnapshots Kusto table, keeping the original
        # fleet-controller.logs copy so they still land in fleetLogs too.
        Name            rewrite_tag
        Alias           filter.cosmos_snapshot_router_fleet
        Match           fleet-controller.logs
        Rule            $snapshotType ^cosmos$ cosmos-snapshots.logs true
        Emitter_Name    re_emitted_cosmos_snapshot_router_fleet
        Emitter_Mem_Buf_Limit  20M
        Emitter_Storage.type   filesystem
  set-cluster-id-from-annotation.lua: |
    -- Lua script for stamping the HCP cluster's Azure ARM resource ID onto
    -- control-plane container logs. Unlike the ACM /shoebox-config file lookup,
    -- this reads the resource ID directly from the pod's NAMESPACE annotation
    -- "azure.microsoft.com/hcp-cluster-azure-resource-id", which the kubernetes
    -- filter enriches onto every record when "Namespace_annotations On" is set.
    -- It stamps two top-level fields:
    --   record["cluster_id"]     = uppercased Azure ARM resource ID
    --   record["resource_group"] = uppercased resource-group segment of that ID
    -- so they ingest into the containerLogs Kusto columns via $.cluster_id /
    -- $.resource_group. Namespace annotations are only populated when the filter
    -- fetches namespace metadata from the API server (Use_Kubelet Off), which is
    -- the case here. Fail-soft: records without the annotation are left unchanged.

    -- The namespace annotation carrying the cluster's Azure ARM resource ID.
    local ANNOTATION_KEY = "azure.microsoft.com/hcp-cluster-azure-resource-id"

    -- Read the resource-ID namespace annotation from the enriched record. Fluent
    -- Bit's namespace-metadata location has changed across versions, so check both
    -- the current top-level "kubernetes_namespace"."annotations" map and the older
    -- "kubernetes"."namespace_annotations" map. Returns nil when absent or empty.
    local function get_namespace_annotation(record)
        local ns = record["kubernetes_namespace"]
        if type(ns) == "table" and type(ns["annotations"]) == "table" then
            local v = ns["annotations"][ANNOTATION_KEY]
            if v ~= nil and v ~= "" then
                return v
            end
        end

        local k8s = record["kubernetes"]
        if type(k8s) == "table" and type(k8s["namespace_annotations"]) == "table" then
            local v = k8s["namespace_annotations"][ANNOTATION_KEY]
            if v ~= nil and v ~= "" then
                return v
            end
        end

        return nil
    end

    -- Extract the resource group from an Azure ARM resource ID of the form
    -- /subscriptions/<sub>/resourceGroups/<rg>/providers/... by splitting on
    -- "/resourceGroups/" case-insensitively and taking the next path segment.
    -- Returns nil when the ID has no resourceGroups segment.
    local function parse_resource_group(resource_id)
        local lower_id = string.lower(resource_id)
        local match_start, match_end = string.find(lower_id, "/resourcegroups/", 1, true)
        if not match_start then
            return nil
        end

        local rest = string.sub(resource_id, match_end + 1)
        local rg = string.match(rest, "^([^/]+)")
        if rg == nil or rg == "" then
            return nil
        end

        return rg
    end

    -- Remove the namespace-annotations payload that "Namespace_annotations On"
    -- attaches to every record. Once cluster_id/resource_group have been
    -- extracted, the full annotations map is dead weight: it would inflate every
    -- ocm.logs record and ship unrelated namespace annotations downstream to the
    -- containerLogs Kusto table. Handle both the current FB v5
    -- "kubernetes_namespace"."annotations" shape and the older
    -- "kubernetes"."namespace_annotations" shape. Only the annotations payload is
    -- dropped -- namespace_name, labels, pod name and all other kubernetes
    -- metadata are left untouched.
    local function strip_namespace_annotations(record)
        local ns = record["kubernetes_namespace"]
        if type(ns) == "table" then
            ns["annotations"] = nil
            -- If the namespace object carried nothing but annotations, drop the
            -- now-empty table too so we don't emit an empty "kubernetes_namespace".
            if next(ns) == nil then
                record["kubernetes_namespace"] = nil
            end
        end

        local k8s = record["kubernetes"]
        if type(k8s) == "table" then
            k8s["namespace_annotations"] = nil
        end
    end

    -- Stamp cluster_id and resource_group from the namespace annotation. Returns
    -- code 1 (record modified, original timestamp kept) when the annotation is
    -- present and non-empty; otherwise code 0 (record left unchanged).
    function set_cluster_id_from_annotation(tag, timestamp, record)
        local resource_id = get_namespace_annotation(record)
        if resource_id == nil then
            return 0, 0, 0
        end

        -- Trim surrounding whitespace.
        resource_id = string.match(resource_id, "^%s*(.-)%s*$")
        if resource_id == "" then
            return 0, 0, 0
        end

        record["cluster_id"] = string.upper(resource_id)

        local rg = parse_resource_group(resource_id)
        if rg ~= nil and rg ~= "" then
            record["resource_group"] = string.upper(rg)
        end

        -- Drop the bulky namespace-annotations payload now that cluster_id and
        -- resource_group have been extracted from it.
        strip_namespace_annotations(record)

        return 1, timestamp, record
    end
  output.conf: |
    [OUTPUT]
        Name  prometheus_exporter
        Alias exporter.fluentbit
        Match metrics.fluentbit
        Host  0.0.0.0
        Port  9090
    [OUTPUT]
        Match ocm.logs
        Name azure_kusto
        Retry_Limit 5
        auth_type workload_identity
        tenant_id __tenantId__
        client_id __msiClientId__
        workload_identity_token_file ${AZURE_FEDERATED_TOKEN_FILE}
        Ingestion_Endpoint __kustoDataIngestionUri__
        Database_Name HostedControlPlaneLogs
        Table_Name containerLogs
        ingestion_mapping_reference ingestionMapping
        azure_kusto_buffer_key containerLogsOcm
        buffer_dir "/var/kusto"
        buffering_enabled           true 
        upload_timeout              1m
        upload_file_size            16M
        buffer_file_delete_early    false
        unify_tag                   true
        store_dir_limit_size        1.8GB
        blob_uri_length             128
        scheduler_max_retries       9
        delete_on_max_upload_error  true
        io_timeout                  60s

    [OUTPUT]
        Match aro-hcp-frontend.logs
        Name azure_kusto
        Retry_Limit 5
        auth_type workload_identity
        tenant_id __tenantId__
        client_id __msiClientId__
        workload_identity_token_file ${AZURE_FEDERATED_TOKEN_FILE}
        Ingestion_Endpoint __kustoDataIngestionUri__
        Database_Name ServiceLogs
        Table_Name frontendLogs
        ingestion_mapping_reference ingestionMapping
        buffer_dir "/var/kusto"
        azure_kusto_buffer_key frontendLogs
        buffering_enabled           true 
        upload_timeout              1m
        upload_file_size            16M
        buffer_file_delete_early    false
        unify_tag                   true
        store_dir_limit_size        1.8GB
        blob_uri_length             128
        scheduler_max_retries       9
