#
# Purpose: Manage monitoring resources for ARO HCP shared by SC and MC
# Managed Resources:
# * Azure Monitor Metrics resources for services
# * Azure Monitor Metrics resources for hosted control planes
# * Prometheus alerting rules
# * Event Hub action group (region-scoped, for forwarding alerts to Kusto)
#
# ICM action groups are created at geography level (geography-pipeline.yaml)
# and looked up here for wiring into regional alert rules.
#
$schema: "pipeline.schema.v1"
serviceGroup: Microsoft.Azure.ARO.HCP.Monitoring
rolloutName: Monitoring Rollout
resourceGroups:
- name: global
  resourceGroup: '{{ .global.rg }}'
  subscription: '{{ .global.subscription.key }}'
  steps:
  - name: output
    action: ARM
    template: templates/output-global.bicep
    parameters: configurations/output-global.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
- name: kusto
  resourceGroup: '{{ .kusto.rg }}'
  subscription: '{{ .global.subscription.key }}'
  steps:
  - name: actiongroup-lookup
    action: ARM
    template: templates/actiongroups-lookup.bicep
    parameters: configurations/actiongroups-lookup.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
- name: regional
  resourceGroup: '{{ .regionRG }}'
  subscription: '{{ .svc.subscription.key }}'
  steps:
  - name: output
    action: ARM
    template: templates/output-region.bicep
    parameters: configurations/output-region.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
  # one-shot cleanup, remove after it ran in all envs (Phase 3 of AROSLSRE-2630)
  - name: remove-legacy-monitoring-stack
    action: ARMStack
    operation: delete
    deploymentLevel: ResourceGroup
    deploymentStackNameForDelete:
      value: Monitoring.regional.monitoring
    actionOnUnmanage: detach
    identityFrom:
      resourceGroup: global
      step: output
      name: globalMSIId
  # Previous ringless stack name for public/int/westus3.
  - name: remove-ringless-stack
    action: ARMStack
    operation: delete
    deploymentLevel: ResourceGroup
    deploymentStackNameForDelete:
      value: lqkbvpbbzei47mhnbn3okrzxxl5v6ppa7wek5io6bjspy-usw3
    actionOnUnmanage: detach
    identityFrom:
      resourceGroup: global
      step: output
      name: globalMSIId
  # Previous region-only stack name for public/int/westus3.
  - name: remove-region-only-stack
    action: ARMStack
    operation: delete
    deploymentLevel: ResourceGroup
    deploymentStackNameForDelete:
      value: lqkbvpbbzei47mhnbn3okrzxxl5v6ppa7wek5io6bjspy-westus3
    actionOnUnmanage: detach
    identityFrom:
      resourceGroup: global
      step: output
      name: globalMSIId
  - name: monitoring
    action: ARMStack
    template: templates/monitoring.bicep
    parameters: configurations/monitoring.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    actionOnUnmanage: delete
    bypassStackOutOfSyncError: false
    automatedRetry:
      errorContainsAny:
      - "DeploymentStackInNonTerminalState"
      maximumRetryCount: 3
      durationBetweenRetries: 2m
    dependsOn:
    - resourceGroup: regional
      step: remove-legacy-monitoring-stack
    - resourceGroup: regional
      step: remove-region-only-stack
    - resourceGroup: regional
      step: remove-ringless-stack
    variables:
    - name: azureMonitoringWorkspaceId
      input:
        resourceGroup: regional
        step: output
        name: azureMonitoringWorkspaceId
    - name: hcpAzureMonitoringWorkspaceId
      input:
        resourceGroup: regional
        step: output
        name: hcpAzureMonitoringWorkspaceId
    - name: rpCosmosDbAccountId
      input:
        resourceGroup: regional
        step: output
        name: rpCosmosDbAccountId
    - name: actionGroupSL
      input:
        resourceGroup: kusto
        step: actiongroup-lookup
        name: actionGroupSL
    - name: actionGroupSRE
      input:
        resourceGroup: kusto
        step: actiongroup-lookup
        name: actionGroupSRE
    - name: actionGroupRP
      input:
        resourceGroup: kusto
        step: actiongroup-lookup
        name: actionGroupRP
    - name: actionGroupMSFT
      input:
        resourceGroup: kusto
        step: actiongroup-lookup
        name: actionGroupMSFT
    - name: actionGroupDEV
      input:
        resourceGroup: kusto
        step: actiongroup-lookup
        name: actionGroupDEV
