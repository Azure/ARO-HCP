---
# Source: Fixes/templates/ds-kubelet-parameters.yaml
# Alter kubelet config for better stability at higher scales
# Ref: https://issues.redhat.com/browse/ARO-13357
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    component: kubelet-parameters
  name: set-kubelet-parameters-for-scale
  namespace: kube-system
spec:
  revisionHistoryLimit: 10
  minReadySeconds: 30
  selector:
    matchLabels:
      component: kubelet-parameters
      tier: node
  template:
    metadata:
      creationTimestamp: null
      labels:
        component: kubelet-parameters
        tier: node
    spec:
      nodeSelector:
        aro-hcp.azure.com/role: worker
      initContainers:
      - command:
        - nsenter
        - --target
        - "1"
        - --mount
        - --uts
        - --ipc
        - --net
        - --pid
        - --
        - sh
        - -c
        - |
          # Copyright 2026 Microsoft Corporation
          #
          # Licensed under the Apache License, Version 2.0 (the "License");
          # you may not use this file except in compliance with the License.
          # You may obtain a copy of the License at
          #
          #     http://www.apache.org/licenses/LICENSE-2.0
          #
          # Unless required by applicable law or agreed to in writing, software
          # distributed under the License is distributed on an "AS IS" BASIS,
          # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          # See the License for the specific language governing permissions and
          # limitations under the License.

          set -eu

          # nsenter runs this on the host, not against the container CPU/memory limits.
          cpu_count=$(getconf _NPROCESSORS_ONLN)
          reservation=$(awk -v cpus="$cpu_count" '
            /^MemTotal:/ {
              count++
              if (NF != 3 || $2 !~ /^[1-9][0-9]*$/ || $3 != "kB") exit 1
              memory = $2
            }
            END {
              # Keep the integer arithmetic exact even for malformed capacity inputs.
              if (cpus !~ /^[1-9][0-9]*$/ || count != 1 || memory <= 0 ||
                  cpus * 3000 + 31 > 9007199254740991 ||
                  memory * 7550 + 268435455 > 9007199254740991) exit 1
              printf "cpu=%.0fm,memory=%.0fMi,pid=1000", \
                int((cpus * 3000 + 31) / 32), int((memory * 7550 + 268435455) / 268435456)
            }
          ' /proc/meminfo)

          config=/etc/default/kubelet
          pending=${config}.system-reserved-restart-pending
          # Our marker is an empty, owner-only regular file. Never overwrite unknown state.
          if [ -e "$pending" ] || [ -L "$pending" ]; then
            if [ -L "$pending" ] || [ ! -f "$pending" ] ||
                [ "$(stat -c '%a:%u:%s:%h' "$pending")" != "600:$(id -u):0:1" ]; then
              echo "Refusing unknown restart marker: $pending" >&2
              exit 1
            fi
          fi
          temporary=$(mktemp "${config}.XXXXXX")
          trap 'rm -f "$temporary"' EXIT
          trap 'exit 1' HUP INT TERM
          # Retain the host file permissions and ownership on atomic replacement.
          cp -p "$config" "$temporary"
          if ! awk -v reservation="$reservation" '
            /^[[:space:]]*(#|$)/ { print; next }
            {
              line = $0
              rest = line
              while (match(rest, /--(kube|system)-reserved(=|[[:space:]"\047]|$)/)) {
                occurrences++
                rest = substr(rest, RSTART + RLENGTH)
              }
              # AgentBaker writes systemd EnvironmentFile assignments, not shell source.
              if (!match(line, /^[[:space:]]*([A-Za-z_][A-Za-z_0-9]*)=/)) exit 1
              prefix = substr(line, 1, RLENGTH)
              name = prefix
              sub(/^[[:space:]]*/, "", name)
              if (assignments[name]++) exit 1
              value = substr(line, RLENGTH + 1)
              suffix = ""
              if (match(value, /[[:space:]]+$/)) {
                suffix = substr(value, RSTART)
                value = substr(value, 1, RSTART - 1)
              }
              quote = substr(value, 1, 1)
              if (quote == "\"" || quote == "\047") {
                if (substr(value, length(value), 1) != quote) exit 1
                prefix = prefix quote
                suffix = quote suffix
                value = substr(value, 2, length(value) - 2)
              }
              # Only literal single-line values are supported; never source/eval this file.
              if (value ~ /["\047\\]/) exit 1
              if (line !~ /--(kube|system)-reserved(=|[[:space:]"\047]|$)/) { print; next }
              if (value ~ /[$`]/) exit 1
              if (!match(value, /(^|[[:space:]])--(kube|system)-reserved=[^[:space:]]+/)) exit 1
              start = RSTART
              size = RLENGTH
              end = start + size
              flag = substr(value, start, size)
              sub(/^[[:space:]]/, "", flag)
              sub(/^--(kube|system)-reserved=/, "", flag)
              n = split(flag, entries, ",")
              extra = ""
              for (i = 1; i <= n; i++) {
                if (entries[i] !~ /^[a-z][A-Za-z0-9-]*=[A-Za-z0-9.]+$/) exit 1
                split(entries[i], pair, "=")
                if (seen[pair[1]]++) exit 1
                if (pair[1] != "cpu" && pair[1] != "memory" && pair[1] != "pid") extra = extra "," entries[i]
              }
              if (substr(value, start, 1) ~ /[[:space:]]/) start++
              print prefix substr(value, 1, start - 1) "--system-reserved=" reservation extra substr(value, end) suffix
              updated++
            }
            END { if (occurrences != 1 || updated != 1) exit 1 }
          ' "$config" > "$temporary"; then
            echo "Unsupported kubelet EnvironmentFile layout: expected exactly one reservation flag" >&2
            exit 1
          fi

          if cmp -s "$config" "$temporary"; then
            echo "system-reserved already matches host capacity"
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            # Record intent before replacement so failure/interruption cannot lose a restart.
            if [ ! -e "$pending" ]; then
              (umask 077; set -C; : > "$pending")
            fi
            mv -f "$temporary" "$config"
            echo "system-reserved updated to $reservation"
          fi
          if [ -f "$pending" ]; then
            systemctl daemon-reload
            systemctl restart kubelet
          fi
          # Check local HTTP responsiveness, not Node Ready or allocatable publication.
          # Also check unchanged nodes before allowing the init container to complete.
          curl --fail --silent --show-error --noproxy '*' --connect-timeout 2 --max-time 5 \
            --retry 60 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
            http://127.0.0.1:10248/healthz
          rm -f "$pending"
          rm -f "$temporary"
          trap - EXIT HUP INT TERM

          # Newer AKS images do not have the legacy host node-exporter script.
          if [ ! -e /usr/local/bin/node-exporter-startup.sh ]; then
             echo "legacy node-exporter startup script absent; skipping netclass workaround"
          elif grep -Fq -- '--collector.netclass.netlink' /usr/local/bin/node-exporter-startup.sh;then
             echo "collector.netclass.netlink parameter already updated in node-exporter configuration"
          else
             sed -i 's/--no-collector.arp.netlink/--no-collector.arp.netlink --collector.netclass.netlink/g' /usr/local/bin/node-exporter-startup.sh
             systemctl daemon-reload
             systemctl restart node-exporter
             echo "collector.netclass.netlink parameter has been updated in node-exporter configuration"
          fi
        image: alpine
        imagePullPolicy: IfNotPresent
        name: apply-kubelet-parameters
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      containers:
      - name: kubelet-parameters
        image: alpine
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        readinessProbe:
          exec:
            command:
            - nsenter
            - --target
            - "1"
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - curl
            - --fail
            - --silent
            - --show-error
            - --noproxy
            - '*'
            - --connect-timeout
            - "2"
            - --max-time
            - "5"
            - http://127.0.0.1:10248/healthz
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 1
        resources:
          requests:
            cpu: 10m
        securityContext:
          privileged: true
      dnsPolicy: ClusterFirst
      hostPID: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        operator: Exists
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate

