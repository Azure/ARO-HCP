$schema: "pipeline.schema.v1"
serviceGroup: Microsoft.Azure.ARO.HCP.GenevaHealthFunction
rolloutName: Geneva Health Function Rollout
resourceGroups:
# Query the service Key Vault URL
- name: svcKV
  resourceGroup: '{{ .serviceKeyVault.rg }}'
  subscription: '{{ .serviceKeyVault.subscription.key }}'
  steps:
  - name: output
    action: ARM
    template: templates/subscription-lookup.bicep
    parameters: configurations/subscription-lookup.tmpl.bicepparam
    deploymentLevel: Subscription
    outputOnly: true
- name: service
  resourceGroup: '{{ .svc.rg }}'
  subscription: '{{ .svc.subscription.key }}'
  steps:
  - name: infra-output
    action: ARM
    template: templates/svc-infra-lookup.bicep
    parameters: configurations/svc-infra-lookup.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
    variables:
    - name: serviceKeyVaultSubscription
      input:
        resourceGroup: svcKV
        step: output
        name: subscriptionId
# Query HCP AMW outputs from regional infra
- name: regional
  resourceGroup: '{{ .regionRG }}'
  subscription: '{{ .svc.subscription.key }}'
  steps:
  - name: output
    action: ARM
    template: templates/output-region.bicep
    parameters: configurations/output-region.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    outputOnly: true
# Create the certificate and deploy the Function App
- name: functionapp
  resourceGroup: '{{ .svc.rg }}'
  subscription: '{{ .svc.subscription.key }}'
  steps:
  - name: geneva-health-cert
    action: CreateCertificate
    secretKeyVault:
      configRef: ev2.assistedId.certificate.keyVault
    secretName:
      configRef: ev2.assistedId.certificate.name
    applicationId:
      configRef: ev2.assistedId.applicationId
    vaultBaseUrl:
      input:
        resourceGroup: service
        step: infra-output
        name: svcKeyVaultUrl
    certificateName:
      configRef: genevaHealthFunction.certificateName
    contentType:
      value: x-pkcs12
    san:
      configRef: genevaHealthFunction.certificateSAN
    issuer:
      configRef: genevaHealthFunction.certificateIssuer
    commonName:
      configRef: genevaHealthFunction.certificateCN
    dependsOn:
    - resourceGroup: service
      step: infra-output
    automatedRetry:
      errorContainsAny:
      - "InternalServerError"
      - "ServiceUnavailable"
      maximumRetryCount: 3
      durationBetweenRetries: 1m
  - name: deploy
    action: ARM
    template: modules/geneva-health-function/functionapp.bicep
    parameters: configurations/geneva-health-function.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    variables:
    - name: svcKeyVaultUrl
      input:
        resourceGroup: service
        step: infra-output
        name: svcKeyVaultUrl
    - name: serviceKeyVaultSubscription
      input:
        resourceGroup: svcKV
        step: output
        name: subscriptionId
    - name: hcpMonitorPrometheusQueryEndpoint
      input:
        resourceGroup: regional
        step: output
        name: hcpMonitorPrometheusQueryEndpoint
    dependsOn:
    - resourceGroup: functionapp
      step: geneva-health-cert
    - resourceGroup: regional
      step: output
# Grant AMW access to the Function App managed identity
- name: amw-role
  resourceGroup: '{{ .regionRG }}'
  subscription: '{{ .svc.subscription.key }}'
  steps:
  - name: amw-role-assignment
    action: ARM
    template: modules/geneva-health-function/amw-role-assignment.bicep
    parameters: configurations/geneva-health-function-amw-role.tmpl.bicepparam
    deploymentLevel: ResourceGroup
    variables:
    - name: managedIdentityPrincipalId
      input:
        resourceGroup: functionapp
        step: deploy
        name: managedIdentityPrincipalId
    dependsOn:
    - resourceGroup: functionapp
      step: deploy
